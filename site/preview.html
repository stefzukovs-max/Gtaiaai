/* ============================================================
   LUMEN HARBOR — a 3D social sandbox MMO.

   One self-contained file. No engine, no dependencies, no asset
   downloads: every mesh, texture, animation and sound is
   generated in the browser at load time — the same discipline
   the 2D build ran on, moved into three dimensions.

   Layering, top to bottom:
     LH.M      vector / matrix math
     LH.GL     WebGL2 device — programs, buffers, textures, FBOs
     LH.Geo    procedural geometry
     LH.Tex    procedural textures
     LH.Render forward renderer: shadow pass, sky, opaque, water
     LH.Cam    third-person camera with collision
     LH.Rig    humanoid rig + animation state machine

:root{
  --bg:#080B12;
  --panel:rgba(14,19,30,.92);
  --panel2:rgba(20,27,42,.94);
  --line:rgba(126,160,216,.16);
  --line2:rgba(126,160,216,.32);
  --ink:#E8EFFA;
  --ink2:#93A4C0;
  --ink3:#5D6E8C;
  --acc:#4FE3B0;
  --acc2:#17A886;
  --gold:#FFC94D;
  --danger:#FF5A6E;
  --xp:#7C6BFF;
  /* rarity ramp — the 2D build's tiers, restated for a dark UI */
  --r1:#9AA8BE;
  --r2:#57D07A;
  --r3:#489BFF;
  --r4:#B269FF;
  --r5:#F5A03C;
  --r6:#FF4F7A;
  /* Rounded, not angular. Nunito carries the small text — it stays
     legible at the sizes the HUD actually uses — and Fredoka does the
     headings, where the roundness is the point. Both have real
     fallbacks: the game has to look deliberate with the network off. */
  --ui: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --disp: 'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--ui);-webkit-font-smoothing:antialiased}

/* The whole game lives in one container so every measurement in the
   HUD can be expressed against the game view rather than the browser
   window. container-type must be `size` — `inline-size` alone silently
   disables the aspect-ratio queries further down. */
#app{position:fixed;inset:0;container-type:size;container-name:app;
  background:radial-gradient(120% 90% at 50% 0%,#101A2C 0%,#080B12 60%,#05070C 100%);
  overflow:hidden;user-select:none}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- shared surface language ---------- */
.surface{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:19px;
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
}

#boot{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(130% 100% at 50% 35%,#12263A 0%,#080D16 55%,#04060B 100%)}
#boot.gone{opacity:0;pointer-events:none;transition:opacity .7s ease}

  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(59,224,200,.35))}

  -webkit-text-fill-color:var(--ink3);margin-top:.5em}

  background:rgba(255,255,255,.07)}

/* ============================================================
   HUD. Everything is sized in cqw/cqh against the game container, so

.panel .hd .sp{flex:1}
.xbtn{width:2.2cqw;height:2.2cqw;min-width:24px;min-height:24px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);
  display:grid;place-items:center;cursor:pointer;font-size:1.0cqw;line-height:1}
.xbtn:hover{background:rgba(255,90,110,.16);color:#FFC6CE;border-color:rgba(255,90,110,.4)}
.tabs{display:flex;gap:.34cqw;flex-wrap:wrap}
.tab{padding:.38cqw .8cqw;border-radius:13px;font-size:.85cqw;cursor:pointer;
  color:var(--ink3);border:1px solid transparent;letter-spacing:.04em}
.tab:hover{color:var(--ink2);background:rgba(255,255,255,.04)}
.tab.on{color:var(--acc);border-color:var(--line2);background:rgba(59,224,200,.10)}
.panel .bd{padding:1.1cqw 1.3cqw;overflow:auto;flex:1;min-height:0}
.panel .bd::-webkit-scrollbar{width:8px}
.panel .bd::-webkit-scrollbar-thumb{background:rgba(126,160,216,.22);border-radius:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6cqw,1fr));
  gap:.5cqw}
.cell{position:relative;aspect-ratio:1;border-radius:15px;cursor:pointer;
  background:linear-gradient(165deg,rgba(38,48,66,.85),rgba(20,27,40,.85));
  border:1px solid var(--line);display:grid;place-items:center;
  transition:transform .12s,border-color .12s,box-shadow .12s}
.cell:hover{transform:translateY(-2px);border-color:var(--line2)}
.cell.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cell.worn{border-color:var(--r2);box-shadow:0 0 0 1px var(--r2)}
.cell .ic{width:74%;height:74%;border-radius:7px}
.cell .n{position:absolute;right:.2cqw;bottom:.1cqw;font-size:.68cqw;font-weight:700;
  color:var(--ink);text-shadow:0 1px 3px #000}
.cell .rr{position:absolute;left:0;right:0;top:0;height:2px;border-radius:10px 10px 0 0}

.detail{display:flex;gap:1.1cqw;padding:.9cqw 0 0}
.detail .big{width:8cqw;height:8cqw;border-radius:17px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);display:grid;place-items:center;flex:0 0 auto}
.detail .big .ic{width:78%;height:78%;border-radius:9px}
.detail .txt{flex:1;min-width:0}
.detail h3{font-size:1.15cqw;font-weight:700;margin-bottom:.2cqw}
.detail .rt{font-size:.78cqw;letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:.5cqw}
.detail p{font-size:.88cqw;color:var(--ink2);line-height:1.5;margin-bottom:.5cqw}
.detail .meta{display:flex;gap:1.1cqw;flex-wrap:wrap;font-size:.82cqw;color:var(--ink3)}
.detail .meta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:.5cqw;margin-top:.7cqw;flex-wrap:wrap}
.btn{padding:.46cqw 1.0cqw;border-radius:14px;font-size:.86cqw;font-weight:600;
  letter-spacing:.05em;cursor:pointer;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ink);transition:all .14s}
.btn:hover{background:rgba(59,224,200,.14);border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(180deg,rgba(59,224,200,.22),rgba(21,156,137,.22));
  border-color:var(--acc);color:var(--acc)}
.btn.dim{color:var(--ink3);border-color:var(--line)}
.btn.dim:hover{color:var(--ink2);background:rgba(255,255,255,.06);border-color:var(--line2)}
.btn[disabled]{opacity:.38;pointer-events:none}

.empty-note{padding:2.4cqw;text-align:center;color:var(--ink3);font-size:.95cqw}

/* ---------------- the wardrobe ----------------
   Pinned to the left rather than centred, because the whole point is
   watching the change happen on the character standing behind it. */
.panel.dress{left:2.2cqw;transform:translateY(-46%) scale(.98);
  width:min(34cqw,520px);max-height:84cqh}
.panel.dress.on{transform:translateY(-50%) scale(1)}
.dressrow{display:flex;flex-direction:column;gap:.26cqw;margin-bottom:.7cqw}
.dressrow>.lb{font-size:.74cqw;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3)}
.dressopts{display:flex;gap:.34cqw;flex-wrap:wrap}
.dopt{padding:.34cqw .7cqw;border-radius:12px;font-size:.82cqw;cursor:pointer;
  border:1px solid var(--line);color:var(--ink2);transition:all .13s;
  text-transform:capitalize}
.dopt:hover{border-color:var(--line2);color:var(--ink)}
.dopt.on{border-color:var(--acc);color:var(--acc);background:rgba(59,224,200,.10)}
.dsw{width:1.9cqw;height:1.9cqw;min-width:20px;min-height:20px;border-radius:11px;
  cursor:pointer;border:2px solid transparent;transition:transform .12s}
.dsw:hover{transform:scale(1.1)}
.dsw.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(59,224,200,.28)}
.dressnote{font-size:.82cqw;line-height:1.55;color:var(--ink3);
  border-left:2px solid var(--line2);padding-left:.7cqw;margin-bottom:.8cqw}

/* ---------------- the world map ---------------- */
.mapgrid{display:grid;grid-template-columns:1fr min(20cqw,300px);gap:1.1cqw}
.mapwrap{position:relative;border-radius:18px;overflow:hidden;
  border:1px solid var(--line2);background:#0A1018;aspect-ratio:1}
.mapwrap canvas{width:100%;height:100%;display:block;image-rendering:auto;
  filter:saturate(1.05) contrast(1.04)}
.mapvig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(4,7,13,.55) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.12cqw;
  transition:transform .12s}
.pin:hover{transform:translate(-50%,-50%) scale(1.09)}
.pin .dot{width:1.9cqw;height:1.9cqw;min-width:20px;min-height:20px;
  border-radius:50%;display:grid;place-items:center;font-size:.95cqw;
  background:rgba(10,16,24,.82);border:1.5px solid var(--acc);
  box-shadow:0 2px 10px rgba(0,0,0,.5)}
.pin.soon .dot{border-color:var(--ink3);opacity:.75}
.pin.unseen .dot{border-color:var(--line2);color:var(--ink3)}
.pin.on .dot{background:var(--acc);color:#08120F;transform:scale(1.06)}
.pin .lbl{font-size:.72cqw;letter-spacing:.04em;white-space:nowrap;
  padding:.1cqw .34cqw;border-radius:7px;background:rgba(6,10,16,.72);
  color:var(--ink2)}
.pin.unseen .lbl{color:var(--ink3)}
.you{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  width:1.1cqw;height:1.1cqw;min-width:11px;min-height:11px}
.you i{position:absolute;inset:0;border-radius:50%;background:#FFF;
  box-shadow:0 0 0 2px rgba(59,224,200,.9),0 0 12px rgba(59,224,200,.7)}
.you b{position:absolute;left:50%;top:50%;width:0;height:0;
  border-left:.42cqw solid transparent;border-right:.42cqw solid transparent;
  border-bottom:.72cqw solid var(--acc);transform-origin:50% 100%}
.npcdot{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  width:.62cqw;height:.62cqw;min-width:6px;min-height:6px;border-radius:50%;
  background:var(--acc2);opacity:.85;box-shadow:0 0 6px rgba(0,0,0,.6)}
.mapside{display:flex;flex-direction:column;gap:.7cqw}
.mapcard{border:1px solid var(--line);border-radius:16px;padding:.9cqw;
  background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:.4cqw}
.mapcard h3{font-family:var(--disp);font-size:1.15cqw;font-weight:600}
.mapcard .who{font-size:.82cqw;color:var(--acc2)}
.mapcard .blurb{font-size:.86cqw;line-height:1.55;color:var(--ink2)}
.mapcard .doing{font-size:.8cqw;color:var(--ink3)}
.tagsoon{align-self:flex-start;font-size:.68cqw;letter-spacing:.14em;
  text-transform:uppercase;padding:.18cqw .5cqw;border-radius:9px;
  border:1px solid var(--line2);color:var(--ink3)}
.maplist{display:flex;flex-direction:column;gap:.22cqw;max-height:17cqw;
  overflow:auto}
.maprow{display:flex;align-items:center;gap:.5cqw;padding:.34cqw .5cqw;
  border-radius:11px;cursor:pointer;font-size:.86cqw;color:var(--ink2)}
.maprow:hover{background:rgba(255,255,255,.05)}
.maprow.on{background:rgba(59,224,200,.12);color:var(--acc)}
.maprow .ic{width:1.2cqw;text-align:center}
.maprow .st{margin-left:auto;font-size:.7cqw;color:var(--ink3)}

/* the banner that names a place as you walk into it */
.arrive{position:absolute;left:50%;top:16%;transform:translateX(-50%);
  z-index:60;pointer-events:none;text-align:center;opacity:0;
  transition:opacity .5s,transform .5s}
.arrive.on{opacity:1;transform:translateX(-50%) translateY(0)}
.arrive .nm{font-family:var(--disp);font-size:2.2cqw;font-weight:600;
  letter-spacing:.08em;color:#fff;text-shadow:0 3px 22px rgba(0,0,0,.8)}
.arrive .sb{font-size:.9cqw;letter-spacing:.24em;text-transform:uppercase;
  color:var(--acc);text-shadow:0 2px 14px rgba(0,0,0,.9);margin-top:.2cqw}


/* Sizes that used to be written inline in the JS, where no stylesheet
   could reach them — on a phone they stayed at three pixels. */
.skname{width:9cqw;font-size:.92cqw;text-transform:capitalize}
.skval{font-size:.92cqw;width:3cqw;text-align:right}
.lvbig{font-family:var(--disp);font-size:2.6cqw;color:var(--acc)}
/* ============================================================
   FRONT END — title, character creation, and the first minutes.
   Full-frame overlays that own the boot flow. The world renders
   behind them from the first frame, so character creation is a
   live preview rather than a separate screen.
   ============================================================ */
#front{position:absolute;inset:0;z-index:70;display:none;
  pointer-events:auto}
#front.on{display:block}
#front .veil{position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(4,7,13,.94) 0%,rgba(4,7,13,.86) 38%,
    rgba(4,7,13,.30) 66%,rgba(4,7,13,.10) 100%)}
#front .pane{position:absolute;left:0;top:0;bottom:0;width:min(38cqw,560px);
  padding:3.2cqw 3.0cqw;display:flex;flex-direction:column;
  justify-content:center;gap:1.1cqw}
.fbrand{font-family:var(--disp);font-weight:700;letter-spacing:.20em;
  font-size:clamp(26px,3.4cqw,54px);text-transform:uppercase;line-height:1;
  background:linear-gradient(180deg,#EAF6FF 0%,#7FE9DA 55%,#1E8C7E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(59,224,200,.32))}
.fsub{font-size:.92cqw;letter-spacing:.30em;text-transform:uppercase;
  color:var(--ink3);margin-top:-.4cqw}
.fbody{font-size:.95cqw;line-height:1.6;color:var(--ink2);max-width:30cqw}
.fstep{font-size:.74cqw;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acc2)}
.frow{display:flex;gap:.5cqw;flex-wrap:wrap;align-items:center}
.keygrid{display:grid;grid-template-columns:auto 1fr;gap:.3cqw 1cqw;
  font-size:.9cqw}
.fbtn{padding:.66cqw 1.5cqw;border-radius:15px;font-size:.98cqw;font-weight:600;
  letter-spacing:.06em;cursor:pointer;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ink);transition:all .15s;
  font-family:var(--ui)}
.fbtn:hover{background:rgba(59,224,200,.14);border-color:var(--acc);color:var(--acc)}
.fbtn.pri{background:linear-gradient(180deg,rgba(59,224,200,.26),rgba(21,156,137,.22));
  border-color:var(--acc);color:#0B1018;font-weight:700}
.fbtn.pri:hover{filter:brightness(1.12)}
.fbtn[disabled]{opacity:.4;pointer-events:none}
.finp{width:100%;background:rgba(6,9,14,.7);border:1px solid var(--line);
  border-radius:15px;color:var(--ink);font-family:var(--ui);font-size:1.05cqw;
  padding:.66cqw .9cqw;outline:0}
.finp:focus{border-color:var(--acc)}
.swatches{display:flex;gap:.42cqw;flex-wrap:wrap}
.sw2{width:2.1cqw;height:2.1cqw;min-width:22px;min-height:22px;border-radius:13px;
  cursor:pointer;border:2px solid transparent;transition:transform .12s}
.sw2:hover{transform:scale(1.1)}
.sw2.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(59,224,200,.3)}
.optrow{display:flex;gap:.4cqw;flex-wrap:wrap}
.opt{padding:.4cqw .8cqw;border-radius:13px;font-size:.84cqw;cursor:pointer;
  border:1px solid var(--line);color:var(--ink2);transition:all .13s;
  text-transform:capitalize}
.opt:hover{border-color:var(--line2);color:var(--ink)}
.opt.on{border-color:var(--acc);color:var(--acc);background:rgba(59,224,200,.10)}
.flabel{font-size:.76cqw;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.24cqw}
/* The wardrobe is taller than the pane once every slot is exposed, so
   the detail rows scroll inside their own box rather than pushing the
   Continue button off the bottom of the screen. */
.fscroll{max-height:40cqh;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:.9cqw;padding-right:.7cqw;
  /* fade the cut edge, so a half-visible row reads as "more below"
     rather than as a layout that ran out of room */
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 90%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 90%,transparent 100%)}
.fscroll::-webkit-scrollbar{width:6px}
.fscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.fnote{font-size:.88cqw;line-height:1.5;color:var(--ink3);font-style:italic;
  border-left:2px solid var(--acc);padding-left:.7cqw;max-width:30cqw}

/* the guided first steps, as a small card in the corner */
.guide{position:absolute;right:.7cqw;bottom:6.4cqw;width:min(13.2cqw,240px);
  padding:.9cqw 1.0cqw;border-radius:18px;display:none;
  background:linear-gradient(180deg,rgba(20,27,42,.94),rgba(10,15,24,.92));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 12px 34px rgba(0,0,0,.5)}
.guide.on{display:block;animation:tin .3s ease both}
.guide .st{font-size:.7cqw;letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc2);margin-bottom:.24cqw}
.guide h4{font-size:1.0cqw;font-weight:700;margin-bottom:.3cqw}
.guide p{font-size:.86cqw;line-height:1.5;color:var(--ink2)}
.guide .pg{height:.3cqw;min-height:4px;border-radius:99px;margin-top:.55cqw;
  background:rgba(255,255,255,.08);overflow:hidden}
.guide .pg>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}

@container app (max-width: 700px){
  #front .pane{width:74cqw;padding:6cqw 5cqw}
  .fbody{max-width:64cqw;font-size:13px}
  .guide{width:44cqw;bottom:16cqw;font-size:12px}
}

/* ---- worlds ---- */
.wcard{display:flex;gap:1.0cqw;align-items:center;padding:.85cqw 1.0cqw;
  border-radius:17px;border:1px solid var(--line);margin-bottom:.6cqw;
  background:rgba(255,255,255,.03);cursor:pointer;transition:all .14s}
.wcard:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.wcard .badge{width:3.6cqw;height:3.6cqw;min-width:38px;min-height:38px;
  border-radius:15px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--disp);font-size:1.1cqw;color:#0B1018;font-weight:700}
.wcard .wi{flex:1;min-width:0}
.wcard h4{font-size:1.02cqw;font-weight:600}
.wcard .sub{font-size:.8cqw;color:var(--ink3);letter-spacing:.04em}
.wcard .perm{font-size:.7cqw;letter-spacing:.14em;text-transform:uppercase;
  padding:.16cqw .55cqw;border-radius:11px;border:1px solid var(--line);
  color:var(--ink2)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(8cqw,1fr));
  gap:.5cqw;margin:.6cqw 0}
.theme{padding:.7cqw;border-radius:15px;border:1px solid var(--line);
  cursor:pointer;text-align:center;font-size:.86cqw;transition:all .14s}
.theme:hover{border-color:var(--line2)}
.theme.on{border-color:var(--acc);background:rgba(59,224,200,.10);color:var(--acc)}
.theme .sw{height:.7cqw;border-radius:99px;margin-bottom:.34cqw}
.field{display:flex;gap:.5cqw;align-items:center;margin:.5cqw 0}
.field input{flex:1;background:rgba(6,9,14,.7);border:1px solid var(--line);
  border-radius:14px;color:var(--ink);font-family:var(--ui);font-size:.92cqw;
  padding:.5cqw .8cqw;outline:0}
.field input:focus{border-color:var(--acc)}

/* travel fade: entering a world regenerates the terrain, and the cut
   is hidden behind this rather than shown */
#travel{position:absolute;inset:0;z-index:60;background:#05070C;opacity:0;
  pointer-events:none;transition:opacity .34s ease;display:grid;
  place-items:center}
#travel.on{opacity:1;pointer-events:auto}
#travel .lbl{font-family:var(--disp);letter-spacing:.24em;font-size:1.2cqw;
  text-transform:uppercase;color:var(--ink3)}

/* ---- missions ---- */
.mrow{display:flex;gap:.9cqw;align-items:center;padding:.7cqw .9cqw;
  border-radius:16px;border:1px solid var(--line);margin-bottom:.5cqw;
  background:rgba(255,255,255,.028)}
.mrow.done{border-color:rgba(87,208,122,.42);background:rgba(87,208,122,.07)}
.mrow .mi{flex:1;min-width:0}
.mrow h4{font-size:.98cqw;font-weight:600;margin-bottom:.14cqw}
.mrow p{font-size:.82cqw;color:var(--ink2);margin-bottom:.34cqw}
.mrow .rw{font-size:.76cqw;color:var(--gold);letter-spacing:.04em}
.mrow .pg{height:.42cqw;min-height:5px;border-radius:99px;
  background:rgba(6,9,14,.7);overflow:hidden;border:1px solid var(--line)}
.mrow .pg>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc))}
.mrow .ct{font-size:.76cqw;color:var(--ink3);min-width:4cqw;text-align:right}
/* ---- outfit sets ----
   A wide card rather than another square in the grid, because the
   point of a set is the three things together and a name over them. */
.setrow{display:flex;gap:.9cqw;align-items:center;padding:.75cqw .9cqw;
  border-radius:18px;border:1px solid var(--line);margin-bottom:.6cqw;
  background:linear-gradient(120deg,rgba(255,255,255,.045),rgba(255,255,255,.018))}
.setrow.owned{border-color:rgba(87,208,122,.42);background:rgba(87,208,122,.06)}
.setrow .si{flex:1;min-width:0}
.setrow h4{font-size:1.02cqw;font-weight:600;margin-bottom:.14cqw}
.setrow p{font-size:.82cqw;color:var(--ink2);margin-bottom:.3cqw}
.setpc{display:flex;gap:.34cqw;flex-wrap:wrap}
.setpc>span{font-size:.72cqw;padding:.14cqw .5cqw;border-radius:11px;
  border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.setpc>span.have{border-color:rgba(87,208,122,.5);color:#8FE0A6}
.setart{display:flex;gap:.3cqw;flex:0 0 auto}
.setart .cell{width:3.5cqw;min-width:38px;cursor:default}
.setbuy{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;
  gap:.34cqw;align-items:flex-end}
.setbuy .was{font-size:.72cqw;color:var(--ink3);text-decoration:line-through}
.setbuy .now{font-size:.92cqw;color:var(--gold);font-weight:600}
.setsave{font-size:.66cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc)}
.aisle{font-size:.7cqw;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);margin:.9cqw 0 .5cqw}
.mtype{font-size:.66cqw;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);padding:.16cqw .5cqw;border-radius:11px;
  border:1px solid var(--line);white-space:nowrap}

/* ---- NPC dialogue ---- */
.dlg{position:absolute;left:50%;bottom:9.4cqw;transform:translateX(-50%);
  width:min(46cqw,720px);display:none;gap:1.0cqw;padding:1.0cqw 1.2cqw;
  border-radius:19px;
  background:linear-gradient(180deg,rgba(20,27,42,.96),rgba(10,15,24,.95));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 16px 44px rgba(0,0,0,.55)}
.dlg.on{display:flex}
.dlg .face{width:4.4cqw;height:4.4cqw;min-width:46px;min-height:46px;
  border-radius:16px;flex:0 0 auto;
  background:linear-gradient(160deg,#2C3A52,#151E2C);
  border:1px solid var(--line2);display:grid;place-items:center;
  font-family:var(--disp);font-size:1.6cqw;color:var(--acc)}
.dlg .txt{flex:1;min-width:0}
.dlg .who{font-size:.98cqw;font-weight:700}
.dlg .role{font-size:.72cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.4cqw}
.dlg .line{font-size:.95cqw;line-height:1.5;color:var(--ink)}
.dlg .offer{font-size:.86cqw;color:var(--acc);margin-top:.4cqw}
.dlg .cls{font-size:.76cqw;color:var(--ink3);margin-top:.5cqw}

/* ---- chat ----
   Bottom-left, tabbed by channel, with the channel tag colour-coded in
   the line itself so you can read who is talking to whom at a glance
   without parsing the tab you happen to be on. */
.chat{position:absolute;left:.7cqw;bottom:2.7cqw;width:min(19cqw,300px);
  display:flex;flex-direction:column;overflow:hidden;
  transition:opacity .2s}
.chat .tabs2{display:flex;align-items:center;gap:.16cqw;padding:.2cqw .24cqw;
  border-bottom:1px solid var(--line)}
.chat .ct{padding:.16cqw .5cqw;border-radius:10px;font-size:.66cqw;cursor:pointer;
  color:var(--ink3);letter-spacing:.04em}
.chat .ct:hover{color:var(--ink2);background:rgba(255,255,255,.05)}
.chat .ct.on{color:var(--acc);background:rgba(59,224,200,.14)}
.chat .cx{margin-left:auto;padding:0 .34cqw;color:var(--ink3);cursor:pointer;
  font-size:.72cqw}
.chat .cx:hover{color:var(--danger)}
.chat .log{height:7.6cqw;min-height:76px;overflow:auto;padding:.3cqw .5cqw;
  display:flex;flex-direction:column;gap:.1cqw}
.chat .log::-webkit-scrollbar{width:4px}
.chat .log::-webkit-scrollbar-thumb{background:rgba(126,160,216,.22);border-radius:6px}
.chat .ln{font-size:.7cqw;line-height:1.4;color:var(--ink2);word-break:break-word}
.chat .ln .tag{font-weight:600;margin-right:.22cqw}
.chat .ln .tag.world{color:#5BC8FF}
.chat .ln .tag.global{color:#8FA4C4}
.chat .ln .tag.trade{color:#F5C451}
.chat .ln .tag.clan{color:#9BE87F}
.chat .ln .tag.system{color:#B269FF}
.chat .ln b{color:var(--ink)}
.chat .inp{display:flex;border-top:1px solid var(--line)}
.chat input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);
  font-family:var(--ui);font-size:.72cqw;padding:.34cqw .5cqw}
.chat input::placeholder{color:var(--ink3)}
.chat.dim{opacity:.42}
.chat.dim:hover{opacity:1}

/* ---- vitals and the fishing rig ---- */
.vitals{position:absolute;left:.7cqw;top:4.0cqw;width:12.2cqw;display:none}
.vitals.on{display:block}
.bar{height:.55cqw;min-height:7px;border-radius:99px;overflow:hidden;
  background:rgba(4,7,12,.8);border:1px solid rgba(0,0,0,.5);position:relative}
.bar>i{display:block;height:100%;transition:width .22s ease}
.bar .lbl{position:absolute;inset:0;display:grid;place-items:center;
  font-size:.5cqw;font-weight:700;letter-spacing:.08em;color:var(--ink);
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bar.hp>i{background:linear-gradient(90deg,#B22C42,#FF6478);
  box-shadow:0 0 8px rgba(255,100,120,.5)}

.fishrig{position:absolute;left:50%;bottom:6.6cqw;transform:translateX(-50%);
  width:min(30cqw,460px);display:none;flex-direction:column;gap:.5cqw;
  padding:.8cqw 1.0cqw;border-radius:19px;
  background:linear-gradient(180deg,rgba(20,27,42,.94),rgba(10,15,24,.92));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
.fishrig.on{display:flex}
.fishrig .cap{font-size:.82cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:flex;justify-content:space-between}
.fishrig .cap b{color:var(--acc);letter-spacing:.06em;text-transform:none}
.prog{height:1.1cqw;min-height:12px;border-radius:99px;overflow:hidden;
  background:rgba(6,9,14,.8);border:1px solid var(--line);position:relative}
.prog>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc));
  box-shadow:0 0 14px rgba(59,224,200,.55)}
.strain{height:.62cqw;min-height:7px;border-radius:99px;overflow:hidden;
  background:rgba(6,9,14,.8);border:1px solid var(--line)}
.strain>i{display:block;height:100%;
  background:linear-gradient(90deg,#3FA46A,#F5C451 62%,#FF4F7A)}
.strain.hot{animation:strainPulse .28s ease-in-out infinite alternate}
@keyframes strainPulse{to{box-shadow:0 0 14px rgba(255,79,122,.8)}}
.fishrig .hint{font-size:.80cqw;color:var(--ink2);text-align:center;min-height:1.1em}
.fishrig .runs{color:#FFB86A;font-weight:700}

/* the catch card */
.catch{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  display:none;flex-direction:column;align-items:center;gap:.5cqw;
  padding:1.3cqw 2.0cqw;border-radius:21px;
  background:linear-gradient(180deg,rgba(22,29,44,.97),rgba(12,17,26,.97));
  border:1px solid var(--line2);opacity:0;transition:all .3s ease;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.catch.on{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.catch .ic{width:7cqw;height:7cqw;background-size:cover;border-radius:12px}
.catch h3{font-size:1.4cqw;font-weight:700}
.catch .w{font-size:1.0cqw;color:var(--ink2)}
.catch .r{font-size:.78cqw;letter-spacing:.18em;text-transform:uppercase}

/* floating damage numbers */
.dmg{position:absolute;font-family:var(--disp);font-weight:700;
  font-size:1.3cqw;color:#FFD9A0;text-shadow:0 2px 6px rgba(0,0,0,.8);
  pointer-events:none;animation:dfloat .9s ease-out both}
.dmg.crit{font-size:1.9cqw;color:#FFE9A8}
.dmg.hurt{color:#FF7A8E}
@keyframes dfloat{from{opacity:1;transform:translate(-50%,0)}
  to{opacity:0;transform:translate(-50%,-3.4cqw)}}

/* enemy nameplate */
.plate{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:.16cqw}
.plate .nm{font-size:.76cqw;font-weight:600;color:var(--ink);
  text-shadow:0 2px 5px rgba(0,0,0,.9);white-space:nowrap}
.plate .hb{width:5.5cqw;height:.34cqw;min-height:4px;border-radius:99px;
  background:rgba(6,9,14,.8);border:1px solid rgba(0,0,0,.6);overflow:hidden}
.plate .hb>i{display:block;height:100%;background:linear-gradient(90deg,#C4344A,#FF6478)}
.plate.boss .hb{width:9cqw}
.plate.boss .nm{color:#FFC46A}

/* ---- touch ----
   Only present on a coarse pointer. Left thumb steers, right thumb
   looks, and the action cluster sits under the right thumb rather
   than in a corner it cannot reach. */
.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch.on{display:block}
.tstick{position:absolute;width:26cqh;height:26cqh;border-radius:50%;
  border:2px solid rgba(232,239,250,.18);pointer-events:none;
  opacity:0;transition:opacity .18s}
.tstick.on{opacity:1}
.tstick>i{position:absolute;left:50%;top:50%;width:38%;height:38%;
  margin:-19% 0 0 -19%;border-radius:50%;
  background:rgba(232,239,250,.24);border:1px solid rgba(232,239,250,.42)}
.tbtn{position:absolute;border-radius:50%;pointer-events:auto;
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;
  letter-spacing:.06em;color:var(--ink);
  background:linear-gradient(165deg,rgba(38,48,66,.86),rgba(18,25,38,.86));
  border:1px solid var(--line2);backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,.45);user-select:none;
  transition:transform .1s,background .1s}
.tbtn:active{transform:scale(.92);background:rgba(59,224,200,.22)}
.tbtn.big{width:13cqh;height:13cqh;font-size:1.5cqh;right:4cqh;bottom:13cqh}
.tbtn.mid{width:9.5cqh;height:9.5cqh;font-size:1.2cqh}
.tbtn.jump{right:17.5cqh;bottom:16cqh}
.tbtn.act{right:5.5cqh;bottom:27cqh}
.tbtn.menu{width:7cqh;height:7cqh;font-size:1cqh;right:2.5cqh;top:2.5cqh}

/* ---- trading ---- */
.tradewrap{display:flex;gap:1.1cqw}
.tradeside{flex:1;min-width:0;border:1px solid var(--line);border-radius:17px;
  padding:.8cqw;background:rgba(255,255,255,.025)}
.tradeside h4{font-size:.92cqw;font-weight:600;margin-bottom:.5cqw;
  display:flex;justify-content:space-between;align-items:center}
.tradeside h4 .v{color:var(--gold);font-size:.86cqw}
.tradegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.42cqw}
.tradegrid .cell{aspect-ratio:1}
.tradeside.locked{border-color:rgba(87,208,122,.5);
  background:rgba(87,208,122,.06)}
.tradebar{display:flex;gap:.6cqw;align-items:center;margin-top:.9cqw}
.tradebar .note{flex:1;font-size:.84cqw;color:var(--ink2)}
.tradetimer{height:.34cqw;border-radius:99px;background:rgba(6,9,14,.7);
  overflow:hidden;margin-top:.6cqw;border:1px solid var(--line)}
.tradetimer>i{display:block;height:100%;background:var(--acc);transition:width 1s linear}

/* ---- emote wheel ---- */
.wheel{position:absolute;inset:0;z-index:34;display:none;
  place-items:center;background:rgba(5,8,14,.44)}
.wheel.on{display:grid}
.wheel .ring{position:relative;width:30cqw;height:30cqw;
  min-width:280px;min-height:280px}
.wheel .em{position:absolute;transform:translate(-50%,-50%);
  width:7.4cqw;height:7.4cqw;min-width:74px;min-height:74px;
  display:grid;place-items:center;gap:.1cqw;border-radius:99px;
  border:1px solid var(--line2);background:var(--panel2);cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.wheel .em:hover{transform:translate(-50%,-50%) scale(1.14);
  border-color:var(--acc);background:rgba(79,227,176,.16)}
.wheel .em b{font-size:2.1cqw;line-height:1;min-font-size:20px}
.wheel .em span{font-size:.62cqw;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink2)}
.wheel .em i{position:absolute;top:.3cqw;right:.7cqw;font-style:normal;
  font-size:.58cqw;color:var(--ink3)}
.wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
  /* The hub sits over whoever is standing in the middle of it, so it
     carries its own ground rather than trusting the scene behind. */
  padding:.7cqw 1.4cqw;border-radius:99px;
  background:radial-gradient(closest-side,rgba(6,9,15,.86),rgba(6,9,15,0))}
.wheel .hub h4{font-family:var(--disp);font-size:1.3cqw;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink)}
.wheel .hub p{font-size:.68cqw;color:var(--ink3);margin-top:.3cqw}

/* ============================================================
   MOBILE FIRST.

   Everything above this line is sized in cqw against the game
   container, which is the right call on a desktop — the interface
   scales as one piece with the view. On a phone it is the wrong call
   twice over. In landscape on a 844x390 screen one cqw is 8.4 pixels,
   so a label written at 0.86cqw renders at seven pixels; and a layout
   measured from the corners of a rectangle ignores the fact that a
   phone is held by two thumbs that reach about a third of the way in
   from the bottom corners and nowhere near the top ones.

   So the phone gets its own layout rather than a scaled copy of the
   desktop one. It is expressed in pixels, because a thumb is 44
   physical pixels wide whatever the screen is; it is anchored to the
   safe area rather than to the glass; and the things you press most —
   move, jump, use, interact, the hotbar — are the biggest things on
   screen and sit inside the thumb arcs. The desktop layout is left
   exactly as it was.

   `--sa*` are the notch and home-indicator insets, read once and used
   everywhere so nothing has to remember the env() spelling.
   ============================================================ */
#app.mobile{
  --sat:env(safe-area-inset-top,0px);
  --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  /* the thumb arc: how far up from the bottom edge the action cluster
     and the hotbar sit, so neither is under the home indicator */
  --thumb:calc(12px + var(--sab));
}
/* A tap that scrolls the page behind the game, or selects a label, or
   fires a 300ms-delayed synthetic click, is a tap that got away. */
#app.mobile, #app.mobile *{
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
#app.mobile input, #app.mobile textarea{
  -webkit-user-select:text;user-select:text;
  font-size:16px;              /* anything smaller makes iOS zoom on focus */
}

/* ---- mobile: identity, purse, tools ----
   One slim bar across the top, clear of the notch, with nothing in it
   you have to hit accurately. */
#app.mobile .idchip{left:calc(8px + var(--sal));top:calc(8px + var(--sat));
  gap:8px;padding:5px 12px 5px 5px;border-radius:16px}
#app.mobile .idchip .av{width:34px;height:34px;min-width:34px;min-height:34px;
  border-radius:11px;font-size:15px}
#app.mobile .idchip .lvbadge{font-size:8px;padding:1px 0}
#app.mobile .idchip .who{min-width:0;gap:3px}
#app.mobile .idchip .nm{font-size:13px}
#app.mobile .xpbar{height:4px;min-height:4px}
#app.mobile .idchip .xpn{font-size:9px}
#app.mobile .purse{left:auto;right:calc(8px + var(--sar));top:calc(8px + var(--sat));
  gap:6px}
#app.mobile .coin{font-size:12px;padding:5px 10px 5px 6px}
#app.mobile .coin .dot{width:14px;height:14px;min-width:14px;min-height:14px}
#app.mobile .coin .plus{width:20px;height:20px;min-width:20px;min-height:20px;
  font-size:13px}
/* The desktop tool cluster and the left menu list are both keyboard
   affordances. On a phone their jobs belong to the nav bar below. */
#app.mobile .tools, #app.mobile .menu, #app.mobile .keyhint,
#app.mobile .prompt .k{display:none !important}

/* ---- mobile: the nav bar ----
   Six destinations along the top edge under the identity, each one a
   48px target. This replaces the keyboard menu and is the only piece
   of chrome that is always on screen besides the controls. */
.mnav{position:absolute;display:none;gap:6px;z-index:26;pointer-events:auto}
#app.mobile .mnav{display:flex}
.mnav .nb{width:44px;height:44px;border-radius:14px;display:grid;
  place-items:center;color:var(--ink2);
  background:linear-gradient(170deg,rgba(28,37,54,.88),rgba(13,19,30,.88));
  border:1px solid var(--line);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(0,0,0,.42)}
.mnav .nb .hicon{width:20px;height:20px;min-width:20px;min-height:20px}
.mnav .nb:active{transform:scale(.92);background:rgba(79,227,176,.22);
  color:var(--acc)}
.mnav .nb.on{color:var(--acc);border-color:var(--acc)}
/* a dot for anything that wants attention — a mission done, a trade */
.mnav .nb i{position:absolute;margin:-24px 0 0 24px;width:9px;height:9px;
  border-radius:50%;background:var(--danger);display:none}
.mnav .nb.alert i{display:block}

/* ---- mobile: hotbar ----
   Bottom centre, between the thumbs rather than under one of them, so
   picking a block never fights with steering. */
#app.mobile .hotbar{left:50%;transform:translateX(-50%);
  bottom:var(--thumb);gap:7px;padding:7px;border-radius:18px}
#app.mobile .slot{width:52px;height:52px;min-width:52px;min-height:52px;
  border-radius:14px}
#app.mobile .slot .n{font-size:10px}
#app.mobile .slot .k{display:none}
#app.mobile .slot.on{box-shadow:0 0 0 2px var(--acc),0 6px 18px rgba(0,0,0,.5)}

/* ---- mobile: the controls ----
   The stick is invisible until a thumb lands and then draws itself
   under it, anywhere in the left half — a fixed stick you have to find
   is a stick you look down at. */
#app.mobile .tstick{width:132px;height:132px;border-width:2px}
#app.mobile .tstick>i{width:46%;height:46%;margin:-23% 0 0 -23%}
#app.mobile .tbtn{border:1px solid var(--line2);
  font-family:var(--disp);font-weight:700;letter-spacing:.04em}
#app.mobile .tbtn.big{width:82px;height:82px;font-size:14px;
  right:calc(16px + var(--sar));bottom:calc(var(--thumb) + 62px)}
#app.mobile .tbtn.mid{width:58px;height:58px;font-size:12px}
#app.mobile .tbtn.jump{right:calc(106px + var(--sar));
  bottom:calc(var(--thumb) + 74px)}
#app.mobile .tbtn.act{right:calc(24px + var(--sar));
  bottom:calc(var(--thumb) + 152px)}
#app.mobile .tbtn.menu{display:none}
/* A button that does nothing right now says so by fading, rather than
   by doing nothing when pressed. */
#app.mobile .tbtn.off{opacity:.34;pointer-events:none}

/* ---- mobile: the pieces that only make sense with a mouse ----
   The world card is a dashboard widget: it is read once a session and
   it sits exactly where a right thumb rests. It moves into the Worlds
   sheet. The reticle shrinks because on a phone the primary button's
   label already says what is under it, and a big crosshair over a
   small screen is just something in the way. */
#app.mobile .myworld{display:none}
#app.mobile .clock{right:calc(8px + var(--sar));top:calc(48px + var(--sat));
  font-size:11px;gap:6px;padding:4px 9px}
#app.mobile .clock .wx{font-size:9px}
#app.mobile .retic{width:7px;height:7px}
#app.mobile .plate .nm{font-size:11px}
#app.mobile .plate .hb{width:52px;height:5px}
#app.mobile .actbar{bottom:calc(var(--thumb) + 68px);gap:5px;padding:5px;
  max-width:calc(100vw - 200px);overflow-x:auto;scrollbar-width:none}
#app.mobile .actbar::-webkit-scrollbar{display:none}
#app.mobile .act2{min-height:44px;padding:0 12px;font-size:11px;
  border-radius:13px;gap:6px}
#app.mobile .act2 .hicon{width:16px;height:16px}

/* ---- mobile: prompt, arrival, toasts ---- */
#app.mobile .prompt{font-size:13px;padding:9px 14px;border-radius:14px;
  bottom:calc(var(--thumb) + 74px);left:50%;transform:translateX(-50%)}
#app.mobile .arrive .nm{font-size:26px}
#app.mobile .arrive .sb{font-size:12px}
#app.mobile .toasts{right:calc(8px + var(--sar));top:calc(60px + var(--sat));
  width:min(64vw,300px)}
#app.mobile .toast{font-size:12px;padding:9px 12px}

/* ---- mobile: chat ----
   Collapsed to a single line you tap to open, because a chat log is
   the one thing on this HUD that nobody needs while they are moving. */
#app.mobile .chat{left:calc(8px + var(--sal));bottom:calc(var(--thumb) + 62px);
  width:min(52vw,300px);height:112px;border-radius:14px}
#app.mobile .chat.dim{height:34px}
#app.mobile .chat .tabs2{font-size:11px}
#app.mobile .chat .ct{padding:5px 9px}
#app.mobile .chat .log{font-size:11.5px}
#app.mobile .chat .inp input{font-size:16px;padding:7px 9px}

/* ---- mobile: panels as sheets ----
   A phone has no room for a floating dialogue. Every panel becomes a
   sheet that owns the screen, slides up from the bottom edge, and has
   one 44px close target in the corner your thumb is already near. */
#app.mobile .panel{
  width:100%;max-width:none;height:100%;max-height:none;
  left:0;top:0;right:0;bottom:0;transform:none;border-radius:0;
  padding:calc(10px + var(--sat)) calc(10px + var(--sar))
          calc(10px + var(--sab)) calc(10px + var(--sal));
  animation:sheet .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sheet{from{transform:translateY(4%);opacity:0}
                 to{transform:none;opacity:1}}
#app.mobile .panel h3{font-size:19px}
#app.mobile .panel .px{width:44px;height:44px;min-width:44px;min-height:44px;
  font-size:20px;border-radius:14px}
#app.mobile .panel .tabs{gap:6px;overflow-x:auto;flex-wrap:nowrap;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
#app.mobile .panel .tabs::-webkit-scrollbar{display:none}
#app.mobile .panel .tab{font-size:12.5px;padding:0 15px;border-radius:12px;
  white-space:nowrap;flex:0 0 auto;min-height:44px;display:grid;
  place-items:center}
#app.mobile .panel .body{-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;font-size:14px}
#app.mobile .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:8px}
#app.mobile .cell{border-radius:14px}
#app.mobile .cell .qty{font-size:11px}
#app.mobile .row{padding:12px;border-radius:14px;gap:10px}
#app.mobile .btn{min-height:44px;font-size:14px;padding:0 16px;border-radius:14px}
#app.mobile .dressnote,#app.mobile .empty-note{font-size:13px}
#app.mobile .dsw{width:34px;height:34px;min-width:34px;min-height:34px}
#app.mobile .dressrow>.lb{font-size:11px}
#app.mobile .dopt{min-height:40px;font-size:13px;padding:0 14px;
  display:grid;place-items:center}
#app.mobile .scrim{backdrop-filter:blur(2px)}

/* ---- mobile: emote wheel ---- */
#app.mobile .wheel .ring{width:min(86vw,86vh);height:min(86vw,86vh);
  min-width:0;min-height:0}
#app.mobile .wheel .em{width:76px;height:76px;min-width:76px;min-height:76px}
#app.mobile .wheel .em b{font-size:26px}
#app.mobile .wheel .em span{font-size:9px}
#app.mobile .wheel .em i{display:none}
#app.mobile .wheel .hub h4{font-size:17px}
#app.mobile .wheel .hub p{font-size:11px}

/* ---- mobile: portrait ----
   Portrait is playable rather than blocked. The view keeps the top of
   the screen, the controls take the bottom third, and the hotbar moves
   above them instead of between them. */
#app.mobile.portrait .tbtn.big{width:74px;height:74px;
  right:calc(14px + var(--sar));bottom:calc(var(--thumb) + 96px)}

/* ---- mobile: the front end ----

   was no way to start the game at all in portrait. Everything here is
   px for the same reason the HUD is: a thumb is 44 pixels wide whatever
   the screen is.

#app.mobile #front .pane{

   The live stick draws itself wherever the thumb lands, which is the

   game has a walk control at all. So a faint one rests in the corner to

.tsthome{position:absolute;width:132px;height:132px;border-radius:50%;

#app.mobile.portrait .hotbar{

#app.mobile:not(.portrait) .chat{

#app.mobile .getapp{width:min(92cqw,360px)}

#app.mobile:not(.portrait) .getapp{

#app.mobile .getapp .no{width:40px;height:40px;min-width:40px;min-height:40px}

.tbtn{transition:transform .07s ease-out,filter .07s ease-out}
.tbtn.press{transform:scale(.93);filter:brightness(1.22)}
#app.mobile .mnav .nb{transition:transform .07s ease-out}
#app.mobile .mnav .nb:active{transform:scale(.92)}
#app.mobile .slot{transition:transform .08s ease-out}
#app.mobile .slot:active{transform:scale(.94)}

/* The coach mark is the one thing on screen that is trying to teach you
   the controls, so it must not be sitting on them. Above the action
   cluster in portrait, and clear of the hotbar under it. */

   walk stick rests. Everything else on this screen is either a control
   or sitting on one. */
#app.mobile.portrait .guide{bottom:calc(292px + var(--sab))}

/* A 16%-alpha dashed ring disappears entirely over pale ground, which
   is most of the plaza. Give it a dark rim of its own so it reads on
   anything without becoming a fixture you can't ignore. */
.tsthome{border-color:rgba(232,239,250,.30);
  box-shadow:0 0 0 2px rgba(6,10,18,.22),inset 0 0 22px rgba(6,10,18,.20)}
.tsthome>i{background:rgba(232,239,250,.16);
  border-color:rgba(232,239,250,.30)}

/* Landscape is 390 pixels tall and almost all of it is spoken for:
   identity and nav top-left, purse top-right, the walk stick bottom-left,
   the action cluster bottom-right, the hotbar across the bottom. The one
   clear band is the strip under the nav, so the chat gives up some width
   and the coach mark takes the middle of it. */
#app.mobile:not(.portrait) .chat{width:min(32cqw,260px)}
#app.mobile:not(.portrait) .guide{
  left:50%;right:auto;transform:translateX(-50%);
  top:calc(110px + var(--sat));bottom:auto;width:min(36cqw,300px)}

/* The chat's size lives on the lines, not on the log that holds them,
   so styling .log did nothing: at 390px wide .7cqw is under three

#app.mobile .chat .ln{font-size:12.5px;line-height:1.42}
#app.mobile .chat .ln .tag{margin-right:5px}

#app.mobile .chat .cx{padding:0 8px;font-size:15px}

#app.mobile .hcap{font-size:10px;letter-spacing:.14em}

#app.mobile .online b, #app.mobile .online .n{font-size:12px}

#app.mobile .menu .mi .kk{display:none}

   The first mobile pass sized everything for certainty — an 82px USE

<script>
/* ============================================================
   LH.M — math.

   Column-major mat4 to match WebGL's uniformMatrix4fv, so matrices
   go to the GPU without a transpose. Everything writes into an
   `out` argument; the hot paths in the renderer run per-object per
   frame and allocating there is what kills a JS renderer.
   ============================================================ */
var LH={};
(function(){
'use strict';
var M={};
var TAU=Math.PI*2;

M.TAU=TAU;
M.clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
M.lerp=function(a,b,t){return a+(b-a)*t;};
M.smooth=function(t){return t*t*(3-2*t);};

M.angDelta=function(a,b){var d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};

function v3(x,y,z){return new Float32Array([x||0,y||0,z||0]);}

M.set3=function(o,x,y,z){o[0]=x;o[1]=y;o[2]=z;return o;};
M.copy3=function(o,a){o[0]=a[0];o[1]=a[1];o[2]=a[2];return o;};
M.add3=function(o,a,b){o[0]=a[0]+b[0];o[1]=a[1]+b[1];o[2]=a[2]+b[2];return o;};
M.sub3=function(o,a,b){o[0]=a[0]-b[0];o[1]=a[1]-b[1];o[2]=a[2]-b[2];return o;};
M.scale3=function(o,a,s){o[0]=a[0]*s;o[1]=a[1]*s;o[2]=a[2]*s;return o;};
M.addScaled3=function(o,a,b,s){o[0]=a[0]+b[0]*s;o[1]=a[1]+b[1]*s;o[2]=a[2]+b[2]*s;return o;};
M.dot3=function(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];};
M.len3=function(a){return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);};
M.dist3=function(a,b){var x=a[0]-b[0],y=a[1]-b[1],z=a[2]-b[2];return Math.sqrt(x*x+y*y+z*z);};

};

    /* wind so the normal points outward */
    var flip=(nx+ny+nz)<0;
    var order=flip?[0,3,2,1]:[0,1,2,3];
    var ids=[];
    for(var k=0;k<4;k++){var P=pts[order[k]];ids.push(V(P[0],P[1],P[2],nx,ny,nz,P[3],P[4]));}
    this.quad(ids[0],ids[1],ids[2],ids[3]);
  }
  /* The bevel band itself: rather than exact geometry, ring the box
     with a slightly shrunken shell whose normals are averaged. At the
     sizes these props are drawn it is indistinguishable and costs a
     fraction of the triangles. */
  var inner=o.noBand?null:1;
  if(inner){
    var corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
    /* four vertical edge quads */
    for(var e=0;e<4;e++){
      var c0=corners[e],c1=corners[(e+1)%4];
      var sx0=c0[0],sz0=c0[1],sx1=c1[0],sz1=c1[1];
      var n0x=sx0*0.7071,n0z=sz0*0.7071,n1x=sx1*0.7071,n1z=sz1*0.7071;
      var A=V(x+sx0*hw,y-(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,0);
      var B=V(x+sx1*(hw-b),y-(hh-b),z+sz1*hd,n1x,0,n1z,1,0);
      var C=V(x+sx1*(hw-b),y+(hh-b),z+sz1*hd,n1x,0,n1z,1,1);
      var D=V(x+sx0*hw,y+(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,1);
      /* winding depends on which quadrant we are in */
      if((sx0*sz1-sz0*sx1)>0)this.quad(A,B,C,D);else this.quad(A,D,C,B);
    }
  }
  return this;
};

/* A subdivided plane in XZ. `fn(x,z,u,v)` may return {y,c,layer} to
   displace and recolour it, which is how terrain, riverbeds and
   plaza slopes are all built from the same call. Normals come from
   central differences on the displaced height rather than the flat
   (0,1,0), or hills would light as if they were level ground. */
Builder.prototype.plane=function(x,y,z,w,d,c,segs,uvScale,fn){
  segs=segs||1;uvScale=uvScale===undefined?1:uvScale;
  var col=col3(c),base=this.n;
  var hs=null,cols=null,lays=null;
  var stride=segs+1;
  if(fn){hs=new Float32Array(stride*stride);}
  var i,j;
  /* first pass: sample, so normals can look at their neighbours */
  if(fn){
    cols=new Array(stride*stride);lays=new Array(stride*stride);
    for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
      var px0=x+(i/segs-0.5)*w,pz0=z+(j/segs-0.5)*d;
      var r=fn(px0,pz0,i/segs,j/segs);
      var k=j*stride+i;
      hs[k]=(r&&r.y!==undefined)?r.y:y;
      cols[k]=(r&&r.c)?col3(r.c):col;
      lays[k]=(r&&r.layer!==undefined)?r.layer:null;
    }
  }
  var dx=w/segs,dz=d/segs;
  var savedLayer=this.layer;
  for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
    var fx=i/segs,fz=j/segs;
    var px=x+(fx-0.5)*w,pz=z+(fz-0.5)*d,py=y;
    var cc=col,nx=0,ny=1,nz=0;
    if(fn){
      var kk=j*stride+i;
      py=hs[kk];cc=cols[kk];
      if(lays[kk]!==null)this.layer=lays[kk];
      var hL=hs[j*stride+Math.max(0,i-1)],hR=hs[j*stride+Math.min(segs,i+1)];
      var hD=hs[Math.max(0,j-1)*stride+i],hU=hs[Math.min(segs,j+1)*stride+i];
      var spanX=(Math.min(segs,i+1)-Math.max(0,i-1))*dx;
      var spanZ=(Math.min(segs,j+1)-Math.max(0,j-1))*dz;
      nx=-(hR-hL)/(spanX||dx);
      nz=-(hU-hD)/(spanZ||dz);
      ny=1;
      var nl=Math.sqrt(nx*nx+1+nz*nz);
      nx/=nl;ny/=nl;nz/=nl;
    }
    this.vert(px,py,pz,nx,ny,nz,fx*uvScale,fz*uvScale,cc);
    if(fn)this.layer=savedLayer;
  }
  /* Wind counter-clockwise seen from above: a→(x0,z1)→(x1,z1)→(x1,z0)
     puts the face normal at +Y. The obvious ordering gives -Y and the
     whole surface vanishes into the back-face cull. */
  for(var jj=0;jj<segs;jj++)for(var ii=0;ii<segs;ii++){
    var a=base+jj*stride+ii,b=a+1,cq=a+stride,d2=cq+1;
    this.quad(a,cq,d2,b);
  }
  return this;
};

Builder.prototype.cylinder=function(x,y,z,r0,r1,h,seg,c,o){
  o=o||{};seg=seg||12;
  var col=col3(c),hh=h/2,base=this.n;
  var slope=(r0-r1)/h;
  for(var i=0;i<=seg;i++){
    var a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a);
    var nl=Math.sqrt(1+slope*slope);
    var nx=ca/nl,ny=slope/nl,nz=sa/nl;
    this.vert(x+ca*r0,y-hh,z+sa*r0,nx,ny,nz,i/seg*(o.uvScale||1),0,col);
    this.vert(x+ca*r1,y+hh,z+sa*r1,nx,ny,nz,i/seg*(o.uvScale||1),(o.uvScale||1),col);
  }
  /* same winding rule as loft: up the wall first, then around */
  for(var k=0;k<seg;k++){
    var p=base+k*2;
    this.quad(p,p+1,p+3,p+2);
  }
  if(!o.open){
    if(r1>1e-5){
      var ct=this.vert(x,y+hh,z,0,1,0,.5,.5,col),t0=this.n;
      for(var t=0;t<=seg;t++){var aa=t/seg*TAU;
        this.vert(x+Math.cos(aa)*r1,y+hh,z+Math.sin(aa)*r1,0,1,0,
          Math.cos(aa)*.5+.5,Math.sin(aa)*.5+.5,col);}
      for(var t2=0;t2<seg;t2++)this.tri(ct,t0+t2+1,t0+t2);
    }
    if(r0>1e-5){
      var cb=this.vert(x,y-hh,z,0,-1,0,.5,.5,col),b0=this.n;
      for(var u=0;u<=seg;u++){var ab=u/seg*TAU;
        this.vert(x+Math.cos(ab)*r0,y-hh,z+Math.sin(ab)*r0,0,-1,0,
          Math.cos(ab)*.5+.5,Math.sin(ab)*.5+.5,col);}
      for(var u2=0;u2<seg;u2++)this.tri(cb,b0+u2,b0+u2+1);
    }
  }
  return this;
};

Builder.prototype.sphere=function(x,y,z,r,seg,rings,c,o){
  o=o||{};seg=seg||14;rings=rings||10;
  var col=col3(c),base=this.n;
  var sy=o.squash||1;
  for(var j=0;j<=rings;j++){
    var v=j/rings,phi=v*Math.PI,sp=Math.sin(phi),cp=Math.cos(phi);
    for(var i=0;i<=seg;i++){
      var u=i/seg,th=u*TAU,st=Math.sin(th),ct=Math.cos(th);
      var nx=sp*ct,ny=cp,nz=sp*st;
      this.vert(x+nx*r,y+ny*r*sy,z+nz*r,nx,ny/sy,nz,u,v,col);
    }
  }
  for(var jj=0;jj<rings;jj++)for(var ii=0;ii<seg;ii++){
    var a=base+jj*(seg+1)+ii,b=a+seg+1;
    this.quad(a,a+1,b+1,b);
  }
  return this;
};

/* A capsule is the character's collision shape and also, squashed and
   coloured, most of a limb. */
Builder.prototype.capsule=function(x,y,z,r,h,seg,c){
  seg=seg||10;
  var half=Math.max(0,h/2-r);
  this.cylinder(x,y,z,r,r,half*2,seg,c,{open:true});
  this.push().translate(x,y+half,z).scale(1,1,1);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  this.push().translate(x,y-half,z);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  return this;
};

/* Sweep a 2D outline into a solid. This is how railings, rooftops,
   boat hulls and sign frames get made without hand-listing vertices. */
Builder.prototype.extrude=function(pts,depth,c,o){
  o=o||{};
  var col=col3(c),hd=depth/2,n=pts.length,base=this.n;
  /* front + back caps via fan from the centroid — outlines here are
     always convex or near enough that a fan is safe */
  var cx=0,cy=0;
  for(var i=0;i<n;i++){cx+=pts[i][0];cy+=pts[i][1];}
  cx/=n;cy/=n;
  var fc=this.vert(cx,cy,hd,0,0,1,.5,.5,col);
  for(var a=0;a<n;a++)this.vert(pts[a][0],pts[a][1],hd,0,0,1,pts[a][0],pts[a][1],col);
  var bc=this.vert(cx,cy,-hd,0,0,-1,.5,.5,col);
  for(var b=0;b<n;b++)this.vert(pts[b][0],pts[b][1],-hd,0,0,-1,pts[b][0],pts[b][1],col);
  var f0=fc+1,b0=bc+1;
  for(var k=0;k<n;k++){
    var k2=(k+1)%n;
    this.tri(fc,f0+k,f0+k2);
    this.tri(bc,b0+k2,b0+k);
  }
  /* the side wall */
  for(var s=0;s<n;s++){
    var s2=(s+1)%n;
    var dx=pts[s2][0]-pts[s][0],dy=pts[s2][1]-pts[s][1];
    var l=Math.hypot(dx,dy)||1;
    var nx=dy/l,ny=-dx/l;
    var A=this.vert(pts[s][0],pts[s][1],hd,nx,ny,0,0,0,col);
    var B=this.vert(pts[s2][0],pts[s2][1],hd,nx,ny,0,l,0,col);
    var C=this.vert(pts[s2][0],pts[s2][1],-hd,nx,ny,0,l,depth,col);
    var D=this.vert(pts[s][0],pts[s][1],-hd,nx,ny,0,0,depth,col);
    this.quad(A,D,C,B);
  }
  return this;
};

/* ---------------- lofting ----------------
   Stitch a stack of cross-sections into a surface. This is the single
   most useful builder in the file: torsos, limbs, boat hulls, tree
   trunks, fish and rooftops are all a list of outlines at increasing
   heights. Every section needs the same point count so the rings
   correspond; the helpers below all take `n` for exactly that reason. */

/* a circle, for limbs and trunks */
Geo.circle=function(r,n,sx,sz){
  sx=sx===undefined?1:sx;sz=sz===undefined?1:sz;
  var out=[];
  for(var i=0;i<n;i++){
    var a=i/n*TAU;
    out.push([Math.cos(a)*r*sx,Math.sin(a)*r*sz]);
  }
  return out;
};
/* a rounded rectangle, for torsos and anything built rather than grown */
Geo.roundRect=function(w,d,r,n){
  var hw=Math.max(0.0001,w/2-r),hd=Math.max(0.0001,d/2-r);
  var out=[],per=Math.max(1,Math.floor(n/4));
  var corners=[[hw,hd,0],[-hw,hd,Math.PI/2],[-hw,-hd,Math.PI],[hw,-hd,-Math.PI/2]];
  for(var c=0;c<4;c++){
    var cc=corners[c];
    for(var i=0;i<per;i++){
      var a=cc[2]+(i/per)*(Math.PI/2);
      out.push([cc[0]+Math.cos(a)*r,cc[1]+Math.sin(a)*r]);
    }
  }
  /* pad to exactly n so sections always line up */
  while(out.length<n)out.push(out[out.length-1].slice());
  return out.slice(0,n);
};

/* `sections` is [{y, pts:[[x,z]...], scale?, col?, skin?}]. Normals come
   from the surface itself — the ring tangent crossed with the rise to
   the next ring — so a taper lights correctly instead of like a
   cylinder.

   `skin` is [bone,weight,...] up to four pairs, applied before the ring
   is emitted. Per ring rather than per loft is the whole point: a limb
   is one loft whose rings hand over from one bone to the next as they
   cross the joint, and that hand-over is what makes a knee bend like a
   knee instead of shearing. */
Builder.prototype.loft=function(sections,c,o){
  o=o||{};
  var col=col3(c),n=sections[0].pts.length,rings=sections.length;
  var base=this.n,i,j;
  /* Sections may be listed bottom-up (a torso) or top-down (a limb
     hanging from its pivot). Rather than make every caller remember
     which way round to write them, detect the direction and flip the
     winding to match — otherwise half the meshes in the game face
     inward and vanish into the back-face cull. */
  var up=(sections[rings-1].y>=sections[0].y);
  var uvScale=o.uvScale||1;
  /* `uvV` remaps the section height into 0..1 across the whole loft, so
     a texture can be painted to fit the thing rather than tiled along
     it. The head needs this: a face map is one image stretched from
     chin to crown, not a repeating pattern. */
  var vLo=o.uvV?o.uvV[0]:0, vHi=o.uvV?o.uvV[1]:0;
  var vK=o.uvV?1/((vHi-vLo)||1):0;
  var uOff=o.uvU||0;
  for(j=0;j<rings;j++){
    var S=sections[j],pts=S.pts,cc=S.col?col3(S.col):col;
    if(S.skin)this.skin.apply(this,S.skin);
    var sc=S.scale===undefined?1:S.scale;
    /* rise toward the neighbouring ring, used for the normal's tilt */
    var prev=sections[Math.max(0,j-1)],next=sections[Math.min(rings-1,j+1)];
    var dy=(next.y-prev.y)||1;
    for(i=0;i<n;i++){
      var px=pts[i][0]*sc,pz=pts[i][1]*sc;
      /* ring tangent */
      var a=pts[(i+1)%n],b=pts[(i-1+n)%n];
      var tx=(a[0]-b[0])*sc,tz=(a[1]-b[1])*sc;
      /* radial outward */
      var rx=px,rz=pz;
      var rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
      /* how much the profile grows between neighbouring rings decides
         how far the normal tips up or down */
      var pn=next.pts[i],pp=prev.pts[i];
      var nsc=next.scale===undefined?1:next.scale,psc=prev.scale===undefined?1:prev.scale;
      var dr=Math.hypot(pn[0]*nsc,pn[1]*nsc)-Math.hypot(pp[0]*psc,pp[1]*psc);
      var ny=-dr/dy;
      var nx=rx,nz=rz;
      var nl=Math.hypot(nx,ny,nz)||1;
      var uu=i/n*uvScale+uOff;
      var vvv=o.uvV?((S.y-vLo)*vK):S.y*uvScale;
      this.vert(px,S.y,pz,nx/nl,ny/nl,nz/nl,uu,vvv,cc);
    }
  }
  /* Wind along the stack before going around the ring: sections from
     Geo.circle/roundRect run counter-clockwise in XZ, so the reverse
     order puts every face normal on the inside. */
  for(j=0;j<rings-1;j++)for(i=0;i<n;i++){
    var i2=(i+1)%n;
    var A=base+j*n+i, B=base+j*n+i2, C2=base+(j+1)*n+i2, D=base+(j+1)*n+i;
    if(up)this.quad(A,D,C2,B);else this.quad(A,B,C2,D);
  }
  /* caps, unless the loft joins something else */
  /* `openTop` means the geometrically higher cap and `openBottom` the
     lower one, regardless of which end of the list they land on. Tying
     them to list order instead makes a descending loft cap the wrong
     end, which shows up as a large flat surface facing the wrong way. */
  var ny=up?1:-1;
  var openFar=up?o.openTop:o.openBottom;
  var openNear=up?o.openBottom:o.openTop;
  if(!openFar){
    var top=sections[rings-1],tsc=top.scale===undefined?1:top.scale;
    var tcol=top.col?col3(top.col):col;
    if(top.skin)this.skin.apply(this,top.skin);
    var tc=this.vert(0,top.y,0,0,ny,0,.5,.5,tcol),t0=this.n;
    for(i=0;i<n;i++)this.vert(top.pts[i][0]*tsc,top.y,top.pts[i][1]*tsc,0,ny,0,
      top.pts[i][0]+.5,top.pts[i][1]+.5,tcol);
    for(i=0;i<n;i++){
      if(up)this.tri(tc,t0+(i+1)%n,t0+i);else this.tri(tc,t0+i,t0+(i+1)%n);
    }
  }
  if(!openNear){
    var bo=sections[0],bsc=bo.scale===undefined?1:bo.scale;
    var bcol=bo.col?col3(bo.col):col;
    if(bo.skin)this.skin.apply(this,bo.skin);
    var bc=this.vert(0,bo.y,0,0,-ny,0,.5,.5,bcol),b0=this.n;
    for(i=0;i<n;i++)this.vert(bo.pts[i][0]*bsc,bo.y,bo.pts[i][1]*bsc,0,-ny,0,
      bo.pts[i][0]+.5,bo.pts[i][1]+.5,bcol);
    for(i=0;i<n;i++){
      if(up)this.tri(bc,b0+i,b0+(i+1)%n);else this.tri(bc,b0+(i+1)%n,b0+i);
    }
  }
  return this;
};

/* A limb: a tapered loft between two radii with rounded ends, built
   downward from the bone pivot at y=0 the way the skeleton expects. */
Builder.prototype.limb=function(len,r0,r1,c,o){
  o=o||{};
  var n=o.seg||10,secs=[],steps=o.steps||7;
  for(var i=0;i<=steps;i++){
    var t=i/steps;
    var y=-len*t;
    /* ease the radius so the limb swells slightly at the top rather
       than tapering linearly like a traffic cone */
    var r=M.lerp(r0,r1,t*t*(3-2*t));
    if(o.bulge)r*=1+Math.sin(t*Math.PI)*o.bulge;
    var cap=1;
    if(i===0)cap=0.82;
    if(i===steps)cap=0.86;
    secs.push({y:y,pts:Geo.circle(r*cap,n,o.flatX||1,o.flatZ||1)});
  }
  this.loft(secs,c,{uvScale:o.uvScale||1});
  /* joint spheres hide the seam where rigid parts meet */
  if(o.joint!==false){
    this.sphere(0,0,0,r0*0.96,n,Math.max(5,n>>1),c);
    this.sphere(0,-len,0,r1*0.94,n,Math.max(5,n>>1),c);
  }
  return this;
};

/* A flat disc, and a flat ring. Both exist because a capped loft is
   the wrong shape for anything hollow: a fountain basin built as a
   capped cylinder is a solid lid over the water. */
Builder.prototype.disc=function(x,y,z,r,seg,c,down){
  seg=seg||16;
  var col=col3(c),ny=down?-1:1;
  var ctr=this.vert(x,y,z,0,ny,0,.5,.5,col),i0=this.n;
  for(var i=0;i<seg;i++){
    var a=i/seg*TAU;
    this.vert(x+Math.cos(a)*r,y,z+Math.sin(a)*r,0,ny,0,
      Math.cos(a)*.5+.5,Math.sin(a)*.5+.5,col);
  }
  for(var k=0;k<seg;k++){
    var k2=(k+1)%seg;
    if(down)this.tri(ctr,i0+k,i0+k2);
    else this.tri(ctr,i0+k2,i0+k);
  }
  return this;
};
Builder.prototype.annulus=function(x,y,z,r0,r1,seg,c,down){
  seg=seg||16;
  var col=col3(c),ny=down?-1:1,base=this.n;
  for(var i=0;i<seg;i++){
    var a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a);
    this.vert(x+ca*r0,y,z+sa*r0,0,ny,0,ca*.5+.5,sa*.5+.5,col);
    this.vert(x+ca*r1,y,z+sa*r1,0,ny,0,ca*.5+.5,sa*.5+.5,col);
  }
  for(var k=0;k<seg;k++){
    var a0=base+k*2, b0=base+((k+1)%seg)*2;
    if(down)this.quad(a0,a0+1,b0+1,b0);
    else this.quad(a0,b0,b0+1,a0+1);
  }
  return this;
};

/* A quad billboarded in the XY plane — leaves, banners, fish fins. */
Builder.prototype.card=function(x,y,z,w,h,c,dbl){
  var col=col3(c);
  var a=this.vert(x-w/2,y-h/2,z,0,0,1,0,0,col);
  var b=this.vert(x+w/2,y-h/2,z,0,0,1,1,0,col);
  var cc=this.vert(x+w/2,y+h/2,z,0,0,1,1,1,col);
  var d=this.vert(x-w/2,y+h/2,z,0,0,1,0,1,col);
  this.quad(a,b,cc,d);
  if(dbl!==false){
    var e=this.vert(x-w/2,y-h/2,z,0,0,-1,0,0,col);
    var f=this.vert(x+w/2,y-h/2,z,0,0,-1,1,0,col);
    var g=this.vert(x+w/2,y+h/2,z,0,0,-1,1,1,col);
    var hh=this.vert(x-w/2,y+h/2,z,0,0,-1,0,1,col);
    this.quad(e,hh,g,f);
  }
  return this;
};

/* Merge another builder's output in under the current transform.
   Lets a prop be composed from named sub-builders. */
Builder.prototype.append=function(other){
  var base=this.n,ov=other.v,sl=this.layer,se=this.emis,
      sl2=this.layer2,sb=this.blend;
  for(var i=0;i<ov.length;i+=15){
    this.layer=ov[i+11];this.emis=ov[i+12];
    this.layer2=ov[i+13];this.blend=ov[i+14];
    this.vert(ov[i],ov[i+1],ov[i+2],ov[i+3],ov[i+4],ov[i+5],
      ov[i+6],ov[i+7],[ov[i+8],ov[i+9],ov[i+10]]);
  }
  this.layer=sl;this.emis=se;this.layer2=sl2;this.blend=sb;
  for(var j=0;j<other.i.length;j++)this.i.push(base+other.i[j]);
  return this;
};

/* Tint every vertex already in the buffer — used to recolour a shared
   prop builder without rebuilding it. */
Builder.prototype.tintAll=function(c){
  var col=col3(c);
  for(var i=0;i<this.v.length;i+=15){this.v[i+8]=col[0];this.v[i+9]=col[1];this.v[i+10]=col[2];}
  return this;
};

Builder.prototype.bounds=function(){
  var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(var i=0;i<this.v.length;i+=15){
    for(var k=0;k<3;k++){

   uploaded as one layer of a texture array, so the whole world
   draws with a single texture bound. Nothing is downloaded.

   rectangles on it, and cloth, bark, gravel and skin were all equally
   glassy-smooth under the same highlight.

   from the luminance of the one that already exists. That is a guess,
   but a good one here: every recipe in this file was painted by making
   the recessed parts darker — mortar lines, plank grooves, the gaps
   between cobbles. Where the guess is wrong it is wrong in *sign*
   rather than in shape, which is why `bump` is signed: brick's mortar

     normal map built straight off it is a field of static that turns
