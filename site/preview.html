/* ============================================================
   Mission and social handlers, inside the authority.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D=LH.Data,Net=LH.Net,Q=LH.Quests;

/* Every activity funnels through one tracker. Missions, achievements
   and the "discovered" counters all read the same event, so a new
   mission never means editing the thing it measures. */
function activeSet(srv){
  var out=[];
  var s=srv.snapshot();
  Q.todaysDailies().forEach(function(m){out.push(m);});
  Q.thisWeek().forEach(function(m){out.push(m);});
  Q.MISSIONS.forEach(function(m){
    if(m.type!=='story')return;
    var st=s.missions[m.id];
    if(st&&st.claimed)return;
    if(m.needs){
      var pre=s.missions[m.needs];
      if(!pre||!pre.claimed)return;
    }
    if(s.level<m.level)return;
    out.push(m);
  });
  return out;
}

Net.register('track',function(p,srv){
  var kind=p.kind,key=p.key,n=p.n||1;
  var s=srv.snapshot();
  var completed=[];

  /* rotate: a daily from a previous day resets rather than carrying */
  var today=Q.dayIndex(), week=Q.weekIndex();

  activeSet(srv).forEach(function(m){
    var g=m.goal;
    if(g[0]!==kind)return;
    if(g[1]&&g[1]!==key)return;
    var st=srv.mission(m.id);
    if(m.type==='daily'&&st.day!==today){st.p=0;st.done=false;st.claimed=false;st.day=today;}
    if(m.type==='weekly'&&st.week!==week){st.p=0;st.done=false;st.claimed=false;st.week=week;}
    if(st.done)return;
    st.p+=n;
    if(st.p>=g[2]){st.p=g[2];st.done=true;completed.push(m.id);}
  });

  /* achievements use the same events but never reset */
  Q.ACH.forEach(function(a){
    if(a[2]!==kind)return;
    if(a[3]&&a[3]!==key)return;
    var st=srv.achievement(a[0]);
    if(st.done)return;
    st.p+=n;
    if(st.p>=a[4]){
      st.done=true;
      var rw=a[5]||{};
      if(rw.xp)srv.xp(rw.xp);
      if(rw.items)rw.items.forEach(function(it){srv.give(it[0],it[1]);});
      if(rw.title)srv.title(rw.title);
      completed.push('ach:'+a[0]);
    }
  });

  return {ok:true,completed:completed,state:srv.snapshot()};
});

Net.register('missions',function(p,srv){
  var s=srv.snapshot();
  var today=Q.dayIndex(), week=Q.weekIndex();
  function pack(m){
    var st=s.missions[m.id]||{p:0,done:false,claimed:false};
    /* a stale daily reads as fresh rather than complete */
    if(m.type==='daily'&&st.day!==today)st={p:0,done:false,claimed:false};
    if(m.type==='weekly'&&st.week!==week)st={p:0,done:false,claimed:false};
    return {id:m.id,name:m.name,desc:m.desc,type:m.type,
      goal:m.goal[2],progress:Math.min(st.p||0,m.goal[2]),
      done:!!st.done,claimed:!!st.claimed,
      reward:m.reward,npc:m.npc};
  }
  return {ok:true,
    daily:Q.todaysDailies().map(pack),
    weekly:Q.thisWeek().map(pack),
    story:activeSet(srv).filter(function(m){return m.type==='story';}).map(pack),
    achievements:Q.ACH.map(function(a){
      var st=(s.achievements||{})[a[0]]||{p:0,done:false};
      return {id:a[0],name:a[1],goal:a[4],progress:Math.min(st.p||0,a[4]),
        done:!!st.done};
    })};
});

Net.register('claim',function(p,srv){
  var m=Q.byId(p.id);
  if(!m)return {ok:false,why:'No such mission.'};
  var st=srv.mission(m.id);
  if(!st.done)return {ok:false,why:'Not finished yet.'};
  if(st.claimed)return {ok:false,why:'Already claimed.'};
  st.claimed=true;
  var rw=m.reward||{};
  if(rw.coins)srv.coins(rw.coins);
  if(rw.xp)srv.xp(rw.xp);
  if(rw.items)rw.items.forEach(function(it){srv.give(it[0],it[1]);});
  if(rw.title)srv.title(rw.title);
  return {ok:true,reward:rw,state:srv.snapshot()};
});

Net.register('talk',function(p,srv){
  var npc=Q.NPCS[p.id];
  if(!npc)return {ok:false,why:'Nobody there.'};
  srv.meet(p.id);
  Net.request('track',{kind:'talk',key:p.id,n:1});
  var seen=srv.metCount(p.id);
  return {ok:true,name:npc.name,role:npc.role,
    line:npc.lines[Math.min(seen-1,npc.lines.length-1)],
    offer:npc.offer,state:srv.snapshot()};
});

Net.register('visit',function(p,srv){
  if(srv.visit(p.id))Net.request('track',{kind:'visit',key:p.id,n:1});
  return {ok:true,state:srv.snapshot()};
});

LH.QuestNet=true;
})();

/* ============================================================
   LH.Realm — private worlds.

   The promise the whole game is making: somewhere that is yours,
   that persists, that you can build in without asking, and that you
   can let other people into on your terms.

   A realm is a terrain profile plus a voxel layer plus a permission
   row. It reuses the same generator, chunking, lighting, collision
   and material blending as Lumen Harbor rather than being a second,
   thinner renderer — which is why a private world does not look
   like a lesser place than the public one.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,Geo=LH.Geo,T=LH.Terrain,V=LH.Voxels,W=LH.World;
var Net=LH.Net,D=LH.Data,En=LH.Enemies;
var R={};

R.current=null;          /* null means Lumen Harbor */
R.busy=false;

/* Themes decide the ground, the sky's mood and what grows there.
   Deliberately few: a long list of themes is a long list of worlds
   that all feel the same. */
var THEMES={
  meadow:{name:'Meadow',   band:'grass',    tree:'broadleaf',density:0.9,
          tint:'#8FD36A'},
  garden:{name:'Blossom Garden',band:'grass',tree:'blossom',density:1.2,
          tint:'#FFC0DA'},
  dunes:{ name:'Dunes',    band:'sand',     tree:'palm',    density:0.5,
          tint:'#EBD6A4'},
  tundra:{name:'Tundra',   band:'snow',     tree:'pine',    density:0.7,
          tint:'#DDEAF6'},
  basalt:{name:'Basalt',   band:'stone',    tree:'dead',    density:0.4,
          tint:'#8A8F98'},
  works:{ name:'Old Works',band:'concrete', tree:'dead',    density:0.3,
          tint:'#7E868F'}
};
R.THEMES=THEMES;
R.themeList=function(){return Object.keys(THEMES);};

/* Props placed in a realm belong to the realm, so they are rebuilt
   on entry and dropped on exit rather than accumulating. */
var realmProps=[];

function dressRealm(seed,theme){
  var Th=THEMES[theme]||THEMES.meadow;
  var rng=M.rng((seed||1)*7919+13);
  var P=LH.Props;
  var radius=(R.current&&R.current.radius)||64;
  var n=Math.round(90*Th.density);
  for(var i=0;i<n;i++){
    var a=rng()*M.TAU, rr=Math.sqrt(rng())*radius*0.94;
    var x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    var h=T.heightAt(x,z);
    if(h<0.9)continue;
    /* leave the middle clear: it is the part people build on */
    if(rr<radius*0.30&&rng()<0.85)continue;
    var k=rng();
    if(k<0.34)W.place(P.tree(Th.tree,(rng()*4)|0),x,h-0.2,z,rng()*6.28,
      0.8+rng()*0.5,'#FFFFFF');
    else if(k<0.58)W.place(P.bush((rng()*3)|0),x,h,z,rng()*6.28,
      0.7+rng()*0.6,'#FFFFFF');
    else if(k<0.86)W.place(P.grassTuft((rng()*3)|0),x,h,z,rng()*6.28,
      0.7+rng()*0.6,'#FFFFFF');
    else W.place(P.rock((rng()*4)|0),x,h-0.3,z,rng()*6.28,
      0.4+rng()*0.9,'#FFFFFF');
  }
}

/* The way home. Every realm has one, in the same place, so nobody
   ever has to work out how to leave. */
function realmGate(){
  var b=Geo.build();
  var y=T.heightAt(0,-14);
  b.push();b.translate(0,y,-14);
  b.mat('panel');
  b.loft([
    {y:0,   pts:Geo.roundRect(4.6,2.6,0.5,14)},
    {y:0.5, pts:Geo.roundRect(4.2,2.2,0.45,14)},
    {y:0.7, pts:Geo.roundRect(3.9,1.9,0.4,14)}
  ],'#98A2B0',{uvScale:1.2});
  for(var i=0;i<=16;i++){
    var a=Math.PI*(i/16);
    b.push();
    b.translate(Math.cos(a)*2.3,0.9+Math.sin(a)*2.3,0);
    b.rotate(0,0,a-Math.PI/2);
    b.mat('panel');
    b.chamfer(0,0,0,0.46,0.40,0.66,i%2?'#C4CCD8':'#AAB2BE',0.06);
    b.pop();
  }
  b.mat('neon',0.85);
  b.push();b.translate(0,0.9,0);
  b.loft([
    {y:-0.9,pts:Geo.circle(1.85,18,1,0.10)},
    {y: 0.0,pts:Geo.circle(2.02,18,1,0.10)},
    {y: 1.9,pts:Geo.circle(1.20,18,1,0.10)}
  ],'#F5A03C',{openTop:true,openBottom:true});
  b.pop();
  b.pop();
  W.statics.push(b.upload());
  W.lights.push({x:0,y:y+2.2,z:-14,r:14,col:[1.00,0.63,0.24],
    power:1.4,always:true});
  W.point('gate','gate',0,-11.5,{y:y,r:4.0,
    label:'Way Home',prompt:'Return to Lumen Harbor'});
}

/* ---------------- entering and leaving ----------------
   The public island's own statics, props, points and collision are
   kept aside rather than rebuilt, because regenerating Lumen Harbor
   on every trip home would take a second and a half. */
var harbourCache=null;

function stash(){
  harbourCache={
    statics:W.statics.slice(),
    boxes:W.boxes.slice(),
    points:W.points.slice(),
    groups:(W.groups||[]).slice(),
    instanced:W.instanced.slice(),
    lights:W.lights.slice(),
    spawn:M.v3(W.spawn[0],W.spawn[1],W.spawn[2]),
    cells:V.serialise(),
    enemies:En.live.slice()
  };
}
function restore(){
  if(!harbourCache)return;
  /* release only what the realm made; the harbour's meshes are the
     same objects that were set aside */
  for(var i=0;i<W.statics.length;i++){
    if(harbourCache.statics.indexOf(W.statics[i])<0)GL.freeMesh(W.statics[i]);
  }
  W.statics.length=0;
  Array.prototype.push.apply(W.statics,harbourCache.statics);
  W.boxes.length=0;
  Array.prototype.push.apply(W.boxes,harbourCache.boxes);
  W.points.length=0;
  Array.prototype.push.apply(W.points,harbourCache.points);
  W.groups=harbourCache.groups;
  W.instanced.length=0;
  Array.prototype.push.apply(W.instanced,harbourCache.instanced);
  W.lights.length=0;
  Array.prototype.push.apply(W.lights,harbourCache.lights);
  M.copy3(W.spawn,harbourCache.spawn);
  En.live.length=0;
  Array.prototype.push.apply(En.live,harbourCache.enemies);
  V.deserialise(harbourCache.cells);
}

/* Build a realm's surface and contents. Synchronous: it is about a
   fifth of a second and it happens behind a fade. */
function buildRealm(realm){
  W.statics.length=0;
  W.boxes.length=0;
  W.points.length=0;
  W.instanced.length=0;
  W.lights.length=0;
  W.groups=[];
  En.live.length=0;

  T.setProfile({kind:'realm',seed:realm.seed,theme:realm.theme,
    radius:realm.radius,relief:realm.relief});
  T.generate();
  T.buildChunks();

  dressRealm(realm.seed,realm.theme);
  W.commitProps();
  realmGate();

  V.deserialise(realm.cells||[]);
  M.set3(W.spawn,0,T.heightAt(0,-6),-6);
}

R.enter=function(realm,done){
  if(R.busy)return false;
  R.busy=true;
  if(!R.current)stash();
  R.current=realm;
  buildRealm(realm);
  R.busy=false;
  if(done)done();
  return true;
};

R.leave=function(done){
  if(!R.current||R.busy)return false;
  R.busy=true;
  /* hand the realm's current cells back to the server before leaving */
  Net.request('saveRealm',{id:R.current.id,cells:V.serialise()});
  R.current=null;
  T.setProfile({kind:'harbor'});
  T.generate();
  T.buildChunks();
  restore();
  R.busy=false;
  if(done)done();
  return true;
};

R.inRealm=function(){return !!R.current;};

LH.Realm=R;
})();

/* ============================================================
   Realm handlers, inside the authority.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Net=LH.Net,R=LH.Realm,D=LH.Data;

var PERMS=['private','friends','invite','public'];

Net.register('myWorlds',function(p,srv){
  return {ok:true,worlds:srv.worlds()};
});

Net.register('createWorld',function(p,srv){
  var list=srv.worlds();
  if(list.length>=3)return {ok:false,why:'You already hold three worlds.'};
  var cost=list.length===0?0:1500*list.length;
  var s=srv.snapshot();
  if(s.coins<cost)return {ok:false,why:'A second world costs '+cost+' coins.'};
  var name=String(p.name||'').trim().slice(0,20);
  if(!/^[A-Za-z0-9 '_-]{2,20}$/.test(name))
    return {ok:false,why:'Two to twenty letters, numbers, spaces, - or _.'};
  if(!R.THEMES[p.theme])return {ok:false,why:'Pick a theme.'};
  srv.coins(-cost);
  var w=srv.addWorld({
    id:'w'+Date.now().toString(36)+Math.floor(Math.random()*999).toString(36),
    name:name,theme:p.theme,
    seed:(Math.random()*1e9)|0,
    radius:64,relief:1,
    perm:'friends',
    cells:[],
    visits:0,
    created:Date.now()
  });
  srv.xp(200,'building');
  return {ok:true,world:w,state:srv.snapshot()};
});

Net.register('saveRealm',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  /* Ownership is checked here rather than trusted: a client may only
     ever write to a world the server already has under its name.
     A call with no cells is a no-op rather than an erase — otherwise
     any stray save would empty the world it was meant to protect. */
  if(Array.isArray(p.cells))w.cells=p.cells;
  return {ok:true};
});

/* ---------------- trading ----------------
   Player to player, with the confirmation dance the 2D build had: both
   sides put items up, both sides lock, both sides confirm, and any
   change to either offer after a lock breaks both locks. The other
   party is simulated until there is a server; the validation is not,
   because it is the part that has to survive one arriving. */
var trade=null;
function tradeValue(offer){
  var v=0;
  for(var k in offer){
    var it=D.byKey(k);
    if(it)v+=it.value*offer[k];
  }
  return v;
}

Net.register('tradeOpen',function(p,srv){
  if(trade)return {ok:false,why:'You are already trading.'};
  trade={with:String(p.with||'Trader').slice(0,16),
    mine:{},theirs:p.theirs||{},
    lockedMe:false,lockedThem:false,
    confirmMe:false,confirmThem:false,
    opened:Date.now()};
  return {ok:true,trade:tradeState(srv)};
});
function tradeState(srv){
  if(!trade)return null;
  return {with:trade.with,mine:Object.assign({},trade.mine),
    theirs:Object.assign({},trade.theirs),
    lockedMe:trade.lockedMe,lockedThem:trade.lockedThem,
    confirmMe:trade.confirmMe,confirmThem:trade.confirmThem,
    valueMine:tradeValue(trade.mine),valueTheirs:tradeValue(trade.theirs),
    left:Math.max(0,120-Math.floor((Date.now()-trade.opened)/1000))};
}
Net.register('tradeOffer',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  if(trade.lockedMe)return {ok:false,why:'Unlock first.'};
  var it=D.byKey(p.key);
  if(!it)return {ok:false,why:'No such item.'};
  if(!it.tradeable)return {ok:false,why:'That item cannot be traded.'};
  var n=Math.max(1,p.n|0||1);
  var held=srv.snapshot().inv[p.key]||0;
  var already=trade.mine[p.key]||0;
  if(p.remove){
    trade.mine[p.key]=Math.max(0,already-n);
    if(!trade.mine[p.key])delete trade.mine[p.key];
  }else{
    if(already+n>held)return {ok:false,why:'You do not have that many.'};
    if(Object.keys(trade.mine).length>=9&&!trade.mine[p.key])
      return {ok:false,why:'Nine kinds of item is the limit.'};
    trade.mine[p.key]=already+n;
  }
  /* A locked offer refuses edits outright (above), so the classic
     swap-after-agreement is impossible. This clears the locks as well,
     which matters for the other direction: if their side changes, your
     agreement to the old goods must not carry over. */
  trade.lockedMe=trade.lockedThem=false;
  trade.confirmMe=trade.confirmThem=false;
  return {ok:true,trade:tradeState(srv)};
});
Net.register('tradeLock',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  trade.lockedMe=!trade.lockedMe;
  if(!trade.lockedMe)trade.confirmMe=trade.confirmThem=false;
  /* the simulated partner locks a beat later, and only if the deal is
     not obviously lopsided against them */
  trade.lockedThem=trade.lockedMe&&
    tradeValue(trade.mine)>=tradeValue(trade.theirs)*0.62;
  return {ok:true,trade:tradeState(srv)};
});
Net.register('tradeConfirm',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  if(!trade.lockedMe||!trade.lockedThem)
    return {ok:false,why:'Both sides have to lock first.'};
  trade.confirmMe=true;
  trade.confirmThem=true;
  /* re-check the goods are still there at the moment of the swap */
  var inv=srv.snapshot().inv;
  for(var k in trade.mine){
    if((inv[k]||0)<trade.mine[k]){
      trade=null;
      return {ok:false,why:'The trade fell through — something is missing.'};
    }
  }
  for(var g in trade.mine)srv.take(g,trade.mine[g]);
  for(var t in trade.theirs)srv.give(t,trade.theirs[t]);
  var got=Object.keys(trade.theirs).map(function(x){return [x,trade.theirs[x]];});
  srv.xp(40,'social');
  trade=null;
  return {ok:true,got:got,state:srv.snapshot()};
});
Net.register('tradeCancel',function(p,srv){
  trade=null;
  return {ok:true};
});
Net.register('tradeState',function(p,srv){
  return {ok:true,trade:tradeState(srv)};
});

Net.register('realmCells',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  return {ok:true,cells:(w.cells||[]).slice()};
});

Net.register('setPerm',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  if(PERMS.indexOf(p.perm)<0)return {ok:false,why:'Unknown permission.'};
  w.perm=p.perm;
  return {ok:true,world:w,state:srv.snapshot()};
});

Net.register('renameWorld',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  var name=String(p.name||'').trim().slice(0,20);
  if(!/^[A-Za-z0-9 '_-]{2,20}$/.test(name))
    return {ok:false,why:'Two to twenty letters, numbers, spaces, - or _.'};
  w.name=name;
  return {ok:true,world:w,state:srv.snapshot()};
});

/* Building permission is per-place. In Lumen Harbor it is your plots;
   in a realm it is whether the realm is yours. */
Net.register('canBuildHere',function(p,srv){
  if(!R.inRealm())return {ok:true,can:Net.canBuild(p.x,p.y,p.z)};
  var w=srv.world(R.current.id);
  return {ok:true,can:!!w};
});

LH.RealmNet=true;
})();

/* ============================================================
   LH.Audio — everything you hear, synthesised.

   No sound files, for the same reason there are no texture files:
   the whole game is one document. Effects are short envelopes over
   oscillators and filtered noise; the score is a slow generative
   pad that follows the time of day and swaps its scale when you
   enter your own world.

   Browsers will not start audio without a gesture, so the context
   is created lazily on the first real input and everything before
   that is silently dropped rather than queued.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,A={};

var ctx=null, master=null, sfxBus=null, musicBus=null;
var noiseBuf=null;
A.enabled=true;
A.volume=0.75;
A.musicVolume=0.42;

function ensure(){
  if(ctx)return ctx;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  ctx=new C();
  master=ctx.createGain();
  master.gain.value=A.volume;
  master.connect(ctx.destination);
  sfxBus=ctx.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
  musicBus=ctx.createGain();musicBus.gain.value=A.musicVolume;
  musicBus.connect(master);
  /* One second of noise, reused by everything that needs a transient:
     footsteps, breaking rock, water. */
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return ctx;
}
A.unlock=function(){
  ensure();
  if(ctx&&ctx.state==='suspended')ctx.resume();
  return !!ctx;
};
A.ready=function(){return !!ctx;};

function env(node,t0,a,d,peak){
  node.gain.setValueAtTime(0.0001,t0);
  node.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+a);
  node.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}

function tone(freq,dur,type,peak,slideTo,delay){
  if(!ctx||!A.enabled)return;
  var t0=ctx.currentTime+(delay||0);
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  env(g,t0,Math.min(0.02,dur*0.25),dur,peak===undefined?0.22:peak);
  o.connect(g);g.connect(sfxBus);
  o.start(t0);o.stop(t0+dur+0.06);
}

function noise(dur,peak,cut,q,slideCut,delay){
  if(!ctx||!A.enabled)return;
  var t0=ctx.currentTime+(delay||0);
  var src=ctx.createBufferSource();src.buffer=noiseBuf;
  var f=ctx.createBiquadFilter();
  f.type='bandpass';
  f.frequency.setValueAtTime(cut||1200,t0);
  if(slideCut)f.frequency.exponentialRampToValueAtTime(Math.max(60,slideCut),t0+dur);
  f.Q.value=q||1.1;
  var g=ctx.createGain();
  env(g,t0,0.006,dur,peak===undefined?0.2:peak);
  src.connect(f);f.connect(g);g.connect(sfxBus);
  src.start(t0);src.stop(t0+dur+0.05);
}

/* ---------------- the effect library ----------------
   Each one is a short recipe. Written as data-ish functions rather
   than a switch so adding a sound is a line. */
var SFX={
  step:function(){noise(0.09,0.10,420+Math.random()*260,1.6,180);},
  jump:function(){tone(300,0.14,'triangle',0.16,520);},
  land:function(){noise(0.13,0.20,300,1.2,110);tone(120,0.10,'sine',0.14,70);},
  place:function(){tone(420,0.09,'square',0.10,560);noise(0.07,0.09,900,2,500);},
  break:function(){
    noise(0.22,0.26,900,0.9,220);
    tone(180,0.12,'triangle',0.10,90);
  },
  hit:function(){
    noise(0.10,0.24,1600,1.4,500);
    tone(220,0.09,'sawtooth',0.12,140);
  },
  hurt:function(){tone(300,0.20,'sawtooth',0.16,120);noise(0.12,0.14,700,1.1,240);},
  pickup:function(){
    tone(880,0.07,'sine',0.13);
    tone(1320,0.09,'sine',0.11,undefined,0.05);
  },
  cast:function(){noise(0.26,0.12,2400,0.8,600);},
  splash:function(){noise(0.30,0.20,900,0.7,240);},
  bite:function(){tone(660,0.08,'square',0.14);tone(880,0.10,'square',0.12,undefined,0.07);},
  reel:function(){noise(0.05,0.06,2600,3,2200);},
  snap:function(){tone(1400,0.10,'sawtooth',0.20,300);noise(0.10,0.16,3000,1.4,700);},
  catch:function(){
    /* a small rising arpeggio — the one moment worth a fanfare */
    [523,659,784,1046].forEach(function(f,i){
      tone(f,0.20,'triangle',0.16,undefined,i*0.075);
    });
    noise(0.30,0.12,700,0.8,200);
  },
  levelup:function(){
    [523,659,784,1046,1318].forEach(function(f,i){
      tone(f,0.34,'sine',0.18,undefined,i*0.09);
    });
  },
  ui:function(){tone(1200,0.04,'sine',0.07);},
  open:function(){tone(520,0.09,'sine',0.09,760);},
  close:function(){tone(760,0.08,'sine',0.08,480);},
  deny:function(){tone(200,0.14,'square',0.13,150);},
  coin:function(){
    tone(1568,0.07,'sine',0.10);
    tone(2093,0.08,'sine',0.08,undefined,0.045);
  },
  travel:function(){
    tone(180,0.9,'sine',0.14,720);
    noise(0.9,0.10,400,0.6,3000);
  }
};

A.play=function(name){
  if(!ctx||!A.enabled)return false;
  var f=SFX[name];
  if(!f)return false;
  f();
  return true;
};
A.has=function(name){return !!SFX[name];};

/* Footsteps are rate-limited by distance travelled rather than by a
   timer, so they stay in step whether you walk or sprint. */
var stepAccum=0;
A.footstep=function(distance,surface){
  stepAccum+=distance;
  if(stepAccum<1.9)return;
  stepAccum=0;
  if(!ctx||!A.enabled)return;
  /* soft ground is duller and quieter than stone */
  var soft=(surface==='grass'||surface==='sand'||surface==='dirt');
  noise(soft?0.11:0.08, soft?0.07:0.11,
        soft?(300+Math.random()*180):(900+Math.random()*500),
        soft?1.1:2.0, soft?150:320);
};

/* ---------------- the score ----------------
   A slow pad over a scale that follows the time of day, with a
   sparse melody on top. Generative rather than looped: a loop of any
   length becomes obvious in a game people leave running. */
var musicOn=false, nextNote=0, chordIdx=0;
var SCALES={
  day:   [0,2,4,7,9],        /* major pentatonic — open, unbothered */
  dusk:  [0,2,3,7,9],
  night: [0,2,3,5,7,10],     /* minor — the harbour after dark */
  realm: [0,2,4,6,7,9,11]    /* lydian — your own world, slightly unreal */
};
var ROOT={day:220,dusk:196,night:174.61,realm:233.08};
var pad=null;

function mood(){
  if(LH.Realm&&LH.Realm.inRealm())return 'realm';
  var t=LH.Sky?LH.Sky.time:12;
  if(t<6.2||t>19.6)return 'night';
  if(t<7.6||t>18.0)return 'dusk';
  return 'day';
}

function startPad(){
  if(!ctx||pad)return;
  pad={osc:[],gain:ctx.createGain(),filter:ctx.createBiquadFilter()};
  pad.gain.gain.value=0.0001;
  pad.filter.type='lowpass';
  pad.filter.frequency.value=900;
  pad.filter.Q.value=0.6;
  pad.gain.connect(pad.filter);
  pad.filter.connect(musicBus);
  /* three detuned voices: the beating between them is the whole
     character of the pad */
  for(var i=0;i<3;i++){
    var o=ctx.createOscillator();
    o.type='sawtooth';
    o.detune.value=(i-1)*7;
    o.connect(pad.gain);
    o.start();
    pad.osc.push(o);
  }
  pad.gain.gain.linearRampToValueAtTime(0.055,ctx.currentTime+4);
}

A.music=function(on){
  musicOn=on!==false;
  if(musicOn){ensure();startPad();}
  else if(pad)pad.gain.gain.linearRampToValueAtTime(0.0001,ctx.currentTime+1.5);
};

A.update=function(dt){
  if(!ctx||!musicOn||!A.enabled)return;
  var m=mood();
  var root=ROOT[m], scale=SCALES[m];
  var now=ctx.currentTime;

  if(pad){
    /* the pad walks a slow chord cycle */
    var deg=scale[chordIdx%scale.length];
    var f=root*Math.pow(2,deg/12);
    for(var i=0;i<pad.osc.length;i++){
      pad.osc[i].frequency.setTargetAtTime(f*(i===2?2:1),now,2.2);
    }
    pad.filter.frequency.setTargetAtTime(m==='night'?620:1100,now,3);
  }

  if(now<nextNote)return;
  chordIdx++;
  nextNote=now+(m==='night'?7.5:5.5)+Math.random()*3.5;
  /* one note, sometimes two, high above the pad */
  if(Math.random()<0.72){
    var d1=scale[(Math.random()*scale.length)|0];
    var oct=Math.random()<0.4?3:2;
    var g=ctx.createGain();
    var o=ctx.createOscillator();
    o.type='triangle';
    o.frequency.value=root*Math.pow(2,d1/12+oct);
    env(g,now+0.05,0.6,2.6,0.05);
    o.connect(g);g.connect(musicBus);
    o.start(now);o.stop(now+3.6);
  }
};

A.setVolume=function(v){
  A.volume=M.clamp(v,0,1);
  if(master)master.gain.setTargetAtTime(A.volume,ctx.currentTime,0.05);
};
A.setMusicVolume=function(v){
  A.musicVolume=M.clamp(v,0,1);
  if(musicBus)musicBus.gain.setTargetAtTime(A.musicVolume,ctx.currentTime,0.05);
};
A.mute=function(on){
  A.enabled=!on;
  if(master)master.gain.setTargetAtTime(on?0:A.volume,ctx.currentTime,0.05);
};

LH.Audio=A;
})();

/* ============================================================
   LH.Front — the title, character creation, and the first steps.

   Three screens over a live world. The camera orbits the plaza
   behind them and the character being built is the actual player
   actor, so character creation is a preview of the thing itself
   rather than a paper doll that has to be kept in sync.

   The onboarding that follows is a checklist rather than a corridor:
   it names the next thing worth doing and gets out of the way when
   you do something else.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D=LH.Data,Net=LH.Net,Act=LH.Actors,Body=LH.Body,Cos=LH.Cos,Geo=LH.Geo;
var Cast=LH.Cast;
var F={};

var root=null,pane=null,step='title';
var draft=null;
F.active=function(){return step!=='done';};
F.step=function(){return step;};
/* Exposed so anything outside this module can move between screens
   without synthesising clicks on chips it has to find first. */
F.go=function(s){go(s);};

var SKIN=['#F7DCC2','#F2C9A4','#E3AE83','#C98B62','#9C6242','#75462C','#54321F'];
var HAIRC=['#1E1B18','#2B2118','#4A3222','#7A5230','#A87740','#D8B978',
           '#8E3B2E','#2A2E3A','#5C4B8A','#2E6B6B'];
/* Eye colours, brightened. These are multiplied over a white iris
   disc, so what is listed here is what you see — and the old set was
   picked as plausible iris pigments, which on a stylised face at three
   metres is six shades of dark. */
var EYEC=['#5C9EDC','#5FA86A','#A87A46','#4E5A6E','#8A6ED8','#C88A4A',
          '#3FC4C0','#D06A86'];
var WEAR=['#8C93A0','#3E5C7A','#7A3A48','#3A6A4A','#6A5A3A','#4A3A6A',
          '#D8D2C4','#26292F'];
/* The wardrobe offers the same choices as character creation, from the
   same lists. Two palettes that drift apart is how a game ends up with
   a hair colour you can pick once and never again. */
F.PALETTE={skin:SKIN,hair:HAIRC,eye:EYEC,wear:WEAR};

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h;return e;}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}

F.init=function(){
  root=document.getElementById('front');

  root.classList.add('on');

function go(next){

/* ---------------- screens ---------------- */
function render(){

}

function renderTitle(){

function swatchRow(label,colours,current,onPick){

  wrap.appendChild(el('div','flabel',label));

function optRow(label,opts,current,onPick){

    b.addEventListener('click',function(){onPick(o);});
    row.appendChild(b);

var presetName=Cast.PRESETS[0].name;
function renderCreate(){
  var p=LH.Game&&LH.Game.player;
  if(!p)return;
  if(!draft)draft=p.kit;

  pane.appendChild(el('div','fstep','Step one of two'));
  pane.appendChild(el('div','fbrand','Who Are You'));

  function repaint(){
    /* The actor is the preview, so a change is visible immediately in
       the world rather than on a separate doll. */
    render();

  /* Overwrite the draft in place. The draft *is* the player's kit
     object, so replacing the reference would leave the preview wearing
     the old one and nothing on screen would move. */
  function wear(kit){
    var keep=draft.name;
    for(var key in kit)draft[key]=kit[key];
    draft.name=keep;
    if(LH.Game&&LH.Game.player)LH.Game.player.scale=draft.scale||1;

  /* Six finished characters to start from. A first screen of sliders

    for(var i=0;i<Cast.PRESETS.length;i++){

  det.appendChild(swatchRow('Hair colour',HAIRC,draft.hair.color,function(c){
    draft.hair.color=c;repaint();}));
  det.appendChild(optRow('Facial hair',Body.FACIAL,draft.facial.style,

  det.appendChild(swatchRow('Eyes',EYEC,draft.eye,function(c){

  det.appendChild(optRow('Build',['slim','base','bulk'],draft.build,function(o){
    draft.build=o;repaint();}));
  det.appendChild(optRow('Headwear',Body.HATS,draft.hat.style,function(o){
    draft.hat.style=o;repaint();}));
  det.appendChild(optRow('Worn on the face',Body.ACCESSORIES,draft.acc.style,
    function(o){draft.acc.style=o;repaint();}));
  det.appendChild(optRow('Top',['tee','jacket','hoodie'],draft.shirt.style,
    function(o){draft.shirt.style=o;repaint();}));
  det.appendChild(optRow('Sleeves',['short','long','none'],draft.shirt.sleeve,
    function(o){draft.shirt.sleeve=o;repaint();}));
  det.appendChild(optRow('Layer',Cos.OVERLAYS,draft.over.style,function(o){
    draft.over.style=o;repaint();}));
  det.appendChild(optRow('Legs',['long','shorts'],draft.pants.leg,function(o){
    draft.pants.leg=o;repaint();}));
  det.appendChild(optRow('Feet',Body.SHOES,draft.shoes.style,function(o){
    draft.shoes.style=o;repaint();}));
  det.appendChild(swatchRow('Clothes',WEAR,draft.shirt.color,function(c){
    draft.shirt.color=c;
    draft.pants.color=Geo.shade(c,-52);
    repaint();}));
  det.appendChild(swatchRow('Layer colour',WEAR,draft.over.color,function(c){
    draft.over.color=c;repaint();}));
  pane.appendChild(det);

  var row=el('div','frow');
  var rand=el('button','fbtn','Surprise me');
  rand.addEventListener('click',function(){
    /* The same rule that dresses the crowd, so a random character is
       still an outfit rather than a bag of colours. */
    wear(Cast.crowd((Math.random()*1e9)|0));

    LH.Audio&&LH.Audio.play('ui');

  var next=el('button','fbtn pri','Continue');
  next.addEventListener('click',function(){

var card=null,idx=0,guideOn=false;
function startGuide(){
  if(F.resumed){guideOn=false;return;}
  card=document.createElement('div');
  card.className='guide';

  guideOn=true;
  idx=0;

function paintGuide(){
  if(!card)return;
  if(idx>=STEPS.length){
    card.classList.remove('on');

      ((LH.Device&&LH.Device.touch&&s.touch)||s.text)+'</p>'+
    '<div class="pg"><i style="width:'+Math.round(idx/STEPS.length*100)+'%"></i></div>';
  card.classList.add('on');
}

  if(!guideOn||!card||idx>=STEPS.length)return;
  if(STEPS[idx].test(state)){
    idx++;

    paintGuide();

/* ============================================================
   LH.Sky — time of day and weather.

   The sun's colour, the sky gradient, the fog and the ambient are all
   driven from one clock, so evening in the harbour is a single number
   changing rather than a set of hand-tuned presets. Weather rides on
   top: overcast desaturates and thickens the fog, rain adds particles
   and drops the exposure.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,R=LH.Render,S={};

S.time=9.2;            /* hours, 0..24 */
S.rate=1/110;          /* game hours per real second — a day is ~30 min */
S.weather='clear';
S.wet=0;               /* 0..1, eased so weather changes are not a cut */

/* Keyframes around the clock. Everything between them is interpolated,
   which is why dawn actually passes through a colour rather than
   snapping from night to day. */
var KEY=[
  /* hour  sun            zenith         horizon        fog            amb sky        amb gnd       exp   stars */
  [ 0.0, [0.14,0.18,0.34],[0.02,0.03,0.12],[0.07,0.10,0.24],[0.07,0.10,0.22],[0.07,0.10,0.20],[0.04,0.04,0.06],1.10,1.0],
  [ 5.0, [0.26,0.22,0.34],[0.04,0.08,0.22],[0.22,0.18,0.32],[0.19,0.18,0.28],[0.11,0.13,0.22],[0.05,0.05,0.07],1.05,0.8],
  [ 6.6, [1.10,0.60,0.38],[0.10,0.20,0.48],[0.92,0.56,0.42],[0.72,0.54,0.50],[0.21,0.21,0.32],[0.10,0.09,0.09],1.00,0.15],
  [ 8.5, [1.16,1.00,0.84],[0.10,0.32,0.76],[0.66,0.82,0.97],[0.64,0.81,0.96],[0.23,0.30,0.42],[0.16,0.15,0.13],1.00,0.0],
  [12.5, [1.18,1.12,1.02],[0.10,0.37,0.84],[0.70,0.87,1.00],[0.69,0.86,1.00],[0.26,0.34,0.46],[0.19,0.18,0.16],0.98,0.0],
  [17.0, [1.17,1.02,0.80],[0.10,0.33,0.78],[0.72,0.84,0.96],[0.70,0.83,0.95],[0.24,0.31,0.43],[0.17,0.16,0.14],1.00,0.0],
  [19.2, [1.22,0.58,0.30],[0.11,0.18,0.46],[1.00,0.54,0.34],[0.82,0.52,0.44],[0.23,0.20,0.29],[0.11,0.09,0.08],1.02,0.2],
  [20.6, [0.50,0.32,0.36],[0.05,0.09,0.26],[0.34,0.22,0.36],[0.27,0.22,0.35],[0.13,0.14,0.24],[0.06,0.05,0.06],1.08,0.7],
  [24.0, [0.14,0.18,0.34],[0.02,0.03,0.12],[0.07,0.10,0.24],[0.07,0.10,0.22],[0.07,0.10,0.20],[0.04,0.04,0.06],1.10,1.0]
];

function sample(h){
  var i=0;
  while(i<KEY.length-2&&KEY[i+1][0]<=h)i++;
  var a=KEY[i],b=KEY[i+1];
  var t=M.smooth(M.clamp((h-a[0])/((b[0]-a[0])||1),0,1));
  var out=[];
  for(var k=1;k<=6;k++){
    out.push([M.lerp(a[k][0],b[k][0],t),M.lerp(a[k][1],b[k][1],t),
              M.lerp(a[k][2],b[k][2],t)]);
  }
  out.push(M.lerp(a[7],b[7],t));
  out.push(M.lerp(a[8],b[8],t));
  return out;
}

var WEATHER={
  clear:   {fogMul:1.00,sunMul:1.00,ambMul:1.00,exp:1.00,cloud:0.0,rain:0},
  cloudy:  {fogMul:1.55,sunMul:0.62,ambMul:1.25,exp:0.97,cloud:0.6,rain:0},
  overcast:{fogMul:2.30,sunMul:0.32,ambMul:1.45,exp:0.94,cloud:1.0,rain:0},
  rain:    {fogMul:3.10,sunMul:0.22,ambMul:1.35,exp:0.90,cloud:1.0,rain:1},
  fog:     {fogMul:5.20,sunMul:0.45,ambMul:1.30,exp:0.96,cloud:0.4,rain:0}
};
S.WEATHER=Object.keys(WEATHER);
var cur=WEATHER.clear, want=WEATHER.clear, blend=1;

S.setWeather=function(name){
  if(!WEATHER[name]||S.weather===name)return;
  cur=mixW(cur,want,blend);
  want=WEATHER[name];blend=0;S.weather=name;
};
function mixW(a,b,t){
  return {fogMul:M.lerp(a.fogMul,b.fogMul,t),sunMul:M.lerp(a.sunMul,b.sunMul,t),
    ambMul:M.lerp(a.ambMul,b.ambMul,t),exp:M.lerp(a.exp,b.exp,t),
    cloud:M.lerp(a.cloud,b.cloud,t),rain:M.lerp(a.rain,b.rain,t)};
}

S.update=function(dt){
  S.time=(S.time+dt*S.rate*(S.paused?0:1))%24;
  blend=Math.min(1,blend+dt*0.28);
  var w=mixW(cur,want,M.smooth(blend));
  S.wet=M.damp(S.wet,w.rain,0.02,dt);

  var k=sample(S.time);
  var sc=k[0],zen=k[1],hor=k[2],fog=k[3],ambS=k[4],ambG=k[5],exp=k[6],stars=k[7];
  var sd=R.scene;

  /* The sun tracks an arc tilted off true east-west, so shadows sweep
     across the island through the day instead of along one axis. */
  var ang=((S.time-6)/12)*Math.PI;
  var elev=Math.sin(ang);
  var tilt=0.34;
  M.set3(sd.sunDir,Math.cos(ang)*0.86,Math.max(0.06,elev),Math.sin(ang)*tilt+0.22);
  M.norm3(sd.sunDir,sd.sunDir);

  M.set3(sd.sunCol,sc[0]*w.sunMul,sc[1]*w.sunMul,sc[2]*w.sunMul);
  M.set3(sd.zenith,zen[0],zen[1],zen[2]);
  M.set3(sd.horizon,hor[0],hor[1],hor[2]);
  M.set3(sd.ground,hor[0]*0.20,hor[1]*0.20,hor[2]*0.24);
  M.set3(sd.fogCol,fog[0],fog[1],fog[2]);
  M.set3(sd.skyCol,ambS[0]*w.ambMul,ambS[1]*w.ambMul,ambS[2]*w.ambMul);
  M.set3(sd.gndCol,ambG[0]*w.ambMul,ambG[1]*w.ambMul,ambG[2]*w.ambMul);
  sd.fogDensity=0.0012*w.fogMul;
  sd.exposure=exp*w.exp;
  sd.stars=stars;
  /* Night and rain both want more bloom: wet surfaces and lit windows
     are most of what you can see. */
  sd.bloom=0.72+stars*0.55+S.wet*0.35;
  sd.bloomThresh=1.05-stars*0.30;
  /* Lit windows and neon are dialled right down at noon and carry the
     scene at night. Baking one value into the mesh would mean the
     harbour glows through the middle of the day. */
  sd.emisScale=0.26+stars*1.05+w.cloud*0.16;
  /* Street lamps come on as the sun drops, not on a clock edge, and
     overcast brings them on early — which is what makes an overcast
     afternoon in the harbour read as weather rather than a filter. */
  sd.lampLevel=M.clamp((0.26-elev)/0.34,0,1)*(1+w.cloud*0.25);

  /* Wind. A gust term on top of a base breeze, so the canopy is never
     doing exactly the same thing twice, and weather leans on it. */
  var gust=0.72+Math.sin(S.time*2.3)*0.16+Math.sin(S.time*7.1)*0.09;
  var force=gust*(1+w.cloud*0.55+S.wet*0.85);
  M.set3(sd.wind,0.86*force,0.30*force,0.40*force);
  sd.windTime+=dt*(1.35+w.cloud*0.5+S.wet*0.9);
  /* Overcast is not "more clouds on the ground": past a point the sky
     is a single sheet and the shadows it casts stop being separate.
     Cover peaks around broken cloud and falls away again. */
  sd.cloudAmt=M.clamp(0.30+w.cloud*0.55,0,1)*(1-S.wet*0.55)*
    M.clamp(elev*3.2,0,1);
  sd.cloudDrift[0]+=dt*0.0042*(1+w.cloud);
  sd.cloudDrift[1]+=dt*0.0026*(1+w.cloud);
  /* Shafts are a low-sun effect. Driving them off the sun's elevation
     means they arrive at dawn and dusk on their own, and a fixed amount
     does not sit over the middle of the day looking like a lens smear.
     Overcast kills them: there is no beam to break up. */
  var lowSun=1-M.clamp(Math.abs(elev)/0.55,0,1);
  sd.rays=(0.16+lowSun*0.62)*(1-w.cloud*0.85)*(1-stars*0.85);
  sd.rayDecay=0.952+lowSun*0.012;
  S.rain=w.rain;
  S.cloud=w.cloud;
};

/* Is it dark enough that street lamps and windows should be lit? */
S.isNight=function(){return S.time<6.4||S.time>19.4;};

LH.Sky=S;
})();

/* ============================================================
   LH.Game — the assembly point.

   Boot stages, the frame loop's game half, and the draw order. This
   is the only file section that knows about all the others.

(function(){
'use strict';
var M=LH.M,GL=LH.GL,R=LH.Render,App=LH.App,Cam=LH.Cam,Geo=LH.Geo;
var T=LH.Terrain,W=LH.World,P=LH.Props,Act=LH.Actors,I=LH.Input,Pl=LH.Player,Sky=LH.Sky;
var Cast=LH.Cast;
var V=LH.Voxels,D=LH.Data,Net=LH.Net,UI=LH.UI,Icon=LH.Icon;
var En=LH.Enemies,Fish=LH.Fishing,Quests=LH.Quests,Realm=LH.Realm;
var Aud=LH.Audio,Front=LH.Front;
var G={};

G.player=null;
G.crowd=[];
G.ready=false;
G.aim={hit:false,x:0,y:0,z:0,mode:'none',target:null};
G.entered=false;

/* ---------------- boot ---------------- */

});

/* The rig asks the world how high the ground is; this is the whole of

Act.groundAt=function(x,z){return W.groundAt(x,z);};

App.stage('Waking the harbour',function(){
  var spawn=W.spawn;
  /* You arrive as the Dock Runner. It is a designed look rather than
     a default one, so the first thing on screen is a character — and
     it is the first entry in the same preset list the wardrobe
     offers, so changing it is one click, not a rebuild. */
  var kit=Cast.kit('dockrunner',7);
  G.player=Act.Actor({x:spawn[0],y:spawn[1],z:spawn[2],kit:kit,name:'You'});
  G.rememberLook();
  Pl.init(G.player);

  /* Simulated residents. There is no server behind them — they walk a
     patrol, and the crowd is honest fiction until there is one. */
  var NAMES=['Skylar','Zenn','Mochi','Noctis','Lumi','Kestrel','Vale',
             'Orin','Sable','Wren','Pico','Juno'];
  var rng=M.rng(4242);
  for(var i=0;i<12;i++){
    var pt=[T.pad('plaza'),T.pad('market'),T.pad('harbour')][i%3];
    var a=rng()*M.TAU,rr=6+rng()*14;
    var x=pt.x+Math.cos(a)*rr, z=pt.z+Math.sin(a)*rr;
    /* Dressed by LH.Cast, not here: the rule that keeps a crowd from
       looking like a colour test lives with the rest of the wardrobe
       decisions rather than in the spawner. */
    var k=Cast.crowd(i*31+5);
    var npc=Act.Actor({x:x,y:T.heightAt(x,z),z:z,kit:k,
      name:NAMES[i%NAMES.length],facing:rng()*M.TAU});
    npc.home=[pt.x,pt.z];
    npc.wander=[x,z];
    npc.wait=rng()*4;
    npc.speed=1.5+rng()*0.9;
    G.crowd.push(npc);
  }
  /* The named residents. Each stands in the district their role
     belongs to, so the person who explains fishing is beside the
     water and the land registry is on the plots. */
  G.npcs=[];
  var NPCSPOT={
    harbourmaster:['harbour',6,4],  foreman:['quarry',-6,-8],
    clerk:['plots',0,-10],          warden:['missions',-6,-9],
    merchant:['market',-4,-8],      mechanic:['garage',-6,-4]
  };
  Quests.npcList().forEach(function(id,i){
    var def=Quests.NPCS[id], spot=NPCSPOT[id];
    var pad=T.pad(spot[0]);
    var nx=pad.x+spot[1], nz=pad.z+spot[2];
    /* Each one is a designed character — see LH.Cast for the sentence
       every kit was built to serve. */
    var kit=Cast.kit(id,600+i*41);
    var a=Act.Actor({x:nx,y:T.heightAt(nx,nz),z:nz,kit:kit,name:def.name,
      facing:Math.atan2(pad.x-nx,pad.z-nz)});
    a.npcId=id;
    a.pos[1]=W.groundAt(nx,nz);
    G.npcs.push(a);
    W.point('npc_'+id,'npc',nx,nz,{y:a.pos[1],r:3.4,
      label:def.name,prompt:'Talk to '+def.name,data:{npc:id}});
  });

  /* Populate. Species are placed by terrain rather than by hand: crabs
     on the shore, slimes in the meadows, wisps in the deep woods,
     rogues on the roads, and one guardian in the quarry. */
  var erng=M.rng(9001);
  function scatterEnemy(kind,count,test){
    var placed=0,tries=0;
    while(placed<count&&tries<4000){
      tries++;
      var ex=(erng()-0.5)*T.SIZE*0.86, ez=(erng()-0.5)*T.SIZE*0.86;
      var eh=T.heightAt(ex,ez);
      if(!test(ex,ez,eh))continue;
      if(T.flatAt(ex,ez)>0.55)continue;                /* not in a district */
      if(Math.hypot(ex-W.spawn[0],ez-W.spawn[2])<34)continue;  /* not on the doorstep */
      En.spawn(kind,ex,ez);placed++;
    }
    return placed;
  }
  scatterEnemy('crab',14,function(x,z,h){return h>0.6&&h<3.2;});
  scatterEnemy('slime',18,function(x,z,h){return h>3&&h<20;});
  scatterEnemy('wisp',10,function(x,z,h){return h>14&&z>10;});
  scatterEnemy('rogue',9,function(x,z,h){return h>4&&h<26;});
  scatterEnemy('shade',5,function(x,z,h){return h>20;});
  var qpad=T.pad('quarry');
  En.spawn('guardian',qpad.x,qpad.z+14,{leash:30});

  /* Saved progress is offered on the title screen rather than loaded
     over the top of a character you are about to make. */
  Front.hasSave=Net.hasSave();
  G.refreshKit();
  G.ready=true;
});
App.stage('Opening the harbour',function(){
  Front.init();
});

/* The character's appearance is a projection of the server's equipped
   map. Nothing writes to the kit directly, so a rejected equip cannot
   leave you visibly wearing something you do not own. */
G.loadSave=function(){
  if(!Net.load())return false;
  UI.sync(Net.snapshot());
  for(var g=0;g<80;g++)V.update(8);
  G.refreshKit();
  var p=G.player;
  p.pos[0]=W.spawn[0];p.pos[2]=W.spawn[2];
  p.pos[1]=W.groundAt(W.spawn[0],W.spawn[2]);
  return true;
};

/* The look the player actually chose. Equipment is still authoritative
   — an equipped hat always wins — but a slot with nothing equipped in
   it now falls back to this rather than to the engine's default. It
   used to fall back to 'crop' and 'none', which meant the first thing
   you ever equipped quietly shaved your head and took your coat off. */
var LOOK={},LOOKC={};
var LOOK_SLOTS=['hair','shirt','hat','wings','cape','back','pet','aura',
                'over','acc','facial','pants','shoes'];
G.rememberLook=function(){
  if(!G.player)return;
  var k=G.player.kit;
  for(var i=0;i<LOOK_SLOTS.length;i++){
    var n=LOOK_SLOTS[i];
    if(!k[n])continue;
    LOOK[n]=k[n].style;
    if(k[n].color)LOOKC[n]=k[n].color;
  }
};

G.refreshKit=function(){
  if(!G.player)return;
  var eq=Net.snapshot().equipped;
  var k=G.player.kit;
  /* An equipped item wins over the wardrobe for both the shape and
     the colour. It used to win only on the shape, so buying a Red
     Coat got you the coat in whatever colour your wardrobe was set
     to — which is a strange thing for a shop to sell. An item with no
     colour of its own (props.col '#FFFFFF') keeps the wardrobe's,
     which is how a plain tee stays dyeable. */
  function slot(name,dflt){
    var key=eq[name];
    var it=key?D.byKey(key):null;
    if(it&&it.props&&it.props.style){
      k[name].style=it.props.style;
      if(it.props.emis!==undefined)k[name].emis=it.props.emis;
      if(k[name].color!==undefined)
        k[name].color=(it.props.col&&it.props.col!=='#FFFFFF')
          ? it.props.col
          : (LOOKC[name]||k[name].color);
    }else{
      var fb=LOOK[name]!==undefined?LOOK[name]:dflt;
      if(fb!==undefined)k[name].style=fb;
      if(k[name]&&k[name].color!==undefined&&LOOKC[name])
        k[name].color=LOOKC[name];
    }
  }
  slot('hair','bald');slot('shirt','tee');slot('hat','none');
  slot('wings','none');slot('cape','none');slot('back','none');
  slot('pet','none');slot('aura','none');
  /* The five slots that had geometry and items but no way to put one
     on: a coat, glasses, a beard, trousers and shoes were all
     wardrobe-only, so every such item in the shop was unwearable. */
  slot('over','none');slot('acc','none');slot('facial','none');
  slot('shoes','shoe');
  /* Trousers carry a leg length rather than a style name, so they are
     read by hand rather than through slot(). */
  var pit=eq.pants?D.byKey(eq.pants):null;
  if(pit&&pit.props){
    k.pants.leg=pit.props.style==='shorts'?'shorts':'long';
    if(pit.props.col&&pit.props.col!=='#FFFFFF')k.pants.color=pit.props.col;
  }else if(LOOKC.pants)k.pants.color=LOOKC.pants;

  /* the held object follows the equipped tool */
  var tool=eq.tool?D.byKey(eq.tool):null;
  k.tool.style=(tool&&tool.props&&tool.props.style)||'none';
};

/* What the player is looking at: a placed block, a spot to build on,
   or an interaction point. The reticle and the prompt both read this. */
var _ro=M.v3(),_rd=M.v3();
function updateAim(){
  var a=G.aim;
  a.hit=false;a.mode='none';a.target=null;
  if(!G.player)return;
  /* Cast from the camera through the screen centre — what the reticle
     covers is what you act on, which is the only rule that stays
     honest across mouse, touch and pad. */
  Cam.ray(0.5,0.5,_ro,_rd);
  var hit=V.raycast(_ro[0],_ro[1],_ro[2],_rd[0],_rd[1],_rd[2],7.5);

  /* an interaction point beats a block: talking to a shop matters
     more than mining the ground under it */
  var pt=W.nearestPoint(G.player.pos[0],G.player.pos[2],4.0);
  if(pt){a.mode='interact';a.target=pt;a.hit=true;return;}

  if(!hit.hit)return;
  a.hit=true;a.x=hit.x;a.y=hit.y;a.z=hit.z;
  a.ground=hit.ground;
  a.item=hit.item;
  a.place=V.placeTarget(hit);
  var held=UI.heldItem();
  if(held&&held.placeable)a.mode='place';
  else if(!hit.ground)a.mode='break';
  else a.mode='none';
}

function actPrimary(){
  var a=G.aim;
  var p=G.player;
  if(!p)return;
  if(a.mode==='interact'){G.interact(a.target);return;}
  var held=UI.heldItem();

  /* In build mode the tool decides, not the held item. Outside it, the
     held item decides — which keeps ordinary play a single button. */
  if(UI.buildOn()&&a.hit){
    var t=UI.tool();
    if(t==='remove'&&!a.ground){
      p.anim.play('mine');
      Net.request('break',{x:a.x,y:a.y,z:a.z,pos:p.pos},function(r){
        if(r.ok&&LH.Device)LH.Device.buzz(18);
        if(r.ok){UI.sync(r.state);Aud&&Aud.play('break');
          for(var i=0;i<r.drops.length;i++)UI.toastItem(r.drops[i][0],r.drops[i][1]);}
        else UI.toast(r.why,'bad');
      });
      return;
    }
    if(t==='rotate'&&!a.ground){
      Net.request('rotate',{x:a.x,y:a.y,z:a.z,pos:p.pos},function(r){
        if(r.ok){UI.sync(r.state);Aud&&Aud.play('ui');}
        else UI.toast(r.why,'bad');
      });
      return;
    }
    if(t==='copy'&&!a.ground){
      Net.request('pickBlock',{x:a.x,y:a.y,z:a.z},function(r){
        if(!r.ok){UI.toast(r.why,'bad');return;}
        UI.setSlot(UI.slotIndex(),r.key);
        UI.buildPalette();
        UI.setTool('place');
        UI.toast('Copied '+D.byKey(r.key).name,'good');
        Aud&&Aud.play('pickup');
      });
      return;
    }
    if(t==='select'&&!a.ground){
      var itSel=a.item;
      UI.toast(itSel?itSel.name+' — '+D.RARITY[itSel.rarity]:'Nothing there',
        itSel?'good':'bad');
      return;
    }
  }

  if(held&&held.placeable&&a.place){
    p.anim.play('build');
    Net.request('place',{x:a.place.x,y:a.place.y,z:a.place.z,
      key:held.key,rot:0,pos:p.pos},function(r){
        if(r.ok&&LH.Device)LH.Device.buzz(18);
      if(r.ok){UI.sync(r.state);Aud&&Aud.play('place');}
      else UI.toast(r.why,'bad');
    });
    return;
  }
  if(a.hit&&!a.ground){
    p.anim.play('mine');
    Net.request('break',{x:a.x,y:a.y,z:a.z,pos:p.pos},function(r){
        if(r.ok&&LH.Device)LH.Device.buzz(18);
      if(r.ok){
        UI.sync(r.state);
        for(var i=0;i<r.drops.length;i++)UI.toastItem(r.drops[i][0],r.drops[i][1]);
        Aud&&Aud.play('break');
      }else UI.toast(r.why,'bad');
    });
    return;
  }
  /* Nothing to build on and nothing to break: swing anyway. A tool
     that does nothing when you click feels broken even when the
     refusal is correct. */
  p.anim.play(held&&held.cat==='weapon'?'attack':'mine');
}

G.interact=function(pt){
  if(!pt)return;
  var p=G.player;
  switch(pt.kind){
    case 'npc':
      /* pressing again while the card is up opens the trade window —
         the second press is the one that means business */
      if(G.talking===pt.data.npc){
        G.talking=null;UI.dialogue(null);
        G.offerTrade(Quests.NPCS[pt.data.npc].name);
        break;
      }
      Net.request('talk',{id:pt.data.npc},function(r){
        if(!r.ok){UI.toast(r.why,'bad');return;}
        UI.sync(r.state);
        G.talking=pt.data.npc;
        UI.dialogue(r);
        UI.refreshMissions();
      });
      break;
    case 'shop': UI.open('shop');break;
    case 'missions': UI.refreshMissions();UI.open('missions');break;
    case 'portal': UI.open('worlds');break;
    case 'gate': G.travelHome();break;
    case 'plot':
      Net.request('claimPlot',{plot:pt.data.plot},function(r){
        if(r.ok){UI.sync(r.state);
          UI.toast('Plot claimed. Build anything you like here.','good');}
        else UI.toast(r.why,'bad');
      });
      break;
    case 'mine':
      p.anim.play('mine');
      Net.request('mine',{node:'ore'},function(r){
        if(r.ok){UI.sync(r.state);UI.toastItem(r.got,r.n);Aud&&Aud.play('break');
          if(r.levelled){UI.toast('Level up!','good');Aud&&Aud.play('levelup');}}
        else UI.toast(r.why,'bad');
      });
      break;
    case 'fish': startFishing();break;
    case 'vehicles': UI.toast('The garage is still being fitted out.','bad');break;
    case 'arena': UI.toast('The arena is closed for repairs.','bad');break;
    default: UI.toast(pt.label,'good');
  }
};
G.onHeldChanged=function(){G.refreshKit();};

/* A resident's counter-offer. Simulated — they propose something from
   their own stock at roughly the value of what you have shown them —
   but every check on the swap itself is real. */
G.offerTrade=function(who){
  var pool=['ingot_cu','ingot_fe','rope','cloth','bait_shrimp','plank_m',
            'coal','copper','iron','crystal','food_stew','lantern'];
  var theirs={};
  var n=1+((Math.random()*3)|0);
  for(var i=0;i<n;i++){
    var k=pool[(Math.random()*pool.length)|0];
    theirs[k]=(theirs[k]||0)+1+((Math.random()*4)|0);
  }
  Net.request('tradeOpen',{with:who,theirs:theirs},function(r){
    if(!r.ok){UI.toast(r.why,'bad');return;}
    UI.openTrade(r.trade);
    Aud&&Aud.play('open');
  });
};

/* ---------------- travel ----------------
   Regenerating the surface takes about a fifth of a second, which is
   long enough to see. It happens behind a fade rather than as a cut. */
function travel(label,work){
  if(Realm.busy)return;
  G.ready=false;
  UI.travelFade(true,label);
  Fish.cancel();
  G.talking=null;UI.dialogue(null);
  UI.plates([]);
  setTimeout(function(){
    work();
    var p=G.player;
    p.pos[0]=W.spawn[0];p.pos[2]=W.spawn[2];
    p.pos[1]=W.groundAt(W.spawn[0],W.spawn[2]);
    Pl.vel[0]=Pl.vel[1]=Pl.vel[2]=0;
    p.anim.play('idle',true);
    /* the voxel layer the destination loaded has to be meshed before
       the fade lifts, or you arrive to an empty plot */
    for(var i=0;i<80;i++)V.update(8);
    G.ready=true;
    setTimeout(function(){UI.travelFade(false);},120);
  },380);
}

G.travelTo=function(w){
  var srvWorld=null;
  Net.request('myWorlds',{},function(r){
    if(r.ok)srvWorld=r.worlds.filter(function(x){return x.id===w.id;})[0];
  });
  if(!srvWorld){UI.toast('That world is not yours.','bad');return;}
  /* the cells come from the server's own row, not from the listing */
  Net.request('saveRealm',{id:w.id,cells:undefined});
  Aud&&Aud.play('travel');
  travel('Entering '+w.name,function(){
    Realm.enter({id:w.id,name:w.name,theme:w.theme,seed:w.seed,
      radius:w.radius,relief:w.relief,cells:G._realmCells(w.id)});
  });
  setTimeout(function(){
    UI.say('','You are in your own world. Everything here is yours to '+
      'build on. The gate behind you leads home.','sys');
  },900);
};
/* Cells are held server-side; this asks for them through the boundary
   rather than reaching into the state. */
G._realmCells=function(id){
  var out=[];
  Net.request('realmCells',{id:id},function(r){if(r.ok)out=r.cells;});
  return out;
};
/* Walk-in travel. It uses the same fade the private worlds do, but it
   does not rebuild anything — the island is already there, so this is
   a move rather than a load. The arrival point is offset toward the
   middle of the island from the pad centre, because pad centres are
   where the landmarks are and materialising inside a fountain is a
   poor welcome. */
G.travelDistrict=function(id){
  var D2=W.DISTRICTS[id], pad=T.pad(id);
  if(!pad||Realm.busy)return false;
  G.ready=false;
  UI.travelFade(true,'Crossing to '+D2.name);
  Fish.cancel();
  G.talking=null;UI.dialogue(null);
  setTimeout(function(){
    var toC=Math.hypot(pad.x,pad.z)||1;
    var ax=pad.x-(pad.x/toC)*pad.r*0.45;
    var az=pad.z-(pad.z/toC)*pad.r*0.45;
    var p=G.player;
    p.pos[0]=ax;p.pos[2]=az;p.pos[1]=W.groundAt(ax,az);
    p.facing=Math.atan2(pad.x-ax,pad.z-az);
    p.wantFacing=p.facing;
    Pl.vel[0]=Pl.vel[1]=Pl.vel[2]=0;
    Pl.peak=0;
    p.anim.play('idle',true);
    G.ready=true;
    lastDistrict=null;          /* so the arrival banner fires again */
    UI.close();
    setTimeout(function(){UI.travelFade(false);},120);
  },380);
  return true;
};

G.travelHome=function(){
  if(!Realm.inRealm())return;
  Aud&&Aud.play('travel');
  travel('Returning to Lumen Harbor',function(){Realm.leave();});
};

/* ---------------- fishing ----------------
   The rod's animation follows the minigame's stage, so what the
   character is doing always matches what the bar is asking for. */
Fish.on(function(ev,data){
  var p=G.player;
  if(ev==='stage'){
    if(data==='cast'){p.anim.play('fishCast',true);Aud&&Aud.play('cast');}
    else if(data==='wait'||data==='sink')p.anim.play('fishWait');
    else if(data==='strike'){p.anim.play('fishReel',true);Aud&&Aud.play('bite');}
    else if(data==='reel')p.anim.play('fishReel');
    return;
  }
  if(ev==='reject'){UI.toast(data,'bad');p.anim.play('idle');return;}
  if(ev==='miss'){UI.toast('It got away.','bad');p.anim.play('idle');return;}
  if(ev==='snap'){UI.toast('The line snapped!','bad');Aud&&Aud.play('snap');
    Cam.shake(0.12,0.2);p.anim.play('idle');return;}
  if(ev==='caught'){
    UI.sync(data.state);
    UI.showCatch(data);
    Aud&&Aud.play('catch');
    p.anim.play('celebrate',true);
    setTimeout(function(){if(p.anim.state==='celebrate')p.anim.play('idle');},1500);
  }
});

/* Which water you are standing beside decides what lives in it. */
function fishZoneAt(x,z){
  if(x<-70&&z>-40&&z<110)return 'river';
  return Math.hypot(x+4,z+100)<70?'deep':'harbour';
}
function startFishing(){
  var p=G.player;
  if(Fish.beginCast(fishZoneAt(p.pos[0],p.pos[2])))Pl.aiming=true;
}

/* ---------------- combat ---------------- */
function swing(){
  var p=G.player;
  var wep=D.byKey(Net.snapshot().equipped.tool);
  var reach=(wep&&wep.props&&wep.props.reach)||2.0;
  p.anim.play('attack',true);
  var e=En.pick(p.pos,p.facing,reach+0.6,1.0);
  if(!e)return;
  Net.request('attack',{id:e.id,pos:p.pos},function(r){
    if(!r.ok)return;
    UI.sync(r.state);
    var sp=project(e.pos[0],e.pos[1]+1.2,e.pos[2]);
    if(sp)UI.damage(sp.x,sp.y,r.damage,r.crit?'crit':'');
    if(r.crit)Cam.shake(0.08,0.16);
    if(r.killed){
      UI.toast(e.S.name+' defeated','good');
      if(r.loot)for(var i=0;i<r.loot.length;i++)UI.toastItem(r.loot[i][0],r.loot[i][1]);
    }
    Aud&&Aud.play('hit');
  });
}

/* Project a world point to screen pixels, for damage numbers and
   nameplates. Returns null behind the camera. */
var _pm=M.m4();
function project(x,y,z){
  M.mul(_pm,Cam.proj,Cam.view);
  var cx=_pm[0]*x+_pm[4]*y+_pm[8]*z+_pm[12];
  var cy=_pm[1]*x+_pm[5]*y+_pm[9]*z+_pm[13];
  var cw=_pm[3]*x+_pm[7]*y+_pm[11]*z+_pm[15];
  if(cw<=0.001)return null;
  var r=LH.App.canvas.getBoundingClientRect();
  return {x:(cx/cw*0.5+0.5)*r.width, y:(0.5-cy/cw*0.5)*r.height};
}
G.project=project;

/* Getting hit. The server decides the number from the attacker's own
   table, so the client cannot claim it took nothing. */
function onEnemyHit(e,dmg){
  var p=G.player;
  if(Math.hypot(e.pos[0]-p.pos[0],e.pos[2]-p.pos[2])>e.S.reach*1.4)return;
  Net.request('takeDamage',{id:e.id},function(r){
    if(!r.ok)return;
    UI.sync(r.state);
    p.anim.play('hurt',true);
    Cam.shake(0.10,0.2);
    var sp=project(p.pos[0],p.pos[1]+1.6,p.pos[2]);
    if(sp)UI.damage(sp.x,sp.y,e.S.dmg,'hurt');
    if(r.dead)G.onDeath();
  });
}
G.onDeath=function(){
  var p=G.player;
  UI.toast('You were knocked out. Waking up at the harbour…','bad');
  Fish.cancel();
  setTimeout(function(){
    Net.request('respawn',{},function(r){
      if(r.ok)UI.sync(r.state);
      p.pos[0]=W.spawn[0];p.pos[2]=W.spawn[2];
      p.pos[1]=W.groundAt(W.spawn[0],W.spawn[2]);
      Pl.vel[0]=Pl.vel[1]=Pl.vel[2]=0;
      p.anim.play('idle',true);
    });
  },900);
};

/* Nameplates for anything living and close. Rebuilt each frame from
   projected positions; the DOM pool is reused rather than churned. */
var plateList=[];
function updatePlates(){
  plateList.length=0;
  var live=En.live;
  for(var i=0;i<live.length;i++){
    var e=live[i];
    if(e.dead)continue;
    if(Math.hypot(e.pos[0]-G.player.pos[0],e.pos[2]-G.player.pos[2])>26)continue;
    /* only plate something that has noticed you, been hit, or is a boss */
    if(e.hp>=e.hpMax&&e.state!=='chase'&&e.state!=='attack'&&!e.S.boss)continue;
    var top=e.pos[1]+(e.S.body==='guardian'?4.2:(e.actor?2.1:1.2));
    var sp=project(e.pos[0],top,e.pos[2]);
    if(!sp)continue;
    plateList.push({x:sp.x,y:sp.y,name:e.S.name,hp:e.hp,hpMax:e.hpMax,
      boss:!!e.S.boss});
  }
  UI.plates(plateList);
}

/* ---------------- crowd ----------------
   A patrol with pauses. Deliberately simple: they exist to make the
   town feel inhabited, not to be simulated citizens. */
function updateCrowd(dt){
  var rng=Math.random;
  for(var i=0;i<G.crowd.length;i++){
    var n=G.crowd[i];
    socialLook(n,7);
    var dx=n.wander[0]-n.pos[0], dz=n.wander[1]-n.pos[2];
    var d=Math.hypot(dx,dz);
    if(d<0.8){
      n.wait-=dt;
      if(n.wait<=0){
        var a=rng()*M.TAU,rr=4+rng()*16;
        n.wander[0]=n.home[0]+Math.cos(a)*rr;
        n.wander[1]=n.home[1]+Math.sin(a)*rr;
        n.wait=1.5+rng()*6;
      }
      if(n.anim.state==='locomote'||n.anim.state==='idle'){
        if(n.wait>0.2&&rng()<0.0016)n.anim.play('wave');
        else if(n.anim.state!=='wave')n.anim.play('idle');
      }
    }else{
      var sp=n.speed;
      n.pos[0]+=dx/d*sp*dt;
      n.pos[2]+=dz/d*sp*dt;
      n.faceToward(Math.atan2(dx,dz),dt,7);
      n.anim.play('locomote');
      n.anim.params.speed=M.clamp((sp-2.2)/5.2,0,1);
    }
    n.pos[1]=W.groundAt(n.pos[0],n.pos[2]);
    n.update(dt);
  }
}

/* ---------------- crowding ----------------
   Characters used to stand inside one another. Nothing in the game
   cared, but the eye does: two people occupying the same half metre is
   the clearest possible signal that they are not really there.

   A soft separation pass, run after everyone has moved. It is O(n^2)
   over at most twenty actors, which is twenty times cheaper than any
   spatial structure would be to build each frame, and it pushes rather
   than blocks — the player always wins the exchange, so a crowd parts
   around you instead of pinning you. */
var SEP=0.62;
function separate(){
  if(!G.player)return;
  var list=[G.player];
  var i,j;
  if(!Realm.inRealm()){
    for(i=0;i<G.crowd.length;i++)list.push(G.crowd[i]);
    if(G.npcs)for(i=0;i<G.npcs.length;i++)list.push(G.npcs[i]);
  }
  /* Two relaxation passes. One is not enough when three people arrive
     at the same bench: resolving A against B puts A inside C, and the
     second pass is what settles that. */
  for(var pass=0;pass<2;pass++)
  for(i=0;i<list.length;i++)for(j=i+1;j<list.length;j++){
    var A=list[i],B=list[j];
    var dx=B.pos[0]-A.pos[0], dz=B.pos[2]-A.pos[2];
    var d2=dx*dx+dz*dz;
    var r=SEP*(A.scale+B.scale)*0.5;
    if(d2>=r*r)continue;
    var d=Math.sqrt(d2);
    if(d<1e-4){
      /* exactly coincident: nudge apart along a fixed axis rather than
         dividing by zero and shipping NaN positions */
      dx=(j%2?1:-1)*0.01;dz=0.01;d=Math.hypot(dx,dz);
    }
    var push=(r-d)*0.55;
    /* The player is index zero and does not get moved by anyone: being
       shoved around by pathing NPCs feels like a bug even when it is
       physically the fairer answer. */
    if(i===0)shove(B,dx/d*push*2,dz/d*push*2);
    else{shove(A,-dx/d*push,-dz/d*push);shove(B,dx/d*push,dz/d*push);}
  }
}
/* Move an actor and take its wander target with it, so the patrol does
   not spend the next second walking straight back into the person it
   was just pushed off. */
function shove(a,dx,dz){
  a.pos[0]+=dx;a.pos[2]+=dz;
  if(a.wander){a.wander[0]+=dx;a.wander[1]+=dz;}
}

/* ---------------- update ---------------- */
App.onUpdate(function(dt,time){
  if(!G.ready)return;
  I.begin();

  Sky.update(dt);
  UI.setClock(Sky.time,Sky.weather);
  if(Aud)Aud.update(dt);
  /* The players-online figure counts the simulated crowd. It is
     honest about what it is counting rather than inventing a number. */
  UI.setOnline(1+G.crowd.length+(G.npcs?G.npcs.length:0));

  /* --- the front end owns everything until it is finished --- */
  if(Front.active()){
    /* A slow orbit of the plaza behind the panel, with the character
       being edited standing in it — so creation previews the real
       thing rather than a doll that has to be kept in sync. */
    var fpad=T.pad('plaza');
    var ang=time*0.055;
    Cam.manual=true;
    M.set3(Cam.target,fpad.x+7,fpad.y+1.05,fpad.z-2);
    M.set3(Cam.eye,fpad.x+7+Math.sin(ang)*5.4,fpad.y+2.3,
      fpad.z-2+Math.cos(ang)*5.4);
    G.player.pos[0]=fpad.x+7;G.player.pos[2]=fpad.z-2;
    G.player.pos[1]=W.groundAt(G.player.pos[0],G.player.pos[2]);
    /* The camera sits in direction `ang` from the target, and facing 0
       points at +Z — so facing must equal `ang` for the character to
       look back at it. Adding pi shows their back, which is not what
       anyone wants from a character creator. */
    G.player.facing=ang;
    G.player.anim.play('idle');
    G.player.update(dt);
    updateCrowd(dt);
    updateNpcs(dt);
    Cam.update(dt,G.player.pos,null);
    R.updateLight(G.player.pos,44);
    T.extractFrustum(R.vp);
    W.refreshClutter(Cam.target[0],Cam.target[2]);
  W.cullProps(Cam.target[0],Cam.target[2],1.3);
    I.end();
    return;
  }
  if(!G.entered){
    /* Hand the camera back once, on the frame the front end closes.
       Keying this off Cam.manual would fire again every time anything
       else takes manual control — a cinematic, a screenshot — and
       replay the arrival. */
    G.entered=true;
    Cam.manual=false;
    Cam.yaw=G.player.facing+Math.PI;
    Cam.pitch=0.22;Cam.wantDist=6.2;Cam.dist=6.2;
    M.copy3(Cam.focus,G.player.pos);
    if(Front.resumed)G.loadSave();
    else if(LH.Device&&LH.Device.mobile)
      UI.say('','Welcome to Lumen Harbor. Left thumb walks, right thumb '+
        'looks. The big button does whatever it says it will.','sys');
    else UI.say('','Welcome to Lumen Harbor. Press <b>E</b> to interact, '+
      '<b>Tab</b> for your backpack, <b>Esc</b> for the menu.','sys');
    UI.say('','Other people here are simulated — there is no server '+
      'behind them yet.','sys');
    /* Now that there is a world behind it, and not before. */
    setTimeout(function(){UI.offerApp();},2600);
  }

  /* --- panel and hotbar input --- */
  if(I.pressed('emote'))UI.wheel();
  if(UI.wheelOn()){
    /* While the wheel is up the number row picks an emote instead of a
       hotbar slot. Same keys, different mode — which is the whole
       reason the wheel is worth having over seven more bindings. */
    var EM=LH.Rig.EMOTES;
    for(var w=1;w<=EM.length&&w<=9;w++){
      if(I.pressed('slot'+w))UI.emote(EM[w-1]);
    }
    if(I.pressed('menu'))UI.wheel(false);
  }else{
    for(var n=0;n<10;n++){
      if(I.pressed('slot'+n))UI.selectSlot(n===0?9:n-1);
    }
  }
  if(I.pressed('inventory'))UI.open('inv');
  if(I.pressed('craft'))UI.open('craft');
  if(I.pressed('missions'))UI.open('missions');
  if(I.pressed('profile'))UI.open('profile');
  if(I.pressed('map'))UI.open('map');
  if(I.pressed('wardrobe'))UI.open('wardrobe');
  if(I.pressed('worlds'))UI.open('worlds');
  if(I.pressed('trade'))UI.open('trade');
  if(I.pressed('build'))UI.toggleBuild();
  if(I.pressed('fly'))Pl.toggleFly();
  if(I.pressed('rotate')&&UI.buildOn())UI.setTool('rotate');
  if(I.pressed('menu')){if(UI.isOpen())UI.close();else UI.open('menu');}
  if(I.pressed('chat'))UI.focusChat();
  /* typing in chat must not also drive the character */
  if(UI.chatFocused()){I.move.x=0;I.move.y=0;}

  /* A panel takes the input: movement and world actions stop, which is
     what stops a click on a shop button also punching the ground. */
  if(UI.isOpen()){
    I.move.x=0;I.move.y=0;
    I.end();
    Pl.update(dt);
    G.player.update(dt);
    updateCrowd(dt);
    Cam.update(dt,G.player.pos,camSolid);
    En.update(dt,G.player.pos,onEnemyHit);
    UI.plates([]);
    R.updateLight(G.player.pos,44);
    T.extractFrustum(R.vp);
    W.refreshClutter(Cam.target[0],Cam.target[2]);
  W.cullProps(Cam.target[0],Cam.target[2],Math.min(1.7,1+Cam.dist*0.030));
    V.update(2);
    return;
  }

  /* camera first, so movement is relative to what you can see */
  if(I.look.x||I.look.y)Cam.orbit(I.look.x,I.look.y);
  if(I.zoom)Cam.zoom(I.zoom);

  Pl.update(dt);
  /* Where the player is actually heading, in the camera's own
     convention (facing + PI), for the auto-align above. Below a walking
     pace there is no meaningful heading and a nudge should not swing the
     view, so it hands back null and the camera holds still. */
  var vx=Pl.vel[0],vz=Pl.vel[2];
  Cam.heading=(vx*vx+vz*vz>0.6&&!Pl.flying&&!Pl.swimming)
    ?Math.atan2(vx,vz)+Math.PI:null;
  G.player.ik=true;
  G.player.update(dt);
  if(!Realm.inRealm())updateCrowd(dt);
  separate();

  /* The camera follows the player's chest, not their feet, so a jump
     does not swing the whole view. */
  Cam.update(dt,G.player.pos,camSolid);

  /* --- fishing owns the primary button while it is running --- */
  if(Fish.active()){
    Pl.aiming=true;
    if(Fish.stage==='cast'){
      if(I.down('primary')||I.pointer.down)Fish.chargeCast(dt);
      else Fish.release();
    }else if(Fish.stage==='strike'){
      if(I.pressed('primary')||I.pressed('interact'))Fish.strike();
    }else if(Fish.stage==='reel'){
      Fish.setPull(I.down('primary')||I.pointer.down);
    }
    if(I.pressed('menu'))Fish.cancel();
    Fish.update(dt);
    UI.fishing(Fish);
  }else{
    Pl.aiming=false;
    UI.fishing(Fish);
    updateAim();
    var heldW=UI.heldItem();
    /* a weapon swings at whatever is in front; everything else builds,
       breaks or interacts */
    if(I.pressed('primary')){
      if(heldW&&heldW.cat==='weapon')swing();
      else actPrimary();
    }
    if(I.pressed('interact')&&G.aim.mode==='interact')G.interact(G.aim.target);
  }

  En.update(dt,G.player.pos,onEnemyHit);
  updatePlates();
  if(!Realm.inRealm()){updateNpcs(dt);trackDistrict();chatter(dt);}

  /* footsteps are driven by distance so they stay in step at any speed */
  var moved=Math.hypot(Pl.vel[0],Pl.vel[2])*dt;
  if(Pl.grounded&&moved>0.001){
    Front.walked+=moved;
    if(Aud)Aud.footstep(moved,surfaceName());
  }
  Front.tick(UI.state()||Net.snapshot());
  if(UI.isTouch())UI.touchStick(I.stick);

  /* walking away ends a conversation */
  if(G.talking){
    var talkPt=W.nearestPoint(G.player.pos[0],G.player.pos[2],5.0);
    if(!talkPt||talkPt.kind!=='npc'||talkPt.data.npc!==G.talking){
      G.talking=null;UI.dialogue(null);
    }
  }

  /* reticle and prompt reflect what the aim found — and so does the
     big touch button, which is labelled with the verb it will perform
     rather than with a generic USE. On a phone the reticle is the only
     thing telling you what is under the crosshair, and reading a word
     is faster than reading a colour. */
  if(Fish.active()){
    UI.setReticle('');UI.setPrompt('');
    UI.setTouchVerb(Fish.stage==='reel'?'REEL':(Fish.stage==='strike'?'STRIKE':'CAST'),
      true,'');
  }else if(G.aim.mode==='interact'){
    UI.setReticle('act');
    UI.setPrompt(G.aim.target.prompt,'E');
    UI.setTouchVerb('USE',false,G.aim.target.verb||'TALK');
  }else if(G.aim.mode==='place'){
    var ok=G.aim.place&&Net.canBuild(G.aim.place.x,G.aim.place.y,G.aim.place.z);
    UI.setReticle(ok?'act':'deny');
    UI.setPrompt(ok?'Place '+UI.heldItem().name:'You cannot build here','LMB');
    UI.setTouchVerb('PLACE',ok,'');
  }else if(G.aim.mode==='break'){
    var okb=Net.canBuild(G.aim.x,G.aim.y,G.aim.z);
    UI.setReticle(okb?'act':'deny');
    UI.setPrompt(okb?'Break '+(G.aim.item?G.aim.item.name:'block'):'Not yours','LMB');
    UI.setTouchVerb('MINE',okb,'');
  }else{
    UI.setReticle('');
    UI.setPrompt('');
    UI.setTouchVerb(UI.heldItem()&&UI.heldItem().cat==='weapon'?'SWING':'USE',
      true,'');
  }

  /* Rebuild at most a couple of voxel chunks per frame: a player
     dragging a wall into place dirties one every frame and doing them
     all at once is a visible hitch. */
  V.update(2);

  /* Shadows are fitted to a box around the player rather than the
     island: at 2048 across 224 m the character's own shadow would be
     four texels wide. */
  R.updateLight(G.player.pos,44);
  T.extractFrustum(R.vp);
  /* Cull around what the camera is looking at, with the radius opened
     up by however far the boom is out. Culling around the eye instead
     is wrong for any wide shot: at a 290 m orbit the eye sits off the
     island entirely and most of the world vanishes. */
  /* Capped: a very wide orbit would otherwise open the radius far
     enough to draw every prop on the island. */
  W.refreshClutter(Cam.target[0],Cam.target[2]);
  W.cullProps(Cam.target[0],Cam.target[2],Math.min(1.7,1+Cam.dist*0.030));

  I.end();
});

/* NPCs turn to face you when you are close, and idle otherwise. It is
   a small thing and it is most of what makes them read as people
   rather than statues. */
/* Foot IK and social glances are both per-actor costs that only pay
   off close up, so they share one distance test. Twenty-two metres is
   about where a foot stops being a foot and starts being three
   pixels. */
var IK_RANGE2=22*22;

/* Everyone glances at whoever walks past. It costs one vector per
   actor per frame and it is most of the difference between a crowd and
   a set of props that happen to be walking. */
var _lookP=M.v3();
function socialLook(a,range){
  var d=M.dist2(a.pos,G.player.pos);
  a.ik=(d<IK_RANGE2);
  if(d<range*range){
    M.set3(_lookP,G.player.pos[0],G.player.pos[1]+1.45,G.player.pos[2]);
    a.lookAt=a.lookAt||M.v3();
    M.copy3(a.lookAt,_lookP);
  }else a.lookAt=null;
}

function updateNpcs(dt){
  if(!G.npcs)return;
  for(var i=0;i<G.npcs.length;i++){
    var a=G.npcs[i];
    socialLook(a,9);
    var d=M.dist2(a.pos,G.player.pos);
    if(d<6){
      a.faceToward(Math.atan2(G.player.pos[0]-a.pos[0],
        G.player.pos[2]-a.pos[2]),dt,5);
      if(a.anim.state==='idle'&&G.talking===a.npcId&&Math.random()<0.004)
        a.anim.play('wave');
    }
    if(a.anim.state!=='wave')a.anim.play('idle');
    a.update(dt);
  }
}

/* Entering a district is worth recording once: the exploration
   achievement and one of the dailies both measure it. */
var lastDistrict=null;
function trackDistrict(){
  var best=null,bd=1e9;
  for(var i=0;i<T.PADS.length;i++){
    var P=T.PADS[i];
    var d=Math.hypot(G.player.pos[0]-P[1],G.player.pos[2]-P[2]);
    if(d<P[3]&&d<bd){bd=d;best=P[0];}
  }
  if(best&&best!==lastDistrict){
    lastDistrict=best;
    var D2=W.DISTRICTS[best]||{};
    var first=!(Net.snapshot().visited||{})[best];
    UI.arrive(D2.name||best,first?'Discovered':(D2.doing||''),first);
    if(first)LH.Audio&&LH.Audio.play('open');
    Net.request('visit',{id:best},function(r){if(r.ok)UI.sync(r.state);});
  }else if(!best)lastDistrict=null;
}

/* Ambient chatter. Simulated, and the UI says so the first time — the
   people in the harbour are fiction until there is a server. */
var CHATTER=[
  ['Skylar','anyone seen a crystal koi in the river? third day looking'],
  ['Zenn','selling iron, cheap, meet me at the market'],
  ['Mochi','the guardian in the quarry is NOT a fair fight at level 10'],
  ['Noctis','built a whole lighthouse on plot 3, come look'],
  ['Lumi','tuna running off the jetty right now'],
  ['Kestrel','does anyone actually use the arena'],
  ['Vale','glow lure is worth every coin'],
  ['Orin','wisps drop silver more than the wiki says'],
  ['Wren','first shade kill, never doing that again without a real sword'],
  ['Juno','who keeps leaving crates on the harbour deck']
];
var chatT=14, chatI=0;
function chatter(dt){
  chatT-=dt;
  if(chatT>0)return;
  chatT=22+Math.random()*30;
  var c=CHATTER[(chatI++)%CHATTER.length];
  UI.say(c[0],c[1]);
}

/* The material under the player's feet, by name, for footstep audio. */
function surfaceName(){
  var m=Pl.surfaceMat();
  for(var k in LH.Tex.NAME)if(LH.Tex.NAME[k]===m)return k;
  return 'stone';
}

function camSolid(x,y,z){
  if(y<T.heightAt(x,z)+0.35)return true;
  if(V.solid(Math.floor(x),Math.floor(y),Math.floor(z)))return true;
  return W.solidAt(x,y,z);
}

/* ---------------- draw ---------------- */
var _id=M.m4();
App.onDraw(function(dt,time){
  if(!G.ready)return;
  M.ident(_id);

  Act.beginFrame();
  Act.submit(G.player);
  Act.submitPet(G.player,time);
  if(!Realm.inRealm())for(var i=0;i<G.crowd.length;i++){
    var n=G.crowd[i];
    /* Skip characters far enough away to be a couple of pixels. */
    if(M.dist2(n.pos,G.player.pos)>150)continue;
    Act.submit(n);Act.submitPet(n,time);
  }
  if(G.npcs&&!Realm.inRealm())for(var q=0;q<G.npcs.length;q++){
    var np=G.npcs[q];
    if(M.dist2(np.pos,G.player.pos)>110)continue;
    Act.submit(np);
  }
  En.submit(time,G.player.pos);

  /* Point lights are picked around what the camera is looking at, not
     around the player: on a wide orbit the eye can sit well outside the
     lit street the shot is actually of. */
  R.setLights(W.pickLights(Cam.target[0],Cam.target[1],Cam.target[2],R.MAXLIGHTS),
    R.scene.lampLevel);

  /* --- shadow ---
     Far cascade first, then a tight near one. The near pass draws a
     much smaller set: everything it would gain from the terrain beyond
     thirteen metres is outside its own box anyway. */
  var dp=R.beginShadow();
  GL.u1i(dp,'uInstanced',0);
  GL.uM4(dp,'uModel',_id);
  T.drawChunksNear(G.player.pos[0],G.player.pos[2],48);
  W.drawStatics();
  V.drawNear(G.player.pos[0],G.player.pos[2],48);
  GL.u1i(dp,'uInstanced',1);
  W.drawProps(dp);
  Act.flushShadow(dp);
  R.endShadow();

  var dpn=R.beginShadow(true);
  GL.u1i(dpn,'uInstanced',0);
  GL.uM4(dpn,'uModel',_id);
  T.drawChunksNear(G.player.pos[0],G.player.pos[2],20);
  V.drawNear(G.player.pos[0],G.player.pos[2],20);
  GL.u1i(dpn,'uInstanced',1);
  W.drawProps(dpn);
  Act.flushShadow(dpn);
  R.endShadow();

  /* --- opaque --- */
  R.beginScene();
  var p=R.beginOpaque();
  GL.uM4(p,'uModel',_id);
  GL.u1f(p,'uSpec',0.10+LH.Sky.wet*0.26);
  GL.u1f(p,'uMacro',1);
  T.drawChunks(true);
  GL.u1f(p,'uMacro',0);
  W.drawStatics();
  W.drawFalls(p,time);
  V.draw(true);
  W.drawProps(p);
  /* Clutter is drawn but never shadowed: a grass blade's own shadow is
     a pixel, and the shadow pass would double the cost of the densest
     draw in the frame to produce it. */
  W.drawClutter(p);
  Act.flush(p);

  /* --- water --- */
  var wp=R.beginWater(-7.0);
  GL.uM4(wp,'uModel',_id);
  GL.draw(W.water);
  R.endWater();

  /* --- additive: auras --- */
  Act.beginFrame();
  Act.submitAura(G.player,time);
  if(!Realm.inRealm())
    for(var j=0;j<G.crowd.length;j++)Act.submitAura(G.crowd[j],time);
  En.submitAura(time,G.player.pos);
  var ap=R.beginAdditive();
  Act.flush(ap);
  R.endBlend();

  R.present();
});

/* ---------------- go ---------------- */
if(LH.App.start()){
  LH.Input.attach(document.getElementById('gl'));
  LH.App.runBoot();
}
LH.Game=G;
})();
</script>
