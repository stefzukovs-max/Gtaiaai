  b.sphere(0,0,0,0.055,8,6,'#D8B45E');b.pop();
}

/* Pitched, hipped or flat, plus an overhanging eave. The eave casts
   the shadow line that gives a building its weight. */
function roof(b,st,w,d,y,kind,col){
  b.mat(st.roof);
  if(kind==='flat'){
    b.push();b.translate(0,y+0.12,0);
    b.chamfer(0,0,0,w+0.5,0.24,d+0.5,col,0.06);b.pop();
    /* parapet */
    b.mat(st.trim);
    var t=0.16;
    var sides=[[0,(d+0.5)/2],[0,-(d+0.5)/2],[(w+0.5)/2,0],[-(w+0.5)/2,0]];
    for(var i=0;i<4;i++){
      var S=sides[i],horiz=i<2;
      b.push();b.translate(S[0],y+0.46,S[1]);
      b.chamfer(0,0,0,horiz?w+0.5:t,0.44,horiz?t:d+0.5,st.trimCol,0.04);
      b.pop();
    }
    return y+0.68;
  }
  var ph=kind==='steep'?d*0.52:d*0.34;
  /* two slopes as thin boxes, rotated to meet at the ridge */
  var slope=Math.atan2(ph,d/2);
  var len=Math.hypot(ph,d/2);
  for(var s=-1;s<=1;s+=2){
    b.push();
    b.translate(0,y+ph/2,s*d/4);
    b.rotate(-s*slope,0,0);
    b.chamfer(0,0,0,w+0.7,0.16,len*2*0.52,col,0.05,{uvScale:0.8});
    b.pop();
  }
  /* gable ends fill the triangles the slopes leave open */
  b.mat(st.wall);
  for(var g=-1;g<=1;g+=2){
    b.push();b.translate(g*w/2,y,0);b.rotate(0,Math.PI/2,0);
    b.extrude([[-d/2,0],[d/2,0],[0,ph]],0.14,col);
    b.pop();
  }
  b.mat(st.roof);
  b.push();b.translate(0,y+ph+0.04,0);
  b.chamfer(0,0,0,w+0.8,0.14,0.30,col,0.04);b.pop();
  return y+ph;
}

/* The main entry point. Returns useful anchors — the door position and
   the roof height — so the world can hang a sign or an NPC on it. */
A.building=function(b,o){
  var rng=M.rng(o.seed||1);
  var st=STYLES[o.style]||STYLES.town;
  var w=o.w||8, d=o.d||7, storeys=o.storeys||2;
  var sh=o.storeyH||3.1;
  var wallCol=st.wallCol[(rng()*st.wallCol.length)|0];
  var roofCol=st.roofCol[(rng()*st.roofCol.length)|0];
  var y0=o.y||0;

  b.push();
  b.translate(o.x||0,y0,o.z||0);
  b.rotate(0,o.rot||0,0);

  /* plinth — buildings that meet the ground with no base look pasted on */
  b.mat(st.base);
  b.push();b.translate(0,0.22,0);
  b.chamfer(0,0,0,w+0.44,0.44+ (o.sink||0),d+0.44,st.baseCol,0.08);
  b.pop();

  for(var s=0;s<storeys;s++){
    var yc=0.44+s*sh+sh/2;
    b.mat(st.wall);
    b.push();b.translate(0,yc,0);
    b.chamfer(0,0,0,w,sh,d,wallCol,0.10,{uvScale:0.55});
    b.pop();
    /* a string course between storeys */
    if(s<storeys-1){
      b.mat(st.trim);
      b.push();b.translate(0,0.44+(s+1)*sh,0);
      b.chamfer(0,0,0,w+0.26,0.18,d+0.26,st.trimCol,0.04);b.pop();
    }
    /* openings on the front and back faces */
    var nW=Math.max(1,Math.round(w/2.6));
    for(var i=0;i<nW;i++){
      var wx=(i-(nW-1)/2)*(w/nW);
      for(var face=0;face<2;face++){
        var fz=face?-d/2:d/2;
        if(s===0&&face===0&&Math.abs(wx)<w/nW*0.6&&o.doorway!==false){
          b.push();b.translate(wx,0.44+s*sh,fz);
          if(face)b.rotate(0,Math.PI,0);
          door(b,st,1.30,2.30);
          b.pop();
          continue;
        }
        b.push();
        b.translate(wx,yc+0.10,fz);
        if(face)b.rotate(0,Math.PI,0);
        window_(b,st,1.10,1.45,rng()<0.55);
        b.pop();
      }
    }
    /* and on the sides, fewer */
    var nS=Math.max(1,Math.round(d/3.4));
    for(var j=0;j<nS;j++){
      var wz=(j-(nS-1)/2)*(d/nS);
      for(var side=-1;side<=1;side+=2){
        b.push();
        b.translate(side*w/2,yc+0.10,wz);
        b.rotate(0,side*Math.PI/2,0);
        window_(b,st,0.90,1.30,rng()<0.4);
        b.pop();
      }
    }
  }

  var top=0.44+storeys*sh;
  var kind=o.roof||(rng()<0.28?'flat':(rng()<0.4?'steep':'pitch'));
  var rTop=roof(b,st,w,d,top,kind,roofCol);

  /* Frontage: an awning and a hanging sign turn a box into a shop. */
  if(o.shop){
    b.mat('fabric');
    b.push();b.translate(0,0.44+2.62,d/2+0.62);b.rotate(0.34,0,0);
    b.chamfer(0,0,0,w*0.86,0.08,1.40,o.awning||'#B4485E',0.03,{uvScale:2});
    b.pop();
    b.mat('planks');
    b.push();b.translate(0,0.44+2.98,d/2+0.10);
    b.chamfer(0,0,0,w*0.88,0.14,0.24,st.trimCol,0.03);b.pop();
    b.mat('neon',0.9);
    var signCol=o.signCol||'#3BE0C8';
    b.push();b.translate(0,0.44+3.42,d/2+0.16);
    b.chamfer(0,0,0,w*0.62,0.44,0.06,signCol,0.02,{noBand:true});
    b.pop();
    /* The sign lights the street it faces. Local +Z under a Y rotation
       lands at (sin, cos), which is why this is not just o.x/o.z. */
    if(LH.World&&LH.World.lights){
      var sr=o.rot||0, so=d/2+0.9, sl=Geo.col3(signCol);
      LH.World.lights.push({
        x:(o.x||0)+Math.sin(sr)*so, y:y0+0.44+3.42, z:(o.z||0)+Math.cos(sr)*so,
        r:7.5, col:[sl[0],sl[1],sl[2]], power:0.75});
    }
  }
  /* Chimneys, vents, aerials — the roofline is the part of a building
     you actually see across a town, and a bare one reads as a model. */
  if(kind!=='flat'&&rng()<0.7){
    b.mat(st.base);
    b.push();b.translate((rng()-0.5)*w*0.5,rTop+0.5,(rng()-0.5)*d*0.3);
    b.chamfer(0,0,0,0.62,1.30,0.62,st.baseCol,0.05);b.pop();
  }
  if(kind==='flat'){
    b.mat('panel');
    for(var v=0;v<2+((rng()*3)|0);v++){
      b.push();
      b.translate((rng()-0.5)*w*0.7,rTop+0.30,(rng()-0.5)*d*0.7);
      b.cylinder(0,0,0,0.24,0.24,0.55,8,'#6E7682');
      b.push();b.translate(0,0.34,0);
      b.chamfer(0,0,0,0.62,0.10,0.62,'#5A626E',0.03);b.pop();
      b.pop();
    }
  }
  b.pop();
  return {top:rTop+y0,front:d/2};
};

/* A market stall: a frame, a striped canopy and a counter of goods. */
A.stall=function(b,o){
  var rng=M.rng(o.seed||3);
  b.push();
  b.translate(o.x||0,o.y||0,o.z||0);
  b.rotate(0,o.rot||0,0);
  b.mat('planks');
  for(var i=0;i<4;i++){
    var sx=(i<2?-1:1)*1.5, sz=(i%2?-1:1)*1.1;
    b.push();b.translate(sx,1.1,sz);
    b.cylinder(0,0,0,0.09,0.08,2.2,7,'#8A6A48');b.pop();
  }

  b.chamfer(0,0,0,3.2,0.12,2.0,'#B08A5E',0.03);b.pop();
  b.push();b.translate(0,0.46,-1.0);
  b.chamfer(0,0,0,3.2,0.92,0.10,'#9C7A58',0.03);b.pop();
  /* canopy: alternating stripes as separate slabs */
  b.mat('fabric');
  var c1=o.col||'#C4485E';
  for(var s=0;s<6;s++){

    b.translate(-1.5+s*0.6+0.3,2.30+ (s%2?0.02:0),0);

    b.chamfer(0,0,0,0.58,0.09,2.6,s%2?c1:'#EFE6D6',0.02,{uvScale:2});
    b.pop();
  }
  b.mat('planks');
  b.push();b.translate(0,2.44,0);
  b.chamfer(0,0,0,3.5,0.10,0.16,'#6E5236',0.02);b.pop();
  /* goods on the counter */
  b.mat('crystal',0.25);
  for(var g=0;g<5;g++){
    b.push();
    b.translate(-1.2+g*0.6,1.10,rng()*0.5-0.2);
    b.sphere(0,0,0,0.13+rng()*0.06,8,6,
      ['#5BE8D0','#F5A03C','#B269FF','#57D07A','#489BFF'][g]);
    b.pop();
  }
  b.pop();
};

LH.Arch=A;
})();

/* ============================================================
   LH.World — Lumen Harbor.

   Assembles the island: terrain, water, nine districts, the
   architecture in each, the vegetation between them, and the
   collision volumes that stop you walking through a wall.

   Districts are data. Adding one means adding a pad in LH.Terrain
   and a dresser here — not touching the renderer, the controller or
   the camera.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,Geo=LH.Geo,T=LH.Terrain,P=LH.Props,Arch=LH.Arch;
var W={};

W.statics=[];        /* merged architecture meshes */
W.falls=null;        /* the sky islands' waterfalls, scrolled at draw */
W.lights=[];         /* every lamp and glowing thing in the world */
W.instanced=[];      /* prop meshes with a static instance buffer */
W.boxes=[];          /* axis-aligned collision volumes */
W.points=[];         /* named interaction points */
W.water=null;

/* ---------------- collision ----------------
   Buildings are boxes. A capsule-vs-box push-out is enough for a
   sandbox and costs nothing next to a real physics engine — and the
   list is small because only architecture registers, not props. */
function box(x,y,z,w,h,d,rot,tag){
  W.boxes.push({x:x,y:y,z:z,hw:w/2,hh:h/2,hd:d/2,
    c:Math.cos(-rot||0),s:Math.sin(-rot||0),tag:tag||''});
}
W.box=box;

/* Transform a world point into a box's local space, so a rotated
   building still collides correctly. */
function toLocal(B,x,z,out){
  var dx=x-B.x,dz=z-B.z;
  out[0]=dx*B.c-dz*B.s;
  out[1]=dx*B.s+dz*B.c;
  return out;
}
var _lp=[0,0];
W.solidAt=function(x,y,z){
  for(var i=0;i<W.boxes.length;i++){
    var B=W.boxes[i];
    if(y<B.y-B.hh||y>B.y+B.hh)continue;
    toLocal(B,x,z,_lp);
    if(Math.abs(_lp[0])<B.hw&&Math.abs(_lp[1])<B.hd)return true;
  }
  return false;
};

/* Push a circle of radius r out of every box it overlaps. Iterated
   twice so a corner between two buildings resolves instead of
   oscillating. */
W.resolve=function(pos,r,footY){
  for(var pass=0;pass<2;pass++){
    for(var i=0;i<W.boxes.length;i++){
      var B=W.boxes[i];
      if(footY+1.6<B.y-B.hh||footY>B.y+B.hh)continue;
      toLocal(B,pos[0],pos[2],_lp);
      var lx=_lp[0],lz=_lp[1];
      var cx=M.clamp(lx,-B.hw,B.hw), cz=M.clamp(lz,-B.hd,B.hd);
      var dx=lx-cx, dz=lz-cz;
      var d2=dx*dx+dz*dz;
      if(d2>r*r)continue;
      var nx,nz,pen;
      if(d2>1e-8){
        var d=Math.sqrt(d2);nx=dx/d;nz=dz/d;pen=r-d;
      }else{
        /* centre is inside the box — push out of the nearest face */
        var px=B.hw-Math.abs(lx), pz=B.hd-Math.abs(lz);
        if(px<pz){nx=lx<0?-1:1;nz=0;pen=px+r;}
        else{nx=0;nz=lz<0?-1:1;pen=pz+r;}
      }
      /* back to world space */
      var wx=nx*B.c+nz*B.s, wz=-nx*B.s+nz*B.c;
      pos[0]+=wx*pen;pos[2]+=wz*pen;
    }
  }
  return pos;
};

W.groundAt=function(x,z){
  var h=T.heightAt(x,z);
  /* Standing on a roof or a jetty deck is a box query, not a
     heightmap one. Take the highest surface under the sample. */
  for(var i=0;i<W.boxes.length;i++){
    var B=W.boxes[i];
    if(!B.walkable)continue;
    toLocal(B,x,z,_lp);
    if(Math.abs(_lp[0])<B.hw&&Math.abs(_lp[1])<B.hd){
      var top=B.y+B.hh;
      if(top>h)h=top;
    }
  }
  return h;
};

/* ---------------- interaction points ---------------- */
function point(id,kind,x,z,opt){
  opt=opt||{};
  var y=opt.y!==undefined?opt.y:T.heightAt(x,z);
  var p={id:id,kind:kind,x:x,y:y,z:z,
    r:opt.r||2.6,label:opt.label||id,prompt:opt.prompt||'Interact',
    data:opt.data||null};
  W.points.push(p);
  return p;
}
W.point=point;
W.nearestPoint=function(x,z,maxD){
  var best=null,bd=maxD||3.2;
  for(var i=0;i<W.points.length;i++){
    var p=W.points[i];
    var d=Math.hypot(p.x-x,p.z-z);
    if(d<Math.min(bd,p.r)){bd=d;best=p;}
  }
  return best;
};

/* ---------------- instanced prop placement ---------------- */
var pending={};
/* Lamps register a point light where their bulb is. Doing it here
   rather than at each of the two dozen call sites means a lamp added
   anywhere in the world lights the ground under it for free. */
var LAMPLIGHT={
  /* Deliberately short-range and weak. The plaza carries two dozen of
     them and they overlap: the first pass at this used a 13m radius at
     full strength and flooded the square to daylight at midnight. */
  'lamp:plaza':  {h:4.10,r:9.0,col:[1.00,0.84,0.58],power:0.34},
  'lamp:harbour':{h:3.76,r:8.5,col:[1.00,0.74,0.42],power:0.32}
};
function place(mesh,x,y,z,rot,scale,tint,emis){
  var lit=LAMPLIGHT[mesh.key];
  if(lit)W.lights.push({x:x,y:y+lit.h*(scale||1),z:z,r:lit.r*(scale||1),
    col:lit.col,power:lit.power});
  var list=pending[mesh.key];
  if(!list){
    var kind=String(mesh.key).split(':')[0];
    list=pending[mesh.key]={mesh:mesh,items:[],
      cull:LH.Props.CULL[kind]||LH.Props.CULL.dflt};
  }
  list.items.push([x,y,z,rot||0,scale||1,tint||'#FFFFFF',emis||0]);
}
W.place=place;

var _t=M.v3(),_s=M.v3(),_m=M.m4();
var groups=[];
function commitProps(){
  W.instanced.length=0;
  groups.length=0;
  for(var k in pending){
    var L=pending[k];
    /* Precompute the transform for every placement once. Rebuilding a
       matrix per prop per frame would cost more than the draw. */
    var items=L.items,packed=new Float32Array(items.length*GL.ISTRIDE);
    for(var i=0;i<items.length;i++){
      var it=items[i];
      M.set3(_t,it[0],it[1],it[2]);
      M.set3(_s,it[4],it[4],it[4]);
      M.fromTRS(_m,_t,0,it[3],0,_s);
      var o=i*GL.ISTRIDE;
      for(var q=0;q<16;q++)packed[o+q]=_m[q];
      var c=Geo.col3(it[5]);
      packed[o+16]=c[0];packed[o+17]=c[1];packed[o+18]=c[2];packed[o+19]=it[6];
    }
    var xs=new Float32Array(items.length),zs=new Float32Array(items.length);
    for(var j=0;j<items.length;j++){xs[j]=items[j][0];zs[j]=items[j][2];}
    groups.push({mesh:L.mesh,packed:packed,xs:xs,zs:zs,
      count:items.length,cull:L.cull});
    W.instanced.push(L.mesh);
  }
  pending={};
  W.groups=groups;
}
/* Realms build their own props, so the commit step has to be callable
   from outside the initial world build. */
W.commitProps=commitProps;

/* Refill the instance buffers with what is near enough to matter. The
   island carries about five thousand props; drawing all of them every
   frame is four million triangles for a view that can see a fraction
   of them. Rebuilding the buffers costs a fraction of a millisecond. */
W.cullProps=function(cx,cz,scale){
  scale=scale||1;
  for(var g=0;g<groups.length;g++){
    var G2=groups[g],mesh=G2.mesh,d=mesh.idata,src=G2.packed;
    var cull=G2.cull*scale, cull2=cull*cull;
    var n=0,max=mesh.maxInstances;
    for(var i=0;i<G2.count&&n<max;i++){
      var dx=G2.xs[i]-cx, dz=G2.zs[i]-cz;
      if(dx*dx+dz*dz>cull2)continue;
      var so=i*GL.ISTRIDE, dof=n*GL.ISTRIDE;
      for(var q=0;q<GL.ISTRIDE;q++)d[dof+q]=src[so+q];
      n++;
    }
    mesh.instances=n;
    GL.updateInstances(mesh,n);
  }
};

/* ---------------- district dressers ---------------- */
function ringScatter(b,cx,cz,r0,r1,count,seed,fn){
  var rng=M.rng(seed);
  for(var i=0;i<count;i++){
    var a=rng()*M.TAU, rr=r0+rng()*(r1-r0);
    fn(cx+Math.cos(a)*rr, cz+Math.sin(a)*rr, rng, a);
  }
}

function dressPlaza(b){
  var pad=T.pad('plaza'), cx=pad.x, cz=pad.z, y=pad.y;

  /* The portal. Everything in the plaza is arranged to face it,
     because it is the thing the game is actually about. */
  var portal=P.portal();
  place(portal,cx,y,cz-9,0,1.15,'#FFFFFF',0);
  box(cx,y+2.2,cz-9,5.2,4.4,2.0,0,'portal');
  point('portal','portal',cx,cz-6.4,{y:y,r:4.0,
    label:'World Gateway',prompt:'Enter your world'});

  /* A fountain at the centre: a basin, a plume and a lit rim. */
  var f=Geo.build();
  f.mat('stone');
  f.push();f.translate(cx,y,cz);
  /* A hollow basin: outer wall, inner wall, a rim ring joining them at
     the top, a floor, and the water surface above it. Built as a
     capped loft it comes out as a solid black lid — the cap covers the
     whole basin, which is exactly what a fountain must not have. */
  var SEG=22;
  f.loft([
    {y:0.00,pts:Geo.circle(2.50,SEG)},
    {y:0.62,pts:Geo.circle(2.66,SEG)},
    {y:0.80,pts:Geo.circle(2.60,SEG)}
  ],'#96A0AC',{uvScale:1.4,openTop:true,openBottom:true});
  f.loft([
    {y:0.26,pts:Geo.circle(2.34,SEG)},
    {y:0.80,pts:Geo.circle(2.40,SEG)}
  ],'#828A96',{openTop:true,openBottom:true});
  f.annulus(0,0.80,0,2.40,2.60,SEG,'#A6AEBA');
  f.disc(0,0.26,0,2.36,SEG,'#6E7682');
  f.mat('water',0.02);
  f.disc(0,0.60,0,2.36,SEG,'#2E7C93');
  f.mat('stone');
  f.loft([
    {y:0.42,pts:Geo.circle(0.62,14)},
    {y:1.35,pts:Geo.circle(0.34,14)},
    {y:1.52,pts:Geo.circle(0.86,14)},
    {y:1.66,pts:Geo.circle(0.70,14)}
  ],'#A2AAB6',{});
  f.mat('crystal',0.60);
  f.sphere(0,2.02,0,0.40,14,10,'#5BE8FF');
  f.pop();
  W.statics.push(f.upload());
  /* The fountain crystal is lit around the clock — it is the landmark
     you steer by, and a landmark that only exists after dark is not

  W.lights.push({x:cx,y:y+2.4,z:cz,r:9.5,col:[0.26,0.70,0.92],

  W.boxes[W.boxes.length-1].walkable=false;

  /* Ring of benches, planters and lamps facing in. */
  /* Three concentric rings of furniture. A square this size with a
     bare middle reads as a car park, and the rings also give the eye
     something to measure the space against. */
  ringScatter(b,cx,cz,6.2,6.2,8,29,function(x,z,rng,a){
    place(P.bollard(),x,T.heightAt(x,z),z,a,1,'#8E97A4');
  });
  ringScatter(b,cx,cz,10.5,10.5,8,31,function(x,z,rng,a){
    place(P.bench(),x,T.heightAt(x,z),z,a+Math.PI/2,1,'#FFFFFF');
  });
  ringScatter(b,cx,cz,13.5,13.5,10,37,function(x,z,rng,a){
    place(P.lamp('plaza'),x,T.heightAt(x,z),z,a,1,'#FFFFFF');
  });
  ringScatter(b,cx,cz,16.5,16.5,10,41,function(x,z,rng,a){
    place(P.planter(),x,T.heightAt(x,z),z,a,1,'#FFFFFF');
  });
  ringScatter(b,cx,cz,19.5,19.5,12,43,function(x,z,rng,a){
    place(P.tree('blossom',(rng()*4)|0),x,T.heightAt(x,z)-0.2,z,a,
      0.72+rng()*0.20,'#FFFFFF');

        0.85+rng()*0.5,'#FFFFFF');
      else if(r<0.42)place(P.rock((rng()*4)|0),x,h-0.4,z,rng()*6.28,
        0.7+rng()*1.5,'#FFFFFF');
      else if(r<0.60)place(P.bush((rng()*3)|0),x,h,z,rng()*6.28,

        0.8+rng()*0.4,'#9A9080');
      else if(r<0.52)place(P.bush((rng()*3)|0),x,h,z,rng()*6.28,

/* ---------------- sky islands ----------------
   The harbour sits under a scatter of floating islands: rock keels
   hanging under grass caps, a few of them pouring water off an edge
   into nothing. They exist for the silhouette. Nothing stands on them
   and nothing walks there — they are the reason a screenshot taken
   anywhere on the island has something happening above the horizon.

   Built as one merged static mesh rather than instanced props: props
   are culled around the camera at tens of metres, and these live two
   to three hundred metres out. */
W.isles=[];            /* {x,y,z,r} — read by the waterfall builder */

/* A closed noisy ring, used as every loft section of a keel so the
   rock reads as eroded rather than turned on a lathe. */
function isleRing(seg,seed){
  var pts=[],rng=M.rng(seed);
  var wob=[];
  for(var i=0;i<seg;i++)wob.push(0.62+rng()*0.66);
  /* smooth the wobble once around the loop, or neighbouring vertices
     disagree so hard the normals shatter */
  for(var k=0;k<1;k++){
    var out=[];
    for(var j=0;j<seg;j++){
      out.push((wob[(j-1+seg)%seg]+wob[j]*2+wob[(j+1)%seg])/4);
    }
    wob=out;
  }
  for(var t=0;t<seg;t++){
    var a=t/seg*Math.PI*2,rr=wob[t];
    pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);
  }
  return pts;
}

function isleTree(b,x,y,z,h,rng){
  var tr=h*0.085;
  b.mat('bark');
  b.cylinder(x,y+h*0.22,z,tr,tr*0.7,h*0.44,6,'#6B5340');
  b.mat('foliage');
  var tint=rng()<0.22?'#9FD08A':'#FFFFFF';
  b.cylinder(x,y+h*0.60,z,h*0.30,h*0.05,h*0.44,7,tint);
  b.cylinder(x,y+h*0.86,z,h*0.20,0.01,h*0.34,7,tint);
}

function buildSkyIsles(){
  var b=Geo.build();
  var rng=M.rng(90210);
  var N=12;
  for(var k=0;k<N;k++){
    /* Spread by angle so no two crowd the same bearing, then jitter. */
    var ang=(k/N)*Math.PI*2+rng()*0.5;
    /* Every third one comes in close, so there is something overhead
       from the plaza rather than only a distant band. */
    var near=(k%3===0);
    var dist=near?(120+rng()*60):(190+rng()*150);
    var cx=Math.cos(ang)*dist, cz=Math.sin(ang)*dist;
    var r=near?(15+rng()*11):(19+rng()*24);
    /* Height is derived, not rolled. A keel hangs 1.72 island-radii
       below the grass, so a big island placed at a small height puts
       its point through the rooftops — which is exactly what happened
       when this was two independent random numbers. */
    var cy=r*1.72+(near?26:38)+rng()*34;
    W.isles.push({x:cx,y:cy,z:cz,r:r});

    var seg=16, ring=isleRing(seg,1000+k*37);
    b.push();b.translate(cx,cy,cz);

    /* Keel: eight sections down to a blunt point. Each section gets its
       own ring rather than a scaled copy of one — a single ring scaled
       down is a cone, and a cone is exactly what a floating island must
       not look like. Different rings make the cross-section wander, so
       the silhouette breaks up on the way down. Alternating section
       colours read as strata. */
    /* A little self-lighting: every face of a keel points down or
       outward, so hemisphere ambient alone leaves it a flat grey
       cut-out. 0.10 is enough to keep the strata readable without the
       rock looking like it is glowing. */
    b.mat('cliff',0.10);b.mat2('dirt',0.30);
    var strata=['#E4D6BE','#C9B79C','#DACAAF','#B4A188','#CBB99B',
                '#9F8D74','#B3A187'];
    var prof=[[0,1.00],[-0.16,0.99],[-0.34,0.90],[-0.55,0.80],
              [-0.80,0.62],[-1.08,0.42],[-1.38,0.22],[-1.72,0.05]];
    var keel=[];
    for(var ks=0;ks<prof.length;ks++){
      keel.push({y:prof[ks][0]*r,
        pts:ks===0?ring:isleRing(seg,1000+k*37+ks*211),
        scale:r*prof[ks][1],
        col:ks?strata[(ks-1)%strata.length]:undefined});
    }
    /* listed top-down: loft() reads the direction and winds to match */
    b.loft(keel,'#C9C0B2',{openTop:true});

    /* A couple of spurs hanging off the keel — the shapes that stop it
       reading as one solid mass when it is silhouetted against sky. */
    for(var sp=0;sp<3;sp++){
      var sa=rng()*Math.PI*2, sy=-r*(0.30+rng()*0.65);
      var sr=r*(0.55-Math.abs(sy)/r*0.28)*(0.7+rng()*0.3);
      b.push();
      b.translate(Math.cos(sa)*sr,sy,Math.sin(sa)*sr);
      b.rotate((rng()-0.5)*0.7,rng()*6.28,(rng()-0.5)*0.7);
      b.sphere(0,0,0,r*(0.13+rng()*0.11),7,5,strata[(sp*2)%strata.length],
        {squash:1.7+rng()});
      b.pop();
    }

    /* cap: soil rim under a grass crown */
    b.mat('dirt');
    b.loft([{y:0,pts:ring,scale:r},
            {y:r*0.055,pts:ring,scale:r*0.995}],'#8A7358',{openTop:true,openBottom:true});
    b.mat('grass');
    b.loft([{y:r*0.05,pts:ring,scale:r*0.995},
            {y:r*0.13,pts:ring,scale:r*0.90},
            {y:r*0.17,pts:ring,scale:r*0.62}],'#FFFFFF',{openBottom:true});
    b.disc(0,r*0.17,0,r*0.62,seg,'#FFFFFF');

    /* dressing: trees around the rim, a boulder or two, and on the
       nearer islands a lit crystal so they carry after dark */
    var trees=3+((rng()*5)|0);
    for(var t=0;t<trees;t++){
      var ta=rng()*Math.PI*2, td=r*(0.15+rng()*0.55);
      isleTree(b,Math.cos(ta)*td,r*0.15,Math.sin(ta)*td,r*(0.30+rng()*0.26),rng);
    }
    b.mat('stone');
    for(var q=0;q<2;q++){
      var qa=rng()*Math.PI*2,qd=r*(0.2+rng()*0.5);
      b.sphere(Math.cos(qa)*qd,r*0.14,Math.sin(qa)*qd,r*(0.05+rng()*0.07),
        7,5,'#FFFFFF',{squash:0.6});
    }
    /* Outcrops on the rim. Grass and rock otherwise meet along one clean
       circle the whole way round, which is the tell that this is a lathe
       and not a piece of ground that broke off something. */
    b.mat('cliff',0.06);
    for(var e=0;e<5;e++){
      var ea=rng()*Math.PI*2;
      var er=r*(0.86+rng()*0.16);
      b.push();
      b.translate(Math.cos(ea)*er,r*(0.02+rng()*0.10),Math.sin(ea)*er);
      b.rotate((rng()-0.5)*0.5,ea,(rng()-0.5)*0.5);
      b.sphere(0,0,0,r*(0.11+rng()*0.09),7,5,'#C3B49C',{squash:0.55});
      b.pop();
    }
    if(rng()<0.62){
      b.mat('crystal',0.85);
      var ca=rng()*Math.PI*2,cd=r*0.32;
      var chx=Math.cos(ca)*cd,chz=Math.sin(ca)*cd,ch=r*(0.22+rng()*0.2);
      b.cylinder(chx,r*0.16+ch*0.5,chz,r*0.07,0.02,ch,6,'#7FE6FF');
      W.lights.push({x:cx+chx,y:cy+r*0.16+ch*0.5,z:cz+chz,r:r*1.1,
        col:[0.34,0.82,1.00],power:0.9,always:true});
    }
    b.pop();
  }
  W.statics.push(b.upload());
}

/* Waterfalls hang off three of the islands. They are their own mesh so
   the draw can scroll their UVs — see W.drawFalls. */
function buildFalls(){
  var b=Geo.build();
  b.mat('water',0.10);
  var rng=M.rng(5150);
  for(var i=0;i<W.isles.length;i++){
    if(rng()>0.58)continue;
    var I=W.isles[i];
    var a=rng()*Math.PI*2;
    var ox=Math.cos(a)*I.r*0.80, oz=Math.sin(a)*I.r*0.80;
    var w=I.r*(0.34+rng()*0.24);
    /* Long enough to read as a fall rather than a dribble, but stopping
       well above the sea — it breaks up in the air, which is both
       cheaper and more interesting than meeting the water. Kept short
       relative to its width: a narrow ribbon dropped sixty metres
       reads as a blue pipe rather than as water. */
    var drop=I.y-(15+rng()*20);
    b.push();
    b.translate(I.x+ox,0,I.z+oz);
    b.rotate(0,a+Math.PI/2,0);
    /* Four tapering panels stacked down the fall. Splitting it lets the
       ribbon narrow and drift sideways instead of hanging as one slab. */
    var y0=I.y+I.r*0.05, seg=6, drift=0;
    for(var s2=0;s2<seg;s2++){
      var f0=s2/seg,f1=(s2+1)/seg;
      var yA=y0-(y0-drop)*f0, yB=y0-(y0-drop)*f1;
      /* Water spreads as it falls, so the ribbon widens rather than
         tapering, and leans a little further out each section. */
      var wA=w*(0.68+f0*0.62), wB=w*(0.68+f1*0.62);
      var dA=drift, dB=drift+w*(0.06+f1*0.14); drift=dB;
      var c='#DCF2FF';
      var vrep=(y0-drop)/2.4;
      var uA=f0*vrep,uB=f1*vrep;
      var v0=b.vert(-wA/2+dA,yA,0, 0,0,1, 0,uA, [0.74,0.86,0.94]);
      var v1=b.vert( wA/2+dA,yA,0, 0,0,1, 1,uA, [0.74,0.86,0.94]);
      var v2=b.vert( wB/2+dB,yB,0, 0,0,1, 1,uB, [1.0,1.0,1.0]);
      var v3=b.vert(-wB/2+dB,yB,0, 0,0,1, 0,uB, [1.0,1.0,1.0]);
      b.quad(v0,v1,v2,v3);
      b.quad(v0,v3,v2,v1);     /* backside, so it reads from any bearing */
    }
    /* The burst where it breaks up, plus a thinner veil of spray back
       up the lower third — a fall that simply stops at a cloud of
       spheres reads as a ribbon with a full stop on the end. */
    b.mat('blank',0.30);
    for(var m2=0;m2<10;m2++){
      b.sphere(drift+(rng()-0.5)*w*2.0,drop+(rng()-0.25)*w*1.5,
        (rng()-0.5)*w*1.2,w*(0.28+rng()*0.38),7,5,'#E8F6FF',{squash:0.65});
    }
    for(var m3=0;m3<7;m3++){
      var ft=0.55+rng()*0.42;
      b.sphere(drift*ft+(rng()-0.5)*w*1.1,y0-(y0-drop)*ft,
        (rng()-0.5)*w*0.7,w*(0.10+rng()*0.16),6,4,'#DCEEFF',{squash:0.8});
    }
    b.pop();
  }
  W.falls=b.upload();
}

/* ---------------- ground clutter ----------------
   Wildflowers scattered across the lawns, following the camera.

   This started as grass blades and they were wrong — not buggy,
   wrong. A field of thin blades needs density this budget cannot
   reach, and at reachable density it reads as dirt on the lawn rather
   than grass growing out of it. Worse, the ink pass outlines every
   blade, so each tuft came back as a black speck. Flat, clean ground
   is also what the games this one is aimed at actually have.

   Flowers work where grass did not, for the same reason: they are
   meant to be sparse. A hundred and fifty bright dots read as a
   meadow; a hundred and fifty grass tufts read as neglect. And an
   inked flower looks like a drawing of a flower.

   Placement is a pure function of the grid cell — hash it for a
   jittered position, ask the terrain what it is made of, keep it if
   the answer is grass — so walking away and coming back finds the
   field exactly where it was left. */
var clutter=null;
var CLUT_CELL=2.10, CLUT_RAD=26, CLUT_MAX=760;
var clutCX=1e9, clutCZ=1e9;

/* A flower: two leaves, a stem, five petals and a centre. The petals
   are the only part that takes the instance tint — the leaves and stem
   are painted green in the mesh, so one mesh can be every colour of
   flower without the foliage turning pink with it. */
function buildClutterMesh(){
  var b=Geo.build();
  var leaf=Geo.col3('#7FBE55'), stem=Geo.col3('#6FAD4A');

  b.mat('foliage');b.mat2('blank',0.45);
  /* leaves at the base, splayed */
  for(var l=0;l<2;l++){
    b.push();b.rotate(0,l*2.2+0.4,0);
    b.push();b.translate(0.035,0.018,0);b.rotate(0,0,-0.9);
    b.sphere(0,0,0,0.030,7,5,leaf,{squash:0.22});
    b.pop();b.pop();
  }
  b.mat('blank');
  b.cylinder(0,0.075,0,0.0075,0.0055,0.15,5,stem);

  /* The head. Petals are tinted white so the per-instance colour is
     what decides whether this is a daisy or a poppy. */
  b.push();b.translate(0,0.155,0);
  var white=Geo.col3('#FFFFFF');
  for(var i=0;i<5;i++){
    var a=i/5*6.2832;
    b.push();
    b.translate(Math.cos(a)*0.030,0,Math.sin(a)*0.030);
    b.rotate(0,-a,0.22);
    b.sphere(0,0,0,0.026,7,5,white,{squash:0.30});
    b.pop();
  }
  b.mat('blank');
  b.sphere(0,0.006,0,0.017,7,5,Geo.col3('#FFD34D'),{squash:0.55});
  b.pop();

  clutter=b.upload(CLUT_MAX);
  clutter.key='clutter';
}

/* Petal colours. Enough range to look wild, narrow enough that a lawn
   full of them still reads as one meadow. */
var BLOOM=[[1.00,1.00,1.00],[1.00,0.86,0.36],[1.00,0.62,0.72],
           [0.72,0.66,1.00],[1.00,0.74,0.42],[0.98,0.98,0.86]];

var _cm=M.m4(),_ct=M.v3(),_cs=M.v3(1,1,1);
W.refreshClutter=function(px,pz,force){
  if(!clutter)return;
  var dx0=px-clutCX, dz0=pz-clutCZ;
  /* Rebuilding every frame would cost more than drawing it. Three
     metres of travel is well inside the edge fade, so nothing pops. */
  if(!force&&dx0*dx0+dz0*dz0<9)return;
  clutCX=px;clutCZ=pz;

  var grass=LH.Tex.layer('grass');
  var d=clutter.idata, n=0, R2=CLUT_RAD*CLUT_RAD;
  var i0=Math.floor((px-CLUT_RAD)/CLUT_CELL), i1=Math.floor((px+CLUT_RAD)/CLUT_CELL);
  var j0=Math.floor((pz-CLUT_RAD)/CLUT_CELL), j1=Math.floor((pz+CLUT_RAD)/CLUT_CELL);
  for(var j=j0;j<=j1&&n<CLUT_MAX;j++){
    for(var i=i0;i<=i1&&n<CLUT_MAX;i++){
      var h3=M.hash2(i,j,41);
      if(h3>0.52)continue;                 /* wildflowers, not turf */
      var x=(i+0.5+(M.hash2(i,j,17)-0.5)*0.92)*CLUT_CELL;
      var z=(j+0.5+(M.hash2(i,j,29)-0.5)*0.92)*CLUT_CELL;
      var dx=x-px, dz=z-pz, dd=dx*dx+dz*dz;
      if(dd>R2)continue;
      if(T.matAt(x,z)!==grass)continue;
      if(T.slopeAt(x,z)>1.0)continue;
      var y=T.heightAt(x,z);
      if(y<0.35)continue;                  /* not in the surf */
      /* Shrink toward the edge of the field instead of cutting off.
         A tuft that fades to nothing is invisible arriving; one that
         appears at full size is a pop. */
      var edge=1-M.smooth(M.clamp((dd/R2-0.62)/0.38,0,1));
      if(edge<=0.02)continue;
      var sc=(1.15+M.hash2(i,j,53)*0.75)*edge;
      M.set3(_ct,x,y,z);
      M.set3(_cs,sc,sc*(0.85+M.hash2(i,j,67)*0.5),sc);
      M.fromTRS(_cm,_ct,0,M.hash2(i,j,71)*6.283,0,_cs);
      var o=n*GL.ISTRIDE;
      for(var q=0;q<16;q++)d[o+q]=_cm[q];
      /* Vary the green a little or the field reads as one decal
         repeated, which is exactly what it is. */
      var bl=BLOOM[(M.hash2(i,j,83)*BLOOM.length)|0];
      d[o+16]=bl[0];d[o+17]=bl[1];d[o+18]=bl[2];d[o+19]=0;
      n++;
    }
  }
  clutter.instances=n;
  GL.updateInstances(clutter,n);
};

W.drawClutter=function(prog){
  if(!clutter||!clutter.instances)return;
  GL.u1i(prog,'uInstanced',1);
  GL.drawInstanced(clutter,clutter.instances);
  GL.u1i(prog,'uInstanced',0);
};

/* ---------------- water ---------------- */
function buildWater(){
  var b=Geo.build();
  b.mat('water');
  /* Big enough to reach the horizon from anywhere on the island. A
     plane merely larger than the terrain ends in a visible straight
     edge with grey nothing beyond it. Subdivision stays modest — the
     swell only needs somewhere to displace near the shore. */
  b.plane(0,T.SEA,0,4200,4200,'#FFFFFF',72,180);
  W.water=b.upload();
}

/* ---------------- build ---------------- */
W.build=function(){
  var b=Geo.build();     /* one merged builder for all architecture */
  dressPlaza(b);
  dressMarket(b);
  dressHarbour(b);
  dressMissions(b);
  dressGarage(b);
  dressPlots(b);
  dressQuarry(b);
  dressArena(b);
  W.statics.push(b.upload());
  scatterNature();
  commitProps();
  if(!clutter)buildClutterMesh();
  clutCX=1e9;clutCZ=1e9;      /* force a rebuild for the new terrain */
  buildSkyIsles();
  buildFalls();
  buildWater();

  W.spawn=M.v3(T.pad('plaza').x,T.pad('plaza').y,T.pad('plaza').z+12);
};

/* ---------------- draw ---------------- */
/* The falls are the one surface in the world that flows. Scrolling the
   UV is enough — a real flow map would buy nothing at this distance. */
/* The sixteen nearest lights to wherever the camera is looking. A world
   this size holds a couple of hundred; a forward renderer can afford
   sixteen, and past about thirty metres a street lamp contributes less
   than the dither. Insertion sort into a fixed array — no allocation,
   and the list is nearly sorted from the frame before. */
var _lit=[];
W.pickLights=function(x,y,z,max){
  _lit.length=0;
  for(var i=0;i<W.lights.length;i++){
    var L=W.lights[i];
    var dx=L.x-x,dy=L.y-y,dz=L.z-z;
    var d2=dx*dx+dy*dy+dz*dz;
    if(d2>(L.r+34)*(L.r+34))continue;
    L._d=d2;
    _lit.push(L);
  }
  _lit.sort(function(a,b){return a._d-b._d;});
  if(_lit.length>max)_lit.length=max;
  return _lit;
};

W.drawFalls=function(prog,time){
  if(!W.falls)return;
  GL.u2f(prog,'uUVScroll',0,-time*0.85);
  GL.draw(W.falls);
  GL.u2f(prog,'uUVScroll',0,0);
};
W.drawStatics=function(){
  for(var i=0;i<W.statics.length;i++)GL.draw(W.statics[i]);
};
W.drawProps=function(prog){
  GL.u1i(prog,'uInstanced',1);
  for(var i=0;i<W.instanced.length;i++){
    var m=W.instanced[i];
    if(m.instances)GL.drawInstanced(m,m.instances);
  }
  GL.u1i(prog,'uInstanced',0);
};

LH.World=W;
})();

/* ============================================================
   LH.Input — one abstraction over keyboard, mouse, touch and pad.

   Nothing downstream asks "is this a phone". The controller reads
   move.x/move.y, look.x/look.y and a set of named actions, and the
   device layer is responsible for filling them. That is the only way
   the same gameplay code survives four input methods.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,I={};

I.move={x:0,y:0};      /* -1..1, camera-relative */
I.look={x:0,y:0};      /* delta this frame, in pixels */
I.zoom=0;
I.run=false;
I.actions={};          /* edge-triggered, cleared each frame */
I.held={};             /* level-triggered */
I.pointer={x:0.5,y:0.5,down:false};
I.lastKind='kb';       /* kb | touch | pad */

var keys={};
var BIND={
  KeyW:'fwd',KeyS:'back',KeyA:'left',KeyD:'right',
  ArrowUp:'fwd',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',
  Space:'jump',ShiftLeft:'run',ShiftRight:'run',
  KeyE:'interact',
  KeyZ:'tool',KeyC:'crouch',
  KeyX:'fly',KeyR:'rotate',
  Digit1:'slot1',Digit2:'slot2',Digit3:'slot3',Digit4:'slot4',Digit5:'slot5',
  Digit6:'slot6',Digit7:'slot7',Digit8:'slot8',Digit9:'slot9',Digit0:'slot0',
  Tab:'inventory',KeyI:'inventory',KeyM:'map',
  KeyQ:'missions',KeyJ:'missions',
  KeyF:'profile',KeyP:'profile',
  KeyT:'trade',Enter:'chat',
  KeyB:'build',KeyG:'worlds',KeyK:'craft',
  Escape:'menu',KeyV:'emote',KeyH:'help'
};
I.BIND=BIND;

function fire(name){I.actions[name]=true;}

I.attach=function(el){
  window.addEventListener('keydown',function(e){
    /* Browsers refuse to start audio without a gesture, so the first
       real key or click is where the context comes up. */
    if(LH.Audio)LH.Audio.unlock();
    if(e.repeat)return;
    var b=BIND[e.code];
    if(!b)return;
    /* Never swallow the browser's own shortcuts while a text field is
       focused — chat has to be able to contain the letter W. */
    if(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;
    keys[b]=true;I.held[b]=true;fire(b);
    I.lastKind='kb';
    if(b!=='menu')e.preventDefault();
  });
  window.addEventListener('keyup',function(e){
    var b=BIND[e.code];if(!b)return;
    keys[b]=false;I.held[b]=false;
  });
  window.addEventListener('blur',function(){
    for(var k in keys)keys[k]=false;
    for(var h in I.held)I.held[h]=false;
  });

  /* Mouse look is pointer-lock when the player asks for it, and
     drag-to-look otherwise. Both write into the same look delta. */
  var dragging=false,lastX=0,lastY=0;
  el.addEventListener('mousedown',function(e){
    if(LH.Audio)LH.Audio.unlock();
    I.lastKind='kb';
    I.pointer.down=true;
    I.pointer.x=e.clientX/window.innerWidth;
    I.pointer.y=e.clientY/window.innerHeight;
    if(e.button===2||I.locked){dragging=true;lastX=e.clientX;lastY=e.clientY;}
    else fire('primary');
    if(e.button===2)e.preventDefault();
  });
  window.addEventListener('mouseup',function(e){
    I.pointer.down=false;dragging=false;
    if(e.button===2)fire('secondaryUp');
  });
  window.addEventListener('mousemove',function(e){
    I.pointer.x=e.clientX/window.innerWidth;
    I.pointer.y=e.clientY/window.innerHeight;
    if(I.locked){I.look.x+=e.movementX||0;I.look.y+=e.movementY||0;return;}
    if(dragging){I.look.x+=e.clientX-lastX;I.look.y+=e.clientY-lastY;
      lastX=e.clientX;lastY=e.clientY;}
  });
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
  el.addEventListener('wheel',function(e){
    I.zoom+=Math.sign(e.deltaY)*0.9;e.preventDefault();
  },{passive:false});
  document.addEventListener('pointerlockchange',function(){
    I.locked=document.pointerLockElement===el;
  });
  I.requestLock=function(){el.requestPointerLock&&el.requestPointerLock();};
  I.releaseLock=function(){document.exitPointerLock&&document.exitPointerLock();};

  /* Touch: left half is a virtual stick, right half is look. Both are
     tracked by pointer id so two thumbs never interfere. */
  var stickId=null,stickOX=0,stickOY=0;
  var lookId=null,lookX=0,lookY=0;
  I.stick={active:false,ox:0,oy:0,x:0,y:0};
  el.addEventListener('touchstart',function(e){
    I.lastKind='touch';
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.clientX<window.innerWidth*0.42&&stickId===null){
        stickId=t.identifier;stickOX=t.clientX;stickOY=t.clientY;
        I.stick.active=true;I.stick.ox=stickOX;I.stick.oy=stickOY;
        I.stick.x=stickOX;I.stick.y=stickOY;
      }else if(lookId===null){
        lookId=t.identifier;lookX=t.clientX;lookY=t.clientY;
      }
    }
    e.preventDefault();
  },{passive:false});
  el.addEventListener('touchmove',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===stickId){
        var dx=t.clientX-stickOX,dy=t.clientY-stickOY;
        var R=Math.min(90,window.innerHeight*0.16);
        var d=Math.hypot(dx,dy);
        if(d>R){dx*=R/d;dy*=R/d;}
        I.move.x=dx/R;I.move.y=-dy/R;
        I.run=d>R*0.82;
        I.stick.x=stickOX+dx;I.stick.y=stickOY+dy;
      }else if(t.identifier===lookId){
        I.look.x+=t.clientX-lookX;I.look.y+=t.clientY-lookY;
        lookX=t.clientX;lookY=t.clientY;
      }
    }
    e.preventDefault();
  },{passive:false});
  function endTouch(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===stickId){
        stickId=null;I.move.x=0;I.move.y=0;I.run=false;I.stick.active=false;
      }else if(t.identifier===lookId)lookId=null;
    }
  }
  el.addEventListener('touchend',endTouch);
  el.addEventListener('touchcancel',endTouch);
};

/* Gamepad is polled, not evented, so it is read at the top of the
   frame alongside everything else. */
function pollPad(){
  if(!navigator.getGamepads)return;
  var pads=navigator.getGamepads();
  for(var i=0;i<pads.length;i++){
    var p=pads[i];
    if(!p||!p.connected)continue;
    var dead=0.18;
    function ax(n){var v=p.axes[n]||0;return Math.abs(v)<dead?0:v;}
    if(ax(0)||ax(1)){I.move.x=ax(0);I.move.y=-ax(1);I.lastKind='pad';}
    if(ax(2)||ax(3)){I.look.x+=ax(2)*14;I.look.y+=ax(3)*14;I.lastKind='pad';}
    var btn=function(n){return p.buttons[n]&&p.buttons[n].pressed;};
    if(btn(0)&&!I._padA)fire('jump');I._padA=btn(0);
    if(btn(2)&&!I._padX)fire('interact');I._padX=btn(2);
    if(btn(7)&&!I._padRT)fire('primary');I._padRT=btn(7);
    if(btn(6)&&!I._padLT)fire('secondary');I._padLT=btn(6);
    if(btn(3)&&!I._padY)fire('inventory');I._padY=btn(3);
    if(btn(9)&&!I._padStart)fire('menu');I._padStart=btn(9);
    I.run=btn(10)||btn(1);
    break;
  }
}

/* Called once at the top of each frame, before anything reads input. */
I.begin=function(){
  pollPad();
  if(I.lastKind==='kb'){
    var mx=(keys.right?1:0)-(keys.left?1:0);
    var my=(keys.fwd?1:0)-(keys.back?1:0);
    var l=Math.hypot(mx,my);
    if(l>1){mx/=l;my/=l;}
    I.move.x=mx;I.move.y=my;
    I.run=!!keys.run;
  }
};
/* And once at the bottom, so an action fires for exactly one frame. */
I.end=function(){
  I.actions={};
  I.look.x=0;I.look.y=0;
  I.zoom=0;
};
/* Touch buttons write into the same action and held maps the keyboard
   uses, so nothing downstream knows which device it came from. */
I.touchAction=function(name,down){
  I.lastKind='touch';
  if(down){I.actions[name]=true;I.held[name]=true;}
  else I.held[name]=false;
};
I.pressed=function(n){return !!I.actions[n];};
I.down=function(n){return !!I.held[n];};

LH.Input=I;
})();

/* ============================================================
   LH.Player — the controller.

   A capsule that walks, runs, jumps, swims and climbs slopes,
   resolved against the terrain heightmap and the world's collision
   boxes. Movement is camera-relative; the character turns toward
   where it is going rather than where the camera points, except
   while aiming.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Cam=LH.Cam,W=LH.World,T=LH.Terrain,I=LH.Input;
var Pl={};

Pl.actor=null;
Pl.vel=M.v3();
Pl.grounded=true;
Pl.inWater=false;
Pl.swimming=false;
Pl.radius=0.36;
/* Crown lands at about 1.78 m with the cartoon proportions: shorter
   legs and a much bigger head roughly cancel out, so the capsule
   barely moves. */
Pl.height=1.78;
Pl.eyeH=1.50;

var WALK=4.2, RUN=7.6, SWIM=2.8, FLY=9.5;
var ACCEL=26, AIRACCEL=6, FRICTION=13;
var GRAVITY=-24, JUMP=8.0;
var MAX_STEP=0.62;      /* how tall a ledge you walk up rather than into */
/* ---------------- slopes ----------------
   The heightmap has plenty of steep ground and the controller used to
   treat all of it as a floor, so you could stand on a 60-degree quarry
   face as comfortably as on the plaza and walk up it at full speed.
   Three numbers fix that: how far apart to sample the gradient, how
   flat counts as walkable, and how hard gravity drags you down what
   does not. */
var SLOPE_EPS=0.55;
var SLOPE_STAND=0.68;   /* ground normal Y at about 47 degrees */
var SLIDE_ACC=17;
var WADE=0.55;          /* fraction of top speed in knee-deep water  */
Pl.slope=1;             /* the ground normal's Y under the feet     */
Pl.slide=0;             /* 0..1, how much the ground is refusing to hold */

/* ---------------- the forgiving bits ----------------
   None of this changes where the character can go. All of it changes
   whether the controller feels like it is listening. A jump that is
   refused because you left the ledge 40ms ago, or because you pressed
   40ms before landing, reads as the game being wrong — and the player
   is right, because they did press it. */
var COYOTE=0.13;       /* how long a jump still works after a ledge   */
var JUMPBUF=0.16;      /* how early a jump can be asked for           */
var JUMP_CUT=0.60;     /* velocity kept when the button is released   */
Pl.coyote=0;
Pl.jumpBuf=0;
Pl.rising=false;       /* mid-jump and still holding the button       */
Pl.squash=0;           /* landing compression, 0..1, decays           */
Pl.airTime=0;
Pl.lastSpeed=0;        /* last frame's ground speed */
Pl.peak=0;             /* recent top speed, decaying — drives the stop plant */

Pl.flying=false;
Pl.flyWish=0;          /* -1, 0 or +1 from the action bar */
Pl.init=function(actor){
  Pl.actor=actor;
  return Pl;
};
/* Free flight, for building. Gravity is off and the ground is a floor
   rather than a surface, so you can hover a metre above a wall you are
   putting up instead of scaffolding it. */
Pl.setFly=function(on){
  Pl.flying=!!on;
  if(!Pl.flying)Pl.flyWish=0;
  else{Pl.vel[1]=0;Pl.grounded=false;}
  return Pl.flying;
};
Pl.toggleFly=function(){return Pl.setFly(!Pl.flying);};
/* A tap from the action bar gives a short burst; holding the key gives
   continuous lift. Both go through the same wish value. */
Pl.flyNudge=function(dir){
  if(!Pl.flying)Pl.setFly(true);
  Pl.vel[1]=dir*FLY*0.62;
  Pl._nudge=0.22;
};

var _f=M.v3(),_r=M.v3(),_want=M.v3(),_tmp=M.v3();

/* Placed blocks are collision too. Only the cells around the player
   are tested — a sparse grid makes that a handful of map lookups. */
function resolveVoxels(pos){
  var V=LH.Voxels;
  if(!V||!V.count())return;
  var r=Pl.radius;
  var x0=Math.floor(pos[0]-r-1), x1=Math.floor(pos[0]+r+1);
  var z0=Math.floor(pos[2]-r-1), z1=Math.floor(pos[2]+r+1);
  var y0=Math.floor(pos[1]+0.15), y1=Math.floor(pos[1]+Pl.height-0.15);
  for(var pass=0;pass<2;pass++)
  for(var y=y0;y<=y1;y++)for(var z=z0;z<=z1;z++)for(var x=x0;x<=x1;x++){
    if(!V.solid(x,y,z))continue;
    var cx=M.clamp(pos[0],x,x+1), cz=M.clamp(pos[2],z,z+1);
    var dx=pos[0]-cx, dz=pos[2]-cz;
    var d2=dx*dx+dz*dz;
    if(d2>r*r)continue;
    if(d2>1e-8){
      var d=Math.sqrt(d2);
      pos[0]+=dx/d*(r-d);pos[2]+=dz/d*(r-d);
    }else{
      /* dead centre of a cell — push along whichever axis is shallower */
      var px=(x+0.5)-pos[0], pz=(z+0.5)-pos[2];
      if(Math.abs(px)<Math.abs(pz))pos[0]-=Math.sign(px||1)*r;
      else pos[2]-=Math.sign(pz||1)*r;
    }
  }
}
/* The top of the highest placed block directly under the player, so
   you can stand on what you build. */
function voxelFloor(x,y,z){
  var V=LH.Voxels;
  if(!V||!V.count())return -1e9;
  var cx=Math.floor(x), cz=Math.floor(z);
  var top=-1e9;
  for(var cy=Math.floor(y+0.4);cy>=Math.floor(y)-2;cy--){
    if(V.solid(cx,cy,cz)){top=cy+1;break;}
  }
  return top;
}

Pl.update=function(dt){
  var a=Pl.actor;
  if(!a)return;

  /* ---- camera-relative desired direction ---- */
  Cam.forward(_f);Cam.rightVec(_r);
  M.set3(_want,
    _r[0]*I.move.x+_f[0]*I.move.y,0,
    _r[2]*I.move.x+_f[2]*I.move.y);
  var wl=M.len3(_want);
  if(wl>1){M.scale3(_want,_want,1/wl);wl=1;}

  var seaY=T.SEA;
  var feet=a.pos[1];
  Pl.inWater=feet<seaY-0.15;
  Pl.swimming=feet<seaY-1.05;

  /* ---- the ground's shape under the feet ----
     Taken from the same height function the camera and the foot IK
     use, so there is one definition of where the ground is and they
     cannot disagree about it. */
  var gyx0=W.groundAt(a.pos[0]-SLOPE_EPS,a.pos[2]);
  var gyx1=W.groundAt(a.pos[0]+SLOPE_EPS,a.pos[2]);
  var gyz0=W.groundAt(a.pos[0],a.pos[2]-SLOPE_EPS);
  var gyz1=W.groundAt(a.pos[0],a.pos[2]+SLOPE_EPS);
  var gx=(gyx1-gyx0)/(2*SLOPE_EPS), gz=(gyz1-gyz0)/(2*SLOPE_EPS);
  Pl.slope=1/Math.sqrt(gx*gx+gz*gz+1);
  Pl.slide=Pl.grounded&&!Pl.flying&&!Pl.swimming
    ? M.clamp((SLOPE_STAND-Pl.slope)/0.26,0,1) : 0;

  var top=Pl.swimming?SWIM:((I.run?RUN:WALK));
  /* Wading is not swimming. Between ankle and chest the water takes
     about half your speed and none of your control, and having no
     state in between made the shoreline read as a switch. */
  if(!Pl.swimming&&Pl.inWater)top*=WADE;
  if(!Pl.swimming&&!Pl.flying){
    /* Climbing costs speed and descending gives a little back — the
       gradient in the direction you are actually asking to go, not the
       steepness of the hill in general. */
    var climb=_want[0]*gx+_want[2]*gz;
    top*=M.clamp(1-climb*0.34,0.52,1.14);
  }
  var targetX=_want[0]*top*wl, targetZ=_want[2]*top*wl;
  /* You cannot run in a direction you are not facing yet. Scaling the
     target speed by how far the body still has to turn is what gives
     the turn clip somewhere to happen — without it a reversal reaches
     walking speed in two frames and the character is fired backwards
     out of a cannon while still facing forwards. */
  if(wl>0.01&&Pl.grounded&&!Pl.flying&&!Pl.swimming){
    var mis=Math.abs(M.angDelta(a.facing,Math.atan2(_want[0],_want[2])));
    var align=1-M.clamp((mis-0.50)/1.30,0,1)*0.82;
    targetX*=align;targetZ*=align;
  }

  var acc=Pl.grounded?ACCEL:AIRACCEL;
  if(Pl.swimming)acc=10;
  /* On ground too steep to stand on, control fades out and gravity
     takes over along the fall line. */
  if(Pl.slide>0.01){
    acc*=1-Pl.slide*0.85;
    var dl=Math.hypot(gx,gz)||1;
    Pl.vel[0]-=gx/dl*SLIDE_ACC*Pl.slide*dt;
    Pl.vel[2]-=gz/dl*SLIDE_ACC*Pl.slide*dt;
  }
  Pl.vel[0]+=(targetX-Pl.vel[0])*Math.min(1,acc*dt);
  Pl.vel[2]+=(targetZ-Pl.vel[2])*Math.min(1,acc*dt);
  if(wl<0.01&&Pl.grounded){
    var f=Math.min(1,FRICTION*dt);
    Pl.vel[0]-=Pl.vel[0]*f;Pl.vel[2]-=Pl.vel[2]*f;
  }

  /* ---- vertical ---- */
  if(Pl.flying){
    var lift=0;
    if(LH.Input.down('jump'))lift+=1;
    if(LH.Input.down('crouch'))lift-=1;
    if(Pl._nudge>0){Pl._nudge-=dt;}
    else if(lift)Pl.vel[1]+=(lift*FLY-Pl.vel[1])*Math.min(1,10*dt);
    else Pl.vel[1]-=Pl.vel[1]*Math.min(1,8*dt);
    /* horizontal flight is faster than running and ignores friction */
    var ftx=_want[0]*FLY*wl, ftz=_want[2]*FLY*wl;
    Pl.vel[0]+=(ftx-Pl.vel[0])*Math.min(1,9*dt);
    Pl.vel[2]+=(ftz-Pl.vel[2])*Math.min(1,9*dt);
  }else if(Pl.swimming){
    /* buoyancy pulls you to the surface unless you hold jump to climb
       out or crouch to dive */
    var depth=(seaY-0.9)-feet;
    var buoy=M.clamp(depth*6,-3,4.5);
    if(I.down('jump'))buoy+=4.0;
    if(I.down('crouch'))buoy-=6.0;
    Pl.vel[1]+=(buoy-Pl.vel[1])*Math.min(1,7*dt);
  }else{
    /* Variable height: releasing the button early cuts the rise, so a
       tap is a hop and a hold is a jump. Both from one impulse. */
    if(Pl.rising){
      if(!I.down('jump')){
        if(Pl.vel[1]>0)Pl.vel[1]*=JUMP_CUT;
        Pl.rising=false;
      }else if(Pl.vel[1]<=0)Pl.rising=false;
    }
    Pl.vel[1]+=GRAVITY*dt;

    Pl.coyote=Pl.grounded?COYOTE:Math.max(0,Pl.coyote-dt);
    Pl.jumpBuf=I.pressed('jump')?JUMPBUF:Math.max(0,Pl.jumpBuf-dt);
    if(Pl.jumpBuf>0&&Pl.coyote>0){
      Pl.vel[1]=JUMP;Pl.grounded=false;
      Pl.coyote=0;Pl.jumpBuf=0;Pl.rising=true;
      a.anim.play('jump');
      LH.Audio&&LH.Audio.play('jump');
    }
  }

  /* ---- integrate, then resolve ---- */
  a.pos[0]+=Pl.vel[0]*dt;
  a.pos[2]+=Pl.vel[2]*dt;
  a.pos[1]+=Pl.vel[1]*dt;
  if(Pl.flying){
    /* flight still refuses to go through the ground or out of the sky */
    var floor=W.groundAt(a.pos[0],a.pos[2])+0.1;
    if(a.pos[1]<floor){a.pos[1]=floor;if(Pl.vel[1]<0)Pl.vel[1]=0;}
    if(a.pos[1]>120){a.pos[1]=120;if(Pl.vel[1]>0)Pl.vel[1]=0;}
  }

  /* keep inside the island's bounds */
  var lim=T.HALF-2;
  a.pos[0]=M.clamp(a.pos[0],-lim,lim);
  a.pos[2]=M.clamp(a.pos[2],-lim,lim);

  W.resolve(a.pos,Pl.radius,a.pos[1]);
  resolveVoxels(a.pos);

  var ground=W.groundAt(a.pos[0],a.pos[2]);
  ground=Math.max(ground,voxelFloor(a.pos[0],a.pos[1],a.pos[2]));
  if(Pl.flying){
    Pl.grounded=false;
  }else if(a.pos[1]<=ground+0.001){
    /* Landing. The impact animation only fires from a real fall, not
       from walking down a kerb. */
    if(!Pl.grounded){
      /* Squash scales with the impact and drives both the character's
         compression and the camera's dip, so a long fall lands heavier
         than a hop off a kerb without either being a separate case. */
      var impact=M.clamp((-Pl.vel[1]-2.0)/12.0,0,1);
      if(impact>0.02){
        Pl.squash=Math.max(Pl.squash,impact);
        Cam.dip(impact);
      }
      if(-Pl.vel[1]>6.5){
        a.anim.play('land');
        Cam.shake(M.clamp(-Pl.vel[1]*0.014,0,0.22),0.22);
        LH.Audio&&LH.Audio.play('land');
      }
    }
    a.pos[1]=ground;
    if(Pl.vel[1]<0)Pl.vel[1]=0;
    Pl.grounded=true;
  }else{
    /* Step up: if the ground just ahead is only a little higher, lift
       onto it rather than colliding with it. Without this every kerb
       in the harbour is a wall. */
    if(Pl.grounded&&ground-a.pos[1]<MAX_STEP&&ground>a.pos[1]){
      a.pos[1]=ground;
    }else{
      Pl.grounded=(a.pos[1]-ground)<0.06;
      if(!Pl.grounded&&a.pos[1]>ground)Pl.grounded=false;
    }
  }
  if(a.pos[1]<ground){a.pos[1]=ground;Pl.grounded=true;if(Pl.vel[1]<0)Pl.vel[1]=0;}

  /* Squash relaxes on a spring rather than a ramp: the overshoot back
     past neutral is the part that reads as weight. */
  Pl.squash=Math.max(0,Pl.squash-dt*4.2);
  Pl.airTime=Pl.grounded?0:Pl.airTime+dt;
  a.squash=Pl.squash;

  /* ---- facing ---- */
  var speed=Math.hypot(Pl.vel[0],Pl.vel[2]);
  if(speed>0.35&&!Pl.aiming){
    a.faceToward(Math.atan2(Pl.vel[0],Pl.vel[2]),dt,14);
  }else if(Pl.aiming){
    a.faceToward(Cam.yaw+Math.PI,dt,20);
  }else if(wl>0.10){
    /* Standing, but asking to go somewhere behind us. Turning here —
       slowly, before the first step lands — is what lets the turn clip
       have something to do; without it the facing snapped the instant
       the character crossed the speed threshold. */
    a.faceToward(Math.atan2(_want[0],_want[2]),dt,5.5);
  }

  /* ---- animation ---- */
  var st=a.anim.state;
  /* A looping emote holds until you do something else. Dancing through
     a walk cycle, or staying seated while swimming, reads as a bug the
     first time anyone sees it. */
  var emoting=LH.Rig.EMOTES.indexOf(st)>=0;
  if(emoting&&(speed>0.35||!Pl.grounded||Pl.swimming)){
    a.anim.play('idle');emoting=false;st='idle';
  }
  var busy=(st==='mine'||st==='build'||st==='attack'||st==='hurt'||
            st==='fishCast'||st==='fishWait'||st==='fishReel'||emoting);
  if(!busy){
    if(Pl.flying){
      /* the fall clip reads as hovering once gravity is off */
      a.anim.play(speed>1.2?'fall':'tread');
    }else if(Pl.swimming){
      a.anim.play(speed>0.8?'swim':'tread');
    }else if(!Pl.grounded){
      if(Pl.vel[1]<-1.5&&st!=='jump')a.anim.play('fall');
    }else if(speed>0.35){
      /* Stopping out of a run. The trigger is the moment the input
         goes and the body is still fast, not the moment the body is
         finally slow — by then the plant has nothing left to absorb.
         `peak` decays rather than being sampled, so a stumble through
         a slow patch does not count as a stop. */
      if(wl<0.06&&speed<3.4&&Pl.peak>4.4&&Pl.grounded){
        a.anim.play('stop');
        Cam.dip(0.09);
        Pl.peak=0;
      }else a.anim.play('locomote');
      /* speed drives the clip's amplitude and its playback rate, so a
         run is not just a fast walk */
      a.anim.params.speed=M.clamp((speed-WALK*0.55)/(RUN-WALK*0.55),0,1);
      var st2=LH.Rig.STATES.locomote;
      st2.period=M.lerp(0.86,0.52,a.anim.params.speed);
    }else{
      /* Standing. Three ways to stand: coming to a halt out of a run,
         turning on the spot, and actually standing. */
      var turnErr=M.angDelta(a.facing,a.wantFacing);
      if(wl>0.10&&Math.abs(turnErr)>0.40){
        a.anim.params.turn=turnErr>0?1:-1;
        a.anim.play('turn');
      }else if(st!=='stop'||a.anim.done){
        a.anim.play('idle');
      }
    }
  }
  /* Half-life of about a third of a second, so `peak` remembers a run
     across the handful of frames a stop takes and forgets it after. */
  Pl.peak=Math.max(speed,Pl.peak*Math.pow(0.5,dt/0.34));
  Pl.lastSpeed=speed;
  a.grounded=Pl.grounded;
};

/* The ground the player is standing on, for footstep audio and for
   the "you cannot build here" checks. */
Pl.surfaceMat=function(){
  var a=Pl.actor;if(!a)return 0;
  var i=Math.round((a.pos[0]+T.HALF)),j=Math.round((a.pos[2]+T.HALF));
  i=M.clamp(i,0,T.N-1);j=M.clamp(j,0,T.N-1);
  return T.mats[j*T.N+i];
};

LH.Player=Pl;
})();

/* ============================================================
   LH.Data — the item table.

   Every item in the game is one row. Nothing switches on a key name:
   behaviour comes from `cat` and `shape`, prices from `value`, and
   the world renderer reads `mat`/`col`/`emis` the same way for a
   block of stone as for a legendary crown. That is what lets the
   table grow to a thousand rows without touching gameplay code.

   Rarity runs 1..6 — common, uncommon, rare, epic, legendary,
   mythic — carried over from the 2D build along with its colour ramp,
   because players already read those tiers at a glance.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D={};

var ITEMS=[], ID={}, BY_CAT={};

/* Categories are the inventory's tabs and the shop's aisles. */
var CAT=['block','material','tool','weapon','fishing','furniture',
         'cosmetic','collectible','seed','consumable','quest'];
D.CAT=CAT;
D.RARITY=['','Common','Uncommon','Rare','Epic','Legendary','Mythic'];
D.RARITY_COL=['','#9AA8BE','#57D07A','#489BFF','#B269FF','#F5A03C','#FF4F7A'];

/* Shapes a placeable item can take in the world. The voxel mesher
   switches on this and nothing else. */
D.SHAPES=['cube','slab','pillar','pane','plant','lamp','fence'];

function It(key,name,o){
  o=o||{};
  var r=o.r===undefined?1:o.r;
  var it={
    id:ITEMS.length,
    key:key,
    name:name,
    desc:o.desc||'',
    cat:o.cat||'block',
    rarity:r,
    /* Value is in soft currency and everything else derives from it:
       the shop marks up, the vendor marks down, and the trade window
       totals with it. One number, so prices cannot drift apart. */
    value:o.value===undefined?Math.round(4*Math.pow(2.35,r-1)):o.value,
    stack:o.stack===undefined?(o.cat==='tool'||o.cat==='weapon'||
      o.cat==='fishing'||o.cat==='cosmetic'?1:999):o.stack,
    tradeable:o.tradeable!==false,
    placeable:o.placeable!==undefined?o.placeable:(o.cat||'block')==='block'
      ||o.cat==='furniture',
    consumable:!!o.consumable,
    craftable:!!o.recipe,
    recipe:o.recipe||null,
    /* world appearance */
    shape:o.shape||'cube',
    mat:o.mat||'stone',
    col:o.col||'#FFFFFF',
    emis:o.emis||0,
    /* mining */
    hard:o.hard===undefined?Math.max(1,Math.round(1+r*1.4)):o.hard,
    tool:o.tool||null,
    drops:o.drops||null,
    /* activity-specific payloads: fish weight ranges, tool power,
       weapon damage, cosmetic slot */
    props:o.props||null
  };
  ID[key]=it.id;
  ITEMS.push(it);
  (BY_CAT[it.cat]||(BY_CAT[it.cat]=[])).push(it);
  return it;
}
D.It=It;

/* ---------------- blocks: the building set ----------------
   The colour column is a *modulation*, not the block's colour. The
   material texture already carries the hue — stone is grey, brick is
   red, foliage is green — so a mid-grey tint on a mid-grey texture
   multiplies out to about a tenth of the albedo it should have, and
   the block renders near-black in anything but direct sun. White
   means "as the material comes"; anything else is a deliberate
   variant of it. */
function B(key,name,mat,col,r,o){
  o=o||{};o.cat='block';o.mat=mat;o.col=col;o.r=r;
  return It(key,name,o);
}
B('stone',      'Stone',           'stone',   '#FFFFFF',1);
B('cobble',     'Cobblestone',     'gravel',  '#FFFFFF',1);
B('dirt',       'Packed Dirt',     'dirt',    '#FFFFFF',1);
B('sand',       'Sand Block',      'sand',    '#FFFFFF',1);
B('grassblock', 'Turf',            'grass',   '#FFFFFF',1);
B('plank',      'Oak Plank',       'planks',  '#FFFFFF',1);
B('darkplank',  'Ash Plank',       'planks',  '#8E7A66',2);
B('log',        'Timber',          'bark',    '#FFFFFF',1);
B('brick',      'Red Brick',       'brick',   '#FFFFFF',1);
B('palebrick',  'Sandstone Brick', 'brickpale','#FFFFFF',2);
B('concrete',   'Concrete',        'concrete','#FFFFFF',1);
B('panel',      'Steel Panel',     'panel',   '#FFFFFF',2);
B('whitepanel', 'White Panel',     'panelw',  '#FFFFFF',2);
B('marble',     'Marble',          'tilepale','#FFFFFF',3);
B('tilefloor',  'Slate Tile',      'tile',    '#FFFFFF',2);
B('roofblock',  'Roof Tile',       'roof',    '#FFFFFF',2);
B('glassblock', 'Glass',           'glass',   '#DCEAF4',2);
B('snowblock',  'Packed Snow',     'snow',    '#FFFFFF',2);
B('goldblock',  'Gold Block',      'gold',    '#FFFFFF',4,{value:520});
B('crystalblock','Crystal Block',  'crystal', '#DFF6FF',4,{emis:0.28,value:640});
B('voidblock',  'Void Stone',      'stone',   '#4E5464',5,{value:1500});
B('emberblock', 'Ember Block',     'stone',   '#FFB88A',5,{emis:0.5,value:1750});
B('aurorablock','Aurora Block',    'crystal', '#D6B4FF',6,{emis:0.6,value:5200});

/* the same set as slabs, pillars and panes — a builder needs shapes,
   not just colours */
B('stoneslab',  'Stone Slab',      'stone',   '#FFFFFF',1,{shape:'slab'});
B('plankslab',  'Plank Slab',      'planks',  '#FFFFFF',1,{shape:'slab'});
B('panelslab',  'Panel Slab',      'panel',   '#FFFFFF',2,{shape:'slab'});

D.byId=function(i){return ITEMS[i]||null;};

D.rarityCol=function(r){return D.RARITY_COL[M.clamp(r|0,1,6)];};

/* Fish are looked up by the water they were caught in, weighted so the
   good ones stay rare no matter how long you stand there. */
D.fishIn=function(zone){
  var out=[];
  var col=BY_CAT.collectible||[];
  for(var i=0;i<col.length;i++){
    var it=col[i];
    if(it.props&&it.props.fish&&it.props.zone===zone)out.push(it);
  }
  return out;
};

/* What a block yields when broken. Defaults to itself, which is what
   a sandbox wants: what you place, you get back. */
D.dropsOf=function(it){
  if(it.drops)return it.drops;
  return [[it.key,1]];
};

/* Sale and purchase both derive from `value`, so a shop can never
   drift out of step with the trade window. */
D.buyPrice=function(it){return Math.max(1,Math.round(it.value*1.35));};
D.sellPrice=function(it){return Math.max(1,Math.round(it.value*0.55));};
/* A fish is worth what it weighs, which is why anglers care. */
D.fishValue=function(it,weight){
  var w=it.props&&it.props.w;
  if(!w)return it.value;
  var t=M.clamp((weight-w[0])/Math.max(0.001,w[1]-w[0]),0,1);
  return Math.max(1,Math.round(it.value*(0.55+t*1.30)));
};

LH.Data=D;
