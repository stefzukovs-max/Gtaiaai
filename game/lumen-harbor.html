/* ============================================================
   LH.Input — one abstraction over keyboard, mouse, touch and pad.

   Nothing downstream asks "is this a phone". The controller reads
   move.x/move.y, look.x/look.y and a set of named actions, and the
   device layer is responsible for filling them. That is the only way
   the same gameplay code survives four input methods.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,I={};

I.move={x:0,y:0};      /* -1..1, camera-relative */
I.look={x:0,y:0};      /* delta this frame, in pixels */
I.zoom=0;
I.run=false;
I.actions={};          /* edge-triggered, cleared each frame */
I.held={};             /* level-triggered */
I.pointer={x:0.5,y:0.5,down:false};
I.lastKind='kb';       /* kb | touch | pad */

var keys={};
var BIND={
  KeyW:'fwd',KeyS:'back',KeyA:'left',KeyD:'right',
  ArrowUp:'fwd',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',
  Space:'jump',ShiftLeft:'run',ShiftRight:'run',
  KeyE:'interact',KeyF:'interact',
  KeyQ:'tool',KeyR:'reload',KeyC:'crouch',
  Tab:'inventory',KeyI:'inventory',KeyM:'map',KeyJ:'missions',
  KeyP:'profile',KeyT:'chat',KeyB:'build',KeyG:'worlds',
  Escape:'menu',KeyV:'emote',KeyH:'help'
};
I.BIND=BIND;

function fire(name){I.actions[name]=true;}

I.attach=function(el){
  window.addEventListener('keydown',function(e){
    if(e.repeat)return;
    var b=BIND[e.code];
    if(!b)return;
    /* Never swallow the browser's own shortcuts while a text field is
       focused — chat has to be able to contain the letter W. */
    if(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;
    keys[b]=true;I.held[b]=true;fire(b);
    I.lastKind='kb';
    if(b!=='menu')e.preventDefault();
  });
  window.addEventListener('keyup',function(e){
    var b=BIND[e.code];if(!b)return;
    keys[b]=false;I.held[b]=false;
  });
  window.addEventListener('blur',function(){
    for(var k in keys)keys[k]=false;
    for(var h in I.held)I.held[h]=false;
  });

  /* Mouse look is pointer-lock when the player asks for it, and
     drag-to-look otherwise. Both write into the same look delta. */
  var dragging=false,lastX=0,lastY=0;
  el.addEventListener('mousedown',function(e){
    I.lastKind='kb';
    I.pointer.down=true;
    I.pointer.x=e.clientX/window.innerWidth;
    I.pointer.y=e.clientY/window.innerHeight;
    if(e.button===2||I.locked){dragging=true;lastX=e.clientX;lastY=e.clientY;}
    else fire('primary');
    if(e.button===2)e.preventDefault();
  });
  window.addEventListener('mouseup',function(e){
    I.pointer.down=false;dragging=false;
    if(e.button===2)fire('secondaryUp');
  });
  window.addEventListener('mousemove',function(e){
    I.pointer.x=e.clientX/window.innerWidth;
    I.pointer.y=e.clientY/window.innerHeight;
    if(I.locked){I.look.x+=e.movementX||0;I.look.y+=e.movementY||0;return;}
    if(dragging){I.look.x+=e.clientX-lastX;I.look.y+=e.clientY-lastY;
      lastX=e.clientX;lastY=e.clientY;}
  });
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
  el.addEventListener('wheel',function(e){
    I.zoom+=Math.sign(e.deltaY)*0.9;e.preventDefault();
  },{passive:false});
  document.addEventListener('pointerlockchange',function(){
    I.locked=document.pointerLockElement===el;
  });
  I.requestLock=function(){el.requestPointerLock&&el.requestPointerLock();};
  I.releaseLock=function(){document.exitPointerLock&&document.exitPointerLock();};

  /* Touch: left half is a virtual stick, right half is look. Both are
     tracked by pointer id so two thumbs never interfere. */
  var stickId=null,stickOX=0,stickOY=0;
  var lookId=null,lookX=0,lookY=0;
  I.stick={active:false,ox:0,oy:0,x:0,y:0};
  el.addEventListener('touchstart',function(e){
    I.lastKind='touch';
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.clientX<window.innerWidth*0.42&&stickId===null){
        stickId=t.identifier;stickOX=t.clientX;stickOY=t.clientY;
        I.stick.active=true;I.stick.ox=stickOX;I.stick.oy=stickOY;
        I.stick.x=stickOX;I.stick.y=stickOY;
      }else if(lookId===null){
        lookId=t.identifier;lookX=t.clientX;lookY=t.clientY;
      }
    }
    e.preventDefault();
  },{passive:false});
  el.addEventListener('touchmove',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===stickId){
        var dx=t.clientX-stickOX,dy=t.clientY-stickOY;
        var R=Math.min(90,window.innerHeight*0.16);
        var d=Math.hypot(dx,dy);
        if(d>R){dx*=R/d;dy*=R/d;}
        I.move.x=dx/R;I.move.y=-dy/R;
        I.run=d>R*0.82;
        I.stick.x=stickOX+dx;I.stick.y=stickOY+dy;
      }else if(t.identifier===lookId){
        I.look.x+=t.clientX-lookX;I.look.y+=t.clientY-lookY;
        lookX=t.clientX;lookY=t.clientY;
      }
    }
    e.preventDefault();
  },{passive:false});
  function endTouch(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier===stickId){
        stickId=null;I.move.x=0;I.move.y=0;I.run=false;I.stick.active=false;
      }else if(t.identifier===lookId)lookId=null;
    }
  }
  el.addEventListener('touchend',endTouch);
  el.addEventListener('touchcancel',endTouch);
};

/* Gamepad is polled, not evented, so it is read at the top of the
   frame alongside everything else. */
function pollPad(){
  if(!navigator.getGamepads)return;
  var pads=navigator.getGamepads();
  for(var i=0;i<pads.length;i++){
    var p=pads[i];
    if(!p||!p.connected)continue;
    var dead=0.18;
    function ax(n){var v=p.axes[n]||0;return Math.abs(v)<dead?0:v;}
    if(ax(0)||ax(1)){I.move.x=ax(0);I.move.y=-ax(1);I.lastKind='pad';}
    if(ax(2)||ax(3)){I.look.x+=ax(2)*14;I.look.y+=ax(3)*14;I.lastKind='pad';}
    var btn=function(n){return p.buttons[n]&&p.buttons[n].pressed;};
    if(btn(0)&&!I._padA)fire('jump');I._padA=btn(0);
    if(btn(2)&&!I._padX)fire('interact');I._padX=btn(2);
    if(btn(7)&&!I._padRT)fire('primary');I._padRT=btn(7);
    if(btn(6)&&!I._padLT)fire('secondary');I._padLT=btn(6);
    if(btn(3)&&!I._padY)fire('inventory');I._padY=btn(3);
    if(btn(9)&&!I._padStart)fire('menu');I._padStart=btn(9);
    I.run=btn(10)||btn(1);
    break;
  }
}

/* Called once at the top of each frame, before anything reads input. */
I.begin=function(){
  pollPad();
  if(I.lastKind==='kb'){
    var mx=(keys.right?1:0)-(keys.left?1:0);
    var my=(keys.fwd?1:0)-(keys.back?1:0);
    var l=Math.hypot(mx,my);
    if(l>1){mx/=l;my/=l;}
    I.move.x=mx;I.move.y=my;
    I.run=!!keys.run;
  }
};
/* And once at the bottom, so an action fires for exactly one frame. */
I.end=function(){
  I.actions={};
  I.look.x=0;I.look.y=0;
  I.zoom=0;
};
I.pressed=function(n){return !!I.actions[n];};
I.down=function(n){return !!I.held[n];};

LH.Input=I;
})();

/* ============================================================
   LH.Player — the controller.

   A capsule that walks, runs, jumps, swims and climbs slopes,
   resolved against the terrain heightmap and the world's collision
   boxes. Movement is camera-relative; the character turns toward
   where it is going rather than where the camera points, except
   while aiming.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Cam=LH.Cam,W=LH.World,T=LH.Terrain,I=LH.Input;
var Pl={};

Pl.actor=null;
Pl.vel=M.v3();
Pl.grounded=true;
Pl.inWater=false;
Pl.swimming=false;
Pl.radius=0.36;
Pl.height=1.82;
Pl.eyeH=1.62;

var WALK=4.2, RUN=7.6, SWIM=2.8;
var ACCEL=26, AIRACCEL=6, FRICTION=13;
var GRAVITY=-24, JUMP=8.0;
var MAX_STEP=0.62;      /* how tall a ledge you walk up rather than into */

Pl.init=function(actor){
  Pl.actor=actor;
  return Pl;
};

var _f=M.v3(),_r=M.v3(),_want=M.v3(),_tmp=M.v3();

Pl.update=function(dt){
  var a=Pl.actor;
  if(!a)return;

  /* ---- camera-relative desired direction ---- */
  Cam.forward(_f);Cam.rightVec(_r);
  M.set3(_want,
    _r[0]*I.move.x+_f[0]*I.move.y,0,
    _r[2]*I.move.x+_f[2]*I.move.y);
  var wl=M.len3(_want);
  if(wl>1){M.scale3(_want,_want,1/wl);wl=1;}

  var seaY=T.SEA;
  var feet=a.pos[1];
  Pl.inWater=feet<seaY-0.15;
  Pl.swimming=feet<seaY-1.05;

  var top=Pl.swimming?SWIM:((I.run?RUN:WALK));
  var targetX=_want[0]*top*wl, targetZ=_want[2]*top*wl;

  var acc=Pl.grounded?ACCEL:AIRACCEL;
  if(Pl.swimming)acc=10;
  Pl.vel[0]+=(targetX-Pl.vel[0])*Math.min(1,acc*dt);
  Pl.vel[2]+=(targetZ-Pl.vel[2])*Math.min(1,acc*dt);
  if(wl<0.01&&Pl.grounded){
    var f=Math.min(1,FRICTION*dt);
    Pl.vel[0]-=Pl.vel[0]*f;Pl.vel[2]-=Pl.vel[2]*f;
  }

  /* ---- vertical ---- */
  if(Pl.swimming){
    /* buoyancy pulls you to the surface unless you hold jump to climb
       out or crouch to dive */
    var depth=(seaY-0.9)-feet;
    var buoy=M.clamp(depth*6,-3,4.5);
    if(I.down('jump'))buoy+=4.0;
    if(I.down('crouch'))buoy-=6.0;
    Pl.vel[1]+=(buoy-Pl.vel[1])*Math.min(1,7*dt);
  }else{
    Pl.vel[1]+=GRAVITY*dt;
    if(I.pressed('jump')&&Pl.grounded){
      Pl.vel[1]=JUMP;Pl.grounded=false;
      a.anim.play('jump');
      LH.Audio&&LH.Audio.play('jump');
    }
  }

  /* ---- integrate, then resolve ---- */
  a.pos[0]+=Pl.vel[0]*dt;
  a.pos[2]+=Pl.vel[2]*dt;
  a.pos[1]+=Pl.vel[1]*dt;

  /* keep inside the island's bounds */
  var lim=T.HALF-2;
  a.pos[0]=M.clamp(a.pos[0],-lim,lim);
  a.pos[2]=M.clamp(a.pos[2],-lim,lim);

  W.resolve(a.pos,Pl.radius,a.pos[1]);

  var ground=W.groundAt(a.pos[0],a.pos[2]);
  if(a.pos[1]<=ground+0.001){
    /* Landing. The impact animation only fires from a real fall, not
       from walking down a kerb. */
    if(!Pl.grounded&&Pl.vel[1]<-6.5){
      a.anim.play('land');
      Cam.shake(M.clamp(-Pl.vel[1]*0.014,0,0.22),0.22);
      LH.Audio&&LH.Audio.play('land');
    }
    a.pos[1]=ground;
    if(Pl.vel[1]<0)Pl.vel[1]=0;
    Pl.grounded=true;
  }else{
    /* Step up: if the ground just ahead is only a little higher, lift
       onto it rather than colliding with it. Without this every kerb
       in the harbour is a wall. */
    if(Pl.grounded&&ground-a.pos[1]<MAX_STEP&&ground>a.pos[1]){
      a.pos[1]=ground;
    }else{
      Pl.grounded=(a.pos[1]-ground)<0.06;
      if(!Pl.grounded&&a.pos[1]>ground)Pl.grounded=false;
    }
  }
  if(a.pos[1]<ground){a.pos[1]=ground;Pl.grounded=true;if(Pl.vel[1]<0)Pl.vel[1]=0;}

  /* ---- facing ---- */
  var speed=Math.hypot(Pl.vel[0],Pl.vel[2]);
  if(speed>0.35&&!Pl.aiming){
    a.faceToward(Math.atan2(Pl.vel[0],Pl.vel[2]),dt,14);
  }else if(Pl.aiming){
    a.faceToward(Cam.yaw+Math.PI,dt,20);
  }

  /* ---- animation ---- */
  var st=a.anim.state;
  var busy=(st==='mine'||st==='build'||st==='attack'||st==='hurt'||
            st==='fishCast'||st==='fishWait'||st==='fishReel'||
            st==='wave'||st==='celebrate'||st==='dance'||st==='sit');
  if(!busy){
    if(Pl.swimming){
      a.anim.play(speed>0.8?'swim':'tread');
    }else if(!Pl.grounded){
      if(Pl.vel[1]<-1.5&&st!=='jump')a.anim.play('fall');
    }else if(speed>0.35){
      a.anim.play('locomote');
      /* speed drives the clip's amplitude and its playback rate, so a
         run is not just a fast walk */
      a.anim.params.speed=M.clamp((speed-WALK*0.55)/(RUN-WALK*0.55),0,1);
      var st2=LH.Rig.STATES.locomote;
      st2.period=M.lerp(0.86,0.52,a.anim.params.speed);
    }else{
      a.anim.play('idle');
    }
  }
  a.grounded=Pl.grounded;
};

/* The ground the player is standing on, for footstep audio and for
   the "you cannot build here" checks. */
Pl.surfaceMat=function(){
  var a=Pl.actor;if(!a)return 0;
  var i=Math.round((a.pos[0]+T.HALF)),j=Math.round((a.pos[2]+T.HALF));
  i=M.clamp(i,0,T.N-1);j=M.clamp(j,0,T.N-1);
  return T.mats[j*T.N+i];
};

LH.Player=Pl;
})();

/* ============================================================
   LH.Sky — time of day and weather.

   The sun's colour, the sky gradient, the fog and the ambient are all
   driven from one clock, so evening in the harbour is a single number
   changing rather than a set of hand-tuned presets. Weather rides on
   top: overcast desaturates and thickens the fog, rain adds particles
   and drops the exposure.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,R=LH.Render,S={};

S.time=9.2;            /* hours, 0..24 */
S.rate=1/110;          /* game hours per real second — a day is ~30 min */
S.weather='clear';
S.wet=0;               /* 0..1, eased so weather changes are not a cut */

/* Keyframes around the clock. Everything between them is interpolated,
   which is why dawn actually passes through a colour rather than
   snapping from night to day. */
var KEY=[
  /* hour  sun            zenith         horizon        fog            amb sky        amb gnd       exp   stars */
  [ 0.0, [0.10,0.13,0.26],[0.01,0.02,0.07],[0.05,0.07,0.16],[0.05,0.07,0.14],[0.05,0.07,0.14],[0.02,0.02,0.03],1.10,1.0],
  [ 5.0, [0.20,0.17,0.26],[0.03,0.05,0.14],[0.16,0.13,0.22],[0.14,0.13,0.20],[0.08,0.09,0.16],[0.03,0.03,0.04],1.05,0.8],
  [ 6.6, [1.05,0.55,0.34],[0.09,0.16,0.38],[0.72,0.44,0.34],[0.56,0.42,0.40],[0.16,0.16,0.26],[0.07,0.06,0.06],1.00,0.15],
  [ 8.5, [1.15,0.96,0.78],[0.10,0.26,0.58],[0.58,0.68,0.84],[0.55,0.66,0.80],[0.17,0.23,0.34],[0.11,0.10,0.09],1.00,0.0],
  [12.5, [1.18,1.10,0.98],[0.11,0.31,0.66],[0.62,0.74,0.90],[0.60,0.72,0.88],[0.20,0.26,0.36],[0.13,0.12,0.11],0.98,0.0],
  [17.0, [1.16,0.98,0.74],[0.10,0.27,0.60],[0.64,0.70,0.84],[0.60,0.68,0.82],[0.18,0.23,0.34],[0.12,0.11,0.10],1.00,0.0],
  [19.2, [1.20,0.52,0.26],[0.10,0.14,0.36],[0.86,0.42,0.26],[0.66,0.40,0.34],[0.18,0.15,0.22],[0.08,0.06,0.05],1.02,0.2],
  [20.6, [0.42,0.26,0.30],[0.04,0.06,0.18],[0.26,0.16,0.26],[0.20,0.16,0.26],[0.09,0.10,0.18],[0.04,0.03,0.04],1.08,0.7],
  [24.0, [0.10,0.13,0.26],[0.01,0.02,0.07],[0.05,0.07,0.16],[0.05,0.07,0.14],[0.05,0.07,0.14],[0.02,0.02,0.03],1.10,1.0]
];

function sample(h){
  var i=0;
  while(i<KEY.length-2&&KEY[i+1][0]<=h)i++;
  var a=KEY[i],b=KEY[i+1];
  var t=M.smooth(M.clamp((h-a[0])/((b[0]-a[0])||1),0,1));
  var out=[];
  for(var k=1;k<=6;k++){
    out.push([M.lerp(a[k][0],b[k][0],t),M.lerp(a[k][1],b[k][1],t),
              M.lerp(a[k][2],b[k][2],t)]);
  }
  out.push(M.lerp(a[7],b[7],t));
  out.push(M.lerp(a[8],b[8],t));
  return out;
}

var WEATHER={
  clear:   {fogMul:1.00,sunMul:1.00,ambMul:1.00,exp:1.00,cloud:0.0,rain:0},
  cloudy:  {fogMul:1.55,sunMul:0.62,ambMul:1.25,exp:0.97,cloud:0.6,rain:0},
  overcast:{fogMul:2.30,sunMul:0.32,ambMul:1.45,exp:0.94,cloud:1.0,rain:0},
  rain:    {fogMul:3.10,sunMul:0.22,ambMul:1.35,exp:0.90,cloud:1.0,rain:1},
  fog:     {fogMul:5.20,sunMul:0.45,ambMul:1.30,exp:0.96,cloud:0.4,rain:0}
};
S.WEATHER=Object.keys(WEATHER);
var cur=WEATHER.clear, want=WEATHER.clear, blend=1;

S.setWeather=function(name){
  if(!WEATHER[name]||S.weather===name)return;
  cur=mixW(cur,want,blend);
  want=WEATHER[name];blend=0;S.weather=name;
};
function mixW(a,b,t){
  return {fogMul:M.lerp(a.fogMul,b.fogMul,t),sunMul:M.lerp(a.sunMul,b.sunMul,t),
    ambMul:M.lerp(a.ambMul,b.ambMul,t),exp:M.lerp(a.exp,b.exp,t),
    cloud:M.lerp(a.cloud,b.cloud,t),rain:M.lerp(a.rain,b.rain,t)};
}

S.update=function(dt){
  S.time=(S.time+dt*S.rate*(S.paused?0:1))%24;
  blend=Math.min(1,blend+dt*0.28);
  var w=mixW(cur,want,M.smooth(blend));
  S.wet=M.damp(S.wet,w.rain,0.02,dt);

  var k=sample(S.time);
  var sc=k[0],zen=k[1],hor=k[2],fog=k[3],ambS=k[4],ambG=k[5],exp=k[6],stars=k[7];
  var sd=R.scene;

  /* The sun tracks an arc tilted off true east-west, so shadows sweep
     across the island through the day instead of along one axis. */
  var ang=((S.time-6)/12)*Math.PI;
  var elev=Math.sin(ang);
  var tilt=0.34;
  M.set3(sd.sunDir,Math.cos(ang)*0.86,Math.max(0.06,elev),Math.sin(ang)*tilt+0.22);
  M.norm3(sd.sunDir,sd.sunDir);

  M.set3(sd.sunCol,sc[0]*w.sunMul,sc[1]*w.sunMul,sc[2]*w.sunMul);
  M.set3(sd.zenith,zen[0],zen[1],zen[2]);
  M.set3(sd.horizon,hor[0],hor[1],hor[2]);
  M.set3(sd.ground,hor[0]*0.20,hor[1]*0.20,hor[2]*0.24);
  M.set3(sd.fogCol,fog[0],fog[1],fog[2]);
  M.set3(sd.skyCol,ambS[0]*w.ambMul,ambS[1]*w.ambMul,ambS[2]*w.ambMul);
  M.set3(sd.gndCol,ambG[0]*w.ambMul,ambG[1]*w.ambMul,ambG[2]*w.ambMul);
  sd.fogDensity=0.0021*w.fogMul;
  sd.exposure=exp*w.exp;
  sd.stars=stars;
  /* Night and rain both want more bloom: wet surfaces and lit windows
     are most of what you can see. */
  sd.bloom=0.72+stars*0.55+S.wet*0.35;
  sd.bloomThresh=1.05-stars*0.30;
  /* Lit windows and neon are dialled right down at noon and carry the
     scene at night. Baking one value into the mesh would mean the
     harbour glows through the middle of the day. */
  sd.emisScale=0.26+stars*1.05+w.cloud*0.16;
  S.rain=w.rain;
  S.cloud=w.cloud;
};

/* Is it dark enough that street lamps and windows should be lit? */
S.isNight=function(){return S.time<6.4||S.time>19.4;};

LH.Sky=S;
})();

/* ============================================================
   LH.Game — the assembly point.

   Boot stages, the frame loop's game half, and the draw order. This
   is the only file section that knows about all the others.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,R=LH.Render,App=LH.App,Cam=LH.Cam,Geo=LH.Geo;
var T=LH.Terrain,W=LH.World,P=LH.Props,Act=LH.Actors,I=LH.Input,Pl=LH.Player,Sky=LH.Sky;
var G={};

G.player=null;
G.crowd=[];
G.ready=false;

/* ---------------- boot ---------------- */
App.stage('Painting surfaces',function(){
  LH.Tex.buildAll();
});
App.stage('Raising the island',function(){
  T.generate();
});
App.stage('Cutting the coastline',function(){
  T.buildChunks();
});
App.stage('Building Lumen Harbor',function(){
  W.build();
});
App.stage('Waking the harbour',function(){
  var spawn=W.spawn;
  var kit=Act.defaultKit(7);
  kit.hair.style='swept';
  kit.shirt.style='jacket';kit.shirt.color='#3A4658';kit.shirt.sleeve='long';
  kit.pants.color='#2E3542';
  kit.shoes.color='#22262E';
  G.player=Act.Actor({x:spawn[0],y:spawn[1],z:spawn[2],kit:kit,name:'You'});
  Pl.init(G.player);

  /* Simulated residents. There is no server behind them — they walk a
     patrol, and the crowd is honest fiction until there is one. */
  var NAMES=['Skylar','Zenn','Mochi','Noctis','Lumi','Kestrel','Vale',
             'Orin','Sable','Wren','Pico','Juno'];
  var rng=M.rng(4242);
  for(var i=0;i<12;i++){
    var pt=[T.pad('plaza'),T.pad('market'),T.pad('harbour')][i%3];
    var a=rng()*M.TAU,rr=6+rng()*14;
    var x=pt.x+Math.cos(a)*rr, z=pt.z+Math.sin(a)*rr;
    var k=Act.defaultKit(i*31+5);
    k.hair.style=LH.Body.HAIR[(rng()*LH.Body.HAIR.length)|0];
    k.shirt.style=['tee','jacket','hoodie'][(rng()*3)|0];
    k.shirt.color=['#C4485E','#3E7BE0','#38A86A','#F5A03C','#B269FF','#3BE0C8',
                   '#8E97A4','#D8D2C4'][(rng()*8)|0];
    k.shirt.sleeve=rng()<0.5?'long':'short';
    k.pants.color=Geo.shade(k.shirt.color,-58);
    k.shoes.color='#2E333C';
    if(rng()<0.25)k.hat.style=LH.Body.HATS[(rng()*LH.Body.HATS.length)|0];
    if(rng()<0.14){k.wings.style=LH.Cos.WINGS[(rng()*LH.Cos.WINGS.length)|0];
      k.wings.color=k.shirt.color;}
    if(rng()<0.14)k.pet.style=LH.Cos.PETS[(rng()*LH.Cos.PETS.length)|0];
    var npc=Act.Actor({x:x,y:T.heightAt(x,z),z:z,kit:k,
      name:NAMES[i%NAMES.length],facing:rng()*M.TAU});
    npc.home=[pt.x,pt.z];
    npc.wander=[x,z];
    npc.wait=rng()*4;
    npc.speed=1.5+rng()*0.9;
    G.crowd.push(npc);
  }
  G.ready=true;
});

/* ---------------- crowd ----------------
   A patrol with pauses. Deliberately simple: they exist to make the
   town feel inhabited, not to be simulated citizens. */
function updateCrowd(dt){
  var rng=Math.random;
  for(var i=0;i<G.crowd.length;i++){
    var n=G.crowd[i];
    var dx=n.wander[0]-n.pos[0], dz=n.wander[1]-n.pos[2];
    var d=Math.hypot(dx,dz);
    if(d<0.8){
      n.wait-=dt;
      if(n.wait<=0){
        var a=rng()*M.TAU,rr=4+rng()*16;
        n.wander[0]=n.home[0]+Math.cos(a)*rr;
        n.wander[1]=n.home[1]+Math.sin(a)*rr;
        n.wait=1.5+rng()*6;
      }
      if(n.anim.state==='locomote'||n.anim.state==='idle'){
        if(n.wait>0.2&&rng()<0.0016)n.anim.play('wave');
        else if(n.anim.state!=='wave')n.anim.play('idle');
      }
    }else{
      var sp=n.speed;
      n.pos[0]+=dx/d*sp*dt;
      n.pos[2]+=dz/d*sp*dt;
      n.faceToward(Math.atan2(dx,dz),dt,7);
      n.anim.play('locomote');
      n.anim.params.speed=M.clamp((sp-2.2)/5.2,0,1);
    }
    n.pos[1]=W.groundAt(n.pos[0],n.pos[2]);
    n.update(dt);
  }
}

/* ---------------- update ---------------- */
App.onUpdate(function(dt,time){
  if(!G.ready)return;
  I.begin();

  Sky.update(dt);

  /* camera first, so movement is relative to what you can see */
  if(I.look.x||I.look.y)Cam.orbit(I.look.x,I.look.y);
  if(I.zoom)Cam.zoom(I.zoom);

  Pl.update(dt);
  G.player.update(dt);
  updateCrowd(dt);

  /* The camera follows the player's chest, not their feet, so a jump
     does not swing the whole view. */
  Cam.update(dt,G.player.pos,function(x,y,z){
    if(y<T.heightAt(x,z)+0.35)return true;
    return W.solidAt(x,y,z);
  });

  /* Shadows are fitted to a box around the player rather than the
     island: at 2048 across 224 m the character's own shadow would be
     four texels wide. */
  R.updateLight(G.player.pos,44);
  T.extractFrustum(R.vp);
  /* Cull around what the camera is looking at, with the radius opened
     up by however far the boom is out. Culling around the eye instead
     is wrong for any wide shot: at a 290 m orbit the eye sits off the
     island entirely and most of the world vanishes. */
  /* Capped: a very wide orbit would otherwise open the radius far
     enough to draw every prop on the island. */
  W.cullProps(Cam.target[0],Cam.target[2],Math.min(1.7,1+Cam.dist*0.030));

  I.end();
});

/* ---------------- draw ---------------- */
var _id=M.m4();
App.onDraw(function(dt,time){
  if(!G.ready)return;
  M.ident(_id);

  Act.beginFrame();
  Act.submit(G.player);
  Act.submitPet(G.player,time);
  for(var i=0;i<G.crowd.length;i++){
    var n=G.crowd[i];
    /* Skip characters far enough away to be a couple of pixels. */
    if(M.dist2(n.pos,G.player.pos)>150)continue;
    Act.submit(n);Act.submitPet(n,time);
  }

  /* --- shadow --- */
  var dp=R.beginShadow();
  GL.u1i(dp,'uInstanced',0);
  GL.uM4(dp,'uModel',_id);
  T.drawChunksNear(G.player.pos[0],G.player.pos[2],48);
  W.drawStatics();
  GL.u1i(dp,'uInstanced',1);
  W.drawProps(dp);
  Act.flushShadow(dp);
  R.endShadow();

  /* --- opaque --- */
  R.beginScene();
  var p=R.beginOpaque();
  GL.uM4(p,'uModel',_id);
  GL.u1f(p,'uSpec',0.18+LH.Sky.wet*0.55);
  T.drawChunks(true);
  W.drawStatics();
  W.drawProps(p);
  Act.flush(p);

  /* --- water --- */
  var wp=R.beginWater(-7.0);
  GL.uM4(wp,'uModel',_id);
  GL.draw(W.water);
  R.endWater();

  /* --- additive: auras --- */
  Act.beginFrame();
  Act.submitAura(G.player,time);
  for(var j=0;j<G.crowd.length;j++)Act.submitAura(G.crowd[j],time);
  var ap=R.beginAdditive();
  Act.flush(ap);
  R.endBlend();

  R.present();
});

/* ---------------- go ---------------- */
if(LH.App.start()){
  LH.Input.attach(document.getElementById('gl'));
  LH.App.runBoot(function(){
    /* nothing yet — the UI hooks in here */
  });
}
LH.Game=G;
})();
</script>
