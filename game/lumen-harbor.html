var GODRAY_FS=`#version 300 es
precision highp float;
`+COMMON+`
uniform sampler2D uSrc;
uniform vec2 uSun;        // sun position in screen UV
uniform float uAmount;
uniform float uDecay;
in vec2 vNDC;
layout(location=0) out vec4 oCol;
void main(){
  vec2 uv=vNDC*0.5+0.5;
  vec2 delta=(uv-uSun)*(1.0/16.0)*0.62;
  vec3 acc=vec3(0.0);
  float w=1.0;
  vec2 p=uv;
  for(int i=0;i<16;i++){
    p-=delta;
    acc+=texture(uSrc,clamp(p,vec2(0.0),vec2(1.0))).rgb*w;
    w*=uDecay;
  }
  oCol=vec4(acc*(uAmount/16.0),1.0);
}
`;

/* ---------------- ambient occlusion ----------------
   Hemisphere SSAO reconstructed entirely from the depth texture the
   ink pass already needs: view position by unprojecting depth, and the
   normal from the derivatives of that position. No normal buffer, no
   second geometry pass.

   This is the change that makes objects sit *on* the ground rather
   than in front of it. Everything else in the frame can be right and
   a scene with no contact darkening still reads as a diorama of
   cut-outs. */
var SSAO_FS=`#version 300 es
precision highp float;
uniform sampler2D uDepth;
uniform mat4 uProj;
uniform mat4 uInvProj;
uniform vec2 uRes;
uniform float uRadius;    // metres
uniform float uBias;
uniform float uStrength;
uniform float uPower;
in vec2 vNDC;
layout(location=0) out vec4 oCol;

vec3 viewPos(vec2 uv){
  float d=texture(uDepth,uv).r*2.0-1.0;
  vec4 c=uInvProj*vec4(uv*2.0-1.0,d,1.0);
  return c.xyz/c.w;
}
/* Sixteen rotations on a 4x4 grid. Paired with a 4x4 box blur they
   cancel exactly — which is why the blur below is a box of that size
   and not a gaussian of a convenient one. */
float gridAngle(vec2 fc){
  vec2 g=mod(floor(fc),4.0);
  return (g.x+g.y*4.0)*(6.28318/16.0);
}

/* A fixed hemisphere kernel, weighted toward the origin so the near
   field — where contact shadows actually live — gets most of the
   samples. */
const vec3 KERN[12]=vec3[12](
  vec3( 0.24, 0.11, 0.30),vec3(-0.31, 0.22, 0.18),vec3( 0.08,-0.35, 0.26),
  vec3(-0.16,-0.20, 0.44),vec3( 0.44, 0.30, 0.12),vec3(-0.48, 0.06, 0.36),
  vec3( 0.20,-0.52, 0.20),vec3(-0.28,-0.44, 0.48),vec3( 0.62, 0.14, 0.42),
  vec3(-0.10, 0.66, 0.30),vec3( 0.34,-0.24, 0.72),vec3(-0.58,-0.30, 0.60)
);

void main(){
  vec2 uv=vNDC*0.5+0.5;
  vec3 P=viewPos(uv);
  // Sky and the far field get no occlusion. Without this the horizon
  // picks up a grey band where the reconstruction goes singular.
  if(-P.z>240.0){oCol=vec4(1.0);return;}
  vec3 N=normalize(cross(dFdx(P),dFdy(P)));

  float a=gridAngle(gl_FragCoord.xy);
  float ca=cos(a),sa=sin(a);
  float occ=0.0;
  for(int i=0;i<12;i++){
    vec3 k=KERN[i];
    vec3 t=vec3(k.x*ca-k.y*sa, k.x*sa+k.y*ca, k.z);
    // Flip the sample into the surface's own hemisphere rather than
    // rejecting it — half a kernel is half the quality for the same
    // cost.
    if(dot(t,N)<0.0)t=-t;
    vec3 sp=P+t*uRadius;
    vec4 cp=uProj*vec4(sp,1.0);
    if(cp.w<=0.0)continue;
    vec2 suv=cp.xy/cp.w*0.5+0.5;
    if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0)continue;
    float sceneZ=viewPos(suv).z;
    // View z is negative ahead of the camera, so "the surface here is
    // nearer than my sample" is a greater-than.
    float hit=(sceneZ>=sp.z+uBias)?1.0:0.0;
    // Range check, or a wall fifty metres behind a railing occludes it.
    float range=smoothstep(0.0,1.0,uRadius/max(0.0001,abs(P.z-sceneZ)));
    occ+=hit*range;
  }
  float ao=1.0-(occ/12.0)*uStrength;
  // Curve it. The raw average is a gentle slope and reads as dirt on
  // the lens; the power puts the contrast where the geometry actually
  // touches and leaves open ground alone.
  oCol=vec4(vec3(pow(clamp(ao,0.0,1.0),uPower)),1.0);
}
`;

/* Occlusion needs its own blur. Borrowing the bloom's gaussian looked
   free and was not: that kernel reaches three and a half texels at half
   resolution, which is seven full-res pixels, and averaging a
   centimetre-wide contact band over seven pixels of open floor is how
   you turn a contact shadow into a rumour. Five tight taps instead. */
var AOBLUR_FS=`#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uDir;
in vec2 vNDC;
layout(location=0) out vec4 oCol;
void main(){
  vec2 uv=vNDC*0.5+0.5;
  // Four equal taps spanning exactly four texels. Run once across and
  // once down, that is a 4x4 box — the width the rotation grid needs,
  // and no wider, so contact bands survive it.
  float c=texture(uSrc,uv-uDir*1.5).r;
  c+=texture(uSrc,uv-uDir*0.5).r;
  c+=texture(uSrc,uv+uDir*0.5).r;
  c+=texture(uSrc,uv+uDir*1.5).r;
  oCol=vec4(vec3(c*0.25),1.0);
}
`;

/* ---------------- FXAA ----------------
   The ink pass draws one-pixel lines off a depth derivative, and those
   alias harder than any geometry edge in the scene. This runs last, on
   the finished LDR image, which is the only place a luma-based filter
   can see what it is smoothing. */
var FXAA_FS=`#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uRes;
in vec2 vNDC;
layout(location=0) out vec4 oCol;
float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
void main(){
  vec2 uv=vNDC*0.5+0.5;
  vec2 t=1.0/uRes;
  vec3 mC=texture(uSrc,uv).rgb;
  float lM=luma(mC);
  float lNW=luma(texture(uSrc,uv+vec2(-t.x,-t.y)).rgb);
  float lNE=luma(texture(uSrc,uv+vec2( t.x,-t.y)).rgb);
  float lSW=luma(texture(uSrc,uv+vec2(-t.x, t.y)).rgb);
  float lSE=luma(texture(uSrc,uv+vec2( t.x, t.y)).rgb);
  float lMin=min(lM,min(min(lNW,lNE),min(lSW,lSE)));
  float lMax=max(lM,max(max(lNW,lNE),max(lSW,lSE)));
  // Flat enough to leave alone. Skipping early is most of the speed.
  if(lMax-lMin<max(0.028,lMax*0.115)){oCol=vec4(mC,1.0);return;}

  vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)),((lNW+lSW)-(lNE+lSE)));
  float dirRed=max((lNW+lNE+lSW+lSE)*0.25*0.20,0.0078);
  float rcp=1.0/(min(abs(dir.x),abs(dir.y))+dirRed);
  dir=clamp(dir*rcp,vec2(-6.0),vec2(6.0))*t;

  vec3 a=0.5*(texture(uSrc,uv+dir*(1.0/3.0-0.5)).rgb+
              texture(uSrc,uv+dir*(2.0/3.0-0.5)).rgb);
  vec3 b=a*0.5+0.25*(texture(uSrc,uv+dir*-0.5).rgb+
                     texture(uSrc,uv+dir* 0.5).rgb);
  float lB=luma(b);
  oCol=vec4((lB<lMin||lB>lMax)?a:b,1.0);
}
`;

var COMPOSITE_FS=`#version 300 es
precision highp float;
`+COMMON+`
uniform sampler2D uSrc;
uniform sampler2D uBloom;
uniform sampler2D uRays;
uniform sampler2D uDepth;
uniform sampler2D uAO;
uniform float uAOAmt;
// Dev view: 1 shows the occlusion buffer on its own, 2 shows linear
// depth. Both are the only practical way to tell "the pass produced
// nothing" apart from "the pass produced something too subtle to see".
uniform float uDebug;
uniform float uBloomAmt;
uniform float uRayAmt;
uniform float uVignette;
uniform float uOutline;
uniform float uSat;
uniform vec2 uNearFar;
uniform float uTime;
uniform vec2 uRes;
in vec2 vNDC;
layout(location=0) out vec4 oCol;

float linDepth(vec2 uv){
  float d=texture(uDepth,uv).r*2.0-1.0;
  float n=uNearFar.x,f=uNearFar.y;
  return (2.0*n*f)/(f+n-d*(f-n));
}

// Silhouette finder. The trick is the *second* derivative: a floor
// seen at a grazing angle has a huge depth gradient and would outline
// itself under a plain Sobel, but its curvature is nil. A silhouette
// spikes the curvature, and that is the edge worth inking.
uniform float uInkWidth;   // in pixels
uniform vec2 uInkFade;     // metres: full strength, faded
float edgeAt(vec2 uv){
  // Tap radius in pixels, not in UV: a line that is one texel wide is
  // a hairline at 1440p and a fat marker at 640p, and the drawing has
  // to weigh the same at both.
  vec2 t=uInkWidth/uRes;
  float c=linDepth(uv);
  float l=linDepth(uv-vec2(t.x,0.0));
  float r=linDepth(uv+vec2(t.x,0.0));
  float u=linDepth(uv+vec2(0.0,t.y));
  float d=linDepth(uv-vec2(0.0,t.y));
  float dx=abs(l+r-2.0*c);
  float dy=abs(u+d-2.0*c);
  // Scaled by distance so a line does not thicken into a blot as
  // something walks away from the camera.
  float e=smoothstep(0.055,0.24,(dx+dy)/max(c,0.4));
  // Ink fades with distance. Past about sixty metres a single pixel
  // spans several separate leaves, every one of them a silhouette, and
  // a forest inked at full strength turns into a field of scribble.
  // Near work stays drawn; the far side reads as colour.
  return e*mix(1.0,0.16,smoothstep(uInkFade.x,uInkFade.y,c));
}

void main(){
  vec2 uv=vNDC*0.5+0.5;
  if(uDebug>0.5){
    if(uDebug<1.5){oCol=vec4(vec3(texture(uAO,uv).r),1.0);return;}
    float ld=linDepth(uv)/60.0;
    oCol=vec4(vec3(fract(ld),ld*0.25,1.0-ld*0.25),1.0);return;
  }
  vec3 c=texture(uSrc,uv).rgb;
  // Occlusion goes on before the tonemap and before the glow, so a
  // bloomed window is not dimmed by the eaves above it.
  if(uAOAmt>0.001){
    float ao=texture(uAO,uv).r;
    c*=mix(1.0,ao,uAOAmt);
  }
  c+=texture(uBloom,uv).rgb*uBloomAmt;
  c+=texture(uRays,uv).rgb*uRayAmt;

  c=tonemap(c);

  if(uOutline>0.001){
    // A dark version of the surface's own colour, not black: a pure
    // black line on bright grass reads as a hole, not as ink.
    c=mix(c,c*vec3(0.16,0.17,0.22),edgeAt(uv)*uOutline);
  }
  if(uSat>0.0){
    float lum=dot(c,vec3(0.2126,0.7152,0.0722));
    c=mix(vec3(lum),c,1.0+uSat);
  }

  float r=length(vNDC*vec2(1.0,0.92));
  c*=mix(1.0,smoothstep(1.45,0.35,r),uVignette);

  // A little ordered dither before the 8-bit write: without it the sky
  // gradient bands visibly on a dark display.
  float d=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
  c+=(d-0.5)/255.0;

  oCol=vec4(toSRGB(c),1.0);
}
`;

/* ---------------- state ---------------- */
R.progs={};
R.shadow=null;
R.scene={
  sunDir:M.v3(0.45,0.72,0.28),
  /* Calibrated so a mid-grey albedo comes back mid-grey. Sun plus
     ambient has to land near 1.0 combined; the first pass at this had
     them summing to ~1.7 and every surface blew out a stop and a half
     hot, which reads as "washed out" long before it reads as "bright". */
  sunCol:M.v3(1.15,1.03,0.86),
  skyCol:M.v3(0.17,0.23,0.34),
  gndCol:M.v3(0.11,0.10,0.09),
  zenith:M.v3(0.10,0.26,0.58),
  horizon:M.v3(0.62,0.72,0.86),
  ground:M.v3(0.10,0.11,0.14),
  fogCol:M.v3(0.55,0.66,0.80),
  /* Tuned by eye against a 120m view: enough haze to give the far
     shore depth, not so much that the middle distance goes flat. */
  fogDensity:0.0012,
  fogHeight:44,
  exposure:1.0,
  stars:0,
  bloom:0.85,
  bloomThresh:1.05,
  vignette:0.55,
  emisScale:1.0,
  rays:0.34,
  rayDecay:0.955,
  lampLevel:0,
  /* The cartoon dial. `toon` bands the lighting, `outline` inks the
     silhouettes, `saturation` is a straight chroma push after the
     tonemap. All three at zero gives back the old stylized-realism
     look exactly, which is what makes this a setting and not a
     rewrite. */
  toon:1.0,
  /* Occlusion strength, the sample radius in metres, and a depth bias
     that stops a surface shadowing itself. */
  /* Weather the world can feel. `wind` is a direction times a
     strength; `windTime` is its own clock so a paused game stops
     swaying; the cloud terms drift the shadow field over the ground. */
  wind:M.v3(1,0.35,0.42),
  windTime:0,
  cloudAmt:0.34,
  cloudDrift:[0,0],
  ao:1.0,
  aoRadius:1.05,
  aoBias:0.018,
  aoStrength:2.2,
  aoPower:1.45,
  debugView:0,
  fxaa:1,
  /* Kernel radius in shadow texels. Two is a hard edge with the
     aliasing filtered off; four is a soft one that starts to leak
     under thin geometry. */
  shadowSoft:2.6,
  outline:1.6,
  inkWidth:1.35,
  inkNear:24,
  inkFar:150,
  saturation:0.30
};

R.vp=M.m4();R.view=M.m4();R.proj=M.m4();R.invVP=M.m4();R.invProj=M.m4();
R.lightVP=M.m4();
R.eye=M.v3(0,3,8);
R.time=0;
R.quality=1;      /* 1 = full, 0.75 / 0.5 scale the internal buffers */

var sceneRT=null,bloomA=null,bloomB=null,rayRT=null;
var aoRT=null,aoBlurRT=null,ldrRT=null;
var SHADOW_SIZE=2048;

R.init=function(canvas){
  gl=GL.gl;
  R.canvas=canvas;
  R.progs.std=GL.program('std',STD_VS,STD_FS);
  R.progs.depth=GL.program('depth',DEPTH_VS,DEPTH_FS);
  R.progs.sky=GL.program('sky',SKY_VS,SKY_FS);
  R.progs.water=GL.program('water',WATER_VS,WATER_FS);
  R.progs.bright=GL.program('bright',POST_VS,BRIGHT_FS);
  R.progs.blur=GL.program('blur',POST_VS,BLUR_FS);
  R.progs.rays=GL.program('rays',POST_VS,GODRAY_FS);
  R.progs.comp=GL.program('comp',POST_VS,COMPOSITE_FS);
  R.progs.ssao=GL.program('ssao',POST_VS,SSAO_FS);
  R.progs.aoblur=GL.program('aoblur',POST_VS,AOBLUR_FS);
  R.progs.fxaa=GL.program('fxaa',POST_VS,FXAA_FS);

  /* A weak GPU with a small shadow map still looks fine; a missing one
     does not, so fall back a step rather than disabling shadows. */
  R.shadow=GL.shadowTarget(SHADOW_SIZE);
  if(!R.shadow.ok){SHADOW_SIZE=1024;R.shadow=GL.shadowTarget(SHADOW_SIZE);}

  sceneRT=GL.colorTarget(2,2,true,true);
  bloomA=GL.colorTarget(2,2,true);
  bloomB=GL.colorTarget(2,2,true);
  rayRT=GL.colorTarget(2,2,true);
  /* Occlusion at half resolution and blurred: it is a low-frequency
     term and full-res noise costs four times as much to produce and
     then has to be blurred away anyway. */
  aoRT=GL.colorTarget(2,2,'nodepth');
  aoBlurRT=GL.colorTarget(2,2,'nodepth');
  ldrRT=GL.colorTarget(2,2,'nodepth');
  return R;
};

R.resize=function(w,h){
  var q=R.quality;
  var iw=Math.max(2,Math.round(w*q)),ih=Math.max(2,Math.round(h*q));
  GL.resizeColorTarget(sceneRT,iw,ih,true);
  GL.resizeColorTarget(bloomA,Math.max(2,iw>>1),Math.max(2,ih>>1),true);
  GL.resizeColorTarget(bloomB,Math.max(2,iw>>1),Math.max(2,ih>>1),true);
  GL.resizeColorTarget(rayRT,Math.max(2,iw>>1),Math.max(2,ih>>1),true);
  GL.resizeColorTarget(aoRT,Math.max(2,iw>>1),Math.max(2,ih>>1),'nodepth');
  GL.resizeColorTarget(aoBlurRT,Math.max(2,iw>>1),Math.max(2,ih>>1),'nodepth');
  GL.resizeColorTarget(ldrRT,iw,ih,'nodepth');
  R.iw=iw;R.ih=ih;
};

/* Fit the sun's ortho box around the camera's near region. Shadow
   resolution is finite, so covering the whole 400m island would make
   the character's own shadow a blur — instead the box tracks the
   player and only near geometry casts. */
var _lv=M.m4(),_lp=M.m4(),_ctr=M.v3(),_eye=M.v3(),_up=M.v3(0,1,0);
R.updateLight=function(focus,radius){
  radius=radius||42;
  var s=R.scene;
  /* Snap the focus to shadow-texel increments. Without this the whole
     shadow crawls and shimmers as the player walks. */
  var texel=(radius*2)/SHADOW_SIZE;
  var fx=Math.round(focus[0]/texel)*texel;
  var fz=Math.round(focus[2]/texel)*texel;
  M.set3(_ctr,fx,focus[1],fz);
  M.addScaled3(_eye,_ctr,s.sunDir,radius*2.2);
  M.lookAt(_lv,_eye,_ctr,_up);
  M.ortho(_lp,-radius,radius,-radius,radius,0.5,radius*5);
  M.mul(R.lightVP,_lp,_lv);
};

R.setCamera=function(view,proj,eye){
  M.copy(R.view,view);M.copy(R.proj,proj);M.copy3(R.eye,eye);
  M.mul(R.vp,proj,view);
  M.invert(R.invVP,R.vp);
  /* The occlusion pass works in view space, so it needs the lens on
     its own rather than the whole view-projection. */
  M.invert(R.invProj,proj);
};

function bindSceneUniforms(p){
  var s=R.scene;
  GL.u1i(p,'uLightCount',R.lightCount);
  if(R.lightCount){
    GL.u4fv(p,'uLightPos',R.lightPos);
    GL.u4fv(p,'uLightCol',R.lightCol);
  }
  GL.u3v(p,'uSunDir',s.sunDir);
  GL.u3v(p,'uSunCol',s.sunCol);
  GL.u3v(p,'uSkyCol',s.skyCol);
  GL.u3v(p,'uGndCol',s.gndCol);
  GL.u3v(p,'uFogCol',s.fogCol);
  GL.u2f(p,'uFog',s.fogDensity,s.fogHeight);
  GL.u3v(p,'uEye',R.eye);
  GL.u1f(p,'uExposure',s.exposure);
  GL.u1f(p,'uToon',s.toon);
  GL.u3v(p,'uWind',s.wind);
  GL.u1f(p,'uWindTime',s.windTime);
  GL.u2f(p,'uLeaf',LH.Tex.layer('foliage'),LH.Tex.layer('foliagep'));
  GL.u1f(p,'uCloudAmt',s.cloudAmt);
  GL.u2f(p,'uCloudDrift',s.cloudDrift[0],s.cloudDrift[1]);
  GL.u1f(p,'uTime',R.time);
}

/* ---------------- pass drivers ---------------- */
R.beginShadow=function(){
  GL.bindTarget(R.shadow);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  /* Front-face culling during the depth pass moves acne to the
     backfaces, where nobody sees it. */
  gl.cullFace(gl.FRONT);
  var p=GL.use(R.progs.depth);
  GL.uM4(p,'uLightVP',R.lightVP);
  var s=R.scene;
  GL.u3v(p,'uWind',s.wind);
  GL.u1f(p,'uWindTime',s.windTime);
  GL.u2f(p,'uLeaf',LH.Tex.layer('foliage'),LH.Tex.layer('foliagep'));
  return p;
};
R.endShadow=function(){gl.cullFace(gl.BACK);};

R.beginScene=function(){
  GL.bindTarget(sceneRT);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  /* Sky writes every pixel, so there is no need to clear colour. */
  var p=GL.use(R.progs.sky);
  var s=R.scene;
  gl.depthMask(false);
  GL.uM4(p,'uInvVP',R.invVP);
  GL.u3v(p,'uEye',R.eye);
  GL.u3v(p,'uSunDir',s.sunDir);
  GL.u3v(p,'uSunCol',s.sunCol);
  GL.u3v(p,'uZenith',s.zenith);
  GL.u3v(p,'uHorizon',s.horizon);
  GL.u3v(p,'uGround',s.ground);
  GL.u1f(p,'uTime',R.time);
  GL.u1f(p,'uExposure',s.exposure);
  GL.u1f(p,'uStars',s.stars);
  GL.fullscreen();
  gl.depthMask(true);
};

/* The active point-light set, refilled each frame from whatever the
   world says is nearest. Kept as two flat Float32Arrays so the upload
   is one call per program rather than sixteen. */
R.MAXLIGHTS=16;
R.lightCount=0;
R.lightPos=new Float32Array(R.MAXLIGHTS*4);
R.lightCol=new Float32Array(R.MAXLIGHTS*4);
/* list entries: {x,y,z,r,col:[r,g,b],power,always} — `level` is the
   time-of-day dimmer the sky hands down, which everything but an
   `always` light is multiplied by. */
R.setLights=function(list,level){
  var n=Math.min(list.length,R.MAXLIGHTS);
  for(var i=0;i<n;i++){
    var L=list[i],o=i*4;
    R.lightPos[o]=L.x;R.lightPos[o+1]=L.y;R.lightPos[o+2]=L.z;R.lightPos[o+3]=L.r;
    var k=(L.power===undefined?1:L.power)*(L.always?1:level);
    R.lightCol[o]=L.col[0]*k;R.lightCol[o+1]=L.col[1]*k;R.lightCol[o+2]=L.col[2]*k;
    R.lightCol[o+3]=0;
  }
  R.lightCount=n;
};

R.beginOpaque=function(){
  var p=GL.use(R.progs.std);
  bindSceneUniforms(p);
  GL.uM4(p,'uVP',R.vp);
  GL.uM4(p,'uLightVP',R.lightVP);
  GL.u2f(p,'uShadowTexel',1/SHADOW_SIZE,0.0016);
  GL.u1f(p,'uShadowSoft',R.scene.shadowSoft);
  GL.bindTex(0,LH.Tex.array,gl.TEXTURE_2D_ARRAY);
  GL.u1i(p,'uAtlas',0);
  GL.bindTex(1,R.shadow.tex,gl.TEXTURE_2D);
  GL.u1i(p,'uShadow',1);
  GL.u1f(p,'uSpec',0.25);
  GL.u1f(p,'uAlpha',1);
  GL.u1f(p,'uEmisScale',R.scene.emisScale);
  GL.u4f(p,'uTint',1,1,1,0);
  GL.u2f(p,'uUVScroll',0,0);
  GL.u1i(p,'uInstanced',0);
  return p;
};

R.beginWater=function(floorY){
  var p=GL.use(R.progs.water);
  bindSceneUniforms(p);
  GL.uM4(p,'uVP',R.vp);
  GL.bindTex(0,LH.Tex.array,gl.TEXTURE_2D_ARRAY);
  GL.u1i(p,'uAtlas',0);
  GL.u1f(p,'uDetailLayer',LH.Tex.layer('water'));
  GL.u3f(p,'uShallow',0.30,0.80,0.80);
  GL.u3f(p,'uDeep',0.03,0.26,0.48);
  GL.u3v(p,'uZenith',R.scene.zenith);
  GL.u3v(p,'uHorizonC',R.scene.horizon);
  GL.u1f(p,'uFloorY',floorY===undefined?-3:floorY);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  return p;
};
R.endWater=function(){gl.depthMask(true);gl.disable(gl.BLEND);};

R.beginBlend=function(){
  var p=R.beginOpaque();
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  return p;
};
R.endBlend=function(){gl.depthMask(true);gl.disable(gl.BLEND);};

/* additive pass for sparks, auras, sun shafts */
R.beginAdditive=function(){
  var p=R.beginOpaque();
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.depthMask(false);
  return p;
};

R.present=function(){
  var s=R.scene;
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  /* --- ambient occlusion --- */
  var aoOn=(s.ao>0.001&&sceneRT.depthTex);
  if(aoOn){
    GL.bindTarget(aoRT);
    var pa=GL.use(R.progs.ssao);
    GL.bindTex(0,sceneRT.depthTex,gl.TEXTURE_2D);GL.u1i(pa,'uDepth',0);
    GL.uM4(pa,'uProj',R.proj);
    GL.uM4(pa,'uInvProj',R.invProj);
    GL.u2f(pa,'uRes',aoRT.w,aoRT.h);
    GL.u1f(pa,'uRadius',s.aoRadius);
    GL.u1f(pa,'uBias',s.aoBias);
    GL.u1f(pa,'uStrength',s.aoStrength);
    GL.u1f(pa,'uPower',s.aoPower);
    GL.fullscreen();
    /* Two separable passes over the AO. The kernel is rotated per
       pixel, so what comes out of the pass is correct but noisy, and
       the blur is what turns the noise back into a gradient. */
    var pab=GL.use(R.progs.aoblur);
    GL.bindTarget(aoBlurRT);
    GL.bindTex(0,aoRT.tex,gl.TEXTURE_2D);GL.u1i(pab,'uSrc',0);
    GL.u2f(pab,'uDir',1/aoRT.w,0);
    GL.fullscreen();
    GL.bindTarget(aoRT);
    GL.bindTex(0,aoBlurRT.tex,gl.TEXTURE_2D);GL.u1i(pab,'uSrc',0);
    GL.u2f(pab,'uDir',0,1/aoRT.h);
    GL.fullscreen();
  }

  if(s.bloom>0.001){
    GL.bindTarget(bloomA);
    var pb=GL.use(R.progs.bright);
    GL.bindTex(0,sceneRT.tex,gl.TEXTURE_2D);GL.u1i(pb,'uSrc',0);
    GL.u1f(pb,'uThresh',s.bloomThresh);
    GL.fullscreen();

    /* Two separable passes. More would be smoother but this is a
       glow, not a lens simulation. */
    var pblur=GL.use(R.progs.blur);
    GL.bindTarget(bloomB);
    GL.bindTex(0,bloomA.tex,gl.TEXTURE_2D);GL.u1i(pblur,'uSrc',0);
    GL.u2f(pblur,'uDir',1/bloomA.w,0);
    GL.fullscreen();

    GL.bindTarget(bloomA);
    GL.bindTex(0,bloomB.tex,gl.TEXTURE_2D);GL.u1i(pblur,'uSrc',0);
    GL.u2f(pblur,'uDir',0,1/bloomA.h);
    GL.fullscreen();
  }

  /* Sun shafts. Projected here rather than passed in, so the pass
     needs nothing from the game but the sun direction it already has. */
  var rayAmt=0;
  if(s.rays>0.001){
    var sd=s.sunDir;
    var fwdX=-R.view[2],fwdY=-R.view[6],fwdZ=-R.view[10];
    var facing=fwdX*sd[0]+fwdY*sd[1]+fwdZ*sd[2];
    if(facing>0.02){
      var ex=R.eye[0]+sd[0]*900,ey=R.eye[1]+sd[1]*900,ez=R.eye[2]+sd[2]*900;
      var cx=R.vp[0]*ex+R.vp[4]*ey+R.vp[8]*ez+R.vp[12];
      var cy=R.vp[1]*ex+R.vp[5]*ey+R.vp[9]*ez+R.vp[13];
      var cw=R.vp[3]*ex+R.vp[7]*ey+R.vp[11]*ez+R.vp[15];
      if(cw>0.0001){
        var sx=cx/cw*0.5+0.5, sy=cy/cw*0.5+0.5;
        /* fade out as the sun leaves the frame, or the shafts snap off */
        var edge=Math.max(Math.abs(sx-0.5),Math.abs(sy-0.5));
        rayAmt=s.rays*Math.min(1,facing*2.4)*Math.max(0,1-Math.max(0,edge-0.5)*3.2);
        if(rayAmt>0.001){
          GL.bindTarget(rayRT);
          var pr=GL.use(R.progs.rays);
          GL.bindTex(0,bloomA.tex,gl.TEXTURE_2D);GL.u1i(pr,'uSrc',0);
          GL.u2f(pr,'uSun',sx,sy);
          GL.u1f(pr,'uAmount',1.0);
          GL.u1f(pr,'uDecay',s.rayDecay);
          GL.fullscreen();
        }
      }
    }
  }

  /* The composite lands in a buffer rather than on screen, because
     FXAA has to run on the finished image. */
  var aaOn=!!s.fxaa;
  GL.bindTarget(aaOn?ldrRT:null);
  var pc=GL.use(R.progs.comp);
  GL.bindTex(0,sceneRT.tex,gl.TEXTURE_2D);GL.u1i(pc,'uSrc',0);
  GL.bindTex(4,aoRT.tex,gl.TEXTURE_2D);GL.u1i(pc,'uAO',4);
  GL.u1f(pc,'uAOAmt',aoOn?s.ao:0);
  GL.u1f(pc,'uDebug',s.debugView||0);
  GL.bindTex(1,bloomA.tex,gl.TEXTURE_2D);GL.u1i(pc,'uBloom',1);
  GL.bindTex(2,rayRT.tex,gl.TEXTURE_2D);GL.u1i(pc,'uRays',2);
  GL.bindTex(3,sceneRT.depthTex,gl.TEXTURE_2D);GL.u1i(pc,'uDepth',3);
  /* Recovered from the projection rather than plumbed through from the
     camera: proj[14]/(proj[10]-1) is the near plane and
     proj[14]/(proj[10]+1) the far one, so the outline pass cannot go
     stale when something else changes the lens. */
  var p10=R.proj[10],p14=R.proj[14];
  GL.u2f(pc,'uNearFar',p14/(p10-1.0),p14/(p10+1.0));
  GL.u1f(pc,'uOutline',sceneRT.depthTex?s.outline:0);
  GL.u1f(pc,'uInkWidth',s.inkWidth);
  GL.u2f(pc,'uInkFade',s.inkNear,s.inkFar);
  GL.u1f(pc,'uSat',s.saturation);
  GL.u1f(pc,'uRayAmt',rayAmt);
  GL.u1f(pc,'uBloomAmt',s.bloom);
  GL.u1f(pc,'uVignette',s.vignette);
  GL.u1f(pc,'uTime',R.time);
  GL.u2f(pc,'uRes',R.iw,R.ih);
  GL.fullscreen();

  if(aaOn){
    GL.bindTarget(null);
    var pf=GL.use(R.progs.fxaa);
    GL.bindTex(0,ldrRT.tex,gl.TEXTURE_2D);GL.u1i(pf,'uSrc',0);
    GL.u2f(pf,'uRes',R.iw,R.ih);
    GL.fullscreen();
  }

  gl.enable(gl.DEPTH_TEST);
};

LH.Render=R;
})();

/* ============================================================
   LH.App — device setup, the frame loop, and the boot sequence.

   Everything above this point is engine. Everything below is game.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,R=LH.Render,App={};

App.canvas=null;
App.w=0;App.h=0;App.dpr=1;
App.time=0;App.dt=0;App.frame=0;
App.paused=false;
var _last=0,_acc=0,_fpsT=0,_fpsN=0;
App.fps=60;

/* Update hooks run before the draw, draw hooks during it. Systems
   register themselves rather than the loop knowing about them, so
   adding fishing later does not mean editing the frame loop. */
var updaters=[],drawers=[];
App.onUpdate=function(fn,order){updaters.push({fn:fn,o:order||0});
  updaters.sort(function(a,b){return a.o-b.o;});};
App.onDraw=function(fn,order){drawers.push({fn:fn,o:order||0});
  drawers.sort(function(a,b){return a.o-b.o;});};

App.resize=function(){
  var cv=App.canvas;
  var r=cv.getBoundingClientRect();
  /* Cap the device pixel ratio: a phone at DPR 3 renders nine times the
     pixels of DPR 1 for a difference nobody can see at arm's length. */
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(2,Math.round(r.width*dpr)),h=Math.max(2,Math.round(r.height*dpr));
  if(w===App.w&&h===App.h)return;
  cv.width=w;cv.height=h;
  App.w=w;App.h=h;App.dpr=dpr;
  App.aspect=w/h;
  R.resize(w,h);
  /* The game is landscape. In portrait we keep the landscape layout and
     ask for the device to be turned, so nothing has to reflow. */
  var portrait=r.height>r.width*1.02;
  document.getElementById('rotate').style.display=portrait?'flex':'none';
};

function frame(t){
  requestAnimationFrame(frame);
  if(!_last)_last=t;
  var dt=(t-_last)/1000;_last=t;
  /* Clamp: a backgrounded tab returns with a multi-second delta and
     every integrator in the game would explode on it. */
  if(dt>0.1)dt=0.1;
  App.dt=dt;App.time+=dt;App.frame++;

  _fpsN++;_fpsT+=dt;
  if(_fpsT>=0.5){App.fps=_fpsN/_fpsT;_fpsN=0;_fpsT=0;}

  App.resize();
  if(App.paused)return;

  R.time=App.time;
  GL.resetStats();

  for(var i=0;i<updaters.length;i++)updaters[i].fn(dt,App.time);
  for(var j=0;j<drawers.length;j++)drawers[j].fn(dt,App.time);
}

App.start=function(){
  var cv=App.canvas=document.getElementById('gl');
  var ctx=GL.init(cv);
  if(!ctx){
    document.getElementById('boottip').innerHTML=
      'This browser has no WebGL2. Lumen Harbor needs it to draw the world.';
    return false;
  }
  R.init(cv);
  App.resize();
  requestAnimationFrame(frame);
  return true;
};

/* ---------------- boot sequence ----------------
   Generating every texture and mesh takes a beat, so the work is
   sliced across frames with the progress bar showing real stages
   rather than a fake timer. */
var stages=[];
App.stage=function(label,fn){stages.push({label:label,fn:fn});};

App.runBoot=function(done){
  var fill=document.getElementById('bootfill');
  var tip=document.getElementById('boottip');
  var i=0;
  function step(){
    if(i>=stages.length){
      fill.style.width='100%';
      tip.textContent='Ready';
      setTimeout(function(){
        var b=document.getElementById('boot');
        b.classList.add('gone');
        setTimeout(function(){b.style.display='none';},760);
        done&&done();
      },260);
      return;
    }
    var s=stages[i];
    tip.textContent=s.label;
    fill.style.width=Math.round(i/stages.length*100)+'%';
    /* two frames per stage: one to paint the label, one to do the work,
       so the bar never lies about what it is currently doing */
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      try{s.fn();}catch(e){
        tip.innerHTML='<span style="color:#FF5A6E">'+
          (s.label+' failed: '+(e&&e.message||e))+'</span>';
        console.error(e);
        return;
      }
      i++;step();
    });});
  }
  step();
};

LH.App=App;
})();

/* ============================================================
   LH.Cam — third-person camera.

   Orbits a follow point, collides with the world so it never clips
   into terrain, and eases rather than snapping. Shared by mouse,
   touch and gamepad through LH.Input.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Cam={};

Cam.target=M.v3(0,1.6,0);      /* where the camera looks */
Cam.focus=M.v3(0,1.6,0);       /* smoothed follow point */
Cam.eye=M.v3(0,4,8);
Cam.yaw=0;
Cam.pitch=0.30;
Cam.dist=6.2;
Cam.wantDist=6.2;
Cam.minDist=1.6;
Cam.maxDist=13;
Cam.fov=M.rad(58);
Cam.near=0.12;
Cam.far=520;
Cam.height=1.36;               /* shoulder height above the follow point */
Cam.shoulder=0.55;             /* lateral offset — over-the-shoulder framing */
Cam.sensitivity=1.0;
Cam.invertY=false;
Cam.firstPerson=false;
Cam.collide=true;
Cam.manual=false;

Cam.view=M.m4();
Cam.proj=M.m4();

var PITCH_MIN=M.rad(-72),PITCH_MAX=M.rad(74);
var _shakeT=0,_shakeAmp=0;
Cam.shake=function(amp,dur){_shakeAmp=Math.max(_shakeAmp,amp);_shakeT=Math.max(_shakeT,dur||0.25);};
/* A dip is not a shake. Shake is noise and says "something hit you";
   dip is a single signed motion and says "you hit the ground". Landing
   wants the second, and getting them confused is why so many jumps
   feel like being punched. */
var _dip=0,_dipV=0;
Cam.dip=function(amount){_dipV-=Math.min(0.85,amount)*3.4;};

Cam.orbit=function(dx,dy){
  var s=Cam.sensitivity*0.0032;
  Cam.yaw-=dx*s;
  Cam.pitch+=(Cam.invertY?-dy:dy)*s;
  Cam.pitch=M.clamp(Cam.pitch,PITCH_MIN,PITCH_MAX);
  if(Cam.yaw>Math.PI)Cam.yaw-=M.TAU;
  if(Cam.yaw<-Math.PI)Cam.yaw+=M.TAU;
};
Cam.zoom=function(d){
  Cam.wantDist=M.clamp(Cam.wantDist+d,Cam.minDist,Cam.maxDist);
};

var _want=M.v3(),_dir=M.v3(),_right=M.v3(),_up=M.v3(0,1,0),_tmp=M.v3();

/* `solid(x,y,z)` is supplied by the world: returns true if that point is
   inside geometry. The camera walks the ray back toward the player and
   stops short of the first blocked sample, which is cheaper and steadier
   than a true swept sphere and is indistinguishable in play. */
Cam.update=function(dt,followPos,solid){
  /* Manual mode: eye and target are whatever the caller set. Used by
     cinematics and by the screenshot harness, which needs to frame a
     shot rather than orbit whoever happens to be standing there. */
  if(Cam.manual){
    M.lookAt(Cam.view,Cam.eye,Cam.target,_up);
    M.perspective(Cam.proj,Cam.fov,LH.App.aspect||1.777,Cam.near,Cam.far);
    LH.Render.setCamera(Cam.view,Cam.proj,Cam.eye);
    return;
  }
  M.lerp3(Cam.focus,Cam.focus,followPos,1-Math.pow(0.0008,dt));
  /* Critically-ish damped spring back to level. Stiff enough to settle
     inside a third of a second, soft enough to be felt. */
  _dipV+=(-_dip*46-_dipV*9.5)*dt;
  _dip+=_dipV*dt;
  if(Math.abs(_dip)<0.0004&&Math.abs(_dipV)<0.004){_dip=0;_dipV=0;}
  M.set3(Cam.target,Cam.focus[0],Cam.focus[1]+Cam.height+_dip,Cam.focus[2]);

  var cp=Math.cos(Cam.pitch),sp=Math.sin(Cam.pitch);
  M.set3(_dir,Math.sin(Cam.yaw)*cp,sp,Math.cos(Cam.yaw)*cp);
  M.norm3(_dir,_dir);
  M.cross3(_right,_dir,_up);M.norm3(_right,_right);

  Cam.dist=M.damp(Cam.dist,Cam.wantDist,0.22,dt);

  var d=Cam.dist;
  /* Collision can be switched off for cinematics and for framing
     screenshots, where the boom pulling in is a nuisance rather than
     a feature. */
  if(solid&&Cam.collide!==false){
    /* march out from the head; the first blocked sample caps the boom */
    var steps=14,hit=d;
    for(var i=1;i<=steps;i++){
      var t=d*(i/steps);
      var px=Cam.target[0]+_dir[0]*t+_right[0]*Cam.shoulder*0.4;
      var py=Cam.target[1]+_dir[1]*t;
      var pz=Cam.target[2]+_dir[2]*t+_right[2]*Cam.shoulder*0.4;
      if(solid(px,py,pz)){hit=Math.max(Cam.minDist*0.5,d*((i-1)/steps)-0.22);break;}
    }
    /* pull in fast so the camera never ends up inside a wall, ease back
       out slowly so a doorway does not fling the view */
    if(hit<d)d=hit;
    else d=M.damp(Cam._lastD===undefined?d:Cam._lastD,d,0.12,dt);
    Cam._lastD=d;

    M.copy3(Cam.eye,Cam.target);
    M.addScaled3(Cam.eye,Cam.eye,_dir,-0.05);
    M.addScaled3(Cam.target,Cam.eye,_dir,-4);

    M.addScaled3(Cam.eye,Cam.target,_dir,d);

       pressed against a wall doesn't sit inside the character's ear. */
    var sh=Cam.shoulder*M.clamp(d/Cam.wantDist,0,1);
    M.addScaled3(Cam.eye,Cam.eye,_right,sh);
    M.addScaled3(Cam.target,Cam.target,_right,sh*0.6);
  }

  if(_shakeT>0){
    _shakeT-=dt;
    var amp=_shakeAmp*M.clamp(_shakeT/0.25,0,1);
    Cam.eye[0]+=(Math.random()-0.5)*amp;
    Cam.eye[1]+=(Math.random()-0.5)*amp;
    Cam.eye[2]+=(Math.random()-0.5)*amp;
    if(_shakeT<=0)_shakeAmp=0;
  }

  M.lookAt(Cam.view,Cam.eye,Cam.target,_up);
  M.perspective(Cam.proj,Cam.fov,LH.App.aspect||1.777,Cam.near,Cam.far);
  LH.Render.setCamera(Cam.view,Cam.proj,Cam.eye);
};

/* Movement is relative to where the camera is looking, so these two
   vectors are what the player controller steers by. */
Cam.forward=function(out){
  out[0]=-Math.sin(Cam.yaw);out[1]=0;out[2]=-Math.cos(Cam.yaw);
  return M.norm3(out,out);
};
Cam.rightVec=function(out){
  out[0]=Math.cos(Cam.yaw);out[1]=0;out[2]=-Math.sin(Cam.yaw);
  return M.norm3(out,out);
};

/* Screen ray, for click-to-place and click-to-target. */
var _n=M.v3(),_f=M.v3(),_iv=M.m4();
Cam.ray=function(sx,sy,outO,outD){
  var ndcX=sx*2-1,ndcY=1-sy*2;
  M.mul(_iv,Cam.proj,Cam.view);
  M.invert(_iv,_iv);

  M.set3(_f,ndcX,ndcY,1);M.xformPoint(_f,_iv,_f);
  M.copy3(outO,_n);
  M.norm3(outD,M.sub3(outD,_f,_n));
  return outD;
};

LH.Cam=Cam;
})();


/* ============================================================
   LH.Rig — skeleton and animation.

   Seventeen bones in a parent-child hierarchy, posed every frame by
   an animation state machine that crossfades between clips.

   The clips are functions of phase, not keyframe tables. That is a
   deliberate choice and not just a way of avoiding an importer: a
   procedural walk can take stride length, lean and limp as live
   parameters, so the same clip covers walking, sprinting, wading
   and carrying something heavy without any extra data.

   Parts are rigid per bone with a joint sphere at each pivot rather
   than skinned. At this stylisation the joint reads as an elbow, and
   it saves a skinning shader and the bone-weight data behind it.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Rig={};

/* ---------------- skeleton ----------------
   Offsets are the bone's rest position in its parent's space, in
   metres. The figure is 1.82 m to the crown with the ankle at zero,
   which puts it at roughly seven heads — heroic, but not the
   eight-head fashion-plate that would fight the sandbox proportions,
   and nowhere near the three-head chibi we are moving away from. */
/* ---------------- proportions ----------------
   The cartoon silhouette lives here, in one table, rather than in a
   hundred literals spread across the skeleton and the model code.
   Bones read it directly; LH.Body reads it through Rig.P for limb
   lengths, limb thickness and head scale; the garments read the same
   numbers so a sleeve cannot end up longer than the arm inside it.

   The register is Club Penguin, not anatomy: a head about a fifth of
   the body, short thick legs, arms that stop at the hip. Realistic
   proportions were roughly seven and a half heads tall — this is
   about four and a half, which is the range every toy-shaped
   character in the genre sits in. */

  hipY:0.86, spine:0.10, chest:0.22, neck:0.16, headUp:0.19,
  shoulderX:0.195, shoulderY:0.12, armOut:0.085,
  armUp:0.23, armLo:0.21,
  hipX:0.105, thigh:0.40, shin:0.40,
  /* Geometry multipliers. headScale is applied about the head bone, so
     raising it grows the skull in place rather than lifting it off the
     neck; limbFat thickens arms and legs and the clothes over them by
     the same factor, which is what keeps a sleeve outside its arm. */
  headScale:1.45, limbFat:1.20, handScale:1.30, footScale:1.12

Rig.P=P;

var BONES=[
  /* name,         parent,      offset x,y,z */
  ['hips',        -1,           0,          P.hipY,       0],
  ['spine',        0,           0,          P.spine,      0],
  ['chest',        1,           0,          P.chest,      0],
  ['neck',         2,           0,          P.neck,       0],
  ['head',         3,           0,          P.headUp,     0],
  ['shoulderL',    2,           P.shoulderX, P.shoulderY, 0],
  ['armL',         5,           P.armOut,   0,            0],
  ['forearmL',     6,           0,         -P.armUp,      0],
  ['handL',        7,           0,         -P.armLo,      0],
  ['shoulderR',    2,          -P.shoulderX, P.shoulderY, 0],
  ['armR',         9,          -P.armOut,   0,            0],
  ['forearmR',    10,           0,         -P.armUp,      0],
  ['handR',       11,           0,         -P.armLo,      0],
  ['thighL',       0,           P.hipX,    -0.06,         0],
  ['shinL',       13,           0,         -P.thigh,      0],
  ['footL',       14,           0,         -P.shin,       0],
  ['thighR',       0,          -P.hipX,    -0.06,         0],
  ['shinR',       16,           0,         -P.thigh,      0],
  ['footR',       17,           0,         -P.shin,       0]

var NB=BONES.length;
var NAME={},PARENT=new Int8Array(NB),REST=new Float32Array(NB*3);
for(var i=0;i<NB;i++){

Rig.BONE=function(n){return NAME[n];};

/* A Pose is a flat rotation array plus a few whole-body channels.
   Keeping it flat means blending two poses is one loop over floats
   rather than a walk over objects. */
function Pose(){
  this.rot=new Float32Array(NB*3);   /* euler per bone, radians */
  this.off=new Float32Array(NB*3);   /* additive offset on the rest position */
  this.rootY=0;                      /* whole-body bob */
  this.rootLean=0;                   /* forward pitch of the whole figure */
  this.rootRoll=0;
  this.rootYaw=0;
}
Rig.Pose=Pose;
Pose.prototype.clear=function(){
  this.rot.fill(0);this.off.fill(0);
  this.rootY=0;this.rootLean=0;this.rootRoll=0;this.rootYaw=0;
  return this;
};
Pose.prototype.set=function(bone,x,y,z){
  var b=(typeof bone==='number')?bone:NAME[bone];
  if(b===undefined)return this;
  this.rot[b*3]=x||0;this.rot[b*3+1]=y||0;this.rot[b*3+2]=z||0;return this;
};
Pose.prototype.add=function(bone,x,y,z){
  var b=(typeof bone==='number')?bone:NAME[bone];
  if(b===undefined)return this;
  this.rot[b*3]+=x||0;this.rot[b*3+1]+=y||0;this.rot[b*3+2]+=z||0;return this;
};
Pose.prototype.copyFrom=function(o){
  this.rot.set(o.rot);this.off.set(o.off);
  this.rootY=o.rootY;this.rootLean=o.rootLean;
  this.rootRoll=o.rootRoll;this.rootYaw=o.rootYaw;return this;
};
/* Euler lerp is wrong in general but correct here: no clip in this game
   swings a joint more than a half turn between blended states, so the
   shortest-path ambiguity never arises and quaternions would only cost
   conversions. */
Pose.blend=function(out,a,b,t){
  var ar=a.rot,br=b.rot,orr=out.rot,ao=a.off,bo=b.off,oo=out.off;
  for(var i=0;i<NB*3;i++){
    orr[i]=ar[i]+(br[i]-ar[i])*t;
    oo[i]=ao[i]+(bo[i]-ao[i])*t;
  }
  out.rootY=a.rootY+(b.rootY-a.rootY)*t;
  out.rootLean=a.rootLean+(b.rootLean-a.rootLean)*t;
  out.rootRoll=a.rootRoll+(b.rootRoll-a.rootRoll)*t;
  out.rootYaw=a.rootYaw+(b.rootYaw-a.rootYaw)*t;
  return out;
};

/* ---------------- clip library ----------------
   Each clip fills a pose from (phase, params). Phase is 0..1 for
   looping clips and 0..1 elapsed for one-shots. */
var C={};
Rig.clips=C;
var sin=Math.sin,cos=Math.cos,PI=Math.PI,TAU=M.TAU;

/* Small shared shapes. `ease` gives a clip its weight — a limb that
   accelerates and settles reads as mass, a linear one reads as a
   puppet. */
function ease(t){return t*t*(3-2*t);}
function bell(t){return sin(t*PI);}

C.idle=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  /* Breathing drives the chest and, a beat later, the shoulders. */
  var br=sin(t)*0.5+0.5;
  p.set('chest',-0.03-br*0.030,0,0);
  p.set('spine',0.012+br*0.012,0,0);
  p.set('neck',0.02-br*0.02,0,0);
  /* A slow weight shift on a different period from the breath, so the
     two never sync up and the loop stops being obvious. */
  var sw=sin(ph*TAU*0.37);
  p.rootRoll=sw*0.020;
  p.rootYaw=sw*0.045;
  p.rootY=-Math.abs(sw)*0.012+br*0.006;
  p.set('hips',0,-sw*0.05,sw*0.03);
  /* Arms hang with a natural outward flare and a slight lag. */
  var lag=sin((ph-0.08)*TAU*0.37);
  p.set('armL',0.05,0,0.13+lag*0.02);
  p.set('armR',0.05,0,-0.13-lag*0.02);
  p.set('forearmL',-0.16-br*0.02,0,0.05);
  p.set('forearmR',-0.16-br*0.02,0,-0.05);
  p.set('handL',0,0,0.10);
  p.set('handR',0,0,-0.10);
  /* Weight on alternating legs rather than a symmetric stance. */
  p.set('thighL',-0.02+sw*0.03,0,0.035);
  p.set('thighR',-0.02-sw*0.03,0,-0.035);
  p.set('shinL',0.05-sw*0.02,0,0);
  p.set('shinR',0.05+sw*0.02,0,0);
  p.set('head',0.02,sw*0.10,0);
  return p;
};

/* One clip covers walking through sprinting. `sp` is 0 at a slow walk
   and 1 at a full run, and every amplitude scales off it, which is why
   there is no visible pop as the player accelerates. */
C.locomote=function(p,ph,pr){
  p.clear();
  var sp=pr&&pr.speed!==undefined?M.clamp(pr.speed,0,1):0;
  var t=ph*TAU;
  var swing=0.55+sp*0.52;
  var lift=0.35+sp*0.68;
  var lean=0.06+sp*0.30;

  /* Legs: thigh swings on the fundamental, knee bends on a phase-shifted
     rectified sine so it straightens on the drive and folds on the return. */
  var lp=sin(t),rp=sin(t+PI);
  p.set('thighL',lp*swing,0,0.03);
  p.set('thighR',rp*swing,0,-0.03);
  var kL=Math.max(0,-sin(t-0.5))*lift+0.06;
  var kR=Math.max(0,-sin(t+PI-0.5))*lift+0.06;
  p.set('shinL',kL,0,0);
  p.set('shinR',kR,0,0);
  /* Ankle rolls through the step: toe-off then heel-strike. */
  p.set('footL',-lp*0.32+kL*0.30,0,0);
  p.set('footR',-rp*0.32+kR*0.30,0,0);

  /* Hips rise twice per cycle and roll toward the supporting leg. */
  p.rootY=(Math.abs(sin(t))*0.055-0.028)*(0.5+sp);
  p.rootRoll=cos(t)*(0.03+sp*0.05);
  p.set('hips',0,cos(t)*(0.05+sp*0.09),0);
  /* Chest counter-rotates against the hips — the thing that makes a walk
     look like a person rather than a marching toy. */
  p.set('chest',-lean*0.5,-cos(t)*(0.07+sp*0.13),0);
  p.rootLean=lean;
  p.set('spine',lean*0.25,0,0);
  /* Head stays level while the body pitches under it. */
  p.set('neck',-lean*0.55,0,0);
  p.set('head',-lean*0.20,cos(t)*0.03,0);

  /* Arms oppose the legs, with the forearm trailing a quarter phase. */
  var aL=rp*(0.42+sp*0.55),aR=lp*(0.42+sp*0.55);
  p.set('armL',aL,0,0.11-sp*0.04);
  p.set('armR',aR,0,-0.11+sp*0.04);
  p.set('forearmL',-0.22-sp*0.55-Math.max(0,rp)*(0.20+sp*0.42),0,0.04);
  p.set('forearmR',-0.22-sp*0.55-Math.max(0,lp)*(0.20+sp*0.42),0,-0.04);
  p.set('handL',0.05,0,0.08);
  p.set('handR',0.05,0,-0.08);
  return p;
};

C.jump=function(p,ph,pr){
  p.clear();
  /* Launch: legs still extended from the push, arms thrown up. */
  var e=ease(M.clamp(ph*2.2,0,1));
  p.rootLean=0.10;
  p.set('thighL',-0.30-e*0.35,0,0.05);
  p.set('thighR',-0.26-e*0.30,0,-0.05);
  p.set('shinL',0.55+e*0.55,0,0);
  p.set('shinR',0.40+e*0.45,0,0);
  p.set('footL',-0.30,0,0);
  p.set('footR',-0.26,0,0);
  p.set('armL',-1.55-e*0.55,0,0.42);
  p.set('armR',-1.50-e*0.50,0,-0.42);
  p.set('forearmL',-0.50,0,0.12);
  p.set('forearmR',-0.46,0,-0.12);
  p.set('chest',-0.14,0,0);
  p.set('head',-0.10,0,0);
  return p;
};

C.fall=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  /* Windmilling arms and trailing legs: reads as "not in control". */
  p.rootLean=0.16+sin(t*0.7)*0.05;
  p.set('armL',-2.10+sin(t*1.3)*0.24,0,0.62);
  p.set('armR',-2.05+sin(t*1.3+1.1)*0.24,0,-0.62);
  p.set('forearmL',-0.75,0,0.2);
  p.set('forearmR',-0.70,0,-0.2);
  p.set('thighL',0.34+sin(t)*0.12,0,0.08);
  p.set('thighR',0.12+sin(t+PI)*0.12,0,-0.08);
  p.set('shinL',0.55,0,0);
  p.set('shinR',0.78,0,0);
  p.set('footL',-0.2,0,0);p.set('footR',-0.2,0,0);
  p.set('chest',-0.10,0,0);
  return p;
};

C.land=function(p,ph,pr){
  p.clear();
  /* Absorb on impact then push back up. One-shot over ~0.35 s. */
  var d=bell(M.clamp(ph,0,1));
  p.rootY=-d*0.30;
  p.rootLean=d*0.34;
  p.set('thighL',d*0.86,0,0.10);
  p.set('thighR',d*0.82,0,-0.10);
  p.set('shinL',d*1.15,0,0);
  p.set('shinR',d*1.10,0,0);
  p.set('footL',-d*0.42,0,0);
  p.set('footR',-d*0.40,0,0);
  p.set('armL',-d*0.75,0,0.30+d*0.20);
  p.set('armR',-d*0.72,0,-0.30-d*0.20);
  p.set('forearmL',-0.30-d*0.45,0,0.08);
  p.set('forearmR',-0.30-d*0.42,0,-0.08);
  p.set('chest',d*0.24,0,0);
  p.set('head',-d*0.18,0,0);
  return p;
};

/* Mining and building share a swing; the difference is where it stops
   and how hard it lands. */
function swingClip(p,ph,reach,power){
  p.clear();
  /* Anticipation to about a third, then a fast strike, then recovery. */
  var wind=M.clamp(ph/0.34,0,1);
  var strike=M.clamp((ph-0.34)/0.20,0,1);
  var recov=M.clamp((ph-0.54)/0.46,0,1);
  var raise=ease(wind)*(1-ease(strike));
  var hit=ease(strike)*(1-ease(recov));
  var a=-2.30*raise+0.85*hit;
  p.set('armR',a,0,-0.30+raise*0.34);
  p.set('forearmR',-0.30-raise*1.35+hit*0.60,0,-0.10);
  p.set('handR',0.10-raise*0.30,0,-0.10);
  /* The off hand braces and follows a beat behind. */
  p.set('armL',-0.55*raise+0.35*hit,0,0.36);
  p.set('forearmL',-0.75-raise*0.55,0,0.16);
  /* Whole-body rotation into the swing — the power comes from the hips,
     not the shoulder, and it looks wrong if the torso stays square. */
  p.rootYaw=raise*0.30-hit*0.34;
  p.set('hips',0,raise*0.18-hit*0.22,0);
  p.set('chest',-raise*0.22+hit*0.34*power,raise*0.30-hit*0.36,0);
  p.rootLean=hit*0.26*power-raise*0.10;
  p.set('head',hit*0.18-raise*0.06,raise*0.10-hit*0.12,0);
  p.set('thighL',-0.08+hit*0.12,0,0.05);
  p.set('thighR',-0.14-raise*0.10,0,-0.05);
  p.set('shinL',0.16,0,0);
  p.set('shinR',0.22+raise*0.10,0,0);
  p.rootY=-hit*0.05*power;
  return p;
}
C.mine=function(p,ph,pr){return swingClip(p,ph,0.9,1.0);};
C.build=function(p,ph,pr){
  p.clear();
  /* Placing is a reach and a press, not a swing. */
  var out=ease(M.clamp(ph/0.42,0,1));
  var press=bell(M.clamp((ph-0.36)/0.34,0,1));
  var back=ease(M.clamp((ph-0.70)/0.30,0,1));
  var f=out*(1-back);
  p.set('armR',-1.15*f-press*0.14,0,-0.24+f*0.12);
  p.set('forearmR',-0.55+f*0.34,0,-0.10);
  p.set('handR',0.20*f+press*0.24,0,-0.06);
  p.set('armL',-0.30*f,0,0.30);
  p.set('forearmL',-0.70,0,0.14);
  p.rootLean=f*0.14+press*0.06;
  p.set('chest',-f*0.12,-f*0.20,0);
  p.set('head',-f*0.06,-f*0.12,0);
  p.set('thighL',-0.06,0,0.05);
  p.set('thighR',-0.10,0,-0.05);
  p.set('shinL',0.12,0,0);p.set('shinR',0.16,0,0);
  return p;
};

C.attack=function(p,ph,pr){
  p.clear();
  /* A horizontal slash: wind across the body, whip through, recover. */
  var wind=M.clamp(ph/0.26,0,1);
  var cut=M.clamp((ph-0.26)/0.18,0,1);
  var rec=M.clamp((ph-0.44)/0.56,0,1);
  var w=ease(wind)*(1-ease(cut));
  var c=ease(cut)*(1-ease(rec));
  p.set('armR',-0.55-w*0.70+c*0.30,w*1.15-c*1.40,-0.30-w*0.55+c*0.30);
  p.set('forearmR',-0.95-w*0.75+c*0.85,0,-0.12);
  p.set('handR',0,0,-0.15-w*0.25);
  p.set('armL',-0.25-w*0.30+c*0.55,0,0.42);
  p.set('forearmL',-0.85,0,0.18);
  p.rootYaw=w*0.52-c*0.62;
  p.set('hips',0,w*0.24-c*0.30,0);
  p.set('chest',-0.06,w*0.40-c*0.50,0);
  p.set('head',0,w*0.20-c*0.28,0);
  p.rootLean=c*0.16;
  p.set('thighL',-0.10+c*0.16,0,0.06);
  p.set('thighR',-0.12-w*0.10,0,-0.06);
  p.set('shinL',0.18,0,0);p.set('shinR',0.20,0,0);
  return p;
};

C.fishCast=function(p,ph,pr){
  p.clear();
  /* Rod back over the shoulder, then a flick forward. */
  var back=M.clamp(ph/0.38,0,1);
  var flick=M.clamp((ph-0.38)/0.22,0,1);
  var settle=M.clamp((ph-0.60)/0.40,0,1);
  var b=ease(back)*(1-ease(flick));
  var f=ease(flick)*(1-ease(settle)*0.55);
  p.set('armR',-1.30-b*0.75+f*0.55,0,-0.26);
  p.set('forearmR',-0.55-b*0.95+f*0.80,0,-0.10);
  p.set('handR',-0.20-b*0.30+f*0.40,0,-0.08);
  p.set('armL',-0.85,0,0.34);
  p.set('forearmL',-0.95,0,0.20);
  p.rootLean=-b*0.10+f*0.16;
  p.set('chest',b*0.12-f*0.14,-b*0.20+f*0.16,0);
  p.set('thighL',-0.08,0,0.06);p.set('thighR',-0.10,0,-0.06);
  p.set('shinL',0.14,0,0);p.set('shinR',0.16,0,0);
  return p;
};

C.fishWait=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  /* Rod held out, tip drifting. Almost still — the tension comes from
     the bobber, not the angler. */
  var br=sin(t)*0.5+0.5;
  p.set('armR',-1.02+sin(t*0.6)*0.03,0,-0.24);
  p.set('forearmR',-0.62-br*0.03,0,-0.10);
  p.set('handR',-0.16,0,-0.06);
  p.set('armL',-0.72,0,0.30);
  p.set('forearmL',-1.05,0,0.24);
  p.set('chest',-0.05-br*0.02,-0.12,0);
  p.set('neck',0.04,0.06,0);
  p.set('head',0.06,0.06,0);
  p.rootY=br*0.006;
  p.set('thighL',-0.06,0,0.06);p.set('thighR',-0.08,0,-0.06);
  p.set('shinL',0.12,0,0);p.set('shinR',0.14,0,0);
  return p;
};

C.fishReel=function(p,ph,pr){
  p.clear();
  var t=ph*TAU*3;   /* the crank turns faster than the clip loops */
  /* Rod up and straining, off hand winding the reel. */
  p.set('armR',-1.35+sin(t*0.5)*0.06,0,-0.30);
  p.set('forearmR',-0.95,0,-0.12);
  p.set('handR',-0.10,0,-0.06);
  p.set('armL',-1.05,0.10,0.26);
  p.set('forearmL',-1.15+sin(t)*0.30,cos(t)*0.22,0.20);
  p.set('handL',sin(t)*0.5,0,0.10);
  p.rootLean=-0.10+sin(t*0.5)*0.03;
  p.set('chest',0.10,-0.16,0);
  p.set('head',0.10,0.08,0);
  p.set('thighL',-0.14,0,0.07);p.set('thighR',-0.10,0,-0.07);
  p.set('shinL',0.24,0,0);p.set('shinR',0.20,0,0);
  p.rootY=-0.03;
  return p;
};

C.hurt=function(p,ph,pr){
  p.clear();
  var d=bell(M.clamp(ph,0,1));
  /* Recoil away from the hit, arms in. */
  p.rootLean=-d*0.34;
  p.rootYaw=d*0.22;
  p.set('chest',-d*0.26,d*0.20,0);
  p.set('head',-d*0.30,d*0.16,0);
  p.set('armL',-d*0.85,0,0.50);
  p.set('armR',-d*0.80,0,-0.50);
  p.set('forearmL',-0.55-d*0.70,0,0.20);
  p.set('forearmR',-0.55-d*0.65,0,-0.20);
  p.set('thighL',d*0.22,0,0.06);
  p.set('thighR',d*0.16,0,-0.06);
  p.set('shinL',0.20+d*0.20,0,0);
  p.set('shinR',0.18+d*0.18,0,0);
  p.rootY=-d*0.06;
  return p;
};

C.swim=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  /* Face-down crawl: body flat, alternating arm pull, flutter kick. */
  p.rootLean=1.28;
  p.rootY=-0.36;
  p.set('chest',-0.16,0,0);
  p.set('neck',-0.34,0,0);
  p.set('head',-0.30,sin(t)*0.30,0);
  p.set('armL',-1.55+sin(t)*1.55,0,0.30);
  p.set('armR',-1.55+sin(t+PI)*1.55,0,-0.30);
  p.set('forearmL',-0.45-Math.max(0,sin(t))*0.55,0,0.12);
  p.set('forearmR',-0.45-Math.max(0,sin(t+PI))*0.55,0,-0.12);
  p.set('thighL',sin(t*2)*0.30,0,0.05);
  p.set('thighR',sin(t*2+PI)*0.30,0,-0.05);
  p.set('shinL',0.22+Math.max(0,sin(t*2))*0.34,0,0);
  p.set('shinR',0.22+Math.max(0,sin(t*2+PI))*0.34,0,0);
  p.set('footL',-0.30,0,0);p.set('footR',-0.30,0,0);
  return p;
};

C.tread=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  /* Upright in deep water, sculling. */
  p.rootY=-0.30;
  p.rootLean=0.12;
  p.set('armL',-1.15,0,0.62+sin(t)*0.18);
  p.set('armR',-1.15,0,-0.62-sin(t+PI)*0.18);
  p.set('forearmL',-0.80,0,0.30);
  p.set('forearmR',-0.80,0,-0.30);
  p.set('thighL',0.55+sin(t)*0.28,0,0.10);
  p.set('thighR',0.55+sin(t+PI)*0.28,0,-0.10);
  p.set('shinL',0.60,0,0);p.set('shinR',0.60,0,0);
  p.set('chest',-0.08,0,0);
  return p;
};

/* ---------------- emotes ---------------- */
C.wave=function(p,ph,pr){
  C.idle(p,ph*0.4,pr);
  var t=M.clamp(ph,0,1);
  var up=ease(M.clamp(t/0.2,0,1))*(1-ease(M.clamp((t-0.78)/0.22,0,1)));
  p.set('armR',-2.35*up,0,-0.30-up*0.42);
  p.set('forearmR',-0.55-up*0.42,0,-0.20);
  p.set('handR',0,0,-0.12+sin(t*TAU*3.2)*0.55*up);
  p.set('chest',-0.04,-0.14*up,0);
  p.set('head',0.02,-0.16*up,0.04*up);
  return p;
};
C.celebrate=function(p,ph,pr){
  p.clear();
  var t=ph*TAU;
  var hop=Math.max(0,sin(t*2));
  p.rootY=hop*0.16;
  p.set('armL',-2.55+sin(t*2)*0.24,0,0.55);
  p.set('armR',-2.55+sin(t*2+0.4)*0.24,0,-0.55);
  p.set('forearmL',-0.30,0,0.18);
  p.set('forearmR',-0.30,0,-0.18);
  p.set('chest',-0.18,sin(t)*0.12,0);
  p.set('head',-0.16,sin(t)*0.18,0);
  p.set('thighL',-0.10-hop*0.30,0,0.08);
  p.set('thighR',-0.10-hop*0.26,0,-0.08);
  p.set('shinL',0.20+hop*0.55,0,0);
  p.set('shinR',0.20+hop*0.50,0,0);

  idle:      {clip:'idle',      period:4.2,  loop:true,  blend:0.28, pri:0},
  locomote:  {clip:'locomote',  period:1.0,  loop:true,  blend:0.18, pri:0},
  jump:      {clip:'jump',      period:0.42, loop:false, blend:0.10, pri:2, next:'fall'},
  fall:      {clip:'fall',      period:1.6,  loop:true,  blend:0.20, pri:1},
  land:      {clip:'land',      period:0.34, loop:false, blend:0.07, pri:2, next:'idle'},
  swim:      {clip:'swim',      period:1.5,  loop:true,  blend:0.30, pri:1},
  tread:     {clip:'tread',     period:2.4,  loop:true,  blend:0.30, pri:1},
  mine:      {clip:'mine',      period:0.72, loop:false, blend:0.10, pri:3, next:'idle'},
  build:     {clip:'build',     period:0.54, loop:false, blend:0.10, pri:3, next:'idle'},
  attack:    {clip:'attack',    period:0.58, loop:false, blend:0.08, pri:3, next:'idle'},
  fishCast:  {clip:'fishCast',  period:0.85, loop:false, blend:0.16, pri:3, next:'fishWait'},
  fishWait:  {clip:'fishWait',  period:5.0,  loop:true,  blend:0.30, pri:3},
  fishReel:  {clip:'fishReel',  period:1.1,  loop:true,  blend:0.16, pri:4},
  hurt:      {clip:'hurt',      period:0.40, loop:false, blend:0.06, pri:5, next:'idle'},
  wave:      {clip:'wave',      period:1.6,  loop:false, blend:0.22, pri:3, next:'idle'},
  celebrate: {clip:'celebrate', period:1.5,  loop:true,  blend:0.24, pri:3},
  dance:     {clip:'dance',     period:2.0,  loop:true,  blend:0.30, pri:3},
  sit:       {clip:'sit',       period:6.0,  loop:true,  blend:0.34, pri:3},
  laugh:     {clip:'laugh',     period:1.15, loop:true,  blend:0.20, pri:3},
  clap:      {clip:'clap',      period:0.62, loop:true,  blend:0.18, pri:3},
  point:     {clip:'point',     period:1.5,  loop:false, blend:0.18, pri:3, next:'idle'}

Rig.STATES=STATES;
/* Order is the wheel's order, clockwise from the top. */
Rig.EMOTES=['wave','dance','laugh','celebrate','clap','point','sit'];

function Anim(){
  this.state='idle';
  this.phase=0;
  this.prev='idle';
  this.prevPhase=0;
  this.blend=1;         /* 1 = fully in `state` */
  this.blendRate=1;
  this.params={speed:0};
  this.a=new Pose();
  this.b=new Pose();
  this.out=new Pose();
  this.done=false;
}
Rig.Anim=function(){return new Anim();};

Anim.prototype.play=function(name,force){
  if(!STATES[name])return this;
  if(this.state===name&&!force)return this;
  var cur=STATES[this.state],nxt=STATES[name];
  /* A lower-priority state cannot interrupt a running one-shot; that is
     what stops a stray movement key from cancelling a swing mid-strike. */
  if(!force&&cur&&!cur.loop&&!this.done&&nxt.pri<cur.pri)return this;
  this.prev=this.state;this.prevPhase=this.phase;
  this.state=name;this.phase=0;this.done=false;
  this.blend=0;
  this.blendRate=1/Math.max(0.016,nxt.blend);
  return this;
};

Anim.prototype.update=function(dt){
  var st=STATES[this.state];
  if(!st)return this.out;
  this.phase+=dt/st.period;
  if(this.phase>=1){
    if(st.loop)this.phase%=1;
    else{
      this.phase=1;
      if(!this.done){
        this.done=true;
        if(st.next)this.play(st.next);
      }
    }
  }
  if(this.blend<1){
    this.blend=Math.min(1,this.blend+dt*this.blendRate);
    var pst=STATES[this.prev];
    if(pst){
      this.prevPhase+=dt/pst.period;
      if(pst.loop)this.prevPhase%=1;else this.prevPhase=Math.min(1,this.prevPhase);
    }
  }

  C2[st.clip](this.b,this.phase,this.params);
  if(this.blend>=1)return this.out.copyFrom(this.b);
  var pst2=STATES[this.prev];
  C2[pst2?pst2.clip:'idle'](this.a,this.prevPhase,this.params);
  return Pose.blend(this.out,this.a,this.b,M.smooth(this.blend));

/* ---------------- posing ----------------
   Walk the hierarchy once, writing each bone's world matrix. Parents
   always precede children in BONES, so a single forward pass is
   enough — no recursion, no sort. */

  for(var i=0;i<NB;i++){

      REST[i*3+1]+pose.off[i*3+1],
      REST[i*3+2]+pose.off[i*3+2]);

   The one thing that gives a character away as pasted onto the terrain
   rather than standing on it. On a slope both feet sit at the body's
   ground height, so the downhill one hangs in the air and the uphill
   one is buried to the ankle.

   The fix is not to drive the feet to the ground — that would delete
   the walk cycle and leave a figure gliding on stiff legs. It is to
   keep the lift the animation asked for and measure it from the ground
   under *that foot* instead of the ground under the body. On flat
   ground the solve reproduces the clip almost exactly, which is also
   how you know the angle conventions are right. */

Rig.footIK=function(actor,pose,groundAt,dt){
  var want=actor.grounded?1:0;
  var w=actor.ikW||0;
  w+=(want-w)*Math.min(1,dt*9);
  actor.ikW=w;
  if(w<0.02)return false;

  var sc=actor.scale||1;
  var L1=P.thigh*sc, L2=P.shin*sc;
  var yaw=actor.facing+pose.rootYaw;
  var cy=Math.cos(yaw), sy=Math.sin(yaw);
  var baseY=actor.pos[1];

  var hxA=[],hyA=[],hzA=[],txA=[],tyA=[],tzA=[],drop=0,i;
  for(i=0;i<2;i++){
    var tm=actor.mats[NAME[LEGS[i][0]]];
    var fm=actor.mats[NAME[LEGS[i][2]]];
    hxA[i]=tm[12];hyA[i]=tm[13];hzA[i]=tm[14];
    var g=groundAt(fm[12],fm[14]);
    txA[i]=fm[12];tzA[i]=fm[14];
    /* Keep the animation's lift; move the floor under it. */
    tyA[i]=g+(fm[13]-baseY);
    var need=g-baseY;
    if(need<drop)drop=need;

     the whole body off the ground it is standing on. */
  drop=Math.max(drop,-0.34*sc)*w;

  for(var j=0;j<2;j++){
    var vx=txA[j]-hxA[j], vy=tyA[j]-(hyA[j]+drop), vz=tzA[j]-hzA[j];
    /* Undo the body's facing so the solve happens in the plane the
       leg bones actually rotate in. */
    var lx=vx*cy-vz*sy;
    var lz=vx*sy+vz*cy;
    var d=Math.sqrt(lx*lx+vy*vy+lz*lz);
    /* Never fully straight: at exactly L1+L2 the knee angle is a
       singularity and the joint flickers between the two solutions. */
    d=M.clamp(d,Math.abs(L1-L2)+0.02,L1+L2-0.012);
    var a2=Math.acos(M.clamp((L1*L1+L2*L2-d*d)/(2*L1*L2),-1,1));
    var a1=Math.acos(M.clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));

       on a thigh swings the leg forward in this rig, and the knee
       bends forward, so the thigh leads the line by a1. */

    r[fi]  +=(-(thighX+shinX)-r[fi])*w;
  }

  return true;
};

   LH.Body — the character's meshes.

   One mesh per bone-part, built once and drawn instanced, so a plaza
   with forty people costs the same number of draw calls as one
   person. Colour comes from the per-instance tint, which is why the
   geometry is painted in greys: white takes the tint at full
   strength, darker vertices read as the part's own shading and

   renderer — it is a mesh bound to the chest bone.

function part(key,fn,maxInst){
  var hit=cache[key];

   jaw can each have their own width. A sphere with a face stuck on it
   is the single clearest tell of programmer-art character work. */
Body.head=function(){
  return part('head',function(b){
    b.mat('blank');
    b.push();b.scale(P.headScale,P.headScale,P.headScale);
    var n=14;
    /* cross-sections from under the chin up over the crown */
    var secs=[
      {y:-0.118,pts:Geo.roundRect(0.076,0.090,0.033,n)},  /* chin    */
      {y:-0.078,pts:Geo.roundRect(0.126,0.144,0.050,n)},  /* jaw     */
      {y:-0.036,pts:Geo.roundRect(0.166,0.180,0.063,n)},  /* cheek   */
      {y: 0.005,pts:Geo.roundRect(0.185,0.196,0.076,n)},  /* eyeline */
      {y: 0.048,pts:Geo.roundRect(0.192,0.200,0.087,n)},  /* brow    */
      {y: 0.094,pts:Geo.roundRect(0.185,0.196,0.089,n)},
      {y: 0.131,pts:Geo.roundRect(0.152,0.163,0.076,n)},
      {y: 0.155,pts:Geo.roundRect(0.091,0.100,0.046,n)}   /* crown   */

      {y: 0.052,pts:[[0.011,-0.004],[0.011,0.018],[-0.011,0.018],[-0.011,-0.004]]},

         the geometry is emitted does nothing at all */
      b.scale(0.38,1,0.78);
      b.sphere(0,0,0,0.029,8,6,MID,{squash:1.40});
      b.pop();
    }

    b.push();b.translate(0,-0.056,0.100);
    b.chamfer(0,0,0,0.054,0.015,0.015,DARK,0.005,{noBand:true});b.pop();

/* Eyes are their own part so they can be tinted per player without

Body.eyes=function(){
  return part('eyes',function(b){
    b.mat('blank');
    b.push();b.scale(P.headScale,P.headScale,P.headScale);
    for(var s=-1;s<=1;s+=2){

      b.push();b.translate(s*0.052,0.042,0.099);b.rotate(0,s*-0.16,s*0.10);
      b.chamfer(0,0,0,0.056,0.013,0.014,LIT,0.004,{noBand:true});
      b.pop();
    }

  });

/* ---------------- torso ---------------- */
Body.chest=function(kind){
  kind=kind||'base';
  return part('chest:'+kind,function(b){
    b.mat('blank');
    var n=16;
    var bulk=kind==='bulk'?1.10:(kind==='slim'?0.93:1.0);
    /* The chest bone sits at 1.36 m and the hips mesh tops out at
       1.07 m, so this loft has to reach down past its own bone to
       close the abdomen — otherwise the figure has a hole at the
       waist that clothing does not cover either. */
    var secs=[
      {y:-0.31,pts:Geo.roundRect(0.252*bulk,0.158*bulk,0.062,n)},  /* pelvis   */
      {y:-0.22,pts:Geo.roundRect(0.268*bulk,0.164*bulk,0.066,n)},  /* belly    */
      {y:-0.12,pts:Geo.roundRect(0.278*bulk,0.170*bulk,0.068,n)},  /* waist    */
      {y:-0.02,pts:Geo.roundRect(0.290*bulk,0.176*bulk,0.070,n)},
      {y: 0.04,pts:Geo.roundRect(0.318*bulk,0.188*bulk,0.078,n)},  /* ribs     */
      {y: 0.09,pts:Geo.roundRect(0.360*bulk,0.206*bulk,0.086,n)},  /* pecs     */
      /* The shoulder bones sit at chest-space y = 0.13, i.e. 1.49 m.
         The loft has to peak there and fall away, because the chin is
         at 1.565 m — an earlier version topped out at 1.66 and the
         torso quietly ate the character's jaw. */
      {y: 0.13,pts:Geo.roundRect(0.386*bulk,0.208*bulk,0.092,n)},  /* shoulder */
      {y: 0.163,pts:Geo.roundRect(0.300*bulk,0.180*bulk,0.078,n)},
      {y: 0.186,pts:Geo.roundRect(0.176,0.148,0.060,n)}            /* neck base*/
    ];
    b.loft(secs,LIT,{});
    /* Collarbone shelf and a shallow sternum line: two small pieces of
       geometry that stop the chest reading as a barrel. */
    b.push();b.translate(0,0.140,0.068);
    b.chamfer(0,0,0,0.246,0.015,0.028,MID,0.007,{noBand:true});b.pop();
    b.push();b.translate(0,0.055,0.098);
    b.chamfer(0,0,0,0.013,0.120,0.014,LOW,0.005,{noBand:true});b.pop();
    /* shoulder blades */
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.104,0.078,-0.086);b.rotate(0,0,s*0.2);
      b.chamfer(0,0,0,0.106,0.120,0.018,MID,0.010,{noBand:true});b.pop();
    }
  });
};

    b.push();b.translate(0,0.040,-0.024);

    b.chamfer(0,0,0,0.086,0.044,0.052,MID,0.016);b.pop();
  });

/* ---------------- garments ----------------
   Garments are slightly inflated copies of the body parts they cover.
   Building them from the same profiles guarantees they never clip
   through, which is the failure mode that makes layered clothing
   look cheap. */
function inflate(pts,amt){
  var out=[];
  for(var i=0;i<pts.length;i++){
    var x=pts[i][0],z=pts[i][1];
    var l=Math.hypot(x,z)||1;
    out.push([x+x/l*amt,z+z/l*amt]);
  }
  return out;
}

Body.shirt=function(style){
  style=style||'tee';
  return part('shirt:'+style,function(b){
    b.mat('fabric');
    var n=16,inf=0.014;
    var lowY=style==='crop'?0.06:-0.27;
    var secs=[
      {y:lowY,   pts:inflate(Geo.roundRect(
         style==='crop'?0.312:0.264,style==='crop'?0.186:0.166,0.066,n),inf+0.004)},
      {y:-0.12,  pts:inflate(Geo.roundRect(0.280,0.172,0.068,n),inf)},
      {y:-0.02,  pts:inflate(Geo.roundRect(0.292,0.178,0.070,n),inf)},
      {y: 0.04,  pts:inflate(Geo.roundRect(0.320,0.190,0.078,n),inf)},
      {y: 0.09,  pts:inflate(Geo.roundRect(0.362,0.208,0.086,n),inf)},
      {y: 0.13,  pts:inflate(Geo.roundRect(0.388,0.210,0.092,n),inf)},
      {y: 0.163, pts:inflate(Geo.roundRect(0.302,0.182,0.078,n),inf)},
      {y: 0.184, pts:inflate(Geo.roundRect(0.192,0.156,0.062,n),inf)}
    ];
    b.loft(secs,LIT,{openTop:true,uvScale:2});
    if(style==='jacket'){
      /* lapels and a front seam */
      b.mat('fabric');
      for(var s=-1;s<=1;s+=2){
        b.push();b.translate(s*0.050,0.085,0.112);b.rotate(0.12,0,s*0.30);
        b.chamfer(0,0,0,0.066,0.130,0.018,MID,0.008,{noBand:true});b.pop();
      }
      b.push();b.translate(0,0.020,0.114);
      b.chamfer(0,0,0,0.014,0.200,0.016,DEEP,0.005,{noBand:true});b.pop();
      /* Collar. It stops at 0.176 in chest space (1.539 m) — anything
         taller and the jacket eats the jaw. */
      b.push();b.translate(0,0.150,0.026);
      b.loft([
        {y:0,    pts:inflate(Geo.roundRect(0.200,0.164,0.064,14),0.010)},
        {y:0.026,pts:inflate(Geo.roundRect(0.216,0.176,0.070,14),0.016)}
      ],MID,{openTop:true,openBottom:true});
      b.pop();
    }
    if(style==='hoodie'){
      b.mat('fabric');
      b.push();b.translate(0,0.170,-0.076);b.rotate(-0.30,0,0);
      b.sphere(0,0,0,0.132,12,9,MID,{squash:0.72});b.pop();
      b.push();b.translate(0,-0.030,0.116);
      b.chamfer(0,0,0,0.188,0.066,0.020,MID,0.010,{noBand:true});b.pop();
    }
  });
};

Body.sleeve=function(which){
  return part('sleeve:'+which,function(b){
    b.mat('fabric');
    /* Derived from the arm bone rather than written out: a sleeve that
       is longer than the arm inside it is the one clothing bug you
       cannot see until someone raises their hand. */
    var len=which==='long'?P.armUp+0.01:P.armUp*0.58;
    b.limb(len,0.074*FAT,(which==='long'?0.052:0.064)*FAT,LIT,
      {seg:10,steps:5,joint:false,uvScale:2});
    /* shoulder cap, so the deltoid does not show a ring of skin */
    b.sphere(0,0.006,0,0.072*FAT,10,7,LIT);
    /* a cuff, so the sleeve ends in something rather than stopping */
    b.push();b.translate(0,-len,0);
    b.loft([
      {y:-0.014,pts:Geo.circle((which==='long'?0.050:0.062)*FAT,10)},
      {y: 0.010,pts:Geo.circle((which==='long'?0.052:0.064)*FAT,10)}
    ],MID,{openTop:true,openBottom:true});
    b.pop();
  });
};

/* Lower leg, for anything that reaches past the knee. Split from the

/* ---------------- hair ---------------- */
var HAIR_BUILD={
  crop:function(b){
    /* The cap starts above the eyebrows. It cannot simply be a taller
       ring, because the same ring that covers the nape at the back
       would cut across the face at the front. */
    b.loft([
      {y: 0.026,pts:Geo.roundRect(0.180,0.192,0.084,14)},
      {y: 0.062,pts:Geo.roundRect(0.192,0.202,0.090,14)},
      {y: 0.104,pts:Geo.roundRect(0.186,0.196,0.086,14)},
      {y: 0.138,pts:Geo.roundRect(0.150,0.160,0.072,14)},
      {y: 0.162,pts:Geo.roundRect(0.080,0.086,0.038,14)}
    ],LIT,{openBottom:true});
    /* Back and sides, dropped to the nape. The front half of each ring
       is pulled back behind the ears so it never crosses the face. */
    var back=[];
    for(var i=0;i<4;i++){
      var t=i/3, y=-0.062+t*0.096;
      var pts=Geo.roundRect(0.176+t*0.014,0.190+t*0.012,0.082,14);
      for(var j=0;j<pts.length;j++)
        if(pts[j][1]>-0.010)pts[j][1]=-0.010-Math.max(0,pts[j][1])*0.16;
      back.push({y:y,pts:pts});
    }
    b.loft(back,LIT,{openTop:true,openBottom:true});
    /* A fringe swept off a parting. Spheres, not slabs — a flat plank
       at the hairline reads as a headband bolted to the forehead. */
    var sweep=[[0.052,0.076,0.058,0.062,0.26],[0.012,0.084,0.066,0.058,0.20],
               [-0.030,0.082,0.062,0.054,-0.18],[-0.066,0.072,0.050,0.046,-0.30]];
    for(var f=0;f<sweep.length;f++){
      var S=sweep[f];
      b.push();b.translate(S[0],S[1],S[2]);b.rotate(0.30,S[4],S[4]*0.7);
      b.scale(1.15,0.52,1.0);
      b.sphere(0,0,0,S[3],9,7,MID);b.pop();
    }
  },
  swept:function(b){
    HAIR_BUILD.crop(b);
    /* volume pushed back and up on one side */
    b.push();b.translate(0.014,0.126,-0.024);b.rotate(-0.20,0.10,0.12);
    b.sphere(0,0,0,0.104,12,9,LIT,{squash:0.68});b.pop();
    b.push();b.translate(-0.078,0.100,0.020);b.rotate(0,0,-0.42);
    b.sphere(0,0,0,0.058,10,8,MID,{squash:1.2});b.pop();
  },
  long:function(b){
    HAIR_BUILD.crop(b);
    /* two curtains down the back, tapering and flaring out */
    b.push();b.translate(0,0.020,-0.060);
    b.loft([
      {y:-0.300,pts:Geo.roundRect(0.170,0.120,0.055,12)},
      {y:-0.190,pts:Geo.roundRect(0.208,0.140,0.062,12)},
      {y:-0.070,pts:Geo.roundRect(0.216,0.156,0.068,12)},
      {y: 0.040,pts:Geo.roundRect(0.200,0.170,0.070,12)}
    ],LIT,{openTop:true});
    b.pop();
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.096,-0.060,0.032);b.rotate(0,0,s*0.10);
      b.chamfer(0,0,0,0.052,0.230,0.070,MID,0.024);b.pop();
    }
  },
  bun:function(b){
    HAIR_BUILD.crop(b);
    b.push();b.translate(0,0.156,-0.078);
    b.sphere(0,0,0,0.078,12,9,LIT,{squash:0.92});
    b.sphere(0.034,0.020,0.020,0.040,10,8,MID);b.pop();
  },
  spiked:function(b){
    HAIR_BUILD.crop(b);
    var rng=M.rng(41);
    for(var i=0;i<11;i++){
      var a=rng()*M.TAU,r=0.02+rng()*0.088;
      var x=Math.cos(a)*r,z=Math.sin(a)*r*1.05;
      b.push();
      b.translate(x,0.128+rng()*0.02,z);
      b.rotate(z*2.6,0,-x*2.6);
      b.cylinder(0,0.040,0,0.028,0.002,0.090,6,i%2?LIT:MID);
      b.pop();
    }
  },
  braids:function(b){
    HAIR_BUILD.crop(b);
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.094,0.020,-0.010);
      for(var i=0;i<5;i++){
        b.push();
        b.translate(s*i*0.010,-0.060*i,0.004*i);
        b.sphere(0,0,0,0.042-i*0.004,9,7,i%2?LIT:MID,{squash:0.9});
        b.pop();
      }
      b.pop();
    }
  },
  bald:function(b){}
};
Body.HAIR=Object.keys(HAIR_BUILD);
/* Hair and hats are authored against a reference skull and scaled onto
   the real one here, so changing the head's profile does not mean
   re-measuring eleven hairstyles by hand. */
/* Hair and hats were modelled against the original skull. They are
   scaled to fit it, and now also by the cartoon head scale, so growing
   the head does not bury every hairstyle inside it. */
var HEAD_FIT=[1.085*P.headScale,1.060*P.headScale,1.085*P.headScale];
Body.hair=function(style){
  style=HAIR_BUILD[style]?style:'crop';
  return part('hair:'+style,function(b){
    b.mat('blank');
    b.push();b.scale(HEAD_FIT[0],HEAD_FIT[1],HEAD_FIT[2]);
    HAIR_BUILD[style](b);
    b.pop();
  });
};

    ],MID,{});
    b.pop();
    b.push();b.translate(0,0.100,0);
    b.loft([
      {y:0,     pts:Geo.roundRect(0.206,0.212,0.094,14)},
      {y:0.030, pts:Geo.roundRect(0.206,0.212,0.094,14)}
    ],DARK,{openTop:true,openBottom:true});
    b.pop();
  },
  crown:function(b){
    /* band */
    b.mat('gold');
    b.loft([
      {y:0.030,pts:Geo.roundRect(0.198,0.204,0.092,16)},
      {y:0.100,pts:Geo.roundRect(0.202,0.208,0.094,16)}
    ],LIT,{openTop:true,openBottom:true});
    /* five points, tallest at the front */
    for(var i=0;i<5;i++){
      var a=(-0.5+i/4)*2.0;
      var tall=0.062+Math.cos(a)*0.040;
      b.push();
      b.translate(Math.sin(a)*0.100,0.100,Math.cos(a)*0.104);
      b.rotate(0,a,0);
      b.extrude([[-0.030,0],[0.030,0],[0,tall]],0.020,LIT);
      b.pop();
      /* a set jewel at each point's base */
      b.mat('crystal',0.30);
      b.push();
      b.translate(Math.sin(a)*0.104,0.070,Math.cos(a)*0.108);
      b.sphere(0,0,0,0.017,8,6,LIT,{squash:0.8});
      b.pop();
      b.mat('gold');
    }
  },
  halo:function(b){
    /* a ring of overlapping emissive beads reads as a torus at this
       size and costs a fraction of one */
    b.mat('neon',1.0);
    b.push();b.translate(0,0.230,0);
    for(var k=0;k<26;k++){
      var a=k/26*M.TAU;
      b.push();
      b.translate(Math.cos(a)*0.145,0,Math.sin(a)*0.145);
      b.sphere(0,0,0,0.016,6,5,LIT);
      b.pop();
    }
    b.pop();
  },
  visor:function(b){
    b.mat('panel');
    b.loft([
      {y:0.030,pts:Geo.roundRect(0.204,0.210,0.094,14)},
      {y:0.096,pts:Geo.roundRect(0.200,0.206,0.092,14)},
      {y:0.150,pts:Geo.roundRect(0.160,0.166,0.074,14)}
    ],LIT,{openBottom:true});
    b.mat('neon',0.85);
    b.push();b.translate(0,0.026,0.108);b.rotate(-0.10,0,0);
    b.chamfer(0,0,0,0.216,0.040,0.036,LIT,0.014,{noBand:true});b.pop();
  },
  none:function(b){}
};
Body.HATS=Object.keys(HAT_BUILD);
