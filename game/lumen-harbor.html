    for(var e=0;e<4;e++){
      var c0=corners[e],c1=corners[(e+1)%4];
      var sx0=c0[0],sz0=c0[1],sx1=c1[0],sz1=c1[1];
      var n0x=sx0*0.7071,n0z=sz0*0.7071,n1x=sx1*0.7071,n1z=sz1*0.7071;
      var A=V(x+sx0*hw,y-(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,0);
      var B=V(x+sx1*(hw-b),y-(hh-b),z+sz1*hd,n1x,0,n1z,1,0);
      var C=V(x+sx1*(hw-b),y+(hh-b),z+sz1*hd,n1x,0,n1z,1,1);
      var D=V(x+sx0*hw,y+(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,1);
      /* winding depends on which quadrant we are in */
      if((sx0*sz1-sz0*sx1)>0)this.quad(A,B,C,D);else this.quad(A,D,C,B);
    }
  }
  return this;
};

/* A subdivided plane in XZ. `fn(x,z,u,v)` may return {y,c,layer} to
   displace and recolour it, which is how terrain, riverbeds and
   plaza slopes are all built from the same call. Normals come from
   central differences on the displaced height rather than the flat
   (0,1,0), or hills would light as if they were level ground. */
Builder.prototype.plane=function(x,y,z,w,d,c,segs,uvScale,fn){
  segs=segs||1;uvScale=uvScale===undefined?1:uvScale;
  var col=col3(c),base=this.n;
  var hs=null,cols=null,lays=null;
  var stride=segs+1;
  if(fn){hs=new Float32Array(stride*stride);}
  var i,j;
  /* first pass: sample, so normals can look at their neighbours */
  if(fn){
    cols=new Array(stride*stride);lays=new Array(stride*stride);
    for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
      var px0=x+(i/segs-0.5)*w,pz0=z+(j/segs-0.5)*d;
      var r=fn(px0,pz0,i/segs,j/segs);
      var k=j*stride+i;
      hs[k]=(r&&r.y!==undefined)?r.y:y;
      cols[k]=(r&&r.c)?col3(r.c):col;
      lays[k]=(r&&r.layer!==undefined)?r.layer:null;
    }
  }
  var dx=w/segs,dz=d/segs;
  var savedLayer=this.layer;
  for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
    var fx=i/segs,fz=j/segs;
    var px=x+(fx-0.5)*w,pz=z+(fz-0.5)*d,py=y;
    var cc=col,nx=0,ny=1,nz=0;
    if(fn){
      var kk=j*stride+i;
      py=hs[kk];cc=cols[kk];
      if(lays[kk]!==null)this.layer=lays[kk];
      var hL=hs[j*stride+Math.max(0,i-1)],hR=hs[j*stride+Math.min(segs,i+1)];
      var hD=hs[Math.max(0,j-1)*stride+i],hU=hs[Math.min(segs,j+1)*stride+i];
      var spanX=(Math.min(segs,i+1)-Math.max(0,i-1))*dx;
      var spanZ=(Math.min(segs,j+1)-Math.max(0,j-1))*dz;
      nx=-(hR-hL)/(spanX||dx);
      nz=-(hU-hD)/(spanZ||dz);
      ny=1;
      var nl=Math.sqrt(nx*nx+1+nz*nz);
      nx/=nl;ny/=nl;nz/=nl;
    }
    this.vert(px,py,pz,nx,ny,nz,fx*uvScale,fz*uvScale,cc);
    if(fn)this.layer=savedLayer;
  }
  /* Wind counter-clockwise seen from above: a→(x0,z1)→(x1,z1)→(x1,z0)
     puts the face normal at +Y. The obvious ordering gives -Y and the
     whole surface vanishes into the back-face cull. */
  for(var jj=0;jj<segs;jj++)for(var ii=0;ii<segs;ii++){
    var a=base+jj*stride+ii,b=a+1,cq=a+stride,d2=cq+1;
    this.quad(a,cq,d2,b);
  }
  return this;
};

Builder.prototype.cylinder=function(x,y,z,r0,r1,h,seg,c,o){
  o=o||{};seg=seg||12;
  var col=col3(c),hh=h/2,base=this.n;
  var slope=(r0-r1)/h;
  for(var i=0;i<=seg;i++){
    var a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a);
    var nl=Math.sqrt(1+slope*slope);
    var nx=ca/nl,ny=slope/nl,nz=sa/nl;
    this.vert(x+ca*r0,y-hh,z+sa*r0,nx,ny,nz,i/seg*(o.uvScale||1),0,col);
    this.vert(x+ca*r1,y+hh,z+sa*r1,nx,ny,nz,i/seg*(o.uvScale||1),(o.uvScale||1),col);
  }
  /* same winding rule as loft: up the wall first, then around */
  for(var k=0;k<seg;k++){
    var p=base+k*2;
    this.quad(p,p+1,p+3,p+2);
  }
  if(!o.open){
    if(r1>1e-5){
      var ct=this.vert(x,y+hh,z,0,1,0,.5,.5,col),t0=this.n;
      for(var t=0;t<=seg;t++){var aa=t/seg*TAU;
        this.vert(x+Math.cos(aa)*r1,y+hh,z+Math.sin(aa)*r1,0,1,0,
          Math.cos(aa)*.5+.5,Math.sin(aa)*.5+.5,col);}
      for(var t2=0;t2<seg;t2++)this.tri(ct,t0+t2+1,t0+t2);
    }
    if(r0>1e-5){
      var cb=this.vert(x,y-hh,z,0,-1,0,.5,.5,col),b0=this.n;
      for(var u=0;u<=seg;u++){var ab=u/seg*TAU;
        this.vert(x+Math.cos(ab)*r0,y-hh,z+Math.sin(ab)*r0,0,-1,0,
          Math.cos(ab)*.5+.5,Math.sin(ab)*.5+.5,col);}
      for(var u2=0;u2<seg;u2++)this.tri(cb,b0+u2,b0+u2+1);
    }
  }
  return this;
};

Builder.prototype.sphere=function(x,y,z,r,seg,rings,c,o){
  o=o||{};seg=seg||14;rings=rings||10;
  var col=col3(c),base=this.n;
  var sy=o.squash||1;
  for(var j=0;j<=rings;j++){
    var v=j/rings,phi=v*Math.PI,sp=Math.sin(phi),cp=Math.cos(phi);
    for(var i=0;i<=seg;i++){
      var u=i/seg,th=u*TAU,st=Math.sin(th),ct=Math.cos(th);
      var nx=sp*ct,ny=cp,nz=sp*st;
      this.vert(x+nx*r,y+ny*r*sy,z+nz*r,nx,ny/sy,nz,u,v,col);
    }
  }
  for(var jj=0;jj<rings;jj++)for(var ii=0;ii<seg;ii++){
    var a=base+jj*(seg+1)+ii,b=a+seg+1;
    this.quad(a,a+1,b+1,b);
  }
  return this;
};

/* A capsule is the character's collision shape and also, squashed and
   coloured, most of a limb. */
Builder.prototype.capsule=function(x,y,z,r,h,seg,c){
  seg=seg||10;
  var half=Math.max(0,h/2-r);
  this.cylinder(x,y,z,r,r,half*2,seg,c,{open:true});
  this.push().translate(x,y+half,z).scale(1,1,1);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  this.push().translate(x,y-half,z);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  return this;
};

/* Sweep a 2D outline into a solid. This is how railings, rooftops,
   boat hulls and sign frames get made without hand-listing vertices. */
Builder.prototype.extrude=function(pts,depth,c,o){
  o=o||{};
  var col=col3(c),hd=depth/2,n=pts.length,base=this.n;
  /* front + back caps via fan from the centroid — outlines here are
     always convex or near enough that a fan is safe */
  var cx=0,cy=0;
  for(var i=0;i<n;i++){cx+=pts[i][0];cy+=pts[i][1];}
  cx/=n;cy/=n;
  var fc=this.vert(cx,cy,hd,0,0,1,.5,.5,col);
  for(var a=0;a<n;a++)this.vert(pts[a][0],pts[a][1],hd,0,0,1,pts[a][0],pts[a][1],col);
  var bc=this.vert(cx,cy,-hd,0,0,-1,.5,.5,col);
  for(var b=0;b<n;b++)this.vert(pts[b][0],pts[b][1],-hd,0,0,-1,pts[b][0],pts[b][1],col);
  var f0=fc+1,b0=bc+1;
  for(var k=0;k<n;k++){
    var k2=(k+1)%n;
    this.tri(fc,f0+k,f0+k2);
    this.tri(bc,b0+k2,b0+k);
  }
  /* the side wall */
  for(var s=0;s<n;s++){
    var s2=(s+1)%n;
    var dx=pts[s2][0]-pts[s][0],dy=pts[s2][1]-pts[s][1];
    var l=Math.hypot(dx,dy)||1;
    var nx=dy/l,ny=-dx/l;
    var A=this.vert(pts[s][0],pts[s][1],hd,nx,ny,0,0,0,col);
    var B=this.vert(pts[s2][0],pts[s2][1],hd,nx,ny,0,l,0,col);
    var C=this.vert(pts[s2][0],pts[s2][1],-hd,nx,ny,0,l,depth,col);
    var D=this.vert(pts[s][0],pts[s][1],-hd,nx,ny,0,0,depth,col);
    this.quad(A,D,C,B);
  }
  return this;
};

/* ---------------- lofting ----------------
   Stitch a stack of cross-sections into a surface. This is the single
   most useful builder in the file: torsos, limbs, boat hulls, tree
   trunks, fish and rooftops are all a list of outlines at increasing
   heights. Every section needs the same point count so the rings
   correspond; the helpers below all take `n` for exactly that reason. */

/* a circle, for limbs and trunks */
Geo.circle=function(r,n,sx,sz){
  sx=sx===undefined?1:sx;sz=sz===undefined?1:sz;
  var out=[];
  for(var i=0;i<n;i++){
    var a=i/n*TAU;
    out.push([Math.cos(a)*r*sx,Math.sin(a)*r*sz]);
  }
  return out;
};
/* a rounded rectangle, for torsos and anything built rather than grown */
Geo.roundRect=function(w,d,r,n){
  var hw=Math.max(0.0001,w/2-r),hd=Math.max(0.0001,d/2-r);
  var out=[],per=Math.max(1,Math.floor(n/4));
  var corners=[[hw,hd,0],[-hw,hd,Math.PI/2],[-hw,-hd,Math.PI],[hw,-hd,-Math.PI/2]];
  for(var c=0;c<4;c++){
    var cc=corners[c];
    for(var i=0;i<per;i++){
      var a=cc[2]+(i/per)*(Math.PI/2);
      out.push([cc[0]+Math.cos(a)*r,cc[1]+Math.sin(a)*r]);
    }
  }
  /* pad to exactly n so sections always line up */
  while(out.length<n)out.push(out[out.length-1].slice());
  return out.slice(0,n);
};

/* `sections` is [{y, pts:[[x,z]...], scale?, col?}]. Normals come from
   the surface itself — the ring tangent crossed with the rise to the
   next ring — so a taper lights correctly instead of like a cylinder. */
Builder.prototype.loft=function(sections,c,o){
  o=o||{};
  var col=col3(c),n=sections[0].pts.length,rings=sections.length;
  var base=this.n,i,j;
  /* Sections may be listed bottom-up (a torso) or top-down (a limb
     hanging from its pivot). Rather than make every caller remember
     which way round to write them, detect the direction and flip the
     winding to match — otherwise half the meshes in the game face
     inward and vanish into the back-face cull. */
  var up=(sections[rings-1].y>=sections[0].y);
  var uvScale=o.uvScale||1;
  for(j=0;j<rings;j++){
    var S=sections[j],pts=S.pts,cc=S.col?col3(S.col):col;
    var sc=S.scale===undefined?1:S.scale;
    /* rise toward the neighbouring ring, used for the normal's tilt */
    var prev=sections[Math.max(0,j-1)],next=sections[Math.min(rings-1,j+1)];
    var dy=(next.y-prev.y)||1;
    for(i=0;i<n;i++){
      var px=pts[i][0]*sc,pz=pts[i][1]*sc;
      /* ring tangent */
      var a=pts[(i+1)%n],b=pts[(i-1+n)%n];
      var tx=(a[0]-b[0])*sc,tz=(a[1]-b[1])*sc;
      /* radial outward */
      var rx=px,rz=pz;
      var rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
      /* how much the profile grows between neighbouring rings decides
         how far the normal tips up or down */
      var pn=next.pts[i],pp=prev.pts[i];
      var nsc=next.scale===undefined?1:next.scale,psc=prev.scale===undefined?1:prev.scale;
      var dr=Math.hypot(pn[0]*nsc,pn[1]*nsc)-Math.hypot(pp[0]*psc,pp[1]*psc);
      var ny=-dr/dy;
      var nx=rx,nz=rz;
      var nl=Math.hypot(nx,ny,nz)||1;
      this.vert(px,S.y,pz,nx/nl,ny/nl,nz/nl,i/n*uvScale,S.y*uvScale,cc);
    }
  }
  /* Wind along the stack before going around the ring: sections from
     Geo.circle/roundRect run counter-clockwise in XZ, so the reverse
     order puts every face normal on the inside. */
  for(j=0;j<rings-1;j++)for(i=0;i<n;i++){
    var i2=(i+1)%n;
    var A=base+j*n+i, B=base+j*n+i2, C2=base+(j+1)*n+i2, D=base+(j+1)*n+i;
    if(up)this.quad(A,D,C2,B);else this.quad(A,B,C2,D);
  }
  /* caps, unless the loft joins something else */
  /* `openTop` means the geometrically higher cap and `openBottom` the
     lower one, regardless of which end of the list they land on. Tying
     them to list order instead makes a descending loft cap the wrong
     end, which shows up as a large flat surface facing the wrong way. */
  var ny=up?1:-1;
  var openFar=up?o.openTop:o.openBottom;
  var openNear=up?o.openBottom:o.openTop;
  if(!openFar){
    var top=sections[rings-1],tsc=top.scale===undefined?1:top.scale;
    var tcol=top.col?col3(top.col):col;
    var tc=this.vert(0,top.y,0,0,ny,0,.5,.5,tcol),t0=this.n;
    for(i=0;i<n;i++)this.vert(top.pts[i][0]*tsc,top.y,top.pts[i][1]*tsc,0,ny,0,
      top.pts[i][0]+.5,top.pts[i][1]+.5,tcol);
    for(i=0;i<n;i++){
      if(up)this.tri(tc,t0+(i+1)%n,t0+i);else this.tri(tc,t0+i,t0+(i+1)%n);
    }
  }
  if(!openNear){
    var bo=sections[0],bsc=bo.scale===undefined?1:bo.scale;
    var bcol=bo.col?col3(bo.col):col;
    var bc=this.vert(0,bo.y,0,0,-ny,0,.5,.5,bcol),b0=this.n;
    for(i=0;i<n;i++)this.vert(bo.pts[i][0]*bsc,bo.y,bo.pts[i][1]*bsc,0,-ny,0,
      bo.pts[i][0]+.5,bo.pts[i][1]+.5,bcol);
    for(i=0;i<n;i++){
      if(up)this.tri(bc,b0+i,b0+(i+1)%n);else this.tri(bc,b0+(i+1)%n,b0+i);
    }
  }
  return this;
};

/* A limb: a tapered loft between two radii with rounded ends, built
   downward from the bone pivot at y=0 the way the skeleton expects. */
Builder.prototype.limb=function(len,r0,r1,c,o){
  o=o||{};
  var n=o.seg||10,secs=[],steps=o.steps||7;
  for(var i=0;i<=steps;i++){
    var t=i/steps;
    var y=-len*t;
    /* ease the radius so the limb swells slightly at the top rather
       than tapering linearly like a traffic cone */
    var r=M.lerp(r0,r1,t*t*(3-2*t));
    if(o.bulge)r*=1+Math.sin(t*Math.PI)*o.bulge;
    var cap=1;
    if(i===0)cap=0.82;
    if(i===steps)cap=0.86;
    secs.push({y:y,pts:Geo.circle(r*cap,n,o.flatX||1,o.flatZ||1)});
  }
  this.loft(secs,c,{uvScale:o.uvScale||1});
  /* joint spheres hide the seam where rigid parts meet */
  if(o.joint!==false){
    this.sphere(0,0,0,r0*0.96,n,Math.max(5,n>>1),c);
    this.sphere(0,-len,0,r1*0.94,n,Math.max(5,n>>1),c);
  }
  return this;
};

/* A flat disc, and a flat ring. Both exist because a capped loft is
   the wrong shape for anything hollow: a fountain basin built as a
   capped cylinder is a solid lid over the water. */
Builder.prototype.disc=function(x,y,z,r,seg,c,down){
  seg=seg||16;
  var col=col3(c),ny=down?-1:1;
  var ctr=this.vert(x,y,z,0,ny,0,.5,.5,col),i0=this.n;
  for(var i=0;i<seg;i++){
    var a=i/seg*TAU;
    this.vert(x+Math.cos(a)*r,y,z+Math.sin(a)*r,0,ny,0,
      Math.cos(a)*.5+.5,Math.sin(a)*.5+.5,col);
  }
  for(var k=0;k<seg;k++){
    var k2=(k+1)%seg;
    if(down)this.tri(ctr,i0+k,i0+k2);
    else this.tri(ctr,i0+k2,i0+k);
  }
  return this;
};
Builder.prototype.annulus=function(x,y,z,r0,r1,seg,c,down){
  seg=seg||16;
  var col=col3(c),ny=down?-1:1,base=this.n;
  for(var i=0;i<seg;i++){
    var a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a);
    this.vert(x+ca*r0,y,z+sa*r0,0,ny,0,ca*.5+.5,sa*.5+.5,col);
    this.vert(x+ca*r1,y,z+sa*r1,0,ny,0,ca*.5+.5,sa*.5+.5,col);
  }
  for(var k=0;k<seg;k++){
    var a0=base+k*2, b0=base+((k+1)%seg)*2;
    if(down)this.quad(a0,a0+1,b0+1,b0);
    else this.quad(a0,b0,b0+1,a0+1);
  }
  return this;
};

/* A quad billboarded in the XY plane — leaves, banners, fish fins. */
Builder.prototype.card=function(x,y,z,w,h,c,dbl){
  var col=col3(c);
  var a=this.vert(x-w/2,y-h/2,z,0,0,1,0,0,col);
  var b=this.vert(x+w/2,y-h/2,z,0,0,1,1,0,col);
  var cc=this.vert(x+w/2,y+h/2,z,0,0,1,1,1,col);
  var d=this.vert(x-w/2,y+h/2,z,0,0,1,0,1,col);
  this.quad(a,b,cc,d);
  if(dbl!==false){
    var e=this.vert(x-w/2,y-h/2,z,0,0,-1,0,0,col);
    var f=this.vert(x+w/2,y-h/2,z,0,0,-1,1,0,col);
    var g=this.vert(x+w/2,y+h/2,z,0,0,-1,1,1,col);
    var hh=this.vert(x-w/2,y+h/2,z,0,0,-1,0,1,col);
    this.quad(e,hh,g,f);
  }
  return this;
};

/* Merge another builder's output in under the current transform.
   Lets a prop be composed from named sub-builders. */
Builder.prototype.append=function(other){
  var base=this.n,ov=other.v,sl=this.layer,se=this.emis,
      sl2=this.layer2,sb=this.blend;
  for(var i=0;i<ov.length;i+=15){
    this.layer=ov[i+11];this.emis=ov[i+12];
    this.layer2=ov[i+13];this.blend=ov[i+14];
    this.vert(ov[i],ov[i+1],ov[i+2],ov[i+3],ov[i+4],ov[i+5],
      ov[i+6],ov[i+7],[ov[i+8],ov[i+9],ov[i+10]]);
  }
  this.layer=sl;this.emis=se;this.layer2=sl2;this.blend=sb;
  for(var j=0;j<other.i.length;j++)this.i.push(base+other.i[j]);
  return this;
};

/* Tint every vertex already in the buffer — used to recolour a shared
   prop builder without rebuilding it. */
Builder.prototype.tintAll=function(c){
  var col=col3(c);
  for(var i=0;i<this.v.length;i+=15){this.v[i+8]=col[0];this.v[i+9]=col[1];this.v[i+10]=col[2];}
  return this;
};

Builder.prototype.bounds=function(){
  var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(var i=0;i<this.v.length;i+=15){
    for(var k=0;k<3;k++){
      var val=this.v[i+k];
      if(val<mn[k])mn[k]=val;
      if(val>mx[k])mx[k]=val;
    }
  }
  if(this.v.length===0){mn=[0,0,0];mx=[0,0,0];}
  return {min:mn,max:mx};
};

/* Hand the accumulated data to the GPU. Index width is chosen from the
   vertex count so small props don't pay for 32-bit indices. */
Builder.prototype.upload=function(maxInstances){
  var GL=LH.GL;
  var data=new Float32Array(this.v);
  var idx=this.n>65535?new Uint32Array(this.i):new Uint16Array(this.i);
  var mesh=GL.mesh(data,idx,maxInstances);
  var b=this.bounds();
  mesh.bmin=b.min;mesh.bmax=b.max;
  var cx=(b.min[0]+b.max[0])/2,cy=(b.min[1]+b.max[1])/2,cz=(b.min[2]+b.max[2])/2;
  mesh.center=[cx,cy,cz];
  mesh.radius=Math.hypot(b.max[0]-cx,b.max[1]-cy,b.max[2]-cz);
  mesh.verts=this.n;
  return mesh;
};

LH.Geo=Geo;
})();

/* ============================================================
   LH.Tex — procedural surfaces.

   Every material in the game is painted here into a 2D canvas and
   uploaded as one layer of a texture array, so the whole world
   draws with a single texture bound. Nothing is downloaded.

   The rule each material follows: a base wash, a mid-frequency
   pattern that gives it identity (planks, courses, panel seams),
   and a high-frequency grain so it does not read as flat colour
   under a moving light.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Geo=LH.Geo,Tex={};
var SZ=256;

function make(){
  var cv=document.createElement('canvas');
  cv.width=cv.height=SZ;
  return cv;
}
/* seamless value noise: sample on a torus so the tile wraps */
function tileNoise(x,y,freq,seed){
  var a=M.noise2(x*freq,y*freq,seed);
  var b=M.noise2((x-1)*freq,y*freq,seed);
  var c=M.noise2(x*freq,(y-1)*freq,seed);
  var d=M.noise2((x-1)*freq,(y-1)*freq,seed);
  return M.lerp(M.lerp(a,b,x),M.lerp(c,d,x),y);
}
function tileFbm(x,y,freq,seed,oct){
  oct=oct||4;
  var s=0,amp=1,norm=0,f=freq;
  for(var i=0;i<oct;i++){s+=tileNoise(x,y,f,seed+i*13)*amp;norm+=amp;amp*=0.5;f*=2;}
  return s/norm;
}

/* Paint per-pixel through a callback returning a hex colour. Slower to
   write than gradients but it is the only way to get grain that
   survives mipmapping. */
function paint(cv,fn,label){
  var ctx=cv.getContext('2d');
  var img=ctx.createImageData(SZ,SZ),d=img.data;
  var bad=0;
  for(var y=0;y<SZ;y++)for(var x=0;x<SZ;x++){
    var u=x/SZ,v=y/SZ;
    var c=fn(u,v,x,y);
    var i=(y*SZ+x)*4;
    /* A NaN anywhere in a recipe writes as zero and the material ships
       black with no error. Catch it at the source and say which one. */
    if(c[0]!==c[0]||c[1]!==c[1]||c[2]!==c[2]){
      bad++;c=[255,0,220];
    }
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=c.length>3?c[3]:255;
  }
  if(bad)console.warn('material "'+(label||'?')+'" produced '+bad+
    ' NaN pixels — shown in magenta');
  ctx.putImageData(img,0,0);
  return cv;
}
function rgb(hex){var h=hex.charAt(0)==='#'?hex.slice(1):hex;
  var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function mixv(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function litv(c,amt){return [M.clamp(c[0]+amt,0,255),M.clamp(c[1]+amt,0,255),M.clamp(c[2]+amt,0,255)];}

/* ---------------- material recipes ---------------- */
var R={};

/* a plain speckled solid — the base every other recipe starts from */
R.solid=function(lo,hi,grain,seed,oct){
  var L=rgb(lo),H=rgb(hi);grain=grain===undefined?12:grain;
  return function(u,v){
    var n=tileFbm(u,v,6,seed||1,oct||4);
    var c=mixv(L,H,n);
    var g=(M.hash2(u*SZ|0,v*SZ|0,seed*7+3)-0.5)*grain;
    return litv(c,g);
  };
};

R.grass=function(){
  return function(u,v){
    var base=mixv(rgb('#4C9B3A'),rgb('#89D465'),tileFbm(u,v,5,11,4));
    /* blade streaks: high-frequency stretched noise reads as grass at
       distance without any actual geometry */
    var blade=tileFbm(u*1.0,v*1.0,44,23,2);
    base=mixv(base,rgb('#A9EC80'),blade*0.35);
    var dry=tileFbm(u,v,2.5,41,3);
    if(dry>0.66)base=mixv(base,rgb('#B4C46A'),(dry-0.66)*2.2);
    var g=(M.hash2(u*SZ|0,v*SZ|0,77)-0.5)*22;
    return litv(base,g);
  };
};

R.dirt=function(){
  return function(u,v){
    var base=mixv(rgb('#4A3521'),rgb('#7A5836'),tileFbm(u,v,7,5,4));
    var peb=tileFbm(u,v,26,19,2);
    if(peb>0.72)base=litv(base,26);
    if(peb<0.24)base=litv(base,-18);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,9)-0.5)*20);
  };
};

R.sand=function(){
  return function(u,v){
    var base=mixv(rgb('#C7A972'),rgb('#EBD6A4'),tileFbm(u,v,5,31,4));
    /* wind ripples — a sine banded along one axis, warped by noise */
    var warp=tileFbm(u,v,3,37,2);
    var rip=Math.sin((v*26+warp*4)*Math.PI*2)*0.5+0.5;
    base=litv(base,(rip-0.5)*14);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,13)-0.5)*16);
  };
};

R.stone=function(lo,hi,seed){
  lo=lo||'#4B4E59';hi=hi||'#7C818F';
  /* Default the seed once, up here. Defaulting it inline at each use
     with `seed||3` reads as safe but is not: any *arithmetic* on the
     raw parameter — seed*3+7 — evaluates to NaN when it is undefined,
     litv clamps NaN to NaN, and the whole material writes out black.
     Stone and concrete both shipped black for exactly this reason. */
  seed=seed===undefined?3:seed;
  return function(u,v){
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,6,seed,5));
    /* fracture lines: ridged noise thresholded to thin dark seams */
    var r=1-Math.abs(tileFbm(u,v,9,seed*3+7,3)*2-1);
    if(r>0.86)base=litv(base,-40*(r-0.86)*7);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,seed*11)-0.5)*18);
  };
};

R.cliff=function(){
  return function(u,v){
    /* strata: horizontal bands with a warped boundary */
    var warp=tileFbm(u,v,4,53,3)*0.06;
    var band=((v+warp)*9)%1;
    var tone=tileFbm(u,v,7,59,4);
    var base=mixv(rgb('#5A5044'),rgb('#8E8271'),tone);
    base=litv(base,(band<0.12?-26:(band>0.88?16:0)));
    var r=1-Math.abs(tileFbm(u,v,14,61,3)*2-1);
    if(r>0.8)base=litv(base,-30);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,67)-0.5)*20);
  };
};

R.planks=function(lo,hi,rows,seed){
  lo=lo||'#6B4A2C';hi=hi||'#A8794A';rows=rows||6;seed=seed||71;
  return function(u,v){
    var row=Math.floor(v*rows);
    var fy=v*rows-row;
    /* each plank gets its own tone and grain phase */
    var tone=M.hash2(row,0,seed);
    var base=mixv(rgb(lo),rgb(hi),0.25+tone*0.6);
    var grain=tileFbm(u*1.0+row*0.37,v*6.0,3,seed+row,3);
    base=mixv(base,litv(base,-24),grain*0.55);
    /* long grain streaks run with the plank */
    var streak=Math.sin((grain*5+u*10)*Math.PI*2)*0.5+0.5;
    base=litv(base,(streak-0.5)*10);
    /* the seam between planks, plus a lit top lip */
    if(fy<0.055)base=litv(base,-52);
    else if(fy<0.10)base=litv(base,16);
    /* end joints, staggered per row */
    var jx=(u+tone*0.5)*3%1;
    if(jx<0.012)base=litv(base,-44);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,seed*3)-0.5)*14);
  };
};

R.bark=function(){
  return function(u,v){
    var warp=tileFbm(u,v,5,83,3);
    var ridge=1-Math.abs(tileFbm(u*1.0,v*0.25,7,89,4)*2-1);
    var base=mixv(rgb('#3E2E22'),rgb('#7A5C42'),ridge);
    base=litv(base,(warp-0.5)*22);
    var crack=Math.sin((u*22+warp*3)*Math.PI*2);
    if(crack>0.86)base=litv(base,-38);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,91)-0.5)*16);
  };
};

R.brick=function(lo,hi,mortar,cols,rows){
  lo=lo||'#6E3A32';hi=hi||'#9C5A46';mortar=mortar||'#B9AFA0';
  cols=cols||6;rows=rows||12;
  return function(u,v){
    var row=Math.floor(v*rows);
    var off=(row%2)?0.5:0;      /* running bond */
    var cu=(u*cols+off)%1, cv2=v*rows-row;
    var mw=0.05,mh=0.10;
    if(cu<mw||cu>1-mw||cv2<mh||cv2>1-mh){
      var m=rgb(mortar);
      return litv(m,(M.hash2(u*SZ|0,v*SZ|0,101)-0.5)*18-8);
    }
    var id=Math.floor(u*cols+off)*31+row*7;
    var tone=M.hash2(id,0,103);
    var base=mixv(rgb(lo),rgb(hi),0.2+tone*0.7);
    base=litv(base,(tileFbm(u,v,20,107,3)-0.5)*26);
    /* bevel the brick face so courses catch light */
    if(cv2<mh+0.05)base=litv(base,14);
    if(cv2>1-mh-0.05)base=litv(base,-14);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,109)-0.5)*14);
  };
};

R.panel=function(lo,hi,cells,seed,rivets){
  lo=lo||'#3A4250';hi=hi||'#6E7B8E';cells=cells||4;seed=seed||113;
  return function(u,v){
    var cx=Math.floor(u*cells),cy=Math.floor(v*cells);
    var fu=u*cells-cx,fv=v*cells-cy;
    var tone=M.hash2(cx,cy,seed);
    var base=mixv(rgb(lo),rgb(hi),0.3+tone*0.5);
    /* brushed streaks along X */
    var brush=M.hash2((u*SZ*2)|0,cy,seed+5);
    base=litv(base,(brush-0.5)*16);
    base=litv(base,(tileFbm(u,v,9,seed+11,3)-0.5)*14);
    /* panel seam + highlight lip */
    var e=0.02;
    if(fu<e||fv<e)base=litv(base,-46);
    else if(fu<e*2||fv<e*2)base=litv(base,18);
    if(rivets){
      var rd=Math.hypot(fu-0.5,fv-0.5);
      var rr=Math.hypot((fu<0.5?fu:1-fu)-0.07,(fv<0.5?fv:1-fv)-0.07);
      if(rr<0.022)base=litv(base,rr<0.014?24:-24);
    }
    return base;
  };
};

R.tilefloor=function(a,b,grout,cells){
  a=a||'#6A7686';b=b||'#828E9E';grout=grout||'#4A5462';cells=cells||4;
  return function(u,v){
    var cx=Math.floor(u*cells),cy=Math.floor(v*cells);
    var fu=u*cells-cx,fv=v*cells-cy;
    var e=0.035;
    if(fu<e||fv<e||fu>1-e||fv>1-e)
      return litv(rgb(grout),(M.hash2(u*SZ|0,v*SZ|0,127)-0.5)*10);
    /* checker plus per-tile tone variance, so a plaza is not a grid of
       identical squares */
    var chk=((cx+cy)&1)?a:b;
    var tone=M.hash2(cx,cy,131);
    var base=mixv(rgb(chk),litv(rgb(chk),22),tone);
    base=litv(base,(tileFbm(u,v,14,137,3)-0.5)*12);
    /* polished sheen streak */
    var sh=Math.sin((fu+fv)*Math.PI);
    base=litv(base,sh*6);
    return base;
  };
};

R.concrete=function(lo,hi,seed){
  lo=lo||'#4A5058';hi=hi||'#767E88';
  seed=seed===undefined?139:seed;
  return function(u,v){
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,5,seed,5));
    var pit=M.hash2(u*SZ|0,v*SZ|0,seed*3+1);
    if(pit>0.985)base=litv(base,-40);
    var stain=tileFbm(u,v,2,seed*5+2,3);
    if(stain>0.7)base=mixv(base,rgb('#3B4147'),(stain-0.7)*1.6);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,149)-0.5)*14);
  };
};

R.foliage=function(lo,hi,seed){
  lo=lo||'#256B2C';hi=hi||'#79D257';
  return function(u,v){
    /* clumped leaf masses, not uniform green */
    var clump=tileFbm(u,v,8,seed||151,4);
    var fine=tileFbm(u,v,30,(seed||151)+3,2);
    var base=mixv(rgb(lo),rgb(hi),clump*0.7+fine*0.3);
    if(fine>0.74)base=mixv(base,rgb('#B4F08C'),(fine-0.74)*2.4);
    if(clump<0.28)base=mixv(base,rgb('#1B4523'),(0.28-clump)*2.0);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,157)-0.5)*20);
  };
};

R.fabric=function(lo,hi,seed){
  lo=lo||'#C4C9D2';hi=hi||'#ECEEF2';
  return function(u,v){
    /* a woven cross-hatch: two out-of-phase high-frequency sines */
    var wu=Math.sin(u*SZ*0.5*Math.PI)*0.5+0.5;
    var wv=Math.sin(v*SZ*0.5*Math.PI)*0.5+0.5;
    var weave=(wu*0.5+wv*0.5);
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,4,seed||163,3));
    base=litv(base,(weave-0.5)*18);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,167)-0.5)*10);
  };
};

R.crystal=function(tint,seed){
  tint=tint||'#4FD8FF';
  return function(u,v){
    /* facets from a cheap cellular pattern: nearest of a jittered grid */
    var cells=5,best=9,best2=9,bid=0;
    var gx=Math.floor(u*cells),gy=Math.floor(v*cells);
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
      var ax=gx+dx,ay=gy+dy;
      var px=(ax+M.hash2(ax,ay,seed||173))/cells;
      var py=(ay+M.hash2(ax,ay,(seed||173)+9))/cells;
      var d=Math.hypot(u-px,v-py);
      if(d<best){best2=best;best=d;bid=ax*37+ay*17;}
      else if(d<best2)best2=d;
    }
    var facet=M.hash2(bid,0,181);
    var base=mixv(rgb(tint),rgb('#0E2A44'),0.35+facet*0.4);
    base=litv(base,(best2-best)*300-30);   /* bright facet edges */
    return base;
  };
};

R.glass=function(tint){
  /* Same reasoning as the emissive material: neutral texture, tinted
     at the call site. */
  tint=tint||'#CFDCE6';
  return function(u,v){
    var base=rgb(tint);
    /* faint pane distortion and a diagonal reflection band */
    var d=tileFbm(u,v,6,191,3);
    var band=M.clamp(1-Math.abs(((u+v)*2%1)-0.5)*3.4,0,1);
    var c=litv(base,(d-0.5)*20+band*40);
    return [c[0],c[1],c[2],86];
  };
};

R.water=function(){
  return function(u,v){
    /* not used for the surface shader — this is the caustic/detail
       layer sampled underwater and on wet sand */
    var a=tileFbm(u,v,7,197,3),b=tileFbm(u+0.3,v-0.2,11,199,3);
    var r=1-Math.abs((a*0.6+b*0.4)*2-1);
    var base=mixv(rgb('#0D3A52'),rgb('#4FBCD8'),r*r);
    return base;
  };
};

R.roof=function(lo,hi,rows){
  lo=lo||'#544459';hi=hi||'#8A6A7E';rows=rows||10;
  return function(u,v){
    var row=Math.floor(v*rows),fv=v*rows-row;
    var off=(row%2)?0.5:0;
    var cols=8,cu=(u*cols+off)%1;
    var id=Math.floor(u*cols+off)*13+row*29;
    var tone=M.hash2(id,0,211);
    var base=mixv(rgb(lo),rgb(hi),0.25+tone*0.55);
    /* scalloped shingle: darken toward the tile's lower arc */
    var arc=Math.hypot((cu-0.5)*1.1,(fv-0.15)*1.0);
    if(arc>0.52)base=litv(base,-34);
    if(fv<0.10)base=litv(base,18);
    if(fv>0.92)base=litv(base,-26);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,223)-0.5)*14);
  };
};

/* A dressed stone path rather than asphalt. Tarmac reads as a black
   scar cut across a green island, and every road on the map is
   visible from every hill. */
R.road=function(){
  return function(u,v){
    var base=mixv(rgb('#8A8375'),rgb('#B4AC9C'),tileFbm(u,v,7,227,5));
    /* irregular setts: a cellular split with a paler joint */
    var cells=9;
    var gx=Math.floor(u*cells),gy=Math.floor(v*cells);
    var jitter=M.hash2(gx,gy,231);
    base=litv(base,(jitter-0.5)*26);
    var fu=u*cells-gx,fv=v*cells-gy;
    var e=0.07+jitter*0.03;
    if(fu<e||fv<e)base=mixv(base,rgb('#6E685C'),0.55);
    var agg=M.hash2(u*SZ|0,v*SZ|0,229);
    if(agg>0.965)base=litv(base,26);
    if(agg<0.05)base=litv(base,-16);
    return base;
  };
};

R.snow=function(){
  return function(u,v){
    var base=mixv(rgb('#C6D6E6'),rgb('#FFFFFF'),tileFbm(u,v,6,239,4));
    var spark=M.hash2(u*SZ|0,v*SZ|0,241);
    if(spark>0.994)base=[255,255,255];
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,251)-0.5)*8);
  };
};

R.gold=function(lo,hi){
  lo=lo||'#8A5E12';hi=hi||'#FFDE7A';
  return function(u,v){
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,5,257,4));
    var brush=M.hash2((u*SZ*3)|0,(v*SZ*0.3)|0,263);
    base=litv(base,(brush-0.5)*30);
    return base;
  };
};

/* Neutral by default. An emissive material that bakes its own hue
   multiplies against whatever tint the caller passes, so a warm lamp
   drawn on a teal texture comes out mint green. Keep the texture
   near-white and let the tint carry the colour. */
R.emissive=function(tint){
  tint=tint||'#F4F8FF';
  return function(u,v){
    var c=rgb(tint);
    var pulse=tileFbm(u,v,10,269,2);
    return litv(c,(pulse-0.5)*30+30);
  };
};

/* ---------------- the layer table ----------------
   Order is the contract: LH.Data and the world builders refer to
   materials by these names, and the shader by the resulting index. */
var LAYERS=[
  ['blank',   R.solid('#FFFFFF','#FFFFFF',0,1,1)],
  ['grass',   R.grass()],
  ['dirt',    R.dirt()],
  ['sand',    R.sand()],
  ['stone',   R.stone()],
  ['cliff',   R.cliff()],
  ['gravel',  R.solid('#4E4B52','#8A8792',22,2,5)],
  ['snow',    R.snow()],
  ['planks',  R.planks()],
  ['deck',    R.planks('#5A4636','#8E7458',5,79)],
  ['bark',    R.bark()],
  ['brick',   R.brick()],
  ['brickpale',R.brick('#8A6E5A','#B79A80','#D4CCBE',5,10)],
  ['panel',   R.panel('#333B48','#69768A',4,113,true)],
  ['panelw',  R.panel('#5E6672','#9AA4B2',3,311,false)],
  ['concrete',R.concrete()],
  ['tile',    R.tilefloor('#6A7686','#828E9E','#4A5462',7)],
  ['tilepale',R.tilefloor('#9AA4B0','#B0B9C4','#6E7884',4)],
  ['tiledark',R.tilefloor('#2E3846','#42505F','#1E2630',4)],
  ['roof',    R.roof()],
  ['road',    R.road()],
  ['foliage', R.foliage()],
  ['foliagep',R.foliage('#5A2646','#D473A8',313)],   /* blossom */
  ['fabric',  R.fabric()],
  ['fabricw', R.fabric('#D8C0C6','#FBF2F4',317)],
  ['glass',   R.glass()],
  ['crystal', R.crystal()],
  ['gold',    R.gold()],
  ['water',   R.water()],
  ['neon',    R.emissive('#F4F8FF')],
  ['neonw',   R.emissive('#FFFFFF')]
];

Tex.NAME={};
Tex.SIZE=SZ;

Tex.buildAll=function(){
  var canvases=[];
  for(var i=0;i<LAYERS.length;i++){
    Tex.NAME[LAYERS[i][0]]=i;
    canvases.push(paint(make(),LAYERS[i][1],LAYERS[i][0]));
  }
  Tex.count=LAYERS.length;
  Tex.array=LH.GL.texArrayFromCanvases(canvases,SZ);
  /* keep the canvases: the UI paints item icons from the same source
     so a block's tile and its inventory icon can never drift apart */
  Tex.canvases=canvases;
  return Tex.array;
};

Tex.layer=function(name){
  var i=Tex.NAME[name];
  return i===undefined?0:i;
};

LH.Tex=Tex;
})();

/* ============================================================
   LH.Render — the forward renderer.

   Passes, in order:
     1. shadow   — depth-only from the sun, into a fitted ortho box
     2. sky      — one fullscreen triangle, no geometry
     3. opaque   — world + props + characters, instanced
     4. water    — animated surface, depth-aware shoreline
     5. blend    — glass, foliage cards, particles, name tags
     6. post     — bloom on the emissive pass, tonemap, vignette

   The lighting model is deliberately not full PBR: a directional
   sun with a wrapped diffuse term, a sky/ground hemisphere ambient,
   and a Blinn specular. It costs a fraction of the instructions and,
   for a stylised world, reads better than a physically correct one.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,R={};
var gl=null;

/* ---------------- shared shader chunks ---------------- */
var COMMON=`
const float PI=3.14159265;
float saturate(float x){return clamp(x,0.0,1.0);}
vec3 saturate3(vec3 x){return clamp(x,vec3(0.0),vec3(1.0));}
// ACES-ish filmic curve. Cheap, and it keeps the neon from clipping to
// flat white the moment bloom lands on it.
vec3 tonemap(vec3 x){
  x*=0.9;
  return saturate3((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14));
}
vec3 toSRGB(vec3 c){
  return mix(c*12.92,1.055*pow(max(c,vec3(1e-5)),vec3(1.0/2.4))-0.055,step(0.0031308,c));
}
`;

var LIGHTING=`
uniform vec3 uSunDir;      // toward the sun
uniform vec3 uSunCol;
uniform vec3 uSkyCol;
uniform vec3 uGndCol;
uniform vec3 uEye;
uniform vec3 uFogCol;
uniform vec2 uFog;         // density, height falloff
uniform float uExposure;

// Wrapped diffuse: light bleeds slightly past the terminator, which
// stands in for the bounce a stylised scene would otherwise be missing.
float wrapDiffuse(vec3 n,vec3 l,float w){
  return saturate((dot(n,l)+w)/((1.0+w)*(1.0+w)));
}
vec3 hemi(vec3 n){
  return mix(uGndCol,uSkyCol,n.y*0.5+0.5);
}

// Three light bands with soft shoulders. The shoulders matter: a hard
// step aliases badly on a curved surface, and the whole point of the
// look is that a sphere reads as two clean shapes rather than a
// gradient with a staircase in it.
uniform float uToon;      // 0 = smooth shading, 1 = fully banded
float cel(float x){
  return 0.34
       + 0.30*smoothstep(0.30,0.40,x)
       + 0.36*smoothstep(0.66,0.76,x);
}
float toonify(float x){
  return mix(x,cel(x),uToon);
}

// ---- point lights ----
// A small fixed set, chosen on the CPU each frame from the lamps and
// signs nearest the camera. Sixteen is the whole budget: it is enough
// to light a street, and a forward renderer that loops further than
// that per fragment stops being worth it.
#define MAXLIGHTS 16
uniform int uLightCount;
uniform vec4 uLightPos[MAXLIGHTS];   // xyz world position, w radius
uniform vec4 uLightCol[MAXLIGHTS];   // rgb colour premultiplied by strength

vec3 pointLights(vec3 world,vec3 n){
  vec3 acc=vec3(0.0);
  for(int i=0;i<MAXLIGHTS;i++){
    if(i>=uLightCount)break;
    vec3 d=uLightPos[i].xyz-world;
    float r=uLightPos[i].w;
    float d2=dot(d,d);
    if(d2>r*r)continue;
    float dist=sqrt(max(d2,1e-6));
    // Smooth to zero at the radius. A 1/d^2 falloff cut off at a radius
    // leaves a visible disc edge on the ground under every lamp.
    float att=1.0-dist/r; att*=att;
    // Wrapped again, and hard: a street lamp is a big soft source and
    // a plain N.L makes every wall it touches look like a spotlight.
    float ndl=saturate(dot(n,d/dist)*0.62+0.38);
    acc+=uLightCol[i].rgb*(ndl*att);
  }
  return acc;
}
// Height fog. Distance drives the bulk of it; the height term thins it
// out as you climb, so the harbour sits in haze while the cliff tops
// stay clear. Averaging the two endpoint heights is an approximation of
// the proper integral along the ray, and is stable for every view
// direction including a perfectly horizontal one.
vec3 applyFog(vec3 col,vec3 world,vec3 eye){
  float dist=length(world-eye);
  float hs=max(0.5,uFog.y);
  float hAvg=max(0.0,(world.y+eye.y)*0.5);
  float density=uFog.x*exp(-hAvg/hs);
  float t=1.0-exp(-dist*density);
  return mix(col,uFogCol,clamp(t,0.0,1.0));
}
`;

var SHADOW=`
uniform sampler2DShadow uShadow;
uniform mat4 uLightVP;
uniform vec2 uShadowTexel;   // 1/size, bias scale
uniform float uShadowSoft;   // kernel radius, in shadow texels
const vec2 POISSON12[12]=vec2[12](
  vec2(-0.326,-0.406),vec2(-0.840,-0.074),vec2(-0.696, 0.457),
  vec2(-0.203, 0.621),vec2( 0.962,-0.195),vec2( 0.473,-0.480),
  vec2( 0.519, 0.767),vec2( 0.185,-0.893),vec2( 0.507, 0.064),
  vec2( 0.896, 0.412),vec2(-0.322,-0.933),vec2(-0.792,-0.598)
);
float shadowAt(vec3 world,vec3 n,vec3 l){
  vec4 lp=uLightVP*vec4(world,1.0);
  vec3 p=lp.xyz/lp.w*0.5+0.5;
  if(p.z>1.0||p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0)return 1.0;
  // Slope-scaled bias: grazing light needs far more offset than a
  // face pointing straight at the sun, and a single constant bias
  // either peters or floats depending which you tune for.
  float ndl=saturate(dot(n,l));
  float bias=uShadowTexel.y*(0.6+2.6*(1.0-ndl));
  p.z-=bias;
  // A rotated Poisson disc rather than a 3x3 grid. Twelve taps in a
  // ring cover more of the penumbra than nine in a square for the same
  // cost, and rotating the ring per pixel turns the banding a fixed
  // kernel leaves into noise the eye does not read as structure.
  float ang=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)*6.28318;
  float ca=cos(ang),sa=sin(ang);
  float s=0.0;
  for(int i=0;i<12;i++){
    vec2 o=POISSON12[i];
    vec2 r=vec2(o.x*ca-o.y*sa,o.x*sa+o.y*ca)*uShadowTexel.x*uShadowSoft;
    s+=texture(uShadow,vec3(p.xy+r,p.z));
  }
  return s/12.0;
}
`;

/* ---------------- standard object shader ---------------- */
/* ---------------- wind ----------------
   Leaves are found by their material rather than by a per-vertex sway
   weight: the vertex format has no spare channel, and "this vertex is
   foliage" is exactly what the layer index already says. Trunks are
   bark, so they hold still while the canopy above them moves, which
   is the difference between a tree in wind and a tree being shaken.

   The same snippet goes through the depth pass. A canopy that sways
   while its own shadow stays put is worse than no wind at all. */
var WIND=`
uniform vec3 uWind;        // direction * strength
uniform float uWindTime;
uniform vec2 uLeaf;        // the two foliage layer indices
vec3 windOffset(vec3 local,vec3 world,float layer){
  float lf=floor(layer+0.5);
  if(lf!=uLeaf.x&&lf!=uLeaf.y)return vec3(0.0);
  // Height above the piece's own origin drives the amplitude, clamped
  // because a merged static mesh hands us world height rather than
  // local height and an unclamped term would fling a treetop on a
  // ninety-metre sky island across the sky.
  // A constant term as well as a height term. Height alone gives a
  // quarter-metre tree top a quarter-millimetre of sway, so ground
  // clutter would stand perfectly still in a gale.
  float h=0.045+clamp(local.y,0.0,4.0)*0.085;
  float ph=world.x*0.33+world.z*0.27;
  float t=uWindTime;
  // Two frequencies per axis. One is a metronome; two is weather.
  vec3 o=vec3(
    sin(t+ph)*0.62+sin(t*2.31+ph*1.7)*0.24,
    sin(t*1.73+ph*1.31)*0.16,
    cos(t*0.91+ph*0.8)*0.62+cos(t*2.13+ph*2.2)*0.21);
  return o*uWind*h;
}
`;

var STD_VS=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aCol;
layout(location=4) in vec4 aMat;      // layer, emissive, layer2, blend
layout(location=5) in mat4 aModel;    // consumes 5,6,7,8
layout(location=9) in vec4 aTint;     // rgb tint, a = extra emissive

uniform mat4 uVP;
uniform mat4 uModel;      // used when the mesh is drawn non-instanced
uniform int  uInstanced;
uniform vec4 uTint;
// Scrolls the texture on a surface. Waterfalls, conveyors, anything
// that has to flow without moving.
uniform vec2 uUVScroll;
`+WIND+`
out vec3 vWorld;
out vec3 vNrm;
out vec2 vUV;
out vec3 vCol;
out float vLayer;
out float vLayer2;
out float vBlend;
out float vEmis;

void main(){
  mat4 mdl = (uInstanced==1) ? aModel : uModel;
  vec4 wp = mdl*vec4(aPos,1.0);
  wp.xyz += windOffset(aPos,wp.xyz,aMat.x);
  vWorld = wp.xyz;
  // Inverse-transpose is overkill here: every instance transform in
  // this game is a rotation, a uniform-ish scale, or both, so the
  // upper 3x3 rotates normals correctly on its own.
  vNrm = normalize(mat3(mdl)*aNrm);
  vUV = aUV + uUVScroll;
  vec4 tint = (uInstanced==1) ? aTint : uTint;
  vCol = aCol*tint.rgb;
  vLayer = aMat.x;
  vLayer2 = aMat.z;
  vBlend = aMat.w;
  vEmis = aMat.y + tint.a;
  gl_Position = uVP*wp;
}
`;

var STD_FS=`#version 300 es
precision highp float;
precision highp sampler2DArray;
precision highp sampler2DShadow;
`+COMMON+LIGHTING+SHADOW+`
uniform sampler2DArray uAtlas;
uniform float uSpec;
uniform float uTime;
uniform float uAlpha;
// Lit windows and neon should not blow out at noon. One global scale,
// driven by the time of day, keeps them readable in daylight and lets
// them carry the night.
uniform float uEmisScale;
// Cloud cover drifting over the ground. Cheap two-octave value noise
// in world XZ — the sky already draws clouds, and a world where they
// cast nothing on it looks painted on rather than under them.
uniform float uCloudAmt;
uniform vec2 uCloudDrift;

in vec3 vWorld;
in vec3 vNrm;
in vec2 vUV;
in vec3 vCol;
in float vLayer;
in float vLayer2;
in float vBlend;
in float vEmis;

layout(location=0) out vec4 oCol;

float cnoise2(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=fract(sin(dot(i,vec2(127.1,311.7)))*43758.5453);
  float b=fract(sin(dot(i+vec2(1,0),vec2(127.1,311.7)))*43758.5453);
  float c=fract(sin(dot(i+vec2(0,1),vec2(127.1,311.7)))*43758.5453);
  float d=fract(sin(dot(i+vec2(1,1),vec2(127.1,311.7)))*43758.5453);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float cloudShadow(vec2 wxz){
  if(uCloudAmt<0.001)return 1.0;
  vec2 p=wxz*0.0085+uCloudDrift;
  float n=cnoise2(p)*0.65+cnoise2(p*2.17+7.3)*0.35;
  // Wide bright gaps, soft edges: a hard-edged blotch reads as a
  // texture bug, not as weather.
  return mix(1.0,smoothstep(0.34,0.70,n),uCloudAmt);
}

void main(){
  // Round the layer indices: they are interpolated across the triangle
  // and a fractional array index is undefined, not a blend.
  vec4 tex = texture(uAtlas, vec3(vUV, floor(vLayer+0.5)));
  if(vBlend>0.002){
    vec4 tex2 = texture(uAtlas, vec3(vUV, floor(vLayer2+0.5)));
    tex = mix(tex, tex2, clamp(vBlend,0.0,1.0));
  }
  vec3 albedo = tex.rgb*vCol;
  float alpha = tex.a*uAlpha;
  if(alpha<0.02) discard;

  vec3 n = normalize(vNrm);
  vec3 v = normalize(uEye-vWorld);
  vec3 l = uSunDir;

  float sh = shadowAt(vWorld,n,l);
  float ndl = wrapDiffuse(n,l,0.35);
  // Shadow gets banded too. Leaving the PCF gradient smooth under a
  // banded terminator puts a soft edge next to a hard one on the same
  // surface, and the eye reads that as a bug rather than a style.
  sh *= cloudShadow(vWorld.xz);
  float shT = mix(sh, smoothstep(0.30,0.52,sh)*0.78+0.22, uToon);
  vec3 direct = uSunCol*toonify(ndl)*shT;
  vec3 ambient = hemi(n);

  // Blinn specular, killed in shadow so wet-looking highlights don't
  // float on surfaces the sun cannot see.
  vec3 h = normalize(l+v);
  float spec = pow(saturate(dot(n,h)), 32.0)*uSpec*sh*step(0.0,dot(n,l));

  vec3 col = albedo*(direct+ambient+pointLights(vWorld,n)) + uSunCol*spec;

  // Rim light picked out of the sky colour: separates a character from
  // the background without a outline pass.
  float rim = pow(1.0-saturate(dot(n,v)),mix(3.0,2.0,uToon));
  col += uSkyCol*rim*(0.16+uToon*0.20);

  col += albedo*vEmis*3.0*uEmisScale;

  col = applyFog(col,vWorld,uEye);
  oCol = vec4(col*uExposure, alpha);
}
`;

/* ---------------- sky ---------------- */
var SKY_VS=`#version 300 es
precision highp float;
out vec2 vNDC;
void main(){
  // One oversized triangle covering the viewport. No buffers bound.
  vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
  vNDC = p*2.0-1.0;
  gl_Position = vec4(vNDC,1.0,1.0);
}
`;
var SKY_FS=`#version 300 es
precision highp float;
`+COMMON+`
uniform mat4 uInvVP;
uniform vec3 uEye;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uZenith;
uniform vec3 uHorizon;
uniform vec3 uGround;
uniform float uTime;
uniform float uExposure;
uniform float uStars;
in vec2 vNDC;
layout(location=0) out vec4 oCol;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){
  float s=0.0,a=0.5;
  for(int i=0;i<5;i++){s+=noise(p)*a;p*=2.03;a*=0.5;}
  return s;
}

void main(){
  // Reconstruct the view ray by unprojecting the far plane.
  vec4 far=uInvVP*vec4(vNDC,1.0,1.0);
  vec3 dir=normalize(far.xyz/far.w-uEye);

  float h=dir.y;
  vec3 col;
  if(h>=0.0){
    // Sky gradient biased toward the horizon so the band is thin and
    // the zenith holds its colour, the way a real sky reads.
    float t=pow(saturate(h),0.42);
    col=mix(uHorizon,uZenith,t);
  }else{
    col=mix(uHorizon,uGround,saturate(-h*3.5));
  }

  // Sun disc plus two-stage glow.
  float sd=dot(dir,uSunDir);
  float disc=smoothstep(0.9994,0.99975,sd);
  float glow=pow(saturate(sd),220.0)*0.6+pow(saturate(sd),12.0)*0.14;
  col+=uSunCol*(disc*14.0+glow);

  // Stars fade in with uStars, twitching slightly so the sky is not dead.
  if(uStars>0.001&&h>-0.02){
    vec2 sp=dir.xz/max(0.08,dir.y+0.12)*3.4;
    float st=hash(floor(sp*140.0));
    float tw=0.7+0.3*sin(uTime*2.2+st*90.0);
    float star=smoothstep(0.9975,1.0,st)*tw;
    col+=vec3(0.85,0.92,1.0)*star*uStars*saturate(h*4.0);
  }

  // Two cloud sheets at different scales and drift speeds.
  if(h>0.005){
    vec2 cp=dir.xz/max(0.05,dir.y)*0.5;
    float c1=fbm(cp*0.9+vec2(uTime*0.006,uTime*0.002));
    float c2=fbm(cp*2.1-vec2(uTime*0.010,0.0));
    float cloud=saturate((c1*0.65+c2*0.35-0.44)*2.6);
    cloud*=saturate(h*5.0);
    float lit=saturate(dot(dir,uSunDir)*0.5+0.5);
    vec3 cc=mix(uHorizon*1.05,uSunCol*1.35+vec3(0.55),lit);
    col=mix(col,cc,cloud*0.82);
  }

  oCol=vec4(col*uExposure,1.0);
}
`;

var WATER_VS=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aCol;
layout(location=4) in vec2 aMat;

uniform mat4 uModel;
uniform float uTime;
out vec3 vWorld;

  // harbour, not an ocean, and big waves would fight the boats.

  float w2=sin(wp.z*0.27-uTime*0.83)*0.045;
  float w3=sin((wp.x+wp.z)*0.15+uTime*0.6)*0.03;

var WATER_FS=`#version 300 es
precision highp float;
precision highp sampler2DArray;
`+COMMON+LIGHTING+`
uniform sampler2DArray uAtlas;
uniform float uTime;
uniform float uDetailLayer;
uniform vec3 uShallow;
uniform vec3 uDeep;
uniform float uFloorY;
// The gradient the sky pass is drawing, so the water can hand back the
// sky that is actually up there rather than a single ambient colour.
uniform vec3 uZenith;
uniform vec3 uHorizonC;
in vec3 vWorld;
in vec2 vUV;
layout(location=0) out vec4 oCol;

/* The same gradient the sky shader uses, minus the clouds and stars.
   Reflecting one flat colour is what made the harbour read as painted
   tin: at dusk the sky is orange and the water stayed teal. */
vec3 skyAt(vec3 d){
  float h=max(d.y,0.0);
  vec3 c=mix(uHorizonC,uZenith,pow(h,0.42));
  float sd=dot(d,uSunDir);
  // The sun's own reflection, and the wide sheen around it that turns
  // into the glitter path once the ripples break it up.
  c+=uSunCol*(pow(saturate(sd),340.0)*4.0+pow(saturate(sd),16.0)*0.12);
  return c;
}

void main(){
  // Analytic normal from the same three swells the vertex stage used.
  float dx=cos(vWorld.x*0.32+uTime*1.05)*0.32*0.055
          +cos((vWorld.x+vWorld.z)*0.15+uTime*0.6)*0.15*0.03;
  float dz=-cos(vWorld.z*0.27-uTime*0.83)*0.27*0.045
          +cos((vWorld.x+vWorld.z)*0.15+uTime*0.6)*0.15*0.03;
  vec3 n=normalize(vec3(-dx,1.0,-dz));

  // Ripple detail from the atlas, two layers scrolling against each other.
  vec2 a=vUV*7.0+vec2(uTime*0.020,uTime*0.013);
  vec2 b=vUV*11.0-vec2(uTime*0.016,uTime*0.024);
  float r1=texture(uAtlas,vec3(a,uDetailLayer)).g;
  float r2=texture(uAtlas,vec3(b,uDetailLayer)).g;
  n=normalize(n+vec3((r1-r2)*0.32,0.0,(r2-r1)*0.32));
  // A third, much finer octave. It contributes almost nothing to the
  // shape and everything to the sparkle: glitter is small normals
  // catching the sun, and two octaves are too smooth to catch it.
  vec2 c3=vUV*31.0+vec2(uTime*-0.031,uTime*0.041);
  float r3=texture(uAtlas,vec3(c3,uDetailLayer)).g;
  vec3 nFine=normalize(n+vec3((r3-0.5)*0.55,0.0,(0.5-r3)*0.55));

  vec3 v=normalize(uEye-vWorld);
  float fres=pow(1.0-saturate(dot(n,v)),4.0);

  // Depth-tinted body colour. There is no depth prepass to sample, so
  // the harbour floor height stands in — good enough for a shoreline
  // that shallows out believably.
  float depth=saturate((vWorld.y-uFloorY)/3.2);
  vec3 body=mix(uShallow,uDeep,depth);

  // Fresnel drives how much sky the surface hands back: near-flat views
  // are almost mirror, straight down is almost pure body colour.
  vec3 refl=reflect(-v,n);
  refl.y=abs(refl.y);   // never reflect the ground half of the sphere
  vec3 col=mix(body,skyAt(refl),saturate(fres*0.92+0.05));

  vec3 h=normalize(uSunDir+v);
  float spec=pow(saturate(dot(n,h)),220.0)*1.4;
  float sheen=pow(saturate(dot(n,h)),24.0)*0.18;
  // Glitter rides the fine normal and only exists where the sun's
  // reflection already is, which is what keeps it a path across the
  // water rather than static on the whole surface.
  vec3 hf=normalize(uSunDir+v);
  float glint=pow(saturate(dot(nFine,hf)),90.0);
  col+=uSunCol*(spec+sheen+glint*0.55);

  // solid one right at the edge and a broken one just outside it, so
  // the shore has a wash rather than a contour.
  float foam=smoothstep(0.20,0.0,depth);
  float fw=smoothstep(0.40,0.82,r1*0.6+r2*0.4);
  float surge=0.5+0.5*sin(uTime*0.9+vWorld.x*0.18+vWorld.z*0.15);
  col=mix(col,vec3(0.95,0.99,1.0),foam*fw*(0.55+surge*0.42));
  col=mix(col,vec3(0.90,0.97,1.0),smoothstep(0.05,0.0,depth)*0.55);

  col=applyFog(col,vWorld,uEye);

  // shows the edge of the terrain mesh as a square outline on the sea.
  float alpha=mix(0.88,1.0,saturate(depth*1.4+fres));
  oCol=vec4(col*uExposure,alpha);
}
`;
