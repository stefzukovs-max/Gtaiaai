<title>Lumen Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ============================================================
   LUMEN HARBOR — a 3D social sandbox MMO.

   One self-contained file. No engine, no dependencies, no asset
   downloads: every mesh, texture, animation and sound is
   generated in the browser at load time — the same discipline
   the 2D build ran on, moved into three dimensions.

   Layering, top to bottom:
     LH.M      vector / matrix math
     LH.GL     WebGL2 device — programs, buffers, textures, FBOs
     LH.Geo    procedural geometry
     LH.Tex    procedural textures
     LH.Render forward renderer: shadow pass, sky, opaque, water
     LH.Cam    third-person camera with collision
     LH.Rig    humanoid rig + animation state machine
     LH.Data   items, fish, enemies, missions, cosmetics — data
     LH.World  terrain, voxel build layer, props, spawns
     LH.Net    the authority boundary. Validates every request.
     LH.Game   player controller, activities, progression
     LH.UI     the dark premium interface
   ============================================================ */

:root{
  --bg:#080B12;
  --panel:rgba(14,19,30,.92);
  --panel2:rgba(20,27,42,.94);
  --line:rgba(126,160,216,.16);
  --line2:rgba(126,160,216,.32);
  --ink:#E8EFFA;
  --ink2:#93A4C0;
  --ink3:#5D6E8C;
  --acc:#4FE3B0;
  --acc2:#17A886;
  --gold:#FFC94D;
  --danger:#FF5A6E;
  --xp:#7C6BFF;
  /* rarity ramp — the 2D build's tiers, restated for a dark UI */
  --r1:#9AA8BE;
  --r2:#57D07A;
  --r3:#489BFF;
  --r4:#B269FF;
  --r5:#F5A03C;
  --r6:#FF4F7A;
  /* Rounded, not angular. Nunito carries the small text — it stays
     legible at the sizes the HUD actually uses — and Fredoka does the
     headings, where the roundness is the point. Both have real
     fallbacks: the game has to look deliberate with the network off. */
  --ui: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --disp: 'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--ui);-webkit-font-smoothing:antialiased}

/* The whole game lives in one container so every measurement in the
   HUD can be expressed against the game view rather than the browser
   window. container-type must be `size` — `inline-size` alone silently
   disables the aspect-ratio queries further down. */
#app{position:fixed;inset:0;container-type:size;container-name:app;
  background:radial-gradient(120% 90% at 50% 0%,#101A2C 0%,#080B12 60%,#05070C 100%);
  overflow:hidden;user-select:none}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- shared surface language ---------- */
.surface{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:19px;
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);border:0}

/* ---------- boot / loading ---------- */
#boot{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(130% 100% at 50% 35%,#12263A 0%,#080D16 55%,#04060B 100%)}
#boot.gone{opacity:0;pointer-events:none;transition:opacity .7s ease}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.22em;
  font-size:clamp(30px,6.2cqw,62px);text-transform:uppercase;
  background:linear-gradient(180deg,#EAF6FF 0%,#7FE9DA 55%,#1E8C7E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(59,224,200,.35))}
.brand small{display:block;font-size:.26em;letter-spacing:.5em;color:var(--ink3);
  -webkit-text-fill-color:var(--ink3);margin-top:.5em}
.bootbar{width:min(420px,62cqw);height:4px;border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.07)}
.bootbar>i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .35s ease;
  box-shadow:0 0 18px rgba(59,224,200,.7)}
.boottip{font-size:13px;color:var(--ink3);letter-spacing:.06em;min-height:1.2em}

/* ---------- rotate gate: the game is landscape ---------- */
#rotate{position:absolute;inset:0;z-index:120;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#05070C;text-align:center;padding:24px}
#rotate .ph{width:74px;height:120px;border:3px solid var(--ink2);border-radius:17px;
  animation:tip 1.8s ease-in-out infinite}
@keyframes tip{0%,45%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ============================================================
   HUD. Everything is sized in cqw/cqh against the game container, so
   the interface scales as one piece with the view rather than with
   the browser window. The default screen carries four things: who you
   are, what you are holding, what you are looking at, and the clock.
   Everything else opens on demand.
   ============================================================ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;
  font-family:var(--ui);container-type:size;
  opacity:1;transition:opacity .35s ease}
/* The front end owns the screen while it is up; the HUD behind it is
   just clutter over a title card. */
#hud.hidden{opacity:0;pointer-events:none}
#hud .pe{pointer-events:auto}

/* ---- shared HUD surface ----
   One surface treatment for every panel: a dark translucent card with
   a hairline border and a very slight blue lift, so twelve separate
   panels read as one interface rather than twelve decisions. */
.hp{background:linear-gradient(180deg,rgba(17,23,36,.90),rgba(10,15,24,.88));
  border:1px solid rgba(126,160,216,.20);border-radius:14px;
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.hcap{font-size:.62cqw;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);font-weight:600}
.hicon{width:1.05cqw;height:1.05cqw;min-width:11px;min-height:11px;
  flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ---- identity ---- */
.idchip{position:absolute;left:.7cqw;top:.7cqw;display:flex;gap:.5cqw;
  align-items:center;padding:.34cqw .8cqw .34cqw .34cqw}
.idchip .av{width:2.5cqw;height:2.5cqw;min-width:28px;min-height:28px;
  border-radius:11px;background:linear-gradient(160deg,#2E3D56,#141D2B);
  border:1px solid var(--line2);display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;color:var(--acc);
  font-size:1.05cqw;letter-spacing:.04em;position:relative;overflow:hidden}
.idchip .lvbadge{position:absolute;left:0;right:0;bottom:0;
  background:rgba(6,10,16,.86);font-size:.5cqw;letter-spacing:.06em;
  color:var(--ink2);text-align:center;padding:.06cqw 0;font-family:var(--ui);
  font-weight:600}
.idchip .who{display:flex;flex-direction:column;gap:.16cqw;min-width:7.4cqw}
.idchip .nm{font-size:.86cqw;font-weight:600;color:var(--ink);line-height:1;
  white-space:nowrap}
.xpwrap{display:flex;align-items:center;gap:.34cqw}
.xpbar{height:.34cqw;min-height:4px;border-radius:99px;overflow:hidden;flex:1;
  background:rgba(4,7,12,.8);border:1px solid rgba(0,0,0,.5)}
.xpbar>i{display:block;height:100%;
  background:linear-gradient(90deg,#3FA46A,#6FE39A);
  box-shadow:0 0 8px rgba(111,227,154,.55);transition:width .4s ease}
.idchip .xpn{font-size:.56cqw;color:var(--ink3);font-variant-numeric:tabular-nums;
  white-space:nowrap}

/* ---- currency pills ---- */
.purse{position:absolute;left:12.4cqw;top:.7cqw;display:flex;gap:.42cqw}
.coin{display:flex;align-items:center;gap:.36cqw;padding:.3cqw .3cqw .3cqw .42cqw;
  font-size:.82cqw;font-weight:600;color:var(--ink);border-radius:99px;
  font-variant-numeric:tabular-nums}
.coin .dot{width:1.05cqw;height:1.05cqw;min-width:12px;min-height:12px;
  border-radius:50%;flex:0 0 auto;display:block}
.coin.c .dot{background:radial-gradient(circle at 34% 30%,#FFE9A8,#D9962A 68%,#9A6412);
  box-shadow:0 0 8px rgba(245,196,81,.5)}
.coin.g .dot{background:radial-gradient(circle at 34% 30%,#BFF3FF,#3FA9D8 66%,#1D6E96);
  border-radius:8px;transform:rotate(45deg);
  box-shadow:0 0 8px rgba(90,200,255,.5)}
.coin.s .dot{background:radial-gradient(circle at 34% 30%,#F0D2FF,#A45BE0 66%,#6B2FA0);
  box-shadow:0 0 8px rgba(178,105,255,.5)}
.coin .plus{width:1.15cqw;height:1.15cqw;min-width:14px;min-height:14px;
  border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.10);border:1px solid var(--line);
  font-size:.72cqw;line-height:1;color:var(--ink2);font-weight:700}
.coin .plus:hover{background:rgba(59,224,200,.20);color:var(--acc);
  border-color:var(--acc)}

/* ---- top-right cluster ---- */
.tools{position:absolute;right:.7cqw;top:.7cqw;display:flex;gap:.34cqw;
  align-items:stretch}
.tbtn2{width:2.1cqw;height:2.1cqw;min-width:24px;min-height:24px;
  border-radius:12px;display:grid;place-items:center;cursor:pointer;
  color:var(--ink2)}
.tbtn2:hover{color:var(--acc);border-color:var(--acc)}
.tbtn2 .hicon{width:1.15cqw;height:1.15cqw}
.online{display:flex;flex-direction:column;justify-content:center;
  padding:.2cqw .62cqw;text-align:right;line-height:1.15}
.online b{font-size:.86cqw;color:var(--acc);font-variant-numeric:tabular-nums}

/* ---- left menu ---- */
.menu{position:absolute;left:.7cqw;top:9.8cqw;width:10.2cqw;overflow:hidden}
.menu .mh{padding:.34cqw .62cqw;border-bottom:1px solid var(--line)}
.menu .mi{display:flex;align-items:center;gap:.5cqw;padding:.34cqw .62cqw;
  cursor:pointer;font-size:.8cqw;color:var(--ink2);transition:all .12s}
.menu .mi:hover{background:rgba(59,224,200,.12);color:var(--ink)}
.menu .mi.on{background:rgba(59,224,200,.16);color:var(--acc)}
.menu .mi .lbl{flex:1;white-space:nowrap}
.menu .mi .kk{font-size:.66cqw;color:var(--ink3);font-weight:700;
  min-width:1.6cqw;text-align:right}
.menu .mi:hover .kk{color:var(--acc2)}

/* ---- my world ---- */
.myworld{position:absolute;right:.7cqw;top:9.8cqw;width:11.6cqw;padding:.5cqw .62cqw;
  display:flex;flex-direction:column;gap:.3cqw}
.myworld .wn{font-size:.86cqw;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.myworld .stat{font-size:.68cqw;color:var(--ink3);display:flex;
  justify-content:space-between}
.myworld .stat b{color:var(--ink2);font-variant-numeric:tabular-nums}
.wbtn{margin-top:.16cqw;padding:.34cqw;border-radius:12px;cursor:pointer;
  font-size:.74cqw;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  text-align:center;color:#062028;border:0;font-family:var(--ui);
  background:linear-gradient(180deg,#4FE7D0,#1FA894);
  box-shadow:0 3px 12px rgba(59,224,200,.35)}
.wbtn:hover{filter:brightness(1.1)}

/* ---- build panel ---- */
.buildp{position:absolute;right:.7cqw;bottom:6.4cqw;width:13.2cqw;
  padding:.5cqw .55cqw;display:none;flex-direction:column;gap:.4cqw}
.buildp.on{display:flex}
.brow{display:flex;gap:.3cqw}
.btool{flex:1;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;
  cursor:pointer;color:var(--ink2);background:rgba(255,255,255,.045);
  border:1px solid var(--line);transition:all .12s}
.btool:hover{color:var(--ink);border-color:var(--line2)}
.btool.on{color:var(--acc);border-color:var(--acc);background:rgba(59,224,200,.14);
  box-shadow:0 0 0 1px var(--acc)}
.btool .hicon{width:1.15cqw;height:1.15cqw}
.bpal{display:grid;grid-template-columns:repeat(5,1fr);gap:.3cqw;
  max-height:9cqh;overflow-y:auto;padding-right:.15cqw}
.bpal::-webkit-scrollbar{width:5px}
.bpal::-webkit-scrollbar-thumb{background:rgba(126,160,216,.25);border-radius:6px}
.bsw{aspect-ratio:1;border-radius:11px;cursor:pointer;background-size:cover;
  border:1px solid var(--line);transition:transform .1s,border-color .1s}
.bsw:hover{transform:translateY(-1px);border-color:var(--line2)}
.bsw.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}

/* ---- bottom action bar ---- */
.actbar{position:absolute;left:50%;bottom:.55cqw;transform:translateX(-50%);
  display:flex;gap:.16cqw;padding:.24cqw .3cqw}
.act2{display:flex;align-items:center;gap:.3cqw;padding:.3cqw .68cqw;
  border-radius:12px;cursor:pointer;font-size:.74cqw;color:var(--ink3);
  white-space:nowrap;transition:all .12s}
.act2:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.act2.on{color:var(--acc);background:rgba(59,224,200,.14)}
.act2 .hicon{width:.95cqw;height:.95cqw}

/* ---- clock and weather ---- */
.clock{position:absolute;right:.7cqw;top:3.3cqw;display:flex;align-items:center;
  gap:.45cqw;padding:.28cqw .62cqw;font-size:.78cqw;color:var(--ink2);
  letter-spacing:.05em;font-variant-numeric:tabular-nums}
.clock .wx{color:var(--ink3);font-size:.66cqw;text-transform:uppercase;
  letter-spacing:.14em}

/* ---- hotbar ---- */
.hotbar{position:absolute;left:50%;bottom:2.7cqw;transform:translateX(-50%);
  display:flex;gap:.26cqw;padding:.26cqw;border-radius:10px}
.slot{position:relative;width:3.05cqw;height:3.05cqw;min-width:34px;min-height:34px;
  border-radius:12px;background:linear-gradient(165deg,rgba(40,51,70,.9),rgba(19,26,40,.9));
  border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.slot:hover{transform:translateY(-2px);border-color:var(--line2)}
.slot.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),
  0 0 16px rgba(59,224,200,.34);transform:translateY(-3px)}
.slot .ic{width:80%;height:80%;border-radius:10px;background-size:cover}
.slot .n{position:absolute;right:.14cqw;bottom:.02cqw;font-size:.6cqw;
  font-weight:700;color:var(--ink);text-shadow:0 1px 3px #000;
  font-variant-numeric:tabular-nums}
.slot .k{position:absolute;left:.18cqw;top:.02cqw;font-size:.52cqw;
  color:var(--ink3);font-weight:600}
.slot.empty .ic{opacity:.09;background:var(--ink3)}
.hmore{width:2.3cqw;height:3.05cqw;min-width:26px;border-radius:12px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink3);
  border:1px solid var(--line);background:rgba(255,255,255,.035)}
.hmore:hover{color:var(--acc);border-color:var(--acc)}

/* ---- reticle and target ---- */
.retic{position:absolute;left:50%;top:50%;width:.52cqw;height:.52cqw;
  min-width:6px;min-height:6px;margin:-.26cqw 0 0 -.26cqw;border-radius:50%;
  border:1.5px solid rgba(232,239,250,.72);
  box-shadow:0 0 0 1px rgba(0,0,0,.45);opacity:.85;transition:opacity .2s,transform .2s}
.retic.act{border-color:var(--acc);transform:scale(1.5);opacity:1}
.retic.deny{border-color:var(--danger)}

.prompt{position:absolute;left:50%;bottom:7.2cqw;transform:translateX(-50%);
  display:none;align-items:center;gap:.5cqw;padding:.4cqw .85cqw;border-radius:13px;
  font-size:.82cqw;color:var(--ink);white-space:nowrap}
.prompt.show{display:flex}
.prompt kbd{display:inline-grid;place-items:center;min-width:1.45cqw;height:1.45cqw;
  padding:0 .3cqw;border-radius:10px;background:rgba(255,255,255,.10);
  border:1px solid var(--line2);font-size:.68cqw;font-weight:700;
  font-family:var(--ui);color:var(--acc)}

/* ---- toasts ---- */
.toasts{position:absolute;right:.7cqw;top:13.6cqw;display:flex;
  flex-direction:column;gap:.34cqw;align-items:flex-end;max-width:20cqw}
.toast{padding:.4cqw .72cqw;border-radius:13px;font-size:.78cqw;
  background:rgba(14,19,30,.92);border:1px solid var(--line);color:var(--ink);
  backdrop-filter:blur(10px);animation:tin .28s ease both;
  box-shadow:0 8px 22px rgba(0,0,0,.45);display:flex;gap:.4cqw;align-items:center}
.toast.bad{border-color:rgba(255,90,110,.5);color:#FFC6CE}
.toast.good{border-color:rgba(59,224,200,.45)}
.toast .sw{width:.62cqw;height:.62cqw;min-width:7px;min-height:7px;border-radius:3px}
@keyframes tin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .3s ease both}
@keyframes tout{to{opacity:0;transform:translateX(14px)}}

/* ---- panels ---- */
.scrim{position:absolute;inset:0;background:rgba(4,6,11,.62);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);
  width:min(74cqw,1080px);max-height:82cqh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(22,29,44,.97),rgba(12,17,26,.97));
  border:1px solid var(--line2);border-radius:21px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.65);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease}
.panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel .hd{display:flex;align-items:center;gap:1cqw;padding:1.0cqw 1.3cqw;
  border-bottom:1px solid var(--line)}
.panel .hd h2{font-family:var(--disp);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:1.15cqw;color:var(--ink)}
.panel .hd .sp{flex:1}
.xbtn{width:2.2cqw;height:2.2cqw;min-width:24px;min-height:24px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);
  display:grid;place-items:center;cursor:pointer;font-size:1.0cqw;line-height:1}
.xbtn:hover{background:rgba(255,90,110,.16);color:#FFC6CE;border-color:rgba(255,90,110,.4)}
.tabs{display:flex;gap:.34cqw;flex-wrap:wrap}
.tab{padding:.38cqw .8cqw;border-radius:13px;font-size:.85cqw;cursor:pointer;
  color:var(--ink3);border:1px solid transparent;letter-spacing:.04em}
.tab:hover{color:var(--ink2);background:rgba(255,255,255,.04)}
.tab.on{color:var(--acc);border-color:var(--line2);background:rgba(59,224,200,.10)}
.panel .bd{padding:1.1cqw 1.3cqw;overflow:auto;flex:1;min-height:0}
.panel .bd::-webkit-scrollbar{width:8px}
.panel .bd::-webkit-scrollbar-thumb{background:rgba(126,160,216,.22);border-radius:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6cqw,1fr));
  gap:.5cqw}
.cell{position:relative;aspect-ratio:1;border-radius:15px;cursor:pointer;
  background:linear-gradient(165deg,rgba(38,48,66,.85),rgba(20,27,40,.85));
  border:1px solid var(--line);display:grid;place-items:center;
  transition:transform .12s,border-color .12s,box-shadow .12s}
.cell:hover{transform:translateY(-2px);border-color:var(--line2)}
.cell.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cell.worn{border-color:var(--r2);box-shadow:0 0 0 1px var(--r2)}
.cell .ic{width:74%;height:74%;border-radius:7px}
.cell .n{position:absolute;right:.2cqw;bottom:.1cqw;font-size:.68cqw;font-weight:700;
  color:var(--ink);text-shadow:0 1px 3px #000}
.cell .rr{position:absolute;left:0;right:0;top:0;height:2px;border-radius:10px 10px 0 0}

.detail{display:flex;gap:1.1cqw;padding:.9cqw 0 0}
.detail .big{width:8cqw;height:8cqw;border-radius:17px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);display:grid;place-items:center;flex:0 0 auto}
.detail .big .ic{width:78%;height:78%;border-radius:9px}
.detail .txt{flex:1;min-width:0}
.detail h3{font-size:1.15cqw;font-weight:700;margin-bottom:.2cqw}
.detail .rt{font-size:.78cqw;letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:.5cqw}
.detail p{font-size:.88cqw;color:var(--ink2);line-height:1.5;margin-bottom:.5cqw}
.detail .meta{display:flex;gap:1.1cqw;flex-wrap:wrap;font-size:.82cqw;color:var(--ink3)}
.detail .meta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:.5cqw;margin-top:.7cqw;flex-wrap:wrap}
.btn{padding:.46cqw 1.0cqw;border-radius:14px;font-size:.86cqw;font-weight:600;
  letter-spacing:.05em;cursor:pointer;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ink);transition:all .14s}
.btn:hover{background:rgba(59,224,200,.14);border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(180deg,rgba(59,224,200,.22),rgba(21,156,137,.22));
  border-color:var(--acc);color:var(--acc)}
.btn.dim{color:var(--ink3);border-color:var(--line)}
.btn.dim:hover{color:var(--ink2);background:rgba(255,255,255,.06);border-color:var(--line2)}
.btn[disabled]{opacity:.38;pointer-events:none}

.empty-note{padding:2.4cqw;text-align:center;color:var(--ink3);font-size:.95cqw}

/* ============================================================
   FRONT END — title, character creation, and the first minutes.
   Full-frame overlays that own the boot flow. The world renders
   behind them from the first frame, so character creation is a
   live preview rather than a separate screen.
   ============================================================ */
#front{position:absolute;inset:0;z-index:70;display:none;
  pointer-events:auto}
#front.on{display:block}
#front .veil{position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(4,7,13,.94) 0%,rgba(4,7,13,.86) 38%,
    rgba(4,7,13,.30) 66%,rgba(4,7,13,.10) 100%)}
#front .pane{position:absolute;left:0;top:0;bottom:0;width:min(38cqw,560px);
  padding:3.2cqw 3.0cqw;display:flex;flex-direction:column;
  justify-content:center;gap:1.1cqw}
.fbrand{font-family:var(--disp);font-weight:700;letter-spacing:.20em;
  font-size:clamp(26px,3.4cqw,54px);text-transform:uppercase;line-height:1;
  background:linear-gradient(180deg,#EAF6FF 0%,#7FE9DA 55%,#1E8C7E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(59,224,200,.32))}
.fsub{font-size:.92cqw;letter-spacing:.30em;text-transform:uppercase;
  color:var(--ink3);margin-top:-.4cqw}
.fbody{font-size:.95cqw;line-height:1.6;color:var(--ink2);max-width:30cqw}
.fstep{font-size:.74cqw;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acc2)}
.frow{display:flex;gap:.5cqw;flex-wrap:wrap;align-items:center}
.fbtn{padding:.66cqw 1.5cqw;border-radius:15px;font-size:.98cqw;font-weight:600;
  letter-spacing:.06em;cursor:pointer;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--ink);transition:all .15s;
  font-family:var(--ui)}
.fbtn:hover{background:rgba(59,224,200,.14);border-color:var(--acc);color:var(--acc)}
.fbtn.pri{background:linear-gradient(180deg,rgba(59,224,200,.26),rgba(21,156,137,.22));
  border-color:var(--acc);color:#0B1018;font-weight:700}
.fbtn.pri:hover{filter:brightness(1.12)}
.fbtn[disabled]{opacity:.4;pointer-events:none}
.finp{width:100%;background:rgba(6,9,14,.7);border:1px solid var(--line);
  border-radius:15px;color:var(--ink);font-family:var(--ui);font-size:1.05cqw;
  padding:.66cqw .9cqw;outline:0}
.finp:focus{border-color:var(--acc)}
.swatches{display:flex;gap:.42cqw;flex-wrap:wrap}
.sw2{width:2.1cqw;height:2.1cqw;min-width:22px;min-height:22px;border-radius:13px;
  cursor:pointer;border:2px solid transparent;transition:transform .12s}
.sw2:hover{transform:scale(1.1)}
.sw2.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(59,224,200,.3)}
.optrow{display:flex;gap:.4cqw;flex-wrap:wrap}
.opt{padding:.4cqw .8cqw;border-radius:13px;font-size:.84cqw;cursor:pointer;
  border:1px solid var(--line);color:var(--ink2);transition:all .13s;
  text-transform:capitalize}
.opt:hover{border-color:var(--line2);color:var(--ink)}
.opt.on{border-color:var(--acc);color:var(--acc);background:rgba(59,224,200,.10)}
.flabel{font-size:.76cqw;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.24cqw}
/* The wardrobe is taller than the pane once every slot is exposed, so
   the detail rows scroll inside their own box rather than pushing the
   Continue button off the bottom of the screen. */
.fscroll{max-height:40cqh;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:.9cqw;padding-right:.7cqw;
  /* fade the cut edge, so a half-visible row reads as "more below"
     rather than as a layout that ran out of room */
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 90%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 90%,transparent 100%)}
.fscroll::-webkit-scrollbar{width:6px}
.fscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.fnote{font-size:.88cqw;line-height:1.5;color:var(--ink3);font-style:italic;
  border-left:2px solid var(--acc);padding-left:.7cqw;max-width:30cqw}

/* the guided first steps, as a small card in the corner */
.guide{position:absolute;right:.7cqw;bottom:6.4cqw;width:min(13.2cqw,240px);
  padding:.9cqw 1.0cqw;border-radius:18px;display:none;
  background:linear-gradient(180deg,rgba(20,27,42,.94),rgba(10,15,24,.92));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 12px 34px rgba(0,0,0,.5)}
.guide.on{display:block;animation:tin .3s ease both}
.guide .st{font-size:.7cqw;letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc2);margin-bottom:.24cqw}
.guide h4{font-size:1.0cqw;font-weight:700;margin-bottom:.3cqw}
.guide p{font-size:.86cqw;line-height:1.5;color:var(--ink2)}
.guide .pg{height:.3cqw;min-height:4px;border-radius:99px;margin-top:.55cqw;
  background:rgba(255,255,255,.08);overflow:hidden}
.guide .pg>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}

@container app (max-width: 700px){
  #front .pane{width:74cqw;padding:6cqw 5cqw}
  .fbody{max-width:64cqw;font-size:13px}
  .guide{width:44cqw;bottom:16cqw;font-size:12px}
}

/* ---- worlds ---- */
.wcard{display:flex;gap:1.0cqw;align-items:center;padding:.85cqw 1.0cqw;
  border-radius:17px;border:1px solid var(--line);margin-bottom:.6cqw;
  background:rgba(255,255,255,.03);cursor:pointer;transition:all .14s}
.wcard:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.wcard .badge{width:3.6cqw;height:3.6cqw;min-width:38px;min-height:38px;
  border-radius:15px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--disp);font-size:1.1cqw;color:#0B1018;font-weight:700}
.wcard .wi{flex:1;min-width:0}
.wcard h4{font-size:1.02cqw;font-weight:600}
.wcard .sub{font-size:.8cqw;color:var(--ink3);letter-spacing:.04em}
.wcard .perm{font-size:.7cqw;letter-spacing:.14em;text-transform:uppercase;
  padding:.16cqw .55cqw;border-radius:11px;border:1px solid var(--line);
  color:var(--ink2)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(8cqw,1fr));
  gap:.5cqw;margin:.6cqw 0}
.theme{padding:.7cqw;border-radius:15px;border:1px solid var(--line);
  cursor:pointer;text-align:center;font-size:.86cqw;transition:all .14s}
.theme:hover{border-color:var(--line2)}
.theme.on{border-color:var(--acc);background:rgba(59,224,200,.10);color:var(--acc)}
.theme .sw{height:.7cqw;border-radius:99px;margin-bottom:.34cqw}
.field{display:flex;gap:.5cqw;align-items:center;margin:.5cqw 0}
.field input{flex:1;background:rgba(6,9,14,.7);border:1px solid var(--line);
  border-radius:14px;color:var(--ink);font-family:var(--ui);font-size:.92cqw;
  padding:.5cqw .8cqw;outline:0}
.field input:focus{border-color:var(--acc)}

/* travel fade: entering a world regenerates the terrain, and the cut
   is hidden behind this rather than shown */
#travel{position:absolute;inset:0;z-index:60;background:#05070C;opacity:0;
  pointer-events:none;transition:opacity .34s ease;display:grid;
  place-items:center}
#travel.on{opacity:1;pointer-events:auto}
#travel .lbl{font-family:var(--disp);letter-spacing:.24em;font-size:1.2cqw;
  text-transform:uppercase;color:var(--ink3)}

/* ---- missions ---- */
.mrow{display:flex;gap:.9cqw;align-items:center;padding:.7cqw .9cqw;
  border-radius:16px;border:1px solid var(--line);margin-bottom:.5cqw;
  background:rgba(255,255,255,.028)}
.mrow.done{border-color:rgba(87,208,122,.42);background:rgba(87,208,122,.07)}
.mrow .mi{flex:1;min-width:0}
.mrow h4{font-size:.98cqw;font-weight:600;margin-bottom:.14cqw}
.mrow p{font-size:.82cqw;color:var(--ink2);margin-bottom:.34cqw}
.mrow .rw{font-size:.76cqw;color:var(--gold);letter-spacing:.04em}
.mrow .pg{height:.42cqw;min-height:5px;border-radius:99px;
  background:rgba(6,9,14,.7);overflow:hidden;border:1px solid var(--line)}
.mrow .pg>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc))}
.mrow .ct{font-size:.76cqw;color:var(--ink3);min-width:4cqw;text-align:right}
.mtype{font-size:.66cqw;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);padding:.16cqw .5cqw;border-radius:11px;
  border:1px solid var(--line);white-space:nowrap}

/* ---- NPC dialogue ---- */
.dlg{position:absolute;left:50%;bottom:9.4cqw;transform:translateX(-50%);
  width:min(46cqw,720px);display:none;gap:1.0cqw;padding:1.0cqw 1.2cqw;
  border-radius:19px;
  background:linear-gradient(180deg,rgba(20,27,42,.96),rgba(10,15,24,.95));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 16px 44px rgba(0,0,0,.55)}
.dlg.on{display:flex}
.dlg .face{width:4.4cqw;height:4.4cqw;min-width:46px;min-height:46px;
  border-radius:16px;flex:0 0 auto;
  background:linear-gradient(160deg,#2C3A52,#151E2C);
  border:1px solid var(--line2);display:grid;place-items:center;
  font-family:var(--disp);font-size:1.6cqw;color:var(--acc)}
.dlg .txt{flex:1;min-width:0}
.dlg .who{font-size:.98cqw;font-weight:700}
.dlg .role{font-size:.72cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.4cqw}
.dlg .line{font-size:.95cqw;line-height:1.5;color:var(--ink)}
.dlg .offer{font-size:.86cqw;color:var(--acc);margin-top:.4cqw}
.dlg .cls{font-size:.76cqw;color:var(--ink3);margin-top:.5cqw}

/* ---- chat ----
   Bottom-left, tabbed by channel, with the channel tag colour-coded in
   the line itself so you can read who is talking to whom at a glance
   without parsing the tab you happen to be on. */
.chat{position:absolute;left:.7cqw;bottom:2.7cqw;width:min(19cqw,300px);
  display:flex;flex-direction:column;overflow:hidden;
  transition:opacity .2s}
.chat .tabs2{display:flex;align-items:center;gap:.16cqw;padding:.2cqw .24cqw;
  border-bottom:1px solid var(--line)}
.chat .ct{padding:.16cqw .5cqw;border-radius:10px;font-size:.66cqw;cursor:pointer;
  color:var(--ink3);letter-spacing:.04em}
.chat .ct:hover{color:var(--ink2);background:rgba(255,255,255,.05)}
.chat .ct.on{color:var(--acc);background:rgba(59,224,200,.14)}
.chat .cx{margin-left:auto;padding:0 .34cqw;color:var(--ink3);cursor:pointer;
  font-size:.72cqw}
.chat .cx:hover{color:var(--danger)}
.chat .log{height:7.6cqw;min-height:76px;overflow:auto;padding:.3cqw .5cqw;
  display:flex;flex-direction:column;gap:.1cqw}
.chat .log::-webkit-scrollbar{width:4px}
.chat .log::-webkit-scrollbar-thumb{background:rgba(126,160,216,.22);border-radius:6px}
.chat .ln{font-size:.7cqw;line-height:1.4;color:var(--ink2);word-break:break-word}
.chat .ln .tag{font-weight:600;margin-right:.22cqw}
.chat .ln .tag.world{color:#5BC8FF}
.chat .ln .tag.global{color:#8FA4C4}
.chat .ln .tag.trade{color:#F5C451}
.chat .ln .tag.clan{color:#9BE87F}
.chat .ln .tag.system{color:#B269FF}
.chat .ln b{color:var(--ink)}
.chat .inp{display:flex;border-top:1px solid var(--line)}
.chat input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);
  font-family:var(--ui);font-size:.72cqw;padding:.34cqw .5cqw}
.chat input::placeholder{color:var(--ink3)}
.chat.dim{opacity:.42}
.chat.dim:hover{opacity:1}

/* ---- vitals and the fishing rig ---- */
.vitals{position:absolute;left:.7cqw;top:4.0cqw;width:12.2cqw;display:none}
.vitals.on{display:block}
.bar{height:.55cqw;min-height:7px;border-radius:99px;overflow:hidden;
  background:rgba(4,7,12,.8);border:1px solid rgba(0,0,0,.5);position:relative}
.bar>i{display:block;height:100%;transition:width .22s ease}
.bar .lbl{position:absolute;inset:0;display:grid;place-items:center;
  font-size:.5cqw;font-weight:700;letter-spacing:.08em;color:var(--ink);
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bar.hp>i{background:linear-gradient(90deg,#B22C42,#FF6478);
  box-shadow:0 0 8px rgba(255,100,120,.5)}

.fishrig{position:absolute;left:50%;bottom:6.6cqw;transform:translateX(-50%);
  width:min(30cqw,460px);display:none;flex-direction:column;gap:.5cqw;
  padding:.8cqw 1.0cqw;border-radius:19px;
  background:linear-gradient(180deg,rgba(20,27,42,.94),rgba(10,15,24,.92));
  border:1px solid var(--line2);backdrop-filter:blur(12px);
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
.fishrig.on{display:flex}
.fishrig .cap{font-size:.82cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:flex;justify-content:space-between}
.fishrig .cap b{color:var(--acc);letter-spacing:.06em;text-transform:none}
.prog{height:1.1cqw;min-height:12px;border-radius:99px;overflow:hidden;
  background:rgba(6,9,14,.8);border:1px solid var(--line);position:relative}
.prog>i{display:block;height:100%;
  background:linear-gradient(90deg,var(--acc2),var(--acc));
  box-shadow:0 0 14px rgba(59,224,200,.55)}
.strain{height:.62cqw;min-height:7px;border-radius:99px;overflow:hidden;
  background:rgba(6,9,14,.8);border:1px solid var(--line)}
.strain>i{display:block;height:100%;
  background:linear-gradient(90deg,#3FA46A,#F5C451 62%,#FF4F7A)}
.strain.hot{animation:strainPulse .28s ease-in-out infinite alternate}
@keyframes strainPulse{to{box-shadow:0 0 14px rgba(255,79,122,.8)}}
.fishrig .hint{font-size:.80cqw;color:var(--ink2);text-align:center;min-height:1.1em}
.fishrig .runs{color:#FFB86A;font-weight:700}

/* the catch card */
.catch{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  display:none;flex-direction:column;align-items:center;gap:.5cqw;
  padding:1.3cqw 2.0cqw;border-radius:21px;
  background:linear-gradient(180deg,rgba(22,29,44,.97),rgba(12,17,26,.97));
  border:1px solid var(--line2);opacity:0;transition:all .3s ease;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.catch.on{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.catch .ic{width:7cqw;height:7cqw;background-size:cover;border-radius:12px}
.catch h3{font-size:1.4cqw;font-weight:700}
.catch .w{font-size:1.0cqw;color:var(--ink2)}
.catch .r{font-size:.78cqw;letter-spacing:.18em;text-transform:uppercase}

/* floating damage numbers */
.dmg{position:absolute;font-family:var(--disp);font-weight:700;
  font-size:1.3cqw;color:#FFD9A0;text-shadow:0 2px 6px rgba(0,0,0,.8);
  pointer-events:none;animation:dfloat .9s ease-out both}
.dmg.crit{font-size:1.9cqw;color:#FFE9A8}
.dmg.hurt{color:#FF7A8E}
@keyframes dfloat{from{opacity:1;transform:translate(-50%,0)}
  to{opacity:0;transform:translate(-50%,-3.4cqw)}}

/* enemy nameplate */
.plate{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:.16cqw}
.plate .nm{font-size:.76cqw;font-weight:600;color:var(--ink);
  text-shadow:0 2px 5px rgba(0,0,0,.9);white-space:nowrap}
.plate .hb{width:5.5cqw;height:.34cqw;min-height:4px;border-radius:99px;
  background:rgba(6,9,14,.8);border:1px solid rgba(0,0,0,.6);overflow:hidden}
.plate .hb>i{display:block;height:100%;background:linear-gradient(90deg,#C4344A,#FF6478)}
.plate.boss .hb{width:9cqw}
.plate.boss .nm{color:#FFC46A}

/* ---- touch ----
   Only present on a coarse pointer. Left thumb steers, right thumb
   looks, and the action cluster sits under the right thumb rather
   than in a corner it cannot reach. */
.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch.on{display:block}
.tstick{position:absolute;width:26cqh;height:26cqh;border-radius:50%;
  border:2px solid rgba(232,239,250,.18);pointer-events:none;
  opacity:0;transition:opacity .18s}
.tstick.on{opacity:1}
.tstick>i{position:absolute;left:50%;top:50%;width:38%;height:38%;
  margin:-19% 0 0 -19%;border-radius:50%;
  background:rgba(232,239,250,.24);border:1px solid rgba(232,239,250,.42)}
.tbtn{position:absolute;border-radius:50%;pointer-events:auto;
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;
  letter-spacing:.06em;color:var(--ink);
  background:linear-gradient(165deg,rgba(38,48,66,.86),rgba(18,25,38,.86));
  border:1px solid var(--line2);backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,.45);user-select:none;
  transition:transform .1s,background .1s}
.tbtn:active{transform:scale(.92);background:rgba(59,224,200,.22)}
.tbtn.big{width:13cqh;height:13cqh;font-size:1.5cqh;right:4cqh;bottom:13cqh}
.tbtn.mid{width:9.5cqh;height:9.5cqh;font-size:1.2cqh}
.tbtn.jump{right:17.5cqh;bottom:16cqh}
.tbtn.act{right:5.5cqh;bottom:27cqh}
.tbtn.menu{width:7cqh;height:7cqh;font-size:1cqh;right:2.5cqh;top:2.5cqh}

/* ---- trading ---- */
.tradewrap{display:flex;gap:1.1cqw}
.tradeside{flex:1;min-width:0;border:1px solid var(--line);border-radius:17px;
  padding:.8cqw;background:rgba(255,255,255,.025)}
.tradeside h4{font-size:.92cqw;font-weight:600;margin-bottom:.5cqw;
  display:flex;justify-content:space-between;align-items:center}
.tradeside h4 .v{color:var(--gold);font-size:.86cqw}
.tradegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.42cqw}
.tradegrid .cell{aspect-ratio:1}
.tradeside.locked{border-color:rgba(87,208,122,.5);
  background:rgba(87,208,122,.06)}
.tradebar{display:flex;gap:.6cqw;align-items:center;margin-top:.9cqw}
.tradebar .note{flex:1;font-size:.84cqw;color:var(--ink2)}
.tradetimer{height:.34cqw;border-radius:99px;background:rgba(6,9,14,.7);
  overflow:hidden;margin-top:.6cqw;border:1px solid var(--line)}
.tradetimer>i{display:block;height:100%;background:var(--acc);transition:width 1s linear}

/* ---- emote wheel ---- */
.wheel{position:absolute;inset:0;z-index:34;display:none;
  place-items:center;background:rgba(5,8,14,.44)}
.wheel.on{display:grid}
.wheel .ring{position:relative;width:30cqw;height:30cqw;
  min-width:280px;min-height:280px}
.wheel .em{position:absolute;transform:translate(-50%,-50%);
  width:7.4cqw;height:7.4cqw;min-width:74px;min-height:74px;
  display:grid;place-items:center;gap:.1cqw;border-radius:99px;
  border:1px solid var(--line2);background:var(--panel2);cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.wheel .em:hover{transform:translate(-50%,-50%) scale(1.14);
  border-color:var(--acc);background:rgba(79,227,176,.16)}
.wheel .em b{font-size:2.1cqw;line-height:1;min-font-size:20px}
.wheel .em span{font-size:.62cqw;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink2)}
.wheel .em i{position:absolute;top:.3cqw;right:.7cqw;font-style:normal;

  var l=Math.sqrt(tx*tx+ty*ty+tz*tz)||1;
  this.v.push(px,py,pz,tx/l,ty/l,tz/l,u,vv,c[0],c[1],c[2],
    this.layer,this.emis,this.layer2,this.blend);
  if(this.skinning){
    var w=this.sw;
    this.sk.push(w[0],w[1],w[2],w[3],w[4],w[5],w[6],w[7]);
  }
  return this.n++;
};
Builder.prototype.tri=function(a,b,c){this.i.push(a,b,c);return this;};
Builder.prototype.quad=function(a,b,c,d){this.i.push(a,b,c,a,c,d);return this;};

/* ---------------- primitives ---------------- */
/* A box centred on (x,y,z). `uvScale` maps world units to texture
   repeats so a long wall doesn't stretch its bricks. */
Builder.prototype.box=function(x,y,z,w,h,d,c,o){
  o=o||{};
  var col=col3(c),hw=w/2,hh=h/2,hd=d/2;
  var us=o.uvScale||1;
  var skip=o.skip||0;   /* bitmask: 1+X 2-X 4+Y 8-Y 16+Z 32-Z */
  var self=this;
  function face(bit,nx,ny,nz,p0,p1,p2,p3,uw,uh){
    if(skip&bit)return;
    var a=self.vert(p0[0],p0[1],p0[2],nx,ny,nz,0,0,col);
    var b=self.vert(p1[0],p1[1],p1[2],nx,ny,nz,uw*us,0,col);
    var cc=self.vert(p2[0],p2[1],p2[2],nx,ny,nz,uw*us,uh*us,col);
    var dd=self.vert(p3[0],p3[1],p3[2],nx,ny,nz,0,uh*us,col);
    self.quad(a,b,cc,dd);
  }
  var X0=x-hw,X1=x+hw,Y0=y-hh,Y1=y+hh,Z0=z-hd,Z1=z+hd;
  face(1, 1,0,0,[X1,Y0,Z1],[X1,Y0,Z0],[X1,Y1,Z0],[X1,Y1,Z1],d,h);
  face(2,-1,0,0,[X0,Y0,Z0],[X0,Y0,Z1],[X0,Y1,Z1],[X0,Y1,Z0],d,h);
  face(4, 0,1,0,[X0,Y1,Z1],[X1,Y1,Z1],[X1,Y1,Z0],[X0,Y1,Z0],w,d);
  face(8, 0,-1,0,[X0,Y0,Z0],[X1,Y0,Z0],[X1,Y0,Z1],[X0,Y0,Z1],w,d);
  face(16,0,0,1,[X0,Y0,Z1],[X1,Y0,Z1],[X1,Y1,Z1],[X0,Y1,Z1],w,h);
  face(32,0,0,-1,[X1,Y0,Z0],[X0,Y0,Z0],[X0,Y1,Z0],[X1,Y1,Z0],w,h);
  return this;
};

/* A box with chamfered edges. Cheap, and it is most of why a
   procedural prop stops reading as programmer art: real objects do
   not have infinitely sharp corners, and the chamfer catches a
   highlight along every edge. */
Builder.prototype.chamfer=function(x,y,z,w,h,d,c,bevel,o){
  o=o||{};
  var b=Math.min(bevel,w/2.6,h/2.6,d/2.6);
  var col=col3(c);
  var hw=w/2,hh=h/2,hd=d/2;
  var self=this;
  /* six insets faces + twelve edge quads + eight corner tris.
     Built from a signed-corner table so it stays compact. */
  function V(px,py,pz,nx,ny,nz,u,vv){return self.vert(px,py,pz,nx,ny,nz,u,vv,col);}
  var us=o.uvScale||1;
  // ---- main faces (inset by bevel on their two tangent axes)
  var faces=[
    [ 1,0,0, hw,  hd-b,hh-b, 'x'],
    [-1,0,0,-hw,  hd-b,hh-b, 'x'],
    [0, 1,0, hh,  hw-b,hd-b, 'y'],
    [0,-1,0,-hh,  hw-b,hd-b, 'y'],
    [0,0, 1, hd,  hw-b,hh-b, 'z'],
    [0,0,-1,-hd,  hw-b,hh-b, 'z']
  ];
  for(var f=0;f<faces.length;f++){
    var F=faces[f],nx=F[0],ny=F[1],nz=F[2],off=F[3],e0=F[4],e1=F[5],ax=F[6];
    var pts=[];
    for(var q=0;q<4;q++){
      var s0=(q===0||q===3)?-1:1, s1=(q<2)?-1:1;
      var px,py,pz;
      if(ax==='x'){px=x+off;py=y+s1*e1;pz=z+s0*e0;}
      else if(ax==='y'){px=x+s0*e0;py=y+off;pz=z+s1*e1;}
      else {px=x+s0*e0;py=y+s1*e1;pz=z+off;}
      pts.push([px,py,pz,(s0*0.5+0.5)*e0*2*us,(s1*0.5+0.5)*e1*2*us]);
    }
    /* wind so the normal points outward */
    var flip=(nx+ny+nz)<0;
    var order=flip?[0,3,2,1]:[0,1,2,3];
    var ids=[];
    for(var k=0;k<4;k++){var P=pts[order[k]];ids.push(V(P[0],P[1],P[2],nx,ny,nz,P[3],P[4]));}
    this.quad(ids[0],ids[1],ids[2],ids[3]);
  }
  /* The bevel band itself: rather than exact geometry, ring the box
     with a slightly shrunken shell whose normals are averaged. At the
     sizes these props are drawn it is indistinguishable and costs a
     fraction of the triangles. */
  var inner=o.noBand?null:1;
  if(inner){
    var corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
    /* four vertical edge quads */
    for(var e=0;e<4;e++){
      var c0=corners[e],c1=corners[(e+1)%4];
      var sx0=c0[0],sz0=c0[1],sx1=c1[0],sz1=c1[1];
      var n0x=sx0*0.7071,n0z=sz0*0.7071,n1x=sx1*0.7071,n1z=sz1*0.7071;
      var A=V(x+sx0*hw,y-(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,0);
      var B=V(x+sx1*(hw-b),y-(hh-b),z+sz1*hd,n1x,0,n1z,1,0);
      var C=V(x+sx1*(hw-b),y+(hh-b),z+sz1*hd,n1x,0,n1z,1,1);
      var D=V(x+sx0*hw,y+(hh-b),z+sz0*(hd-b),n0x,0,n0z,0,1);
      /* winding depends on which quadrant we are in */
      if((sx0*sz1-sz0*sx1)>0)this.quad(A,B,C,D);else this.quad(A,D,C,B);
    }
  }
  return this;
};

/* A subdivided plane in XZ. `fn(x,z,u,v)` may return {y,c,layer} to
   displace and recolour it, which is how terrain, riverbeds and
   plaza slopes are all built from the same call. Normals come from
   central differences on the displaced height rather than the flat
   (0,1,0), or hills would light as if they were level ground. */
Builder.prototype.plane=function(x,y,z,w,d,c,segs,uvScale,fn){
  segs=segs||1;uvScale=uvScale===undefined?1:uvScale;
  var col=col3(c),base=this.n;
  var hs=null,cols=null,lays=null;
  var stride=segs+1;
  if(fn){hs=new Float32Array(stride*stride);}
  var i,j;
  /* first pass: sample, so normals can look at their neighbours */
  if(fn){
    cols=new Array(stride*stride);lays=new Array(stride*stride);
    for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
      var px0=x+(i/segs-0.5)*w,pz0=z+(j/segs-0.5)*d;
      var r=fn(px0,pz0,i/segs,j/segs);
      var k=j*stride+i;
      hs[k]=(r&&r.y!==undefined)?r.y:y;
      cols[k]=(r&&r.c)?col3(r.c):col;
      lays[k]=(r&&r.layer!==undefined)?r.layer:null;
    }
  }
  var dx=w/segs,dz=d/segs;
  var savedLayer=this.layer;
  for(j=0;j<=segs;j++)for(i=0;i<=segs;i++){
    var fx=i/segs,fz=j/segs;
    var px=x+(fx-0.5)*w,pz=z+(fz-0.5)*d,py=y;
    var cc=col,nx=0,ny=1,nz=0;
    if(fn){
      var kk=j*stride+i;
      py=hs[kk];cc=cols[kk];
      if(lays[kk]!==null)this.layer=lays[kk];
      var hL=hs[j*stride+Math.max(0,i-1)],hR=hs[j*stride+Math.min(segs,i+1)];
      var hD=hs[Math.max(0,j-1)*stride+i],hU=hs[Math.min(segs,j+1)*stride+i];
      var spanX=(Math.min(segs,i+1)-Math.max(0,i-1))*dx;
      var spanZ=(Math.min(segs,j+1)-Math.max(0,j-1))*dz;
      nx=-(hR-hL)/(spanX||dx);
      nz=-(hU-hD)/(spanZ||dz);
      ny=1;
      var nl=Math.sqrt(nx*nx+1+nz*nz);
      nx/=nl;ny/=nl;nz/=nl;
    }
    this.vert(px,py,pz,nx,ny,nz,fx*uvScale,fz*uvScale,cc);
    if(fn)this.layer=savedLayer;
  }
  /* Wind counter-clockwise seen from above: a→(x0,z1)→(x1,z1)→(x1,z0)
     puts the face normal at +Y. The obvious ordering gives -Y and the
     whole surface vanishes into the back-face cull. */
  for(var jj=0;jj<segs;jj++)for(var ii=0;ii<segs;ii++){
    var a=base+jj*stride+ii,b=a+1,cq=a+stride,d2=cq+1;
    this.quad(a,cq,d2,b);
  }
  return this;
};

Builder.prototype.cylinder=function(x,y,z,r0,r1,h,seg,c,o){
  o=o||{};seg=seg||12;
  var col=col3(c),hh=h/2,base=this.n;
  var slope=(r0-r1)/h;
  for(var i=0;i<=seg;i++){
    var a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a);
    var nl=Math.sqrt(1+slope*slope);
    var nx=ca/nl,ny=slope/nl,nz=sa/nl;
    this.vert(x+ca*r0,y-hh,z+sa*r0,nx,ny,nz,i/seg*(o.uvScale||1),0,col);
    this.vert(x+ca*r1,y+hh,z+sa*r1,nx,ny,nz,i/seg*(o.uvScale||1),(o.uvScale||1),col);
  }
  /* same winding rule as loft: up the wall first, then around */
  for(var k=0;k<seg;k++){
    var p=base+k*2;
    this.quad(p,p+1,p+3,p+2);
  }
  if(!o.open){
    if(r1>1e-5){
      var ct=this.vert(x,y+hh,z,0,1,0,.5,.5,col),t0=this.n;
      for(var t=0;t<=seg;t++){var aa=t/seg*TAU;
        this.vert(x+Math.cos(aa)*r1,y+hh,z+Math.sin(aa)*r1,0,1,0,
          Math.cos(aa)*.5+.5,Math.sin(aa)*.5+.5,col);}
      for(var t2=0;t2<seg;t2++)this.tri(ct,t0+t2+1,t0+t2);
    }
    if(r0>1e-5){
      var cb=this.vert(x,y-hh,z,0,-1,0,.5,.5,col),b0=this.n;
      for(var u=0;u<=seg;u++){var ab=u/seg*TAU;
        this.vert(x+Math.cos(ab)*r0,y-hh,z+Math.sin(ab)*r0,0,-1,0,
          Math.cos(ab)*.5+.5,Math.sin(ab)*.5+.5,col);}
      for(var u2=0;u2<seg;u2++)this.tri(cb,b0+u2,b0+u2+1);
    }
  }
  return this;
};

Builder.prototype.sphere=function(x,y,z,r,seg,rings,c,o){
  o=o||{};seg=seg||14;rings=rings||10;
  var col=col3(c),base=this.n;
  var sy=o.squash||1;
  for(var j=0;j<=rings;j++){
    var v=j/rings,phi=v*Math.PI,sp=Math.sin(phi),cp=Math.cos(phi);
    for(var i=0;i<=seg;i++){
      var u=i/seg,th=u*TAU,st=Math.sin(th),ct=Math.cos(th);
      var nx=sp*ct,ny=cp,nz=sp*st;
      this.vert(x+nx*r,y+ny*r*sy,z+nz*r,nx,ny/sy,nz,u,v,col);

  }
  for(var jj=0;jj<rings;jj++)for(var ii=0;ii<seg;ii++){
    var a=base+jj*(seg+1)+ii,b=a+seg+1;
    this.quad(a,a+1,b+1,b);
  }
  return this;
};

/* A capsule is the character's collision shape and also, squashed and
   coloured, most of a limb. */
Builder.prototype.capsule=function(x,y,z,r,h,seg,c){
  seg=seg||10;
  var half=Math.max(0,h/2-r);
  this.cylinder(x,y,z,r,r,half*2,seg,c,{open:true});
  this.push().translate(x,y+half,z).scale(1,1,1);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  this.push().translate(x,y-half,z);
  this.sphere(0,0,0,r,seg,seg/2|0,c);this.pop();
  return this;
};

/* Sweep a 2D outline into a solid. This is how railings, rooftops,
   boat hulls and sign frames get made without hand-listing vertices. */
Builder.prototype.extrude=function(pts,depth,c,o){
  o=o||{};
  var col=col3(c),hd=depth/2,n=pts.length,base=this.n;
  /* front + back caps via fan from the centroid — outlines here are
     always convex or near enough that a fan is safe */
  var cx=0,cy=0;
  for(var i=0;i<n;i++){cx+=pts[i][0];cy+=pts[i][1];}
  cx/=n;cy/=n;
  var fc=this.vert(cx,cy,hd,0,0,1,.5,.5,col);
  for(var a=0;a<n;a++)this.vert(pts[a][0],pts[a][1],hd,0,0,1,pts[a][0],pts[a][1],col);
  var bc=this.vert(cx,cy,-hd,0,0,-1,.5,.5,col);
  for(var b=0;b<n;b++)this.vert(pts[b][0],pts[b][1],-hd,0,0,-1,pts[b][0],pts[b][1],col);
  var f0=fc+1,b0=bc+1;
  for(var k=0;k<n;k++){
    var k2=(k+1)%n;
    this.tri(fc,f0+k,f0+k2);
    this.tri(bc,b0+k2,b0+k);
  }
  /* the side wall */
  for(var s=0;s<n;s++){
    var s2=(s+1)%n;
    var dx=pts[s2][0]-pts[s][0],dy=pts[s2][1]-pts[s][1];
    var l=Math.hypot(dx,dy)||1;
    var nx=dy/l,ny=-dx/l;
    var A=this.vert(pts[s][0],pts[s][1],hd,nx,ny,0,0,0,col);
    var B=this.vert(pts[s2][0],pts[s2][1],hd,nx,ny,0,l,0,col);
    var C=this.vert(pts[s2][0],pts[s2][1],-hd,nx,ny,0,l,depth,col);
    var D=this.vert(pts[s][0],pts[s][1],-hd,nx,ny,0,0,depth,col);
    this.quad(A,D,C,B);
  }
  return this;
};

/* ---------------- lofting ----------------
   Stitch a stack of cross-sections into a surface. This is the single
   most useful builder in the file: torsos, limbs, boat hulls, tree
   trunks, fish and rooftops are all a list of outlines at increasing
   heights. Every section needs the same point count so the rings
   correspond; the helpers below all take `n` for exactly that reason. */

/* a circle, for limbs and trunks */
Geo.circle=function(r,n,sx,sz){
  sx=sx===undefined?1:sx;sz=sz===undefined?1:sz;
  var out=[];
  for(var i=0;i<n;i++){
    var a=i/n*TAU;
    out.push([Math.cos(a)*r*sx,Math.sin(a)*r*sz]);
  }
  return out;
};
/* a rounded rectangle, for torsos and anything built rather than grown */
Geo.roundRect=function(w,d,r,n){
  var hw=Math.max(0.0001,w/2-r),hd=Math.max(0.0001,d/2-r);
  var out=[],per=Math.max(1,Math.floor(n/4));
  var corners=[[hw,hd,0],[-hw,hd,Math.PI/2],[-hw,-hd,Math.PI],[hw,-hd,-Math.PI/2]];
  for(var c=0;c<4;c++){
    var cc=corners[c];
    for(var i=0;i<per;i++){
      var a=cc[2]+(i/per)*(Math.PI/2);
      out.push([cc[0]+Math.cos(a)*r,cc[1]+Math.sin(a)*r]);
    }
  }
  /* pad to exactly n so sections always line up */
  while(out.length<n)out.push(out[out.length-1].slice());
  return out.slice(0,n);
};

/* `sections` is [{y, pts:[[x,z]...], scale?, col?, skin?}]. Normals come
   from the surface itself — the ring tangent crossed with the rise to
   the next ring — so a taper lights correctly instead of like a
   cylinder.

   `skin` is [bone,weight,...] up to four pairs, applied before the ring
   is emitted. Per ring rather than per loft is the whole point: a limb
   is one loft whose rings hand over from one bone to the next as they
   cross the joint, and that hand-over is what makes a knee bend like a
   knee instead of shearing. */
Builder.prototype.loft=function(sections,c,o){
  o=o||{};
  var col=col3(c),n=sections[0].pts.length,rings=sections.length;
  var base=this.n,i,j;
  /* Sections may be listed bottom-up (a torso) or top-down (a limb
     hanging from its pivot). Rather than make every caller remember
     which way round to write them, detect the direction and flip the
     winding to match — otherwise half the meshes in the game face
     inward and vanish into the back-face cull. */
  var up=(sections[rings-1].y>=sections[0].y);
  var uvScale=o.uvScale||1;
  /* `uvV` remaps the section height into 0..1 across the whole loft, so
     a texture can be painted to fit the thing rather than tiled along
     it. The head needs this: a face map is one image stretched from
     chin to crown, not a repeating pattern. */
  var vLo=o.uvV?o.uvV[0]:0, vHi=o.uvV?o.uvV[1]:0;
  var vK=o.uvV?1/((vHi-vLo)||1):0;
  var uOff=o.uvU||0;
  for(j=0;j<rings;j++){
    var S=sections[j],pts=S.pts,cc=S.col?col3(S.col):col;
    if(S.skin)this.skin.apply(this,S.skin);
    var sc=S.scale===undefined?1:S.scale;
    /* rise toward the neighbouring ring, used for the normal's tilt */
    var prev=sections[Math.max(0,j-1)],next=sections[Math.min(rings-1,j+1)];
    var dy=(next.y-prev.y)||1;
    for(i=0;i<n;i++){
      var px=pts[i][0]*sc,pz=pts[i][1]*sc;
      /* ring tangent */
      var a=pts[(i+1)%n],b=pts[(i-1+n)%n];
      var tx=(a[0]-b[0])*sc,tz=(a[1]-b[1])*sc;
      /* radial outward */
      var rx=px,rz=pz;
      var rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
      /* how much the profile grows between neighbouring rings decides
         how far the normal tips up or down */
      var pn=next.pts[i],pp=prev.pts[i];
      var nsc=next.scale===undefined?1:next.scale,psc=prev.scale===undefined?1:prev.scale;
      var dr=Math.hypot(pn[0]*nsc,pn[1]*nsc)-Math.hypot(pp[0]*psc,pp[1]*psc);
      var ny=-dr/dy;
      var nx=rx,nz=rz;
      var nl=Math.hypot(nx,ny,nz)||1;
      var uu=i/n*uvScale+uOff;
      var vvv=o.uvV?((S.y-vLo)*vK):S.y*uvScale;
      this.vert(px,S.y,pz,nx/nl,ny/nl,nz/nl,uu,vvv,cc);
    }
  }
  /* Wind along the stack before going around the ring: sections from
     Geo.circle/roundRect run counter-clockwise in XZ, so the reverse
     order puts every face normal on the inside. */
  for(j=0;j<rings-1;j++)for(i=0;i<n;i++){
    var i2=(i+1)%n;
    var A=base+j*n+i, B=base+j*n+i2, C2=base+(j+1)*n+i2, D=base+(j+1)*n+i;
    if(up)this.quad(A,D,C2,B);else this.quad(A,B,C2,D);
  }
  /* caps, unless the loft joins something else */
  /* `openTop` means the geometrically higher cap and `openBottom` the
     lower one, regardless of which end of the list they land on. Tying
     them to list order instead makes a descending loft cap the wrong
     end, which shows up as a large flat surface facing the wrong way. */
  var ny=up?1:-1;
  var openFar=up?o.openTop:o.openBottom;
  var openNear=up?o.openBottom:o.openTop;
  if(!openFar){
    var top=sections[rings-1],tsc=top.scale===undefined?1:top.scale;
    var tcol=top.col?col3(top.col):col;
    if(top.skin)this.skin.apply(this,top.skin);
    var tc=this.vert(0,top.y,0,0,ny,0,.5,.5,tcol),t0=this.n;
    for(i=0;i<n;i++)this.vert(top.pts[i][0]*tsc,top.y,top.pts[i][1]*tsc,0,ny,0,
      top.pts[i][0]+.5,top.pts[i][1]+.5,tcol);
    for(i=0;i<n;i++){
      if(up)this.tri(tc,t0+(i+1)%n,t0+i);else this.tri(tc,t0+i,t0+(i+1)%n);
    }
  }
  if(!openNear){
    var bo=sections[0],bsc=bo.scale===undefined?1:bo.scale;
    var bcol=bo.col?col3(bo.col):col;
    if(bo.skin)this.skin.apply(this,bo.skin);
    var bc=this.vert(0,bo.y,0,0,-ny,0,.5,.5,bcol),b0=this.n;
    for(i=0;i<n;i++)this.vert(bo.pts[i][0]*bsc,bo.y,bo.pts[i][1]*bsc,0,-ny,0,
      bo.pts[i][0]+.5,bo.pts[i][1]+.5,bcol);
    for(i=0;i<n;i++){
      if(up)this.tri(bc,b0+i,b0+(i+1)%n);else this.tri(bc,b0+(i+1)%n,b0+i);
    }
  }
  return this;
};

/* A limb: a tapered loft between two radii with rounded ends, built
   downward from the bone pivot at y=0 the way the skeleton expects. */
Builder.prototype.limb=function(len,r0,r1,c,o){
  o=o||{};
  var n=o.seg||10,secs=[],steps=o.steps||7;
  for(var i=0;i<=steps;i++){
    var t=i/steps;
    var y=-len*t;
    /* ease the radius so the limb swells slightly at the top rather
       than tapering linearly like a traffic cone */
    var r=M.lerp(r0,r1,t*t*(3-2*t));

/* ============================================================
   LH.Tex — procedural surfaces.

   Every material in the game is painted here into a 2D canvas and
   uploaded as one layer of a texture array, so the whole world
   draws with a single texture bound. Nothing is downloaded.

   The rule each material follows: a base wash, a mid-frequency
   pattern that gives it identity (planks, courses, panel seams),
   and a high-frequency grain so it does not read as flat colour
   under a moving light.

(function(){
'use strict';

var SZ=256;

function make(){
  var cv=document.createElement('canvas');
  cv.width=cv.height=SZ;
  return cv;
}
/* seamless value noise: sample on a torus so the tile wraps */
function tileNoise(x,y,freq,seed){
  var a=M.noise2(x*freq,y*freq,seed);
  var b=M.noise2((x-1)*freq,y*freq,seed);
  var c=M.noise2(x*freq,(y-1)*freq,seed);
  var d=M.noise2((x-1)*freq,(y-1)*freq,seed);
  return M.lerp(M.lerp(a,b,x),M.lerp(c,d,x),y);

function tileFbm(x,y,freq,seed,oct){
  oct=oct||4;

  for(var i=0;i<oct;i++){s+=tileNoise(x,y,f,seed+i*13)*amp;norm+=amp;amp*=0.5;f*=2;}
  return s/norm;

/* Paint per-pixel through a callback returning a hex colour. Slower to
   write than gradients but it is the only way to get grain that
   survives mipmapping. */
function paint(cv,fn,label){
  var ctx=cv.getContext('2d');
  var img=ctx.createImageData(SZ,SZ),d=img.data;
  var bad=0;
  for(var y=0;y<SZ;y++)for(var x=0;x<SZ;x++){
    var u=x/SZ,v=y/SZ;
    var c=fn(u,v,x,y);
    var i=(y*SZ+x)*4;
    /* A NaN anywhere in a recipe writes as zero and the material ships
       black with no error. Catch it at the source and say which one. */
    if(c[0]!==c[0]||c[1]!==c[1]||c[2]!==c[2]){
      bad++;c=[255,0,220];
    }
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=c.length>3?c[3]:255;
  }
  if(bad)console.warn('material "'+(label||'?')+'" produced '+bad+
    ' NaN pixels — shown in magenta');

}
/* ---------------- surface relief ----------------
   Every material in this world was flat. Geometry normals only, so a
   brick wall lit from the side was a smooth plane with brick-coloured
   rectangles on it, and cloth, bark, gravel and skin were all equally
   glassy-smooth under the same highlight.

   Rather than author a second image per material, the height is taken
   from the luminance of the one that already exists. That is a guess,
   but a good one here: every recipe in this file was painted by making
   the recessed parts darker — mortar lines, plank grooves, the gaps
   between cobbles. Where the guess is wrong it is wrong in *sign*
   rather than in shape, which is why `bump` is signed: brick's mortar
   is lighter than its brick and further in, so brick's bump is
   negative.

   both. Normals only need two channels — the third is reconstructed. */
function bumpMap(cv,opt,label){
  opt=opt||{};

  var h=new Float32Array(SZ*SZ),i;
  for(i=0;i<SZ*SZ;i++)
    h[i]=(src[i*4]*0.30+src[i*4+1]*0.59+src[i*4+2]*0.11)/255;
  /* One blur. The grain in these recipes is per-pixel noise, and a
     normal map built straight off it is a field of static that turns
     into flat grey two mip levels down — costing the fetch and
     delivering nothing. */
  var bl=new Float32Array(SZ*SZ),x,y,dx,dy,sum;
  for(y=0;y<SZ;y++)for(x=0;x<SZ;x++){
    sum=0;
    for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++)
      sum+=h[((y+dy+SZ)%SZ)*SZ+((x+dx+SZ)%SZ)];

  var rough=Math.round(255*M.clamp(opt.rough===undefined?0.80:opt.rough,0,1));
  for(y=0;y<SZ;y++)for(x=0;x<SZ;x++){
    var l=bl[y*SZ+((x-1+SZ)%SZ)], r=bl[y*SZ+((x+1)%SZ)];
    var up=bl[((y-1+SZ)%SZ)*SZ+x], dn=bl[((y+1)%SZ)*SZ+x];

       decreasing v — hence the sign on the second gradient. */

    d[o+1]=Math.round((ny/len*0.5+0.5)*255);

/* a plain speckled solid — the base every other recipe starts from */

/* The face map is authored in the head's own cylindrical unwrap:
   u = 0 at the character's left ear, 0.25 dead centre front, 0.5 at the
   right ear, 0.75 at the back of the skull; v = 0 at the chin and 1 at
   the crown. Those are the coordinates LH.Body.head lofts with, so a
   feature painted at (0.25, 0.212) lands on the mouth. */

  var BASE=rgb('#F1ECE8');

  return function(u,v){
    var row=Math.floor(v*rows);
    var off=(row%2)?0.5:0;      /* running bond */
    var cu=(u*cols+off)%1, cv2=v*rows-row;
    var mw=0.05,mh=0.10;
    if(cu<mw||cu>1-mw||cv2<mh||cv2>1-mh){
      var m=rgb(mortar);
      return litv(m,(M.hash2(u*SZ|0,v*SZ|0,101)-0.5)*18-8);
    }
    var id=Math.floor(u*cols+off)*31+row*7;
    var tone=M.hash2(id,0,103);
    var base=mixv(rgb(lo),rgb(hi),0.2+tone*0.7);
    base=litv(base,(tileFbm(u,v,20,107,3)-0.5)*26);
    /* bevel the brick face so courses catch light */
    if(cv2<mh+0.05)base=litv(base,14);
    if(cv2>1-mh-0.05)base=litv(base,-14);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,109)-0.5)*14);
  };
};

R.panel=function(lo,hi,cells,seed,rivets){
  lo=lo||'#3A4250';hi=hi||'#6E7B8E';cells=cells||4;seed=seed||113;
  return function(u,v){
    var cx=Math.floor(u*cells),cy=Math.floor(v*cells);
    var fu=u*cells-cx,fv=v*cells-cy;
    var tone=M.hash2(cx,cy,seed);
    var base=mixv(rgb(lo),rgb(hi),0.3+tone*0.5);
    /* brushed streaks along X */
    var brush=M.hash2((u*SZ*2)|0,cy,seed+5);
    base=litv(base,(brush-0.5)*16);
    base=litv(base,(tileFbm(u,v,9,seed+11,3)-0.5)*14);
    /* panel seam + highlight lip */
    var e=0.02;
    if(fu<e||fv<e)base=litv(base,-46);
    else if(fu<e*2||fv<e*2)base=litv(base,18);
    if(rivets){
      var rd=Math.hypot(fu-0.5,fv-0.5);
      var rr=Math.hypot((fu<0.5?fu:1-fu)-0.07,(fv<0.5?fv:1-fv)-0.07);
      if(rr<0.022)base=litv(base,rr<0.014?24:-24);

R.tilefloor=function(a,b,grout,cells){
  a=a||'#6A7686';b=b||'#828E9E';grout=grout||'#4A5462';cells=cells||4;
  return function(u,v){
    var cx=Math.floor(u*cells),cy=Math.floor(v*cells);
    var fu=u*cells-cx,fv=v*cells-cy;
    var e=0.035;
    if(fu<e||fv<e||fu>1-e||fv>1-e)
      return litv(rgb(grout),(M.hash2(u*SZ|0,v*SZ|0,127)-0.5)*10);
    /* checker plus per-tile tone variance, so a plaza is not a grid of
       identical squares */
    var chk=((cx+cy)&1)?a:b;
    var tone=M.hash2(cx,cy,131);
    var base=mixv(rgb(chk),litv(rgb(chk),22),tone);
    base=litv(base,(tileFbm(u,v,14,137,3)-0.5)*12);
    /* polished sheen streak */
    var sh=Math.sin((fu+fv)*Math.PI);
    base=litv(base,sh*6);
    return base;
  };
};

R.concrete=function(lo,hi,seed){
  lo=lo||'#4A5058';hi=hi||'#767E88';
  seed=seed===undefined?139:seed;
  return function(u,v){
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,5,seed,5));
    var pit=M.hash2(u*SZ|0,v*SZ|0,seed*3+1);
    if(pit>0.985)base=litv(base,-40);
    var stain=tileFbm(u,v,2,seed*5+2,3);
    if(stain>0.7)base=mixv(base,rgb('#3B4147'),(stain-0.7)*1.6);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,149)-0.5)*14);
  };
};

R.foliage=function(lo,hi,seed){
  lo=lo||'#256B2C';hi=hi||'#79D257';
  return function(u,v){
    /* clumped leaf masses, not uniform green */
    var clump=tileFbm(u,v,8,seed||151,4);
    var fine=tileFbm(u,v,30,(seed||151)+3,2);
    var base=mixv(rgb(lo),rgb(hi),clump*0.7+fine*0.3);
    if(fine>0.74)base=mixv(base,rgb('#B4F08C'),(fine-0.74)*2.4);
    if(clump<0.28)base=mixv(base,rgb('#1B4523'),(0.28-clump)*2.0);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,157)-0.5)*20);
  };
};

R.fabric=function(lo,hi,seed){
  lo=lo||'#C4C9D2';hi=hi||'#ECEEF2';
  return function(u,v){
    /* a woven cross-hatch: two out-of-phase high-frequency sines */
    var wu=Math.sin(u*SZ*0.5*Math.PI)*0.5+0.5;
    var wv=Math.sin(v*SZ*0.5*Math.PI)*0.5+0.5;
    var weave=(wu*0.5+wv*0.5);
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,4,seed||163,3));
    base=litv(base,(weave-0.5)*18);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,167)-0.5)*10);
  };
};

R.crystal=function(tint,seed){
  tint=tint||'#4FD8FF';
  return function(u,v){
    /* facets from a cheap cellular pattern: nearest of a jittered grid */
    var cells=5,best=9,best2=9,bid=0;
    var gx=Math.floor(u*cells),gy=Math.floor(v*cells);
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
      var ax=gx+dx,ay=gy+dy;
      var px=(ax+M.hash2(ax,ay,seed||173))/cells;
      var py=(ay+M.hash2(ax,ay,(seed||173)+9))/cells;
      var d=Math.hypot(u-px,v-py);
      if(d<best){best2=best;best=d;bid=ax*37+ay*17;}
      else if(d<best2)best2=d;
    }
    var facet=M.hash2(bid,0,181);
    var base=mixv(rgb(tint),rgb('#0E2A44'),0.35+facet*0.4);
    base=litv(base,(best2-best)*300-30);   /* bright facet edges */
    return base;
  };

R.glass=function(tint){
  /* Same reasoning as the emissive material: neutral texture, tinted
     at the call site. */
  tint=tint||'#CFDCE6';
  return function(u,v){
    var base=rgb(tint);
    /* faint pane distortion and a diagonal reflection band */
    var d=tileFbm(u,v,6,191,3);
    var band=M.clamp(1-Math.abs(((u+v)*2%1)-0.5)*3.4,0,1);
    var c=litv(base,(d-0.5)*20+band*40);
    return [c[0],c[1],c[2],86];
  };
};

R.water=function(){
  return function(u,v){
    /* not used for the surface shader — this is the caustic/detail

    var a=tileFbm(u,v,7,197,3),b=tileFbm(u+0.3,v-0.2,11,199,3);
    var r=1-Math.abs((a*0.6+b*0.4)*2-1);
    var base=mixv(rgb('#0D3A52'),rgb('#4FBCD8'),r*r);
    return base;
  };
};

R.roof=function(lo,hi,rows){
  lo=lo||'#544459';hi=hi||'#8A6A7E';rows=rows||10;
  return function(u,v){
    var row=Math.floor(v*rows),fv=v*rows-row;
    var off=(row%2)?0.5:0;
    var cols=8,cu=(u*cols+off)%1;
    var id=Math.floor(u*cols+off)*13+row*29;
    var tone=M.hash2(id,0,211);
    var base=mixv(rgb(lo),rgb(hi),0.25+tone*0.55);
    /* scalloped shingle: darken toward the tile's lower arc */
    var arc=Math.hypot((cu-0.5)*1.1,(fv-0.15)*1.0);
    if(arc>0.52)base=litv(base,-34);
    if(fv<0.10)base=litv(base,18);
    if(fv>0.92)base=litv(base,-26);
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,223)-0.5)*14);
  };
};

/* A dressed stone path rather than asphalt. Tarmac reads as a black
   scar cut across a green island, and every road on the map is
   visible from every hill. */
R.road=function(){
  return function(u,v){
    var base=mixv(rgb('#8A8375'),rgb('#B4AC9C'),tileFbm(u,v,7,227,5));
    /* irregular setts: a cellular split with a paler joint */
    var cells=9;
    var gx=Math.floor(u*cells),gy=Math.floor(v*cells);
    var jitter=M.hash2(gx,gy,231);
    base=litv(base,(jitter-0.5)*26);
    var fu=u*cells-gx,fv=v*cells-gy;
    var e=0.07+jitter*0.03;
    if(fu<e||fv<e)base=mixv(base,rgb('#6E685C'),0.55);
    var agg=M.hash2(u*SZ|0,v*SZ|0,229);
    if(agg>0.965)base=litv(base,26);
    if(agg<0.05)base=litv(base,-16);
    return base;
  };
};

R.snow=function(){
  return function(u,v){
    var base=mixv(rgb('#C6D6E6'),rgb('#FFFFFF'),tileFbm(u,v,6,239,4));
    var spark=M.hash2(u*SZ|0,v*SZ|0,241);
    if(spark>0.994)base=[255,255,255];
    return litv(base,(M.hash2(u*SZ|0,v*SZ|0,251)-0.5)*8);
  };
};

R.gold=function(lo,hi){
  lo=lo||'#8A5E12';hi=hi||'#FFDE7A';
  return function(u,v){
    var base=mixv(rgb(lo),rgb(hi),tileFbm(u,v,5,257,4));
    var brush=M.hash2((u*SZ*3)|0,(v*SZ*0.3)|0,263);
    base=litv(base,(brush-0.5)*30);
    return base;
  };
};

    return litv(c,(pulse-0.5)*30+30);

/* ---------------- the layer table ----------------

  ['grass',   R.grass()],
  ['dirt',    R.dirt()],
  ['sand',    R.sand()],
  ['stone',   R.stone()],
  ['cliff',   R.cliff()],
  ['gravel',  R.solid('#4E4B52','#8A8792',22,2,5)],
  ['snow',    R.snow()],
  ['planks',  R.planks()],
  ['deck',    R.planks('#5A4636','#8E7458',5,79)],
  ['bark',    R.bark()],
  ['brick',   R.brick()],
  ['brickpale',R.brick('#8A6E5A','#B79A80','#D4CCBE',5,10)],
  ['panel',   R.panel('#333B48','#69768A',4,113,true)],
  ['panelw',  R.panel('#5E6672','#9AA4B2',3,311,false)],
  ['concrete',R.concrete()],

  ['tilepale',R.tilefloor('#9AA4B0','#B0B9C4','#6E7884',4)],
  ['tiledark',R.tilefloor('#2E3846','#42505F','#1E2630',4)],
  ['roof',    R.roof()],
  ['road',    R.road()],
  ['foliage', R.foliage()],

     character's own tint carries the tone, and it exists mainly so the
     fragment shader can recognise it: skin is the one surface in this
     world that should not be cel-banded and should scatter light. */

     one colour everywhere is the single clearest tell of amateur

     forehead and cheekbones, and none of that comes from geometry.
     Everything here is a multiplier on the character's own skin tone,

  ['crystal', R.crystal()],
  ['gold',    R.gold()],

  cliff:{bump:1.20,rough:0.92}, gravel:{bump:1.10,rough:0.94},
  snow:{bump:0.35,rough:0.66},  planks:{bump:0.75,rough:0.78},
  deck:{bump:0.80,rough:0.82},  bark:{bump:1.30,rough:0.96},
  brick:{bump:-0.95,rough:0.90},brickpale:{bump:-0.95,rough:0.90},

  tile:{bump:-0.35,rough:0.66}, tilepale:{bump:-0.35,rough:0.64},

  foliage:{bump:0.45,rough:0.86},foliagep:{bump:0.45,rough:0.86},
  skin:{bump:0.30,rough:0.62},  face:{bump:0.26,rough:0.56},
  fabric:{bump:0.60,rough:0.93},fabricw:{bump:0.60,rough:0.93},

Tex.buildAll=function(){

/* ============================================================
   LH.Render — the forward renderer.

   Passes, in order:
     1. shadow   — depth-only from the sun, into a fitted ortho box
     2. sky      — one fullscreen triangle, no geometry
     3. opaque   — world + props + characters, instanced
     4. water    — animated surface, depth-aware shoreline
     5. blend    — glass, foliage cards, particles, name tags
     6. post     — bloom on the emissive pass, tonemap, vignette

   The lighting model is deliberately not full PBR: a directional
   sun with a wrapped diffuse term, a sky/ground hemisphere ambient,
   and a Blinn specular. It costs a fraction of the instructions and,
   for a stylised world, reads better than a physically correct one.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,R={};
var gl=null;

/* ---------------- shared shader chunks ---------------- */
var COMMON=`
const float PI=3.14159265;
float saturate(float x){return clamp(x,0.0,1.0);}
vec3 saturate3(vec3 x){return clamp(x,vec3(0.0),vec3(1.0));}
// ACES-ish filmic curve. Cheap, and it keeps the neon from clipping to
// flat white the moment bloom lands on it.
vec3 tonemap(vec3 x){
  x*=0.9;
  return saturate3((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14));
}
vec3 toSRGB(vec3 c){
  return mix(c*12.92,1.055*pow(max(c,vec3(1e-5)),vec3(1.0/2.4))-0.055,step(0.0031308,c));
}
`;

var LIGHTING=`
uniform vec3 uSunDir;      // toward the sun
uniform vec3 uSunCol;
uniform vec3 uSkyCol;
uniform vec3 uGndCol;
uniform vec3 uEye;
uniform vec3 uFogCol;
uniform vec2 uFog;         // density, height falloff
uniform float uExposure;

// Wrapped diffuse: light bleeds slightly past the terminator, which
// stands in for the bounce a stylised scene would otherwise be missing.
float wrapDiffuse(vec3 n,vec3 l,float w){
  return saturate((dot(n,l)+w)/((1.0+w)*(1.0+w)));
}
vec3 hemi(vec3 n){
  return mix(uGndCol,uSkyCol,n.y*0.5+0.5);
}

// Three light bands with soft shoulders. The shoulders matter: a hard
// step aliases badly on a curved surface, and the whole point of the
// look is that a sphere reads as two clean shapes rather than a
// gradient with a staircase in it.
uniform float uToon;      // 0 = smooth shading, 1 = fully banded
float cel(float x){
  return 0.34
       + 0.30*smoothstep(0.30,0.40,x)
       + 0.36*smoothstep(0.66,0.76,x);
}
float toonify(float x){
  return mix(x,cel(x),uToon);
}

// ---- point lights ----
// A small fixed set, chosen on the CPU each frame from the lamps and
// signs nearest the camera. Sixteen is the whole budget: it is enough
// to light a street, and a forward renderer that loops further than
// that per fragment stops being worth it.
#define MAXLIGHTS 16
uniform int uLightCount;
uniform vec4 uLightPos[MAXLIGHTS];   // xyz world position, w radius
uniform vec4 uLightCol[MAXLIGHTS];   // rgb colour premultiplied by strength

vec3 pointLights(vec3 world,vec3 n){
  vec3 acc=vec3(0.0);
  for(int i=0;i<MAXLIGHTS;i++){
    if(i>=uLightCount)break;
    vec3 d=uLightPos[i].xyz-world;
    float r=uLightPos[i].w;
    float d2=dot(d,d);
    if(d2>r*r)continue;
    float dist=sqrt(max(d2,1e-6));
    // Smooth to zero at the radius. A 1/d^2 falloff cut off at a radius
    // leaves a visible disc edge on the ground under every lamp.
    float att=1.0-dist/r; att*=att;
    // Wrapped again, and hard: a street lamp is a big soft source and
    // a plain N.L makes every wall it touches look like a spotlight.
    float ndl=saturate(dot(n,d/dist)*0.62+0.38);
    acc+=uLightCol[i].rgb*(ndl*att);
  }
  return acc;
}
// Height fog. Distance drives the bulk of it; the height term thins it
// out as you climb, so the harbour sits in haze while the cliff tops
// stay clear. Averaging the two endpoint heights is an approximation of
// the proper integral along the ray, and is stable for every view
// direction including a perfectly horizontal one.
// Aerial perspective, not one flat fog colour. Haze is lit air, so its
// colour is the sky's in that direction — bluer looking up and away,
// warmer and brighter looking toward the sun, where forward scattering
// piles up. One constant colour makes a distant hillside sit in front
// of the sky it should be dissolving into, which is the single tell
// that separates depth from a grey wash.
vec3 applyFog(vec3 col,vec3 world,vec3 eye){
  vec3 d=world-eye;
  float dist=length(d);
  vec3 vd=d/max(dist,1e-4);
  float hs=max(0.5,uFog.y);
  float hAvg=max(0.0,(world.y+eye.y)*0.5);
  float density=uFog.x*exp(-hAvg/hs);
  float t=1.0-exp(-dist*density);
  // the sky in the direction we are actually looking
  vec3 haze=mix(uFogCol,uSkyCol*1.9,saturate(vd.y*1.4)*0.55);
  // and the sun's own glow through it
  float fwd=saturate(dot(vd,uSunDir));
  haze+=uSunCol*(pow(fwd,5.0)*0.22+pow(fwd,1.6)*0.05);
  return mix(col,haze,clamp(t,0.0,1.0));
}
`;

/* ---------------- shadows ----------------
   Two cascades. One map fitted to the whole visible neighbourhood has
   to cover about ninety metres, which at 2048 leaves four centimetres
   per texel — enough for a building's shadow and nowhere near enough
   for the contact between a foot and the ground, which is the shadow
   the eye actually checks. The near cascade covers thirteen metres at
   the same resolution, six millimetres a texel, and everything inside
   it reads sharp.

   The split is a hard test against the near box rather than a blend
   band: at this ratio the two look near-identical where they meet, and
   a blend costs a second twelve-tap fetch on every pixel in the
   overlap to hide a seam that is not visible. */
var SHADOW=`
uniform sampler2DShadow uShadow;
uniform sampler2DShadow uShadowN;
uniform mat4 uLightVP;
uniform mat4 uLightVPN;
uniform vec2 uShadowTexel;   // 1/size, bias scale
uniform float uShadowSoft;   // kernel radius, in shadow texels
const vec2 POISSON12[12]=vec2[12](

  vec2(-0.203, 0.621),vec2( 0.962,-0.195),vec2( 0.473,-0.480),
  vec2( 0.519, 0.767),vec2( 0.185,-0.893),vec2( 0.507, 0.064),
  vec2( 0.896, 0.412),vec2(-0.322,-0.933),vec2(-0.792,-0.598)
);
// A rotated Poisson disc rather than a 3x3 grid. Twelve taps in a ring
// cover more of the penumbra than nine in a square for the same cost,
// and rotating the ring per pixel turns the banding a fixed kernel
// leaves into noise the eye does not read as structure.
float pcf(sampler2DShadow smp,vec3 p,float soft){
  float ang=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)*6.28318;
  float ca=cos(ang),sa=sin(ang);
  float s=0.0;
  for(int i=0;i<12;i++){
    vec2 o=POISSON12[i];
    vec2 r=vec2(o.x*ca-o.y*sa,o.x*sa+o.y*ca)*uShadowTexel.x*soft;

float shadowAt(vec3 world,vec3 n,vec3 l){
