/* ---------------- hotbar ---------------- */
function buildHotbar(){
  clear(els.hot);
  for(var i=0;i<10;i++){
    (function(i){
      var s=el('div','slot'+(i===hotIndex?' on':''));
      s.innerHTML='<div class="ic"></div><span class="k">'+((i+1)%10)+'</span>'+
                  '<span class="n"></span>';
      s.addEventListener('click',function(){U.selectSlot(i);});
      els.hot.appendChild(s);
    })(i);
  }
  refreshHotbar();
}
function refreshHotbar(){
  if(!els.hot||!snap)return;
  var slots=els.hot.children;
  for(var i=0;i<slots.length;i++){
    var key=hotbar[i];
    var s=slots[i];
    var ic=s.querySelector('.ic'), n=s.querySelector('.n');
    s.classList.toggle('on',i===hotIndex);
    if(!key||!D.byKey(key)){
      s.classList.add('empty');ic.style.backgroundImage='';n.textContent='';
      s.style.removeProperty('--rr');
      continue;
    }
    s.classList.remove('empty');
    var it=D.byKey(key);
    var url=Icon.of(key);
    ic.style.backgroundImage='url('+url+')';
    ic.style.backgroundSize='cover';
    var count=snap.inv[key]||0;
    n.textContent=(it.stack>1&&count>0)?count:'';
    /* a held tool you no longer own reads as unavailable rather than
       silently doing nothing when you click */
    s.style.opacity=count>0?'1':'0.42';
  }
}
U.selectSlot=function(i){
  hotIndex=M.clamp(i|0,0,9);
  refreshHotbar();
  var key=hotbar[hotIndex];
  var it=key?D.byKey(key):null;
  /* Equipping the held tool is the server's business, not the HUD's. */
  if(it&&(it.cat==='tool'||it.cat==='weapon'||it.cat==='fishing')){
    Net.request('equip',{key:key},function(r){if(r.ok)U.sync(r.state);});
  }
  if(LH.Game&&LH.Game.onHeldChanged)LH.Game.onHeldChanged(key);
};
U.held=function(){return hotbar[hotIndex];};
U.slotIndex=function(){return hotIndex;};
U.heldItem=function(){var k=hotbar[hotIndex];return k?D.byKey(k):null;};
U.setSlot=function(i,key){hotbar[i]=key;refreshHotbar();};

/* ---------------- state sync ----------------
   The HUD never computes a number. It renders whatever the last
   server snapshot said, which is why a rejected request cannot leave
   the display out of step with the truth. */
U.sync=function(s){
  if(!s)return;
  snap=s;
  if(!hud)return;
  els.name.textContent=s.name;
  /* The avatar tile keeps the initial but not the level badge's text —
     writing both into one node would wipe the badge every sync. */
  els.av.firstChild.nodeValue=(s.name[0]||'T').toUpperCase();
  els.lvb.textContent=s.level;
  els.xp.style.width=Math.round(100*s.xp/Math.max(1,s.xpNext))+'%';
  els.xpn.textContent=s.xp+'/'+s.xpNext;
  els.coins.textContent=s.coins.toLocaleString();
  els.shards.textContent=s.shards.toLocaleString();
  if(els.stars)els.stars.textContent=(s.stars||0).toLocaleString();
  if(els.hp){
    els.hp.style.width=Math.round(100*s.hp/Math.max(1,s.hpMax))+'%';
    els.hplbl.textContent=Math.round(s.hp)+' / '+s.hpMax;
    /* Health is only worth screen space when it is not full. */
    els.vitals.classList.toggle('on',s.hp<s.hpMax);
  }
  /* MY WORLD reflects the first world you own, or invites you to make one */
  if(els.wname){
    Net.request('myWorlds',{},function(r){
      if(!r.ok)return;
      var w=r.worlds[0];
      els.wname.textContent=w?w.name:'No world yet';
      els.vis.textContent=w?(w.visits||0):0;
      els.likes.textContent=w?Math.round((w.blocks||0)/8):0;
    });
  }
  refreshHotbar();
  if(buildOn)U.buildPalette();
  if(openPanel)render(openPanel);
};
U.state=function(){return snap;};

/* ---------------- reticle + interaction prompt ---------------- */
U.setReticle=function(mode){
  if(!els.retic)return;
  els.retic.className='retic'+(mode==='act'?' act':(mode==='deny'?' deny':''));
};
U.setPrompt=function(text,keyName){
  if(!els.prompt)return;
  if(!text){els.prompt.classList.remove('show');return;}
  els.prompt.innerHTML='<kbd>'+(keyName||'E')+'</kbd><span>'+text+'</span>';
  els.prompt.classList.add('show');
};
U.setClock=function(hours,weather){
  if(!els.clock)return;
  var h=Math.floor(hours)%24, m=Math.floor((hours%1)*60);
  els.clock.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  els.wx.textContent=String(weather||'clear').toUpperCase();
};

/* ---------------- panels ---------------- */
U.open=function(id){
  if(openPanel===id){U.close();return;}
  if(openPanel)panels[openPanel].root.classList.remove('on');
  openPanel=id;
  if(!panels[id])return;
  panels[id].root.classList.add('on');
  els.scrim.classList.add('on');
  render(id);
  if(LH.Input.releaseLock)LH.Input.releaseLock();
};
U.close=function(){
  if(openPanel&&panels[openPanel])panels[openPanel].root.classList.remove('on');
  openPanel=null;
  els.scrim.classList.remove('on');
};
U.isOpen=function(){return !!openPanel;};
U.openId=function(){return openPanel;};

var selected=null;

function itemCell(key,count,opts){
  opts=opts||{};
  var it=D.byKey(key);
  if(!it)return null;
  var c=el('div','cell'+(selected===key?' sel':'')+(opts.worn?' worn':''));
  var rr=el('div','rr');
  rr.style.background=D.rarityCol(it.rarity);
  c.appendChild(rr);
  var ic=el('div','ic');
  ic.style.backgroundImage='url('+Icon.of(key)+')';
  ic.style.backgroundSize='cover';
  c.appendChild(ic);
  if(count>1||opts.showCount){
    var n=el('span','n',String(count));
    c.appendChild(n);
  }
  c.title=it.name;
  c.addEventListener('click',function(){
    selected=key;
    render(openPanel);
  });
  return c;
}

var CAT_TAB={
  'Blocks':['block','furniture'],'Materials':['material'],
  'Gear':['tool','weapon'],'Cosmetics':['cosmetic'],
  'Fishing':['fishing'],'Food':['consumable'],
  'Collection':['collectible'],'All':null
};

function render(id){
  var P=panels[id];
  if(!P||!snap)return;
  var bd=P.body;
  clear(bd);
  if(id==='inv')return renderInv(bd,P.root.dataset.tab);
  if(id==='craft')return renderCraft(bd,P.root.dataset.tab);
  if(id==='profile')return renderProfile(bd,P.root.dataset.tab);
  if(id==='shop')return renderShop(bd,P.root.dataset.tab);
  if(id==='missions')return renderMissions(bd,P.root.dataset.tab);
  if(id==='worlds')return renderWorlds(bd,P.root.dataset.tab);
  if(id==='trade')return renderTrade(bd);
  if(id==='map')return renderMap(bd);
  if(id==='menu')return renderMenu(bd);
}

function renderInv(bd,tab){
  var cats=CAT_TAB[tab];
  var keys=Object.keys(snap.inv).filter(function(k){
    var it=D.byKey(k);
    if(!it)return false;
    return !cats||cats.indexOf(it.cat)>=0;
  });
  /* Rarity first, then name: the good stuff should never be buried. */
  keys.sort(function(a,b){
    var A=D.byKey(a),B=D.byKey(b);
    return (B.rarity-A.rarity)||A.name.localeCompare(B.name);
  });
  if(!keys.length){
    bd.appendChild(el('div','empty-note','Nothing here yet.'));
    return;
  }
  var g=el('div','grid');
  var worn={};
  for(var sl in snap.equipped)if(snap.equipped[sl])worn[snap.equipped[sl]]=1;
  keys.forEach(function(k){
    var c=itemCell(k,snap.inv[k],{worn:!!worn[k]});
    if(c)g.appendChild(c);
  });
  bd.appendChild(g);
  if(selected&&snap.inv[selected])bd.appendChild(detailFor(selected,'inv'));
}

function detailFor(key,ctx){
  var it=D.byKey(key);
  var d=el('div','detail');
  var big=el('div','big');
  var ic=el('div','ic');
  ic.style.backgroundImage='url('+Icon.of(key)+')';
  ic.style.backgroundSize='cover';
  big.appendChild(ic);
  d.appendChild(big);
  var t=el('div','txt');
  t.appendChild(el('h3',null,it.name));
  var rt=el('div','rt',D.RARITY[it.rarity]+' · '+it.cat);
  rt.style.color=D.rarityCol(it.rarity);
  t.appendChild(rt);
  if(it.desc)t.appendChild(el('p',null,it.desc));
  var meta=el('div','meta');
  meta.innerHTML=
    '<span>Value <b>'+it.value.toLocaleString()+'</b></span>'+
    '<span>Stack <b>'+it.stack+'</b></span>'+
    (it.placeable?'<span><b>Placeable</b></span>':'')+
    (it.tradeable?'':'<span><b>Bound</b></span>')+
    (it.props&&it.props.damage?'<span>Damage <b>'+it.props.damage+'</b></span>':'')+
    (it.props&&it.props.power?'<span>Power <b>'+it.props.power+'</b></span>':'');
  t.appendChild(meta);

  var acts=el('div','acts');
  function act(label,cls,fn){
    var b=el('button','btn'+(cls?' '+cls:''),label);
    b.addEventListener('click',fn);
    acts.appendChild(b);
    return b;
  }
  if(ctx==='inv'){
    if(it.cat==='cosmetic'||it.cat==='tool'||it.cat==='weapon'||it.cat==='fishing'){
      act('Equip','pri',function(){
        Net.request('equip',{key:key},function(r){
          if(r.ok){U.sync(r.state);U.toast('Equipped '+it.name,'good');
            if(LH.Game&&LH.Game.refreshKit)LH.Game.refreshKit();}
          else U.toast(r.why,'bad');
        });
      });
    }
    if(it.placeable){
      act('To hotbar',null,function(){
        U.setSlot(hotIndex,key);
        U.toast(it.name+' to slot '+((hotIndex+1)%10),'good');
      });
    }
    if(it.consumable){
      act('Use','pri',function(){
        Net.request('use',{key:key},function(r){
          if(r.ok){U.sync(r.state);U.toast('Used '+it.name,'good');}
          else U.toast(r.why,'bad');
        });
      });
    }
    if(it.tradeable&&tradeCache){
      act('Add to trade','pri',function(){
        Net.request('tradeOffer',{key:key,n:1},function(r){
          if(r.ok){tradeCache=r.trade;U.toast('Added to the trade','good');}
          else U.toast(r.why,'bad');
        });
      });
    }
    if(it.tradeable){
      act('Sell ('+D.sellPrice(it)+')','dim',function(){
        Net.request('sell',{key:key,n:1},function(r){
          if(r.ok){U.sync(r.state);U.toast('Sold for '+r.earned+' coins','good');}
          else U.toast(r.why,'bad');
        });
      });
    }
  }
  t.appendChild(acts);
  d.appendChild(t);
  return d;
}

var missionCache=null;
function renderMissions(bd,tab){
  Net.request('missions',{},function(r){
    if(r.ok)missionCache=r;
  });
  if(!missionCache){
    bd.appendChild(el('div','empty-note','Reading the board…'));
    return;
  }
  var list=tab==='Story'?missionCache.story
          :tab==='Weekly'?missionCache.weekly:missionCache.daily;
  if(!list||!list.length){
    bd.appendChild(el('div','empty-note',
      tab==='Story'?'Nothing new. Come back as you level up.'
                   :'Nothing posted right now.'));
    return;
  }
  list.forEach(function(m){
    var row=el('div','mrow'+(m.done?' done':''));
    var rw=[];
    if(m.reward.coins)rw.push(m.reward.coins.toLocaleString()+' coins');
    if(m.reward.xp)rw.push(m.reward.xp+' XP');
    if(m.reward.items)m.reward.items.forEach(function(it){
      var d=D.byKey(it[0]);
      if(d)rw.push(d.name+(it[1]>1?' ×'+it[1]:''));
    });
    if(m.reward.title)rw.push('Title: '+m.reward.title);
    row.innerHTML=
      '<div class="mtype">'+m.type+'</div>'+
      '<div class="mi"><h4>'+m.name+'</h4><p>'+m.desc+'</p>'+
      '<div class="pg"><i style="width:'+
        Math.round(100*m.progress/Math.max(1,m.goal))+'%"></i></div>'+
      '<div class="rw">'+rw.join(' · ')+'</div></div>'+
      '<div class="ct">'+m.progress+' / '+m.goal+'</div>';
    if(m.done&&!m.claimed){
      var b=el('button','btn pri','Claim');
      b.style.marginLeft='.6cqw';
      b.addEventListener('click',function(){
        Net.request('claim',{id:m.id},function(r2){
          if(r2.ok){
            U.sync(r2.state);
            U.toast('Reward claimed','good');
            if(r2.reward.items)r2.reward.items.forEach(function(it){
              U.toastItem(it[0],it[1]);});
            missionCache=null;render('missions');
          }else U.toast(r2.why,'bad');
        });
      });
      row.appendChild(b);
    }else if(m.claimed){
      row.appendChild(el('div','ct','✓'));
    }
    bd.appendChild(row);
  });
}
U.refreshMissions=function(){missionCache=null;};

/* ---------------- trade window ----------------
   Both grids visible, both values totalled, and the lock/confirm
   sequence spelled out rather than implied — the anti-scam surface
   matters more than the chrome. */
var tradeCache=null;
function renderTrade(bd){
  Net.request('tradeState',{},function(r){tradeCache=r.trade;});
  var t=tradeCache;
  if(!t){
    bd.appendChild(el('div','empty-note',
      'Nobody is trading with you. Walk up to someone and press E.'));
    return;
  }
  var wrap=el('div','tradewrap');

  function side(title,offer,value,locked,mine){
    var box=el('div','tradeside'+(locked?' locked':''));
    var h=el('h4');
    h.innerHTML=title+'<span class="v">'+value.toLocaleString()+'</span>';
    box.appendChild(h);
    var g=el('div','tradegrid');
    var keys=Object.keys(offer);
    for(var i=0;i<9;i++){
      var k=keys[i];
      if(!k){
        var blank=el('div','cell');
        blank.style.opacity='.35';
        g.appendChild(blank);
        continue;
      }
      var c=itemCell(k,offer[k],{showCount:true});
      if(!c)continue;
      if(mine){
        c.title='Click to take back';
        (function(kk){
          c.addEventListener('click',function(){
            Net.request('tradeOffer',{key:kk,n:1,remove:true},function(r2){
              if(r2.ok){tradeCache=r2.trade;render('trade');}
              else U.toast(r2.why,'bad');
            });
          });
        })(k);
      }
      g.appendChild(c);
    }
    box.appendChild(g);
    return box;
  }
  wrap.appendChild(side('You offer',t.mine,t.valueMine,t.lockedMe,true));
  wrap.appendChild(side(t.with+' offers',t.theirs,t.valueTheirs,t.lockedThem,false));
  bd.appendChild(wrap);

  var tm=el('div','tradetimer');
  tm.innerHTML='<i style="width:'+Math.round(t.left/120*100)+'%"></i>';
  bd.appendChild(tm);

  var bar=el('div','tradebar');
  var note=el('div','note');
  note.innerHTML=!t.lockedMe
    ? 'Add items from your backpack, then lock when you are happy.'
    : (!t.lockedThem
      ? '<b style="color:var(--gold)">Waiting for '+t.with+' to lock.</b> '+
        'They may want a better offer.'
      : '<b style="color:var(--r2)">Both locked.</b> Confirm to swap.');
  bar.appendChild(note);
  var lock=el('button','btn'+(t.lockedMe?'':' pri'),t.lockedMe?'Unlock':'Lock offer');
  lock.addEventListener('click',function(){
    Net.request('tradeLock',{},function(r2){
      if(r2.ok){tradeCache=r2.trade;render('trade');LH.Audio&&LH.Audio.play('ui');}
    });
  });
  bar.appendChild(lock);
  var conf=el('button','btn pri','Confirm');
  if(!t.lockedMe||!t.lockedThem)conf.setAttribute('disabled','');
  conf.addEventListener('click',function(){
    Net.request('tradeConfirm',{},function(r2){
      if(!r2.ok){U.toast(r2.why,'bad');tradeCache=null;render('trade');return;}
      U.sync(r2.state);
      r2.got.forEach(function(g){U.toastItem(g[0],g[1]);});
      U.toast('Trade complete','good');
      LH.Audio&&LH.Audio.play('coin');
      tradeCache=null;U.close();
    });
  });
  bar.appendChild(conf);
  var cancel=el('button','btn dim','Cancel');
  cancel.addEventListener('click',function(){
    Net.request('tradeCancel',{},function(){tradeCache=null;U.close();});
  });
  bar.appendChild(cancel);
  bd.appendChild(bar);
}
U.openTrade=function(state){tradeCache=state;U.open('trade');};
U.refreshTrade=function(){tradeCache=null;};

/* ---------------- fishing display ---------------- */
var FSTAGE={
  cast:'Cast',sink:'Sinking',wait:'Waiting',strike:'Bite!',reel:'Reeling'
};
U.fishing=function(F){
  if(!els.fish)return;
  if(!F.active()){els.fish.classList.remove('on');return;}
  els.fish.classList.add('on');
  els.fstage.textContent=FSTAGE[F.stage]||'';
  var fight=F.fight();
  els.fclass.textContent=fight?({light:'Light',solid:'Solid',
    heavy:'Heavy — careful'})[fight.weightClass]:'';
  if(F.stage==='cast'){
    els.fprog.style.width=Math.round(F.power*100)+'%';
    els.fstrain.style.width='0%';
    els.fhint.innerHTML='Hold to cast further, release to drop the line';
    return;
  }
  if(F.stage==='wait'){
    els.fprog.style.width='0%';els.fstrain.style.width='0%';
    els.fhint.innerHTML='Watch the float…';
    return;
  }
  if(F.stage==='strike'){
    els.fprog.style.width='100%';els.fstrain.style.width='0%';
    els.fhint.innerHTML='<b style="color:var(--acc)">Strike now!</b>';
    return;
  }
  els.fprog.style.width=Math.round(F.progress*100)+'%';
  els.fstrain.style.width=Math.round(F.strain*100)+'%';
  els.fstrainWrap.classList.toggle('hot',F.strain>0.72);
  /* The one instruction that matters, phrased as what to do rather
     than what is happening. */
  els.fhint.innerHTML=fight&&fight.running
    ? '<span class="runs">It is running — give it line</span>'
    : 'Hold to reel it in';
};
U.showCatch=function(r){
  if(!els.catch)return;
  var col=D.rarityCol(r.rarity);
  els.catch.innerHTML=
    '<div class="ic" style="background-image:url('+Icon.of(r.key)+')"></div>'+
    '<h3>'+r.name+'</h3>'+
    '<div class="w">'+r.weight+' kg · worth '+r.value.toLocaleString()+'</div>'+
    '<div class="r" style="color:'+col+'">'+D.RARITY[r.rarity]+'</div>';
  els.catch.classList.add('on');
  clearTimeout(els._catchT);
  els._catchT=setTimeout(function(){els.catch.classList.remove('on');},2600);
};

/* ---------------- world-anchored overlays ----------------
   Damage numbers and enemy nameplates are DOM projected to screen
   space rather than drawn in the scene: text stays crisp, and they
   never fight the depth buffer. */
U.damage=function(sx,sy,amount,kind){
  if(!els.world)return;
  var d=el('div','dmg'+(kind?' '+kind:''),String(amount));
  d.style.left=sx+'px';d.style.top=sy+'px';
  els.world.appendChild(d);
  setTimeout(function(){d.parentNode&&d.parentNode.removeChild(d);},950);
};
var plates=[];
U.plates=function(list){
  if(!els.world)return;
  /* keep the pool the size of the list rather than churning nodes */
  while(plates.length<list.length){
    var p=el('div','plate','<div class="nm"></div><div class="hb"><i></i></div>');
    els.world.appendChild(p);
    plates.push({root:p,nm:p.querySelector('.nm'),hb:p.querySelector('i')});
  }
  for(var i=0;i<plates.length;i++){
    var pl=plates[i], d=list[i];
    if(!d){pl.root.style.display='none';continue;}
    pl.root.style.display='flex';
    pl.root.style.left=d.x+'px';
    pl.root.style.top=d.y+'px';
    pl.root.classList.toggle('boss',!!d.boss);
    if(pl._nm!==d.name){pl.nm.textContent=d.name;pl._nm=d.name;}
    pl.hb.style.width=Math.round(100*d.hp/d.hpMax)+'%';
  }
};

/* ---------------- NPC dialogue ---------------- */
U.dialogue=function(d){
  if(!els.dlg)return;
  if(!d){els.dlg.classList.remove('on');return;}
  els.dlg.innerHTML=
    '<div class="face">'+(d.name[0]||'?')+'</div>'+
    '<div class="txt"><div class="who">'+d.name+'</div>'+
    '<div class="role">'+d.role+'</div>'+
    '<div class="line">'+d.line+'</div>'+
    (d.offer?'<div class="offer">'+d.offer+'</div>':'')+
    '<div class="cls">Press <b>E</b> again to leave</div></div>';
  els.dlg.classList.add('on');
};

/* ---------------- chat ----------------
   Local and simulated, and the module says so: until there is a
   server the other voices in the harbour are fiction. The plumbing is
   real, so wiring it to a socket later is a transport change. */
var chatLines=[];
function stamp(){
  var d=new Date();
  function p2(v){return (v<10?'0':'')+v;}
  return p2(d.getHours())+':'+p2(d.getMinutes());
}
/* Global shows everything; the narrower channels filter. System lines
   appear on every channel, because a line telling you what happened is
   never off-topic. */
function visibleOn(line){
  if(line.ch==='system')return true;
  if(chatChannel==='global')return true;
  return line.ch===chatChannel;
}
function lineHTML(m){
  var ch=m.ch||'global';
  return '<span class="tag '+ch+'">['+ch.charAt(0).toUpperCase()+ch.slice(1)+']</span>'+
    (ch==='system'?'':'<b>'+m.who+':</b> ')+m.text;
}
function repaintChat(){
  if(!els.chatLog)return;
  clear(els.chatLog);
  chatLines.filter(visibleOn).slice(-60).forEach(function(m){
    var ln=el('div','ln');
    ln.innerHTML=lineHTML(m);
    els.chatLog.appendChild(ln);
  });
  els.chatLog.scrollTop=els.chatLog.scrollHeight;
}
U.say=function(who,text,kind,channel){
  var ch=channel||(kind==='sys'?'system':'global');
  chatLines.push({who:who,text:text,at:stamp(),ch:ch});
  while(chatLines.length>120)chatLines.shift();
  if(!els.chatLog)return;
  if(!visibleOn(chatLines[chatLines.length-1]))return;
  var ln=el('div','ln');
  ln.innerHTML=lineHTML(chatLines[chatLines.length-1]);
  els.chatLog.appendChild(ln);
  while(els.chatLog.children.length>60)
    els.chatLog.removeChild(els.chatLog.firstChild);
  els.chatLog.scrollTop=els.chatLog.scrollHeight;
  els.chat.classList.remove('dim');
};
U.focusChat=function(){
  if(!els.chatIn)return;
  els.chat.classList.remove('dim');
  els.chatIn.focus();
};
U.chatFocused=function(){return document.activeElement===els.chatIn;};

/* ---------------- build mode ----------------
   The panel, the palette and the action bar are one control surface:
   picking a block from the palette puts it in your hand, and the tool
   decides what a click does with it. */
U.toggleBuild=function(on){
  buildOn=(on===undefined)?!buildOn:!!on;
  if(els.buildp)els.buildp.classList.toggle('on',buildOn);
  if(els.menu)els.menu.children[1].classList.toggle('on',buildOn);
  if(!buildOn&&LH.Player)LH.Player.setFly(false);
  U.setTool(buildOn?'place':'place');
  LH.Audio&&LH.Audio.play(buildOn?'open':'close');
  return buildOn;
};
U.setTool=function(t){
  tool=t;
  if(els.btools)Array.prototype.forEach.call(els.btools.children,function(b){
    b.classList.toggle('on',b.getAttribute('data-tool')===t);
  });
  if(els.actbar)Array.prototype.forEach.call(els.actbar.children,function(b){
    var a=b.getAttribute('data-act');
    b.classList.toggle('on',a===t);
  });
};
/* One entry point for the action bar, so a button and its keyboard
   equivalent can never drift apart. */
U.action=function(a){
  LH.Audio&&LH.Audio.play('ui');
  if(a==='flyup'||a==='flydown'){
    if(LH.Player)LH.Player.flyNudge(a==='flyup'?1:-1);
    return;
  }
  if(!buildOn)U.toggleBuild(true);
  U.setTool(a);
};

/* The palette is every placeable item you are carrying, so it grows as
   you gather rather than being a fixed menu. */
U.buildPalette=function(){
  if(!els.bpal)return;
  clear(els.bpal);
  var s=snap||Net.snapshot();
  var keys=Object.keys(s.inv).filter(function(k){
    var it=D.byKey(k);
    return it&&it.placeable;
  }).sort(function(a,b){
    var A=D.byKey(a),B=D.byKey(b);
    return (A.rarity-B.rarity)||A.name.localeCompare(B.name);
  });
  keys.forEach(function(k){
    var b=el('div','bsw'+(hotbar[hotIndex]===k?' on':''));
    b.style.backgroundImage='url('+Icon.of(k)+')';
    b.title=D.byKey(k).name+' ×'+s.inv[k];
    b.addEventListener('click',function(){
      /* drop it into the selected hotbar slot — the palette and the
         hotbar are two views of the same hand */
      U.setSlot(hotIndex,k);
      U.setTool('place');
      if(!buildOn)U.toggleBuild(true);
      U.buildPalette();
      LH.Audio&&LH.Audio.play('ui');
    });
    els.bpal.appendChild(b);
  });
  if(!keys.length){
    var n=el('div','empty-note','Gather something placeable first.');
    n.style.cssText='grid-column:1/-1;font-size:.7cqw;padding:.6cqw 0';
    els.bpal.appendChild(n);
  }
};
U.setOnline=function(n){if(els.online)els.online.textContent=n;};

U.travelFade=function(on,label){
  if(!els.travel)return;
  els.travel.querySelector('#utravel').textContent=label||'Travelling…';
  els.travel.classList.toggle('on',!!on);
};

U.touchStick=function(st){
  if(!els.tstick)return;
  if(!st||!st.active){els.tstick.classList.remove('on');return;}
  els.tstick.classList.add('on');
  var r=els.tstick.getBoundingClientRect();
  els.tstick.style.left=(st.ox-r.width/2)+'px';
  els.tstick.style.top=(st.oy-r.height/2)+'px';
  var knob=els.tstick.firstChild;
  knob.style.left=(50+(st.x-st.ox)/r.width*100)+'%';
  knob.style.top=(50+(st.y-st.oy)/r.height*100)+'%';
};
U.isTouch=function(){return els.touch&&els.touch.classList.contains('on');};

LH.UI=U;
})();

/* ============================================================
   LH.Enemies — creatures and the AI that drives them.

   Two kinds of body. Humanoid enemies reuse the player's rig and
   animation library outright — a rogue is an Actor in a dark kit —
   which means every clip written for the player already applies to
   them and a new humanoid enemy costs a palette rather than a mesh.
   Everything else gets its own procedural body.

   One AI state machine covers all of them: idle, patrol, aggro,
   chase, attack, recover, hurt, dead. Behaviour differences are
   numbers in the species table, not branches in the update.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,Geo=LH.Geo,D=LH.Data,T=LH.Terrain,W=LH.World,Act=LH.Actors;
var E={};

/* ---------------- species ---------------- */
var SPECIES={
  slime:{
    name:'Bog Slime',hp:26,dmg:6,speed:1.5,aggro:9,reach:1.5,
    xp:12,level:1,body:'slime',scale:1.0,col:'#6FD08A',
    loot:[['fibre',1,0.7],['clay',1,0.3],['glowmoss',1,0.06]]
  },
  crab:{
    name:'Rock Crab',hp:34,dmg:9,speed:2.1,aggro:8,reach:1.6,
    xp:16,level:2,body:'crab',scale:1.0,col:'#C4685E',
    loot:[['stonechunk',1,0.6],['sandpile',1,0.4],['copper',1,0.12]]
  },
  wisp:{
    name:'Drift Wisp',hp:22,dmg:11,speed:2.8,aggro:12,reach:2.2,
    xp:22,level:4,body:'wisp',scale:1.0,col:'#7FE8FF',fly:1.7,
    loot:[['crystal',1,0.22],['glowmoss',1,0.3],['silver',1,0.1]]
  },
  rogue:{
    name:'Shore Rogue',hp:58,dmg:14,speed:3.4,aggro:13,reach:2.3,
    xp:34,level:6,body:'humanoid',scale:1.0,col:'#54607A',
    kit:{shirt:'jacket',shirtCol:'#3A3F4E',pants:'#23262E',hair:'spiked',
         hairCol:'#1E2028',hat:'none',tool:'sword',toolCol:'#B8C0CC'},
    loot:[['ingot_cu',1,0.4],['rope',1,0.35],['sword_copper',1,0.05]]
  },
  shade:{
    name:'Shade',hp:92,dmg:22,speed:3.8,aggro:15,reach:2.4,
    xp:60,level:12,body:'humanoid',scale:1.06,col:'#2A2438',
    kit:{shirt:'hoodie',shirtCol:'#241E30',pants:'#141020',hair:'long',
         hairCol:'#0E0C16',hat:'none',tool:'sword',toolCol:'#7A5ACC',
         aura:'motes',auraCol:'#8A6ACC'},
    loot:[['voidshard',1,0.3],['ingot_ag',1,0.3],['crystal',1,0.25]]
  },
  guardian:{
    name:'Ancient Guardian',hp:420,dmg:38,speed:2.2,aggro:18,reach:3.4,
    xp:340,level:22,body:'guardian',scale:1.0,col:'#8A8272',boss:true,
    loot:[['mythril',2,0.8],['starcore',1,0.25],['crystal',3,0.9],
          ['hat_crown',1,0.04]]
  }
};
E.SPECIES=SPECIES;
E.list=function(){return Object.keys(SPECIES);};

/* ---------------- bodies ---------------- */
var meshCache={};
function body(kind,fn,maxInst){
  var hit=meshCache[kind];if(hit)return hit;
  var b=Geo.build();fn(b);
  var m=b.upload(maxInst||48);
  m.key='enemy:'+kind;
  meshCache[kind]=m;return m;
}

E.mesh=function(kind){
  if(kind==='slime')return body('slime',function(b){
    b.mat('crystal',0.10);
    /* a squashed dome with a lighter core, so it reads as translucent
       without needing a transparent pass */
    b.loft([
      {y:0.00,pts:Geo.circle(0.62,14)},
      {y:0.24,pts:Geo.circle(0.70,14)},
      {y:0.52,pts:Geo.circle(0.58,14)},
      {y:0.72,pts:Geo.circle(0.30,14)}
    ],'#FFFFFF',{});
    b.mat('blank');
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.20,0.42,0.44);
      b.sphere(0,0,0,0.11,10,8,'#0E1219');
      b.sphere(0.03,0.04,0.06,0.04,8,6,'#FFFFFF');
      b.pop();
    }
    b.mat('crystal',0.35);
    b.sphere(0,0.24,0,0.22,10,8,'#FFFFFF');
  });

  if(kind==='crab')return body('crab',function(b){
    b.mat('cliff');
    b.push();b.translate(0,0.36,0);b.scale(1,0.62,1.15);
    b.sphere(0,0,0,0.62,14,10,'#FFFFFF');
    b.pop();
    b.mat('panel');
    /* eight legs and two claws */
    for(var i=0;i<8;i++){
      var side=i<4?-1:1, t=(i%4)/3;
      b.push();
      b.translate(side*0.5,0.28,-0.34+t*0.7);
      b.rotate(0,0,side*0.7);
      b.cylinder(0,-0.16,0,0.06,0.03,0.44,6,'#D8DEE6');
      b.pop();
    }
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.60,0.30,0.52);b.rotate(0,s*0.4,0);
      b.chamfer(0,0,0,0.24,0.18,0.34,'#D07A6E',0.05);
      b.push();b.translate(0,0.06,0.22);b.rotate(0.4,0,0);
      b.chamfer(0,0,0,0.18,0.08,0.26,'#E08A7A',0.03);b.pop();
      b.pop();
    }
    b.mat('blank');
    for(var e=-1;e<=1;e+=2){
      b.push();b.translate(e*0.18,0.68,0.34);
      b.cylinder(0,0,0,0.05,0.05,0.20,6,'#C4685E');
      b.sphere(0,0.13,0,0.08,8,6,'#0E1219');
      b.pop();
    }
  });

  if(kind==='wisp')return body('wisp',function(b){
    b.mat('neon',1.0);
    b.sphere(0,0,0,0.34,14,10,'#FFFFFF');
    var rng=M.rng(83);
    for(var i=0;i<10;i++){
      var a=rng()*M.TAU, r=0.42+rng()*0.30;
      b.push();
      b.translate(Math.cos(a)*r,(rng()-0.5)*0.6,Math.sin(a)*r);
      b.sphere(0,0,0,0.05+rng()*0.06,6,5,'#FFFFFF');
      b.pop();
    }
    b.mat('blank');
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*0.12,0.06,0.28);
      b.sphere(0,0,0,0.07,8,6,'#0A0E16');b.pop();
    }
  });

  if(kind==='guardian')return body('guardian',function(b){
    b.mat('cliff');
    /* a stone construct: floating shoulder slabs, no neck, a lit core */
    b.push();b.translate(0,1.9,0);
    b.chamfer(0,0,0,1.5,1.7,1.0,'#FFFFFF',0.16);
    b.pop();
    b.push();b.translate(0,3.1,0);
    b.chamfer(0,0,0,0.95,0.85,0.85,'#E8E2D4',0.14);
    b.pop();
    for(var s=-1;s<=1;s+=2){
      b.push();b.translate(s*1.15,2.6,0);b.rotate(0,0,s*0.16);
      b.chamfer(0,0,0,0.7,0.6,0.9,'#D8D2C2',0.10);b.pop();
      /* arms hang as three floating segments */
      for(var k=0;k<3;k++){
        b.push();b.translate(s*(1.25+k*0.10),2.1-k*0.62,0);
        b.chamfer(0,0,0,0.46-k*0.06,0.5,0.46-k*0.06,'#C4BEB0',0.08);
        b.pop();
      }
      b.push();b.translate(s*0.5,0.7,0);
      b.chamfer(0,0,0,0.62,1.4,0.72,'#B8B2A4',0.10);b.pop();
    }
    b.mat('neon',1.0);
    b.push();b.translate(0,2.1,0.54);
    b.sphere(0,0,0,0.26,12,9,'#FFC46A');b.pop();
    b.push();b.translate(0,3.1,0.44);
    b.chamfer(0,0,0,0.52,0.10,0.06,'#FFC46A',0.02,{noBand:true});b.pop();
  });

  return null;
};

/* ---------------- instances ---------------- */
function Enemy(kind,x,z,opt){
  opt=opt||{};
  var S=SPECIES[kind];
  this.kind=kind;this.S=S;
  this.pos=M.v3(x,W.groundAt(x,z),z);
  this.home=M.v3(x,this.pos[1],z);
  this.vel=M.v3();
  this.facing=Math.random()*M.TAU;
  this.hp=S.hp;this.hpMax=S.hp;
  this.state='idle';
  this.t=0;                  /* time in the current state */
  this.cool=0;               /* attack cooldown */
  this.target=null;
  this.wander=M.v3(x,0,z);
  this.phase=Math.random()*6.28;
  this.dead=false;
  this.deadT=0;
  this.hurtT=0;
  this.id='e'+(E._next++);
  this.leash=opt.leash||22;
  /* Humanoids borrow the player's rig outright. */
  if(S.body==='humanoid'){
    var k=Act.defaultKit(this.id.length*7+3);
    var kt=S.kit||{};
    k.shirt.style=kt.shirt||'jacket';k.shirt.color=kt.shirtCol||'#3A3F4E';
    k.shirt.sleeve='long';
    k.pants.color=kt.pants||'#23262E';
    k.hair.style=kt.hair||'crop';k.hair.color=kt.hairCol||'#1E2028';
    k.hat.style=kt.hat||'none';
    k.shoes.color='#191C22';
    k.skin=kt.skin||'#9C8878';
    k.tool.style=kt.tool||'sword';k.tool.color=kt.toolCol||'#B8C0CC';
    if(kt.aura){k.aura.style=kt.aura;k.aura.color=kt.auraCol||'#8A6ACC';}
    this.actor=Act.Actor({x:x,y:this.pos[1],z:z,kit:k,name:S.name});
    this.actor.scale=S.scale||1;
  }
}
E._next=1;
E.Enemy=Enemy;

var live=[];
E.live=live;
E.spawn=function(kind,x,z,opt){
  if(!SPECIES[kind])return null;
  var e=new Enemy(kind,x,z,opt);
  live.push(e);
  return e;
};
E.clear=function(){live.length=0;};

/* ---------------- AI ----------------
   One update for every species. `S` supplies the numbers; the shape of
   the behaviour is identical, which is what keeps adding a creature to
   a table entry rather than a code path. */
var _to=M.v3();
E.update=function(dt,playerPos,onHit){
  for(var i=live.length-1;i>=0;i--){
    var e=live[i], S=e.S;
    e.t+=dt;
    if(e.hurtT>0)e.hurtT-=dt;

    if(e.dead){
      e.deadT+=dt;
      if(e.actor)e.actor.update(dt);
      /* sink and disappear rather than blink out */
      if(e.deadT>0.6)e.pos[1]-=dt*0.9;
      if(e.deadT>2.4)live.splice(i,1);
      continue;
    }

    var dist=M.dist2(e.pos,playerPos);
    var canSee=dist<S.aggro;
    var leashed=M.dist2(e.pos,e.home)>e.leash;

    /* --- transitions --- */
    if(e.state!=='attack'&&e.state!=='recover'){
      if(leashed)e.setState('return');
      else if(canSee&&dist>S.reach)e.setState('chase');
      else if(canSee&&dist<=S.reach&&e.cool<=0)e.setState('attack');
      else if(!canSee&&e.state!=='patrol'&&e.state!=='idle')e.setState('idle');
    }

    e.cool-=dt;
    var speed=0;

    switch(e.state){
      case 'idle':
        /* pause, then pick somewhere nearby to amble to */
        if(e.t>1.2+Math.random()*2.5){
          var a=Math.random()*M.TAU,r=3+Math.random()*7;
          M.set3(e.wander,e.home[0]+Math.cos(a)*r,0,e.home[2]+Math.sin(a)*r);
          e.setState('patrol');
        }
        break;
      case 'patrol':
        speed=S.speed*0.42;
        if(step(e,e.wander,speed,dt)<0.7||e.t>9)e.setState('idle');
        break;
      case 'chase':
        speed=S.speed;
        M.copy3(_to,playerPos);
        step(e,_to,speed,dt);
        if(dist<=S.reach&&e.cool<=0)e.setState('attack');
        break;
      case 'attack':
        /* Wind up, land the blow at a fixed point in the clip, then
           recover. The delay is what makes an attack dodgeable. */
        face(e,playerPos,dt,10);
        if(e.t>0.34&&!e.struck){
          e.struck=true;
          if(dist<=S.reach*1.25&&onHit)onHit(e,S.dmg);
        }
        if(e.t>0.62){e.cool=0.9+Math.random()*0.5;e.setState('recover');}
        break;
      case 'recover':
        if(e.t>0.35)e.setState(canSee?'chase':'idle');
        break;
      case 'return':
        speed=S.speed*0.8;
        if(step(e,e.home,speed,dt)<1.2)e.setState('idle');
        break;
    }

    /* --- placement --- */
    var g=W.groundAt(e.pos[0],e.pos[2]);
    e.pos[1]=S.fly?g+S.fly+Math.sin(e.t*1.6+e.phase)*0.22:g;

    /* --- animation --- */
    if(e.actor){
      e.actor.pos[0]=e.pos[0];e.actor.pos[1]=e.pos[1];e.actor.pos[2]=e.pos[2];
      e.actor.facing=e.facing;
      var st=e.actor.anim.state;
      if(e.hurtT>0.2)e.actor.anim.play('hurt');
      else if(e.state==='attack')e.actor.anim.play('attack');
      else if(speed>0.2){
        e.actor.anim.play('locomote');
        e.actor.anim.params.speed=M.clamp((speed-1.4)/4.0,0,1);
      }else if(st!=='attack'&&st!=='hurt')e.actor.anim.play('idle');
      e.actor.update(dt);
    }
  }
};

Enemy.prototype.setState=function(s){
  if(this.state===s)return;
  this.state=s;this.t=0;
  if(s==='attack')this.struck=false;
};

function step(e,to,speed,dt){
  var dx=to[0]-e.pos[0], dz=to[2]-e.pos[2];
  var d=Math.hypot(dx,dz);
  if(d<0.001)return d;
  e.pos[0]+=dx/d*speed*dt;
  e.pos[2]+=dz/d*speed*dt;
  /* creatures respect buildings too, or a rogue walks through a wall */
  W.resolve(e.pos,0.42,e.pos[1]);
  face(e,to,dt,7);
  return d;
}
function face(e,to,dt,rate){
  var want=Math.atan2(to[0]-e.pos[0],to[2]-e.pos[2]);
  var d=M.angDelta(e.facing,want);
  e.facing+=d*Math.min(1,dt*rate);
}

/* Damage is applied here but authorised elsewhere: LH.Net decides
   whether the hit was legal and how much it was worth. */
E.damage=function(e,amount){
  if(e.dead)return null;
  e.hp-=amount;
  e.hurtT=0.45;
  if(e.hp<=0){
    e.hp=0;e.dead=true;e.deadT=0;
    if(e.actor)e.actor.anim.play('hurt',true);
    return {killed:true,species:e.kind};
  }
  /* being hit interrupts whatever it was doing and makes it angry */
  if(e.state!=='attack')e.setState('chase');
  return {killed:false};
};

/* Nearest living enemy in front of the player, within a weapon's
   reach. Cone rather than a sphere, so a swing has a direction. */
E.pick=function(pos,facing,reach,arc){
  arc=arc||0.9;
  var best=null,bd=reach;
  for(var i=0;i<live.length;i++){
    var e=live[i];
    if(e.dead)continue;
    var dx=e.pos[0]-pos[0], dz=e.pos[2]-pos[2];
    var d=Math.hypot(dx,dz);
    if(d>bd)continue;
    var ang=Math.abs(M.angDelta(facing,Math.atan2(dx,dz)));
    if(ang>arc)continue;
    bd=d;best=e;
  }
  return best;
};
E.byId=function(id){
  for(var i=0;i<live.length;i++)if(live[i].id===id)return live[i];
  return null;
};

/* ---------------- drawing ---------------- */
var _m=M.m4(),_t=M.v3(),_s=M.v3();
E.submit=function(time,playerPos){
  for(var i=0;i<live.length;i++){
    var e=live[i];
    if(M.dist2(e.pos,playerPos)>120)continue;
    if(e.actor){
      Act.submit(e.actor);
      continue;
    }
    var mesh=E.mesh(e.S.body);
    if(!mesh)continue;
    /* a hit flashes white, and a dying creature flattens as it sinks */
    var flash=e.hurtT>0?M.clamp(e.hurtT/0.45,0,1):0;
    var squash=1;
    if(e.kind==='slime')squash=1+Math.sin(e.t*4+e.phase)*0.10;
    if(e.dead)squash=Math.max(0.2,1-e.deadT*0.8);
    M.set3(_t,e.pos[0],e.pos[1],e.pos[2]);
    M.set3(_s,e.S.scale*(2-squash),e.S.scale*squash,e.S.scale*(2-squash));
    M.fromTRS(_m,_t,0,e.facing,0,_s);
    var col=Geo.col3(e.S.col);
    var c=[M.lerp(col[0],2.2,flash),M.lerp(col[1],2.2,flash),
           M.lerp(col[2],2.2,flash)];
    Act.pushInstance(mesh,_m,c,e.kind==='wisp'?0.9:0);
  }
};
E.submitAura=function(time,playerPos){
  for(var i=0;i<live.length;i++){
    var e=live[i];
    if(!e.actor||e.dead)continue;
    if(M.dist2(e.pos,playerPos)>90)continue;
    Act.submitAura(e.actor,time);
  }
};

LH.Enemies=E;
})();

/* ============================================================
   LH.Fishing — the angling minigame.

   Five stages: cast, sink, wait, strike, reel. The reel is the game:
   a hooked fish runs and tires, and the line has a breaking strain,
   so you give it slack when it fights and pull when it does not. A
   big fish is genuinely harder to land than a small one, which is
   the whole reason the weight matters.

   The server decides what is on the hook the moment it bites — the
   client is told the fight parameters, never the identity, so a
   client that reads its own memory still cannot pick its catch.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D=LH.Data,Net=LH.Net;
var F={};

F.stage='idle';        /* idle | cast | sink | wait | strike | reel | done */
F.t=0;
F.zone='harbour';
F.bobber=M.v3();
F.power=0;             /* cast charge, 0..1 */

/* live fight state */
var fight=null;
F.fight=function(){return fight;};

/* Tension bar: `pull` is what the player is doing, `strain` is the
   line. Holding pulls the fish in and loads the line; letting go
   recovers the line and lets the fish run. */
F.progress=0;
F.strain=0;
F.pulling=false;

var listeners=[];
F.on=function(fn){listeners.push(fn);};
function emit(ev,data){
  for(var i=0;i<listeners.length;i++)listeners[i](ev,data);
}

/* ---------------- cast ---------------- */
F.canFish=function(){
  var st=Net.snapshot();
  var rodKey=st.equipped.tool;
  var rod=rodKey?D.byKey(rodKey):null;
  if(!rod||rod.cat!=='fishing')return {ok:false,why:'Equip a rod first.'};
  var bait=F.bestBait(st);
  if(!bait)return {ok:false,why:'You have no bait.'};
  return {ok:true,rod:rod,bait:bait};
};
/* Use the best bait you carry: nobody wants to manage a bait slot. */
F.bestBait=function(st){
  var best=null;
  for(var k in st.inv){
    var it=D.byKey(k);
    if(!it||!it.props||!it.props.bait)continue;
    if(!best||it.props.bait>best.props.bait)best=it;
  }
  return best;
};

F.beginCast=function(zone){
  var can=F.canFish();
  if(!can.ok){emit('reject',can.why);return false;}
  F.zone=zone||'harbour';
  F.stage='cast';F.t=0;F.power=0;
  emit('stage','cast');
  return true;
};
/* Charge while held; the longer the cast the better the water. */
F.chargeCast=function(dt){
  if(F.stage!=='cast')return;
  F.power=Math.min(1,F.power+dt*0.85);
};
F.release=function(){
  if(F.stage!=='cast')return;
  F.stage='sink';F.t=0;
  emit('stage','sink');
};

/* ---------------- waiting ---------------- */
function rollWait(){
  var st=Net.snapshot();
  var rod=D.byKey(st.equipped.tool);
  var bait=F.bestBait(st);
  var power=(rod&&rod.props.power)||1;
  var b=(bait&&bait.props.bait)||1;
  /* Better tackle shortens the wait; a long cast helps a little. */
  var base=9.5/(0.7+power*0.5+b*0.25+F.power*0.5);
  return base*(0.55+Math.random()*0.9);
}

F.update=function(dt){
  F.t+=dt;
  switch(F.stage){
    case 'cast': break;
    case 'sink':
      if(F.t>0.7){F.stage='wait';F.t=0;F.waitFor=rollWait();emit('stage','wait');}
      break;
    case 'wait':
      if(F.t>=F.waitFor){
        /* Ask the server what bit. It returns the fight, not the fish. */
        Net.request('hook',{zone:F.zone,power:F.power},function(r){
          if(!r.ok){F.stage='idle';emit('reject',r.why);return;}
          fight=r.fight;
          F.stage='strike';F.t=0;
          F.progress=0.30;F.strain=0;
          emit('stage','strike');
        });
      }
      break;
    case 'strike':
      /* a short window to set the hook */
      if(F.t>0.85){F.stage='idle';fight=null;emit('miss');}
      break;
    case 'reel':
      stepFight(dt);
      break;
  }
};

/* Setting the hook. Miss the window and the fish is gone. */
F.strike=function(){
  if(F.stage!=='strike')return false;
  F.stage='reel';F.t=0;
  emit('stage','reel');
  return true;
};

function stepFight(dt){
  if(!fight)return;
  /* The fish alternates between running and tiring, on its own clock,
     so the player has to read it rather than mash. */
  fight.phase-=dt;
  if(fight.phase<=0){
    fight.running=!fight.running;
    fight.phase=fight.running?(0.5+Math.random()*fight.runLen)
                             :(0.6+Math.random()*0.9);
  }
  var pull=F.pulling?1:0;
  /* progress moves toward you when you pull and the fish is tired,
     away when it runs */
  var gain=pull*(fight.running?-0.16:0.42)+(pull?0:-0.10);
  F.progress=M.clamp(F.progress+gain*dt*fight.rate,0,1);
  /* strain builds while pulling against a running fish */
  var load=pull?(fight.running?1.55:0.42):-1.25;
  F.strain=M.clamp(F.strain+load*dt*fight.strainRate,0,1);

  if(F.strain>=1){
    F.stage='idle';fight=null;F.pulling=false;
    emit('snap');
    return;
  }
  if(F.progress>=1){
    var f=fight;
    fight=null;F.pulling=false;F.stage='done';F.t=0;
    Net.request('land',{token:f.token},function(r){
      if(r.ok)emit('caught',r);
      else emit('reject',r.why);
      F.stage='idle';
    });
  }
}

F.setPull=function(on){F.pulling=!!on;};
F.cancel=function(){
  if(F.stage==='idle')return;
  F.stage='idle';fight=null;F.pulling=false;
  emit('stage','idle');
};
F.active=function(){return F.stage!=='idle';};

LH.Fishing=F;
})();

/* ============================================================
   Server handlers for the activities.

   Registered from outside LH.Net rather than written into it, but
   they run inside the same authority: they go through Net.register
   and are the only path by which fishing and combat can move a
   number. The fish is chosen here, at the moment of the bite, and
   the client is handed a fight and an opaque token — never the
   species, and never the weight.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D=LH.Data,Net=LH.Net,E=LH.Enemies;

/* The one hooked fish, held server-side between `hook` and `land`. */
var hooked=null;
var tokenSeq=1;

/* Weighted pick: rarity is the weight, so the good ones stay rare no
   matter how long you stand there. Luck from the rod, the bait and
   the fishing skill tilts it, but never flattens it. */
function rollFish(zone,luck){
  var pool=D.fishIn(zone);
  if(!pool.length)pool=D.fishIn('harbour');
  var total=0,w=[];
  for(var i=0;i<pool.length;i++){
    /* base weight falls off steeply with rarity; luck lifts the tail */
    var wt=Math.pow(0.30,pool[i].rarity-1)*(1+luck*(pool[i].rarity-1)*0.9);
    w.push(wt);total+=wt;
  }
  var r=Math.random()*total;
  for(var j=0;j<pool.length;j++){
    r-=w[j];
    if(r<=0)return pool[j];
  }
  return pool[0];
}

/* Weight within the species' range, biased small — a record fish
   should be a story, not a Tuesday. */
function rollWeight(it,luck){
  var w=it.props.w;
  var t=Math.pow(Math.random(),2.2-luck*0.6);
  return Math.round((w[0]+(w[1]-w[0])*t)*100)/100;
}

Net.register('hook',function(p,srv){
  var st=Net.snapshot();
  var rod=D.byKey(st.equipped.tool);
  if(!rod||rod.cat!=='fishing')return {ok:false,why:'You are not holding a rod.'};
  var bait=null;
  for(var k in st.inv){
    var it=D.byKey(k);
    if(it&&it.props&&it.props.bait&&(!bait||it.props.bait>bait.props.bait))bait=it;
  }
  if(!bait)return {ok:false,why:'You have no bait.'};

  /* Bait is consumed on the bite, not on the cast: a cast that never
     gets a bite should not cost anything. */
  if(!srv.take(bait.key,1))return {ok:false,why:'You have no bait.'};

  var luck=(rod.props.luck||0)+(bait.props.bait-1)*0.05+
           st.skills.fishing*0.010+(p.power||0)*0.06;
  var fish=rollFish(p.zone||'harbour',luck);
  var weight=rollWeight(fish,luck);
  hooked={item:fish,weight:weight,token:'t'+(tokenSeq++),zone:p.zone};

  /* Fight difficulty scales with weight and rarity, eased by the rod's
     power and the angler's skill. */
  var wr=fish.props.w;
  var size=M.clamp((weight-wr[0])/Math.max(0.01,wr[1]-wr[0]),0,1);
  var heft=Math.log(1+weight)/Math.log(260);
  var pow=rod.props.power||1;
  var skill=1+st.skills.fishing*0.02;

  return {ok:true,fight:{
    token:hooked.token,
    /* how fast the bar moves — a small fish is landed quickly */
    rate:M.clamp(1.35-heft*0.55,0.45,1.4)*skill,
    /* how quickly the line loads while pulling against a run */
    strainRate:M.clamp(0.42+heft*0.85+size*0.30,0.35,1.5)/Math.sqrt(pow),
    /* how long its runs last */
    runLen:0.7+heft*1.9,
    running:true,
    phase:0.5+Math.random()*0.6,
    /* a hint, not the answer: enough to tell a monster from a sprat */
    weightClass:heft>0.62?'heavy':(heft>0.30?'solid':'light')
  }};
});

Net.register('land',function(p,srv){
  if(!hooked||hooked.token!==p.token)
    return {ok:false,why:'Nothing on the line.'};
  var fish=hooked.item, weight=hooked.weight;
  /* checked before the fish is granted, or every catch looks familiar */
  var wasKnown=!!srv.snapshot().collections.fish[fish.key];
  hooked=null;
  if(!srv.give(fish.key,1))return {ok:false,why:'Your bag is full.'};
  var value=D.fishValue(fish,weight);
  srv.xp(Math.min(400,14+fish.rarity*16+Math.round(value*0.04)),'fishing');
  srv.stat('caught');
  Net.request('track',{kind:'catch',key:fish.key,n:1});
  if(fish.rarity>=3)Net.request('track',{kind:'catchRare',key:fish.key,n:1});
  if(!wasKnown)Net.request('track',{kind:'discoverFish',key:fish.key,n:1});
  return {ok:true,key:fish.key,name:fish.name,weight:weight,
    rarity:fish.rarity,value:value,state:srv.snapshot()};
});

/* Combat. The client says which enemy it swung at; the server decides
   whether the swing could have reached, and how much it was worth. */
Net.register('attack',function(p,srv){
  var st=Net.snapshot();
  var wep=D.byKey(st.equipped.tool);
  var dmg=(wep&&wep.props&&wep.props.damage)||3;
  var reach=(wep&&wep.props&&wep.props.reach)||2.0;
  var e=E.byId(p.id);
  if(!e)return {ok:false,why:'Nothing there.'};
  if(e.dead)return {ok:false,why:'Already down.'};
  var d=Math.hypot(e.pos[0]-p.pos[0],e.pos[2]-p.pos[2]);
  if(d>reach+0.9)return {ok:false,why:'Out of reach.'};

  /* skill and buffs are read from the server's own state */
  var mult=1+srv.skill('combat')*0.022+(srv.buff('damage')?0.35:0);
  var roll=dmg*mult*(0.85+Math.random()*0.3);
  var crit=Math.random()<0.08+srv.skill('combat')*0.004;
  if(crit)roll*=1.9;
  roll=Math.round(roll);

  var r=E.damage(e,roll);
  srv.xp(Math.min(200,Math.round(roll*0.5)),'combat');
  var loot=null;
  if(r&&r.killed){
    loot=[];
    var tbl=e.S.loot||[];
    for(var i=0;i<tbl.length;i++){
      if(Math.random()<=tbl[i][2]){
        srv.give(tbl[i][0],tbl[i][1]);
        loot.push([tbl[i][0],tbl[i][1]]);
      }
    }
    srv.coins(Math.round(e.S.xp*1.6));
    srv.xp(Math.min(500,e.S.xp),'combat');
    srv.stat('killed');
    Net.request('track',{kind:'kill',key:e.kind,n:1});
  }
  return {ok:true,damage:roll,crit:crit,killed:!!(r&&r.killed),
    loot:loot,hp:e.hp,hpMax:e.hpMax,state:srv.snapshot()};
});

/* Damage taken. The enemy's own table supplies the number, so a
   client cannot claim it took zero. */
Net.register('takeDamage',function(p,srv){
  /* The enemy's own table supplies the number, so a client cannot
     claim it took zero — or that an enemy that does not exist hit it. */
  var e=E.byId(p.id);
  if(!e)return {ok:false,why:'No such attacker.'};
  var hp=srv.hurt(e.S.dmg);
  return {ok:true,hp:hp,dead:hp<=0,state:srv.snapshot()};
});

/* Respawn: everything you were carrying stays, but the walk back is
   the cost. Losing inventory on death would make a sandbox hostile. */
Net.register('respawn',function(p,srv){
  srv.heal(9999);
  return {ok:true,state:srv.snapshot()};
});

LH.Activities={rollFish:rollFish};
})();

/* ============================================================
   LH.Quests — missions, achievements and the NPCs who hand them out.

   Missions are data, and progress is tracked by *event kind* rather
   than by mission: an activity handler calls track('catch','f_bass',1)
   once, and every mission, achievement and collection that cares
   about catching updates itself. Adding a mission is a table row; it
   never means editing fishing.

   Dailies rotate on a date-derived seed so everyone in the harbour

(function(){

/* ---------------- daily rotation ----------------
   Seeded from the date so the whole harbour sees the same set. */
function dayIndex(){
  return Math.floor(Date.now()/86400000);
}
function weekIndex(){
  return Math.floor(Date.now()/(86400000*7));
}
function pickRotating(pool,n,seed){
  var rng=M.rng(seed>>>0||1);
  var copy=pool.slice(),out=[];
  while(out.length<n&&copy.length){
    out.push(copy.splice((rng()*copy.length)|0,1)[0]);
  }
  return out;
}
Q.todaysDailies=function(){
  var pool=MISSIONS.filter(function(m){return m.type==='daily';});
  return pickRotating(pool,3,dayIndex()*7919);
};
Q.thisWeek=function(){
  var pool=MISSIONS.filter(function(m){return m.type==='weekly';});
  return pickRotating(pool,2,weekIndex()*104729);
};

Q.NPCS=NPCS;
Q.npcList=function(){return Object.keys(NPCS);};

LH.Quests=Q;
})();

/* ============================================================
   Mission and social handlers, inside the authority.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,D=LH.Data,Net=LH.Net,Q=LH.Quests;

/* Every activity funnels through one tracker. Missions, achievements
   and the "discovered" counters all read the same event, so a new
   mission never means editing the thing it measures. */
function activeSet(srv){
  var out=[];
  var s=srv.snapshot();
  Q.todaysDailies().forEach(function(m){out.push(m);});
  Q.thisWeek().forEach(function(m){out.push(m);});
  Q.MISSIONS.forEach(function(m){
    if(m.type!=='story')return;
    var st=s.missions[m.id];
    if(st&&st.claimed)return;
    if(m.needs){
      var pre=s.missions[m.needs];
      if(!pre||!pre.claimed)return;
    }
    if(s.level<m.level)return;
    out.push(m);
  });
  return out;
}

Net.register('track',function(p,srv){
  var kind=p.kind,key=p.key,n=p.n||1;
  var s=srv.snapshot();
  var completed=[];

  /* rotate: a daily from a previous day resets rather than carrying */
  var today=Q.dayIndex(), week=Q.weekIndex();

  activeSet(srv).forEach(function(m){
    var g=m.goal;
    if(g[0]!==kind)return;
    if(g[1]&&g[1]!==key)return;
    var st=srv.mission(m.id);
    if(m.type==='daily'&&st.day!==today){st.p=0;st.done=false;st.claimed=false;st.day=today;}
    if(m.type==='weekly'&&st.week!==week){st.p=0;st.done=false;st.claimed=false;st.week=week;}
    if(st.done)return;
    st.p+=n;
    if(st.p>=g[2]){st.p=g[2];st.done=true;completed.push(m.id);}
  });

  /* achievements use the same events but never reset */
  Q.ACH.forEach(function(a){
    if(a[2]!==kind)return;
    if(a[3]&&a[3]!==key)return;
    var st=srv.achievement(a[0]);
    if(st.done)return;
    st.p+=n;
    if(st.p>=a[4]){
      st.done=true;
      var rw=a[5]||{};
      if(rw.xp)srv.xp(rw.xp);
      if(rw.items)rw.items.forEach(function(it){srv.give(it[0],it[1]);});
      if(rw.title)srv.title(rw.title);
      completed.push('ach:'+a[0]);
    }
  });

  return {ok:true,completed:completed,state:srv.snapshot()};
});

Net.register('missions',function(p,srv){
  var s=srv.snapshot();
  var today=Q.dayIndex(), week=Q.weekIndex();
  function pack(m){
    var st=s.missions[m.id]||{p:0,done:false,claimed:false};
    /* a stale daily reads as fresh rather than complete */
    if(m.type==='daily'&&st.day!==today)st={p:0,done:false,claimed:false};
    if(m.type==='weekly'&&st.week!==week)st={p:0,done:false,claimed:false};
    return {id:m.id,name:m.name,desc:m.desc,type:m.type,
      goal:m.goal[2],progress:Math.min(st.p||0,m.goal[2]),
      done:!!st.done,claimed:!!st.claimed,
      reward:m.reward,npc:m.npc};
  }
  return {ok:true,
    daily:Q.todaysDailies().map(pack),
    weekly:Q.thisWeek().map(pack),
    story:activeSet(srv).filter(function(m){return m.type==='story';}).map(pack),
    achievements:Q.ACH.map(function(a){
      var st=(s.achievements||{})[a[0]]||{p:0,done:false};
      return {id:a[0],name:a[1],goal:a[4],progress:Math.min(st.p||0,a[4]),
        done:!!st.done};
    })};
});

Net.register('claim',function(p,srv){
  var m=Q.byId(p.id);
  if(!m)return {ok:false,why:'No such mission.'};
  var st=srv.mission(m.id);
  if(!st.done)return {ok:false,why:'Not finished yet.'};
  if(st.claimed)return {ok:false,why:'Already claimed.'};
  st.claimed=true;
  var rw=m.reward||{};
  if(rw.coins)srv.coins(rw.coins);
  if(rw.xp)srv.xp(rw.xp);
  if(rw.items)rw.items.forEach(function(it){srv.give(it[0],it[1]);});
  if(rw.title)srv.title(rw.title);
  return {ok:true,reward:rw,state:srv.snapshot()};
});

Net.register('talk',function(p,srv){
  var npc=Q.NPCS[p.id];
  if(!npc)return {ok:false,why:'Nobody there.'};
  srv.meet(p.id);
  Net.request('track',{kind:'talk',key:p.id,n:1});
  var seen=srv.metCount(p.id);
  return {ok:true,name:npc.name,role:npc.role,
    line:npc.lines[Math.min(seen-1,npc.lines.length-1)],
    offer:npc.offer,state:srv.snapshot()};
});

Net.register('visit',function(p,srv){
  if(srv.visit(p.id))Net.request('track',{kind:'visit',key:p.id,n:1});
  return {ok:true,state:srv.snapshot()};
});

LH.QuestNet=true;
})();

/* ============================================================
   LH.Realm — private worlds.

   The promise the whole game is making: somewhere that is yours,
   that persists, that you can build in without asking, and that you
   can let other people into on your terms.

   A realm is a terrain profile plus a voxel layer plus a permission
   row. It reuses the same generator, chunking, lighting, collision
   and material blending as Lumen Harbor rather than being a second,
   thinner renderer — which is why a private world does not look
   like a lesser place than the public one.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,GL=LH.GL,Geo=LH.Geo,T=LH.Terrain,V=LH.Voxels,W=LH.World;
var Net=LH.Net,D=LH.Data,En=LH.Enemies;
var R={};

R.current=null;          /* null means Lumen Harbor */
R.busy=false;

/* Themes decide the ground, the sky's mood and what grows there.
   Deliberately few: a long list of themes is a long list of worlds
   that all feel the same. */
var THEMES={
  meadow:{name:'Meadow',   band:'grass',    tree:'broadleaf',density:0.9,
          tint:'#8FD36A'},
  garden:{name:'Blossom Garden',band:'grass',tree:'blossom',density:1.2,
          tint:'#FFC0DA'},
  dunes:{ name:'Dunes',    band:'sand',     tree:'palm',    density:0.5,
          tint:'#EBD6A4'},
  tundra:{name:'Tundra',   band:'snow',     tree:'pine',    density:0.7,
          tint:'#DDEAF6'},
  basalt:{name:'Basalt',   band:'stone',    tree:'dead',    density:0.4,
          tint:'#8A8F98'},
  works:{ name:'Old Works',band:'concrete', tree:'dead',    density:0.3,
          tint:'#7E868F'}
};
R.THEMES=THEMES;
R.themeList=function(){return Object.keys(THEMES);};

/* Props placed in a realm belong to the realm, so they are rebuilt
   on entry and dropped on exit rather than accumulating. */
var realmProps=[];

function dressRealm(seed,theme){
  var Th=THEMES[theme]||THEMES.meadow;
  var rng=M.rng((seed||1)*7919+13);
  var P=LH.Props;
  var radius=(R.current&&R.current.radius)||64;
  var n=Math.round(90*Th.density);
  for(var i=0;i<n;i++){
    var a=rng()*M.TAU, rr=Math.sqrt(rng())*radius*0.94;
    var x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    var h=T.heightAt(x,z);
    if(h<0.9)continue;
    /* leave the middle clear: it is the part people build on */
    if(rr<radius*0.30&&rng()<0.85)continue;
    var k=rng();
    if(k<0.34)W.place(P.tree(Th.tree,(rng()*4)|0),x,h-0.2,z,rng()*6.28,
      0.8+rng()*0.5,'#FFFFFF');
    else if(k<0.58)W.place(P.bush((rng()*3)|0),x,h,z,rng()*6.28,
      0.7+rng()*0.6,'#FFFFFF');
    else if(k<0.86)W.place(P.grassTuft((rng()*3)|0),x,h,z,rng()*6.28,
      0.7+rng()*0.6,'#FFFFFF');
    else W.place(P.rock((rng()*4)|0),x,h-0.3,z,rng()*6.28,
      0.4+rng()*0.9,'#FFFFFF');
  }
}

/* The way home. Every realm has one, in the same place, so nobody
   ever has to work out how to leave. */
function realmGate(){
  var b=Geo.build();
  var y=T.heightAt(0,-14);
  b.push();b.translate(0,y,-14);
  b.mat('panel');
  b.loft([
    {y:0,   pts:Geo.roundRect(4.6,2.6,0.5,14)},
    {y:0.5, pts:Geo.roundRect(4.2,2.2,0.45,14)},
    {y:0.7, pts:Geo.roundRect(3.9,1.9,0.4,14)}
  ],'#98A2B0',{uvScale:1.2});
  for(var i=0;i<=16;i++){
    var a=Math.PI*(i/16);
    b.push();
    b.translate(Math.cos(a)*2.3,0.9+Math.sin(a)*2.3,0);
    b.rotate(0,0,a-Math.PI/2);
    b.mat('panel');
    b.chamfer(0,0,0,0.46,0.40,0.66,i%2?'#C4CCD8':'#AAB2BE',0.06);
    b.pop();
  }
  b.mat('neon',0.85);
  b.push();b.translate(0,0.9,0);
  b.loft([
    {y:-0.9,pts:Geo.circle(1.85,18,1,0.10)},
    {y: 0.0,pts:Geo.circle(2.02,18,1,0.10)},
    {y: 1.9,pts:Geo.circle(1.20,18,1,0.10)}
  ],'#F5A03C',{openTop:true,openBottom:true});
  b.pop();
  b.pop();
  W.statics.push(b.upload());
  W.lights.push({x:0,y:y+2.2,z:-14,r:14,col:[1.00,0.63,0.24],
    power:1.4,always:true});
  W.point('gate','gate',0,-11.5,{y:y,r:4.0,
    label:'Way Home',prompt:'Return to Lumen Harbor'});
}

/* ---------------- entering and leaving ----------------
   The public island's own statics, props, points and collision are
   kept aside rather than rebuilt, because regenerating Lumen Harbor
   on every trip home would take a second and a half. */
var harbourCache=null;

function stash(){
  harbourCache={
    statics:W.statics.slice(),
    boxes:W.boxes.slice(),
    points:W.points.slice(),
    groups:(W.groups||[]).slice(),
    instanced:W.instanced.slice(),
    lights:W.lights.slice(),
    spawn:M.v3(W.spawn[0],W.spawn[1],W.spawn[2]),
    cells:V.serialise(),
    enemies:En.live.slice()
  };
}
function restore(){
  if(!harbourCache)return;
  /* release only what the realm made; the harbour's meshes are the
     same objects that were set aside */
  for(var i=0;i<W.statics.length;i++){
    if(harbourCache.statics.indexOf(W.statics[i])<0)GL.freeMesh(W.statics[i]);
  }
  W.statics.length=0;
  Array.prototype.push.apply(W.statics,harbourCache.statics);
  W.boxes.length=0;
  Array.prototype.push.apply(W.boxes,harbourCache.boxes);
  W.points.length=0;
  Array.prototype.push.apply(W.points,harbourCache.points);
  W.groups=harbourCache.groups;
  W.instanced.length=0;
  Array.prototype.push.apply(W.instanced,harbourCache.instanced);
  W.lights.length=0;
  Array.prototype.push.apply(W.lights,harbourCache.lights);
  M.copy3(W.spawn,harbourCache.spawn);
  En.live.length=0;
  Array.prototype.push.apply(En.live,harbourCache.enemies);
  V.deserialise(harbourCache.cells);
}

/* Build a realm's surface and contents. Synchronous: it is about a
   fifth of a second and it happens behind a fade. */
function buildRealm(realm){
  W.statics.length=0;
  W.boxes.length=0;
  W.points.length=0;
  W.instanced.length=0;
  W.lights.length=0;
  W.groups=[];
  En.live.length=0;

  T.setProfile({kind:'realm',seed:realm.seed,theme:realm.theme,
    radius:realm.radius,relief:realm.relief});
  T.generate();
  T.buildChunks();

  dressRealm(realm.seed,realm.theme);
  W.commitProps();
  realmGate();

  V.deserialise(realm.cells||[]);
  M.set3(W.spawn,0,T.heightAt(0,-6),-6);
}

R.enter=function(realm,done){
  if(R.busy)return false;
  R.busy=true;
  if(!R.current)stash();
  R.current=realm;
  buildRealm(realm);
  R.busy=false;
  if(done)done();
  return true;
};

R.leave=function(done){
  if(!R.current||R.busy)return false;
  R.busy=true;
  /* hand the realm's current cells back to the server before leaving */
  Net.request('saveRealm',{id:R.current.id,cells:V.serialise()});
  R.current=null;
  T.setProfile({kind:'harbor'});
  T.generate();
  T.buildChunks();
  restore();
  R.busy=false;
  if(done)done();
  return true;
};

R.inRealm=function(){return !!R.current;};

LH.Realm=R;
})();

/* ============================================================
   Realm handlers, inside the authority.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,Net=LH.Net,R=LH.Realm,D=LH.Data;

var PERMS=['private','friends','invite','public'];

Net.register('myWorlds',function(p,srv){
  return {ok:true,worlds:srv.worlds()};
});

Net.register('createWorld',function(p,srv){
  var list=srv.worlds();
  if(list.length>=3)return {ok:false,why:'You already hold three worlds.'};
  var cost=list.length===0?0:1500*list.length;
  var s=srv.snapshot();
  if(s.coins<cost)return {ok:false,why:'A second world costs '+cost+' coins.'};
  var name=String(p.name||'').trim().slice(0,20);
  if(!/^[A-Za-z0-9 '_-]{2,20}$/.test(name))
    return {ok:false,why:'Two to twenty letters, numbers, spaces, - or _.'};
  if(!R.THEMES[p.theme])return {ok:false,why:'Pick a theme.'};
  srv.coins(-cost);
  var w=srv.addWorld({
    id:'w'+Date.now().toString(36)+Math.floor(Math.random()*999).toString(36),
    name:name,theme:p.theme,
    seed:(Math.random()*1e9)|0,
    radius:64,relief:1,
    perm:'friends',
    cells:[],
    visits:0,
    created:Date.now()
  });
  srv.xp(200,'building');
  return {ok:true,world:w,state:srv.snapshot()};
});

Net.register('saveRealm',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  /* Ownership is checked here rather than trusted: a client may only
     ever write to a world the server already has under its name.
     A call with no cells is a no-op rather than an erase — otherwise
     any stray save would empty the world it was meant to protect. */
  if(Array.isArray(p.cells))w.cells=p.cells;
  return {ok:true};
});

/* ---------------- trading ----------------
   Player to player, with the confirmation dance the 2D build had: both
   sides put items up, both sides lock, both sides confirm, and any
   change to either offer after a lock breaks both locks. The other
   party is simulated until there is a server; the validation is not,
   because it is the part that has to survive one arriving. */
var trade=null;
function tradeValue(offer){
  var v=0;
  for(var k in offer){
    var it=D.byKey(k);
    if(it)v+=it.value*offer[k];
  }
  return v;
}

Net.register('tradeOpen',function(p,srv){
  if(trade)return {ok:false,why:'You are already trading.'};
  trade={with:String(p.with||'Trader').slice(0,16),
    mine:{},theirs:p.theirs||{},
    lockedMe:false,lockedThem:false,
    confirmMe:false,confirmThem:false,
    opened:Date.now()};
  return {ok:true,trade:tradeState(srv)};
});
function tradeState(srv){
  if(!trade)return null;
  return {with:trade.with,mine:Object.assign({},trade.mine),
    theirs:Object.assign({},trade.theirs),
    lockedMe:trade.lockedMe,lockedThem:trade.lockedThem,
    confirmMe:trade.confirmMe,confirmThem:trade.confirmThem,
    valueMine:tradeValue(trade.mine),valueTheirs:tradeValue(trade.theirs),
    left:Math.max(0,120-Math.floor((Date.now()-trade.opened)/1000))};
}
Net.register('tradeOffer',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  if(trade.lockedMe)return {ok:false,why:'Unlock first.'};
  var it=D.byKey(p.key);
  if(!it)return {ok:false,why:'No such item.'};
  if(!it.tradeable)return {ok:false,why:'That item cannot be traded.'};
  var n=Math.max(1,p.n|0||1);
  var held=srv.snapshot().inv[p.key]||0;
  var already=trade.mine[p.key]||0;
  if(p.remove){
    trade.mine[p.key]=Math.max(0,already-n);
    if(!trade.mine[p.key])delete trade.mine[p.key];
  }else{
    if(already+n>held)return {ok:false,why:'You do not have that many.'};
    if(Object.keys(trade.mine).length>=9&&!trade.mine[p.key])
      return {ok:false,why:'Nine kinds of item is the limit.'};
    trade.mine[p.key]=already+n;
  }
  /* A locked offer refuses edits outright (above), so the classic
     swap-after-agreement is impossible. This clears the locks as well,
     which matters for the other direction: if their side changes, your
     agreement to the old goods must not carry over. */
  trade.lockedMe=trade.lockedThem=false;
  trade.confirmMe=trade.confirmThem=false;
  return {ok:true,trade:tradeState(srv)};
});
Net.register('tradeLock',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  trade.lockedMe=!trade.lockedMe;
  if(!trade.lockedMe)trade.confirmMe=trade.confirmThem=false;
  /* the simulated partner locks a beat later, and only if the deal is
     not obviously lopsided against them */
  trade.lockedThem=trade.lockedMe&&
    tradeValue(trade.mine)>=tradeValue(trade.theirs)*0.62;
  return {ok:true,trade:tradeState(srv)};
});
Net.register('tradeConfirm',function(p,srv){
  if(!trade)return {ok:false,why:'Not trading.'};
  if(!trade.lockedMe||!trade.lockedThem)
    return {ok:false,why:'Both sides have to lock first.'};
  trade.confirmMe=true;
  trade.confirmThem=true;
  /* re-check the goods are still there at the moment of the swap */
  var inv=srv.snapshot().inv;
  for(var k in trade.mine){
    if((inv[k]||0)<trade.mine[k]){
      trade=null;
      return {ok:false,why:'The trade fell through — something is missing.'};
    }
  }
  for(var g in trade.mine)srv.take(g,trade.mine[g]);
  for(var t in trade.theirs)srv.give(t,trade.theirs[t]);
  var got=Object.keys(trade.theirs).map(function(x){return [x,trade.theirs[x]];});
  srv.xp(40,'social');
  trade=null;
  return {ok:true,got:got,state:srv.snapshot()};
});
Net.register('tradeCancel',function(p,srv){
  trade=null;
  return {ok:true};
});
Net.register('tradeState',function(p,srv){
  return {ok:true,trade:tradeState(srv)};
});

Net.register('realmCells',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  return {ok:true,cells:(w.cells||[]).slice()};
});

Net.register('setPerm',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  if(PERMS.indexOf(p.perm)<0)return {ok:false,why:'Unknown permission.'};
  w.perm=p.perm;
  return {ok:true,world:w,state:srv.snapshot()};
});

Net.register('renameWorld',function(p,srv){
  var w=srv.world(p.id);
  if(!w)return {ok:false,why:'No such world.'};
  var name=String(p.name||'').trim().slice(0,20);
  if(!/^[A-Za-z0-9 '_-]{2,20}$/.test(name))
    return {ok:false,why:'Two to twenty letters, numbers, spaces, - or _.'};
  w.name=name;
  return {ok:true,world:w,state:srv.snapshot()};
});

/* Building permission is per-place. In Lumen Harbor it is your plots;
   in a realm it is whether the realm is yours. */
Net.register('canBuildHere',function(p,srv){
  if(!R.inRealm())return {ok:true,can:Net.canBuild(p.x,p.y,p.z)};
  var w=srv.world(R.current.id);
  return {ok:true,can:!!w};
});

LH.RealmNet=true;
})();

/* ============================================================
   LH.Audio — everything you hear, synthesised.

   No sound files, for the same reason there are no texture files:
   the whole game is one document. Effects are short envelopes over
   oscillators and filtered noise; the score is a slow generative
   pad that follows the time of day and swaps its scale when you
   enter your own world.

   Browsers will not start audio without a gesture, so the context
   is created lazily on the first real input and everything before
   that is silently dropped rather than queued.
   ============================================================ */
(function(){
'use strict';
var M=LH.M,A={};

var ctx=null, master=null, sfxBus=null, musicBus=null;
var noiseBuf=null;
A.enabled=true;
A.volume=0.75;
A.musicVolume=0.42;

function ensure(){
  if(ctx)return ctx;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  ctx=new C();
  master=ctx.createGain();
  master.gain.value=A.volume;
  master.connect(ctx.destination);
  sfxBus=ctx.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
  musicBus=ctx.createGain();musicBus.gain.value=A.musicVolume;
  musicBus.connect(master);
  /* One second of noise, reused by everything that needs a transient:
     footsteps, breaking rock, water. */
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return ctx;
}
A.unlock=function(){
  ensure();
  if(ctx&&ctx.state==='suspended')ctx.resume();
  return !!ctx;
};
A.ready=function(){return !!ctx;};

function env(node,t0,a,d,peak){
  node.gain.setValueAtTime(0.0001,t0);
  node.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+a);
  node.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}

function tone(freq,dur,type,peak,slideTo,delay){
  if(!ctx||!A.enabled)return;
  var t0=ctx.currentTime+(delay||0);
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  env(g,t0,Math.min(0.02,dur*0.25),dur,peak===undefined?0.22:peak);
  o.connect(g);g.connect(sfxBus);
  o.start(t0);o.stop(t0+dur+0.06);
}

function noise(dur,peak,cut,q,slideCut,delay){
  if(!ctx||!A.enabled)return;
  var t0=ctx.currentTime+(delay||0);
  var src=ctx.createBufferSource();src.buffer=noiseBuf;
  var f=ctx.createBiquadFilter();
  f.type='bandpass';
  f.frequency.setValueAtTime(cut||1200,t0);
  if(slideCut)f.frequency.exponentialRampToValueAtTime(Math.max(60,slideCut),t0+dur);
  f.Q.value=q||1.1;
  var g=ctx.createGain();
  env(g,t0,0.006,dur,peak===undefined?0.2:peak);
  src.connect(f);f.connect(g);g.connect(sfxBus);
  src.start(t0);src.stop(t0+dur+0.05);
}

/* ---------------- the effect library ----------------
   Each one is a short recipe. Written as data-ish functions rather
   than a switch so adding a sound is a line. */
var SFX={
  step:function(){noise(0.09,0.10,420+Math.random()*260,1.6,180);},
  jump:function(){tone(300,0.14,'triangle',0.16,520);},
  land:function(){noise(0.13,0.20,300,1.2,110);tone(120,0.10,'sine',0.14,70);},
  place:function(){tone(420,0.09,'square',0.10,560);noise(0.07,0.09,900,2,500);},
  break:function(){
    noise(0.22,0.26,900,0.9,220);
    tone(180,0.12,'triangle',0.10,90);
  },
  hit:function(){
    noise(0.10,0.24,1600,1.4,500);
    tone(220,0.09,'sawtooth',0.12,140);
  },
  hurt:function(){tone(300,0.20,'sawtooth',0.16,120);noise(0.12,0.14,700,1.1,240);},
  pickup:function(){
    tone(880,0.07,'sine',0.13);
    tone(1320,0.09,'sine',0.11,undefined,0.05);
  },
  cast:function(){noise(0.26,0.12,2400,0.8,600);},
  splash:function(){noise(0.30,0.20,900,0.7,240);},
  bite:function(){tone(660,0.08,'square',0.14);tone(880,0.10,'square',0.12,undefined,0.07);},
  reel:function(){noise(0.05,0.06,2600,3,2200);},
  snap:function(){tone(1400,0.10,'sawtooth',0.20,300);noise(0.10,0.16,3000,1.4,700);},
  catch:function(){
    /* a small rising arpeggio — the one moment worth a fanfare */
    [523,659,784,1046].forEach(function(f,i){
      tone(f,0.20,'triangle',0.16,undefined,i*0.075);
    });
    noise(0.30,0.12,700,0.8,200);
  },
  levelup:function(){
    [523,659,784,1046,1318].forEach(function(f,i){
      tone(f,0.34,'sine',0.18,undefined,i*0.09);
    });
  },
  ui:function(){tone(1200,0.04,'sine',0.07);},
  open:function(){tone(520,0.09,'sine',0.09,760);},
  close:function(){tone(760,0.08,'sine',0.08,480);},
  deny:function(){tone(200,0.14,'square',0.13,150);},
  coin:function(){
    tone(1568,0.07,'sine',0.10);
    tone(2093,0.08,'sine',0.08,undefined,0.045);
  },
  travel:function(){
    tone(180,0.9,'sine',0.14,720);
    noise(0.9,0.10,400,0.6,3000);
  }
};

A.play=function(name){
  if(!ctx||!A.enabled)return false;
  var f=SFX[name];
  if(!f)return false;
  f();
  return true;
};
A.has=function(name){return !!SFX[name];};

/* Footsteps are rate-limited by distance travelled rather than by a
   timer, so they stay in step whether you walk or sprint. */
var stepAccum=0;
A.footstep=function(distance,surface){
  stepAccum+=distance;
  if(stepAccum<1.9)return;
  stepAccum=0;
  if(!ctx||!A.enabled)return;
  /* soft ground is duller and quieter than stone */
  var soft=(surface==='grass'||surface==='sand'||surface==='dirt');
  noise(soft?0.11:0.08, soft?0.07:0.11,
        soft?(300+Math.random()*180):(900+Math.random()*500),
        soft?1.1:2.0, soft?150:320);
};

/* ---------------- the score ----------------
   A slow pad over a scale that follows the time of day, with a
   sparse melody on top. Generative rather than looped: a loop of any
   length becomes obvious in a game people leave running. */
var musicOn=false, nextNote=0, chordIdx=0;
var SCALES={
  day:   [0,2,4,7,9],        /* major pentatonic — open, unbothered */
  dusk:  [0,2,3,7,9],
  night: [0,2,3,5,7,10],     /* minor — the harbour after dark */
  realm: [0,2,4,6,7,9,11]    /* lydian — your own world, slightly unreal */
};
var ROOT={day:220,dusk:196,night:174.61,realm:233.08};
var pad=null;

function mood(){
  if(LH.Realm&&LH.Realm.inRealm())return 'realm';
  var t=LH.Sky?LH.Sky.time:12;
  if(t<6.2||t>19.6)return 'night';
  if(t<7.6||t>18.0)return 'dusk';
  return 'day';
}

function startPad(){
  if(!ctx||pad)return;
  pad={osc:[],gain:ctx.createGain(),filter:ctx.createBiquadFilter()};
  pad.gain.gain.value=0.0001;
  pad.filter.type='lowpass';
  pad.filter.frequency.value=900;
  pad.filter.Q.value=0.6;
  pad.gain.connect(pad.filter);
  pad.filter.connect(musicBus);
  /* three detuned voices: the beating between them is the whole
     character of the pad */
  for(var i=0;i<3;i++){
    var o=ctx.createOscillator();
    o.type='sawtooth';
    o.detune.value=(i-1)*7;
    o.connect(pad.gain);
    o.start();
    pad.osc.push(o);
  }
  pad.gain.gain.linearRampToValueAtTime(0.055,ctx.currentTime+4);
}

A.music=function(on){
  musicOn=on!==false;
  if(musicOn){ensure();startPad();}
  else if(pad)pad.gain.gain.linearRampToValueAtTime(0.0001,ctx.currentTime+1.5);
};

A.update=function(dt){
  if(!ctx||!musicOn||!A.enabled)return;
  var m=mood();
  var root=ROOT[m], scale=SCALES[m];
  var now=ctx.currentTime;

  if(pad){
    /* the pad walks a slow chord cycle */
    var deg=scale[chordIdx%scale.length];
    var f=root*Math.pow(2,deg/12);
    for(var i=0;i<pad.osc.length;i++){
      pad.osc[i].frequency.setTargetAtTime(f*(i===2?2:1),now,2.2);
    }
    pad.filter.frequency.setTargetAtTime(m==='night'?620:1100,now,3);
  }

  if(now<nextNote)return;
  chordIdx++;
  nextNote=now+(m==='night'?7.5:5.5)+Math.random()*3.5;
  /* one note, sometimes two, high above the pad */
  if(Math.random()<0.72){
    var d1=scale[(Math.random()*scale.length)|0];
    var oct=Math.random()<0.4?3:2;
    var g=ctx.createGain();
    var o=ctx.createOscillator();
    o.type='triangle';
    o.frequency.value=root*Math.pow(2,d1/12+oct);
    env(g,now+0.05,0.6,2.6,0.05);
    o.connect(g);g.connect(musicBus);
    o.start(now);o.stop(now+3.6);
  }
};

A.setVolume=function(v){
  A.volume=M.clamp(v,0,1);
  if(master)master.gain.setTargetAtTime(A.volume,ctx.currentTime,0.05);
};
A.setMusicVolume=function(v){
  A.musicVolume=M.clamp(v,0,1);
  if(musicBus)musicBus.gain.setTargetAtTime(A.musicVolume,ctx.currentTime,0.05);
};
A.mute=function(on){
  A.enabled=!on;
  if(master)master.gain.setTargetAtTime(on?0:A.volume,ctx.currentTime,0.05);
};

LH.Audio=A;
})();

   LH.Sky — time of day and weather.

   The sun's colour, the sky gradient, the fog and the ambient are all
   driven from one clock, so evening in the harbour is a single number
   changing rather than a set of hand-tuned presets. Weather rides on
   top: overcast desaturates and thickens the fog, rain adds particles
   and drops the exposure.
