<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The single most important line in this file for a phone. Without a
     viewport a mobile browser lays the page out at 980 CSS pixels and
     then zooms out to fit, so every tap lands a finger-width off and
     every label renders at a third of its intended size. `viewport-fit`
     lets the canvas run under the notch and the home indicator; the
     HUD pulls itself back inside them with env(safe-area-inset-*).
     Zoom is off because a pinch on a 3D view should orbit a camera,
     not scale a document. -->
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<meta name="color-scheme" content="dark">
<meta name="description" content="Lumen Harbor — a 3D social sandbox. Build, fish, mine, dress up and trade in a harbour town.">
<!-- Installed to a home screen these three take the browser away: no
     URL bar, no tab strip, no pull-to-refresh. The status bar is drawn
     translucent so the sky runs behind it. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen Harbor">
<meta name="format-detection" content="telephone=no">
